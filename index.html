      confirmLabel: "Continue",
    });
    if (ok) navigate("program-setup");
  });
}

// ============================================================================
// Sequence editor — shared building blocks for the "Training Sequence"
// builder used both in the first-run Program Setup wizard and on the
// Schedule tab. A sequence is an array of day-type keys (or "R" for rest)
// that repeats continuously — see cycleLetterForDate(). Building blocks:
//   - sequenceEditorHTML(seq, dayTypeOptions, labelsMap): the chip/code/
//     meaning summary plus the reorderable position list, as an HTML string.
//   - wireSequenceEditor(card, seq, dayTypeOptions, rerender): attaches all
//     interaction handlers (reorder, change type, delete, add workout, add
//     rest). `seq` is mutated in place; `rerender` is called after any edit.
// ============================================================================

function sequenceEditorHTML(seq, dayTypeOptions, labelsMap) {
  const typeOptions = [...dayTypeOptions.map((dt) => dt.key), "R"];
  const { code, meaning } = sequenceSummary(seq, labelsMap);

  const chips = seq.length
    ? `<div class="sequence-chip-row">${seq.map((k, i) => `<span class="sequence-chip${k === "R" ? " is-rest" : ""}">${escapeHtml(labelsMap[k] || k)}</span>${i < seq.length - 1 ? `<span class="sequence-arrow">→</span>` : ""}`).join("")}</div>`
    : `<p class="text-faint" style="margin:0;">No days yet — add your first workout below.</p>`;

  return `
    <div class="sequence-summary-card" style="margin-bottom:14px;">
      ${chips}
      ${seq.length ? `<div class="sequence-code">${escapeHtml(code)}</div><div class="sequence-meaning text-faint">${escapeHtml(meaning)}</div>` : ""}
    </div>
    <div id="seq-rows">
      ${seq.map((key, i) => `
        <div class="flex-between" style="gap:8px; padding:7px 0; border-top:1px solid var(--c-hairline); align-items:center;">
          <span style="display:flex; flex-direction:column; gap:1px;">
            <button class="link-btn" data-act="seq-up" data-idx="${i}" ${i === 0 ? "disabled" : ""} style="font-size:10px; padding:0 6px; line-height:1.3; ${i === 0 ? "opacity:0.3;" : ""}">▲</button>
            <button class="link-btn" data-act="seq-down" data-idx="${i}" ${i === seq.length - 1 ? "disabled" : ""} style="font-size:10px; padding:0 6px; line-height:1.3; ${i === seq.length - 1 ? "opacity:0.3;" : ""}">▼</button>
          </span>
          <span class="text-faint numeric" style="min-width:20px;">${i + 1}</span>
          <select data-idx="${i}" class="seq-type-select" style="flex:1; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:9px 8px; font-size:13px;">
            ${typeOptions.map((k) => `<option value="${k}" ${k === key ? "selected" : ""}>${escapeHtml(labelsMap[k] || k)}</option>`).join("")}
          </select>
          <button class="link-btn" data-act="seq-remove" data-idx="${i}" style="color:var(--c-crimson-bright); font-size:16px; padding:2px 6px;">✕</button>
        </div>`).join("")}
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn" data-act="seq-add-workout">+ Add Workout</button>
      <button class="btn" data-act="seq-add-rest">+ Add Rest</button>
    </div>
  `;
}

function wireSequenceEditor(card, seq, dayTypeOptions, rerender) {
  qsa('[data-act="seq-up"], [data-act="seq-down"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.idx);
      const delta = btn.dataset.act === "seq-up" ? -1 : 1;
      const swap = idx + delta;
      if (swap < 0 || swap >= seq.length) return;
      [seq[idx], seq[swap]] = [seq[swap], seq[idx]];
      rerender();
    });
  });
  qsa(".seq-type-select", card).forEach((sel) => {
    sel.addEventListener("change", () => {
      seq[Number(sel.dataset.idx)] = sel.value;
      rerender();
    });
  });
  qsa('[data-act="seq-remove"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      seq.splice(Number(btn.dataset.idx), 1);
      rerender();
    });
  });
  qs('[data-act="seq-add-workout"]', card)?.addEventListener("click", () => {
    seq.push(dayTypeOptions[0]?.key || "R");
    rerender();
  });
  qs('[data-act="seq-add-rest"]', card)?.addEventListener("click", () => {
    seq.push("R");
    rerender();
  });
}

function renderPatternEditor(container, navigate) {
  const card = qs("#pattern-editor-card", container);
  const labels = dayTypeLabels();

  card.innerHTML = sequenceEditorHTML(patternDraft, PROGRAM_DAY_TYPES, labels) + `
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-primary" id="pattern-save" style="width:100%;">Save Training Sequence</button>
    </div>
    ${PROGRAM_DAY_TYPES.length ? "" : `<p class="text-faint" style="margin-top:10px;">Finish Program Setup to unlock day types.</p>`}
  `;

  wireSequenceEditor(card, patternDraft, PROGRAM_DAY_TYPES, () => renderPatternEditor(container, navigate));

  qs("#pattern-save", card).addEventListener("click", async () => {
    if (!patternDraft.length) {
      toast("Add at least one day");
      return;
    }
    const newPattern = patternDraft.slice();
    const history = await storage.getProgramHistory();
    const todayStr = todayDateStr();
    const currentVersion = resolvePatternVersion(todayStr, history);

    if (currentVersion && JSON.stringify(currentVersion.pattern) === JSON.stringify(newPattern)) {
      toast("No changes to save");
      return;
    }

    let effectiveFrom = todayStr;
    if (currentVersion) {
      const rotationEnd = nextRotationBoundary(todayStr, currentVersion.effectiveFrom, currentVersion.pattern.length);
      const choice = await pickOptionModal({
        title: "When should this take effect?",
        body: "Your training sequence keeps repeating — this only changes what happens going forward. Nothing already logged is affected.",
        options: [
          { value: "now", label: "Start Immediately (Today)" },
          { value: "rotation-end", label: `Finish Current Rotation (starts ${formatDateStrShort(rotationEnd)})` },
          { value: "custom", label: "Pick a Specific Date" },
        ],
        currentValue: null,
      });
      if (choice === undefined) return;
      if (choice === "now") effectiveFrom = todayStr;
      else if (choice === "rotation-end") effectiveFrom = rotationEnd;
      else {
        const picked = await dateInputModal({ title: "Start the new sequence on...", label: "Effective date", initialValue: todayStr });
        if (!picked) return;
        effectiveFrom = picked;
      }
    }

    await storage.commitProgramPatternChange(newPattern, effectiveFrom);
    toast(effectiveFrom === todayStr ? "Training sequence updated" : `Change scheduled for ${formatDateStrShort(effectiveFrom)}`);
    renderSchedule(container, navigate);
  });
}

    </div>
    <div class="card" style="margin-top:10px;">
      ${periodFormDraft ? `
        <div class="field"><label>Name</label><input type="text" id="period-name" value="${escapeHtml(periodFormDraft.name)}" placeholder="e.g. Exam Week"></div>
        <div class="field"><label>Routine to use</label><select id="period-routine">${routineOptionsHtml(periodFormDraft.routineId)}</select></div>
        <div style="display:flex; gap:8px;">
          <div class="field" style="flex:1;"><label>Start date</label><input type="date" id="period-start" value="${periodFormDraft.startDate}"></div>
          <div class="field" style="flex:1;"><label>End date</label><input type="date" id="period-end" value="${periodFormDraft.endDate}"></div>
        </div>
        <div class="btn-row"><button class="btn btn-ghost" id="period-cancel" type="button">Cancel</button><button class="btn btn-primary" id="period-save" type="button">Save Period</button></div>
      ` : `<button class="btn" id="period-add-open" type="button">+ Add Routine Period</button>`}
    </div>

    <div class="section-title" style="margin-top:22px;"><h2>Events</h2></div>
    <p class="text-faint" style="margin:-8px 0 10px;">Classes, exams, appointments, travel, family time — one-time or recurring, layered on top of your routine.</p>
    <div class="card">
      ${events.length ? events.map((e) => `
        <div class="flex-between" style="padding:10px 0; border-top:1px solid var(--c-hairline); align-items:flex-start; gap:10px;">
          <span>
            <strong>${escapeHtml(e.title)}</strong>
            <span class="text-faint" style="display:block; font-size:12px;">
              ${e.recurrence ? `Weekly: ${e.recurrence.daysOfWeek.map((d) => WEEKDAY_LABELS[d].slice(0, 3)).join(", ")}` : formatDateStrShort(e.date)}
              ${e.allDay ? " · All day" : (e.start ? ` · ${escapeHtml(e.start)}${e.end ? "–" + escapeHtml(e.end) : ""}` : "")}
              · ${escapeHtml(e.activityType)} · ${escapeHtml(priorityLabel(e.priority))}
            </span>
          </span>
          <button class="link-btn" data-act="delete-event" data-id="${e.id}" style="color:var(--c-crimson-bright); flex-shrink:0;">Remove</button>
        </div>
      `).join("") : `<p class="text-faint" style="margin:0;">No personal events yet.</p>`}

    <div class="card" style="margin-top:10px;">
      ${eventFormDraft ? eventFormHtml(eventFormDraft) : `<button class="btn" id="event-add-open" type="button">+ Add Event</button>`}
    </div>
  `;

  qsa(".routine-row", container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      routineEditorOpenId = routineEditorOpenId === id ? null : id;
      if (routineEditorOpenId && !routineBlockDrafts[routineEditorOpenId]) {
        const r = routines.find((x) => x.id === routineEditorOpenId);
        routineBlockDrafts[routineEditorOpenId] = (r ? r.blocks : []).map((b) => ({ ...b }));
      }
      renderPersonalSchedule(container, navigate);
    });
  });
  if (routineEditorOpenId) {
    const body = qs("#routine-editor-body", container);
    const routine = routines.find((r) => r.id === routineEditorOpenId);
    if (body && routine) renderRoutineBlockEditor(body, container, navigate, routine);
  }

  qs("#add-routine-btn", container).addEventListener("click", async () => {
    const input = qs("#new-routine-name", container);
    const name = input.value.trim();
    if (!name) { toast("Name the routine first"); return; }
    await storage.savePersonalRoutine({ name, blocks: [] });
    newRoutineName = "";
    toast("Routine added");
    renderPersonalSchedule(container, navigate);
  });
  qs("#new-routine-name", container).addEventListener("input", (e) => { newRoutineName = e.target.value; });

  qsa(".weekly-routine-select", container).forEach((sel) => {
    sel.addEventListener("change", async () => {
      await storage.setWeeklyRoutineMap(Number(sel.dataset.dow), sel.value || null);
      toast("Weekly routine updated");
      renderPersonalSchedule(container, navigate);
    });
  });

  qs("#period-add-open", container)?.addEventListener("click", () => {
    periodFormDraft = { name: "", routineId: routines[0]?.id || "", startDate: todayDateStr(), endDate: todayDateStr() };
    renderPersonalSchedule(container, navigate);
  });
  qs("#period-cancel", container)?.addEventListener("click", () => { periodFormDraft = null; renderPersonalSchedule(container, navigate); });
  qs("#period-save", container)?.addEventListener("click", async () => {
    const name = qs("#period-name", container).value.trim();
    const routineId = qs("#period-routine", container).value;
    const startDate = qs("#period-start", container).value;
    const endDate = qs("#period-end", container).value;
    if (!routineId) { toast("Pick a routine"); return; }
    if (!startDate || !endDate || endDate < startDate) { toast("Check the date range"); return; }
    const overlap = routinePeriodForDate(startDate, periods) || routinePeriodForDate(endDate, periods);
    if (overlap) {
      const ok = await confirmModal({
        title: "Overlaps an existing period",
        body: `This overlaps "${escapeHtml(overlap.name || "an existing period")}". The one you're adding now will take precedence on the overlapping dates — the older period stays saved underneath it. Continue?`,
        confirmLabel: "Add anyway",
      });
      if (!ok) return;
    }
    await storage.addRoutinePeriod({ name, routineId, startDate, endDate });
    periodFormDraft = null;
    toast("Routine period added");
    renderPersonalSchedule(container, navigate);
  });
  qsa('[data-act="delete-period"]', container).forEach((btn) => {
    btn.addEventListener("click", async () => {
      const ok = await confirmModal({ title: "Remove this period?", body: "Dates in this range will fall back to your weekly routine (or an older overlapping period).", confirmLabel: "Remove", danger: true });
      if (!ok) return;
      await storage.deleteRoutinePeriod(btn.dataset.id);
      toast("Period removed");
      renderPersonalSchedule(container, navigate);
    });
  });

  qs("#event-add-open", container)?.addEventListener("click", () => {
    eventFormDraft = { title: "", activityType: ACTIVITY_TYPE_SUGGESTIONS[0], priority: "normal", allDay: false, start: "", end: "", mode: "one-time", date: todayDateStr(), recurrence: null };
    renderPersonalSchedule(container, navigate);
  });
  wireEventForm(container, navigate);
  qsa('[data-act="delete-event"]', container).forEach((btn) => {
    btn.addEventListener("click", async () => {
      await storage.deletePersonalEvent(btn.dataset.id);
      toast("Event removed");
      renderPersonalSchedule(container, navigate);
    });
  });

  qs("#import-open", container)?.addEventListener("click", () => {
    personalImportMode = "input";
    renderPersonalSchedule(container, navigate);
  });
  qs("#import-cancel", container)?.addEventListener("click", () => {
    personalImportMode = null; personalImportRawText = "";
    renderPersonalSchedule(container, navigate);
  });
  qs("#import-textarea", container)?.addEventListener("input", (e) => { personalImportRawText = e.target.value; });
  qs("#import-parse", container)?.addEventListener("click", () => {
    const text = qs("#import-textarea", container).value;
    if (!text.trim()) { toast("Paste something first"); return; }
    personalImportItems = parseScheduleText(text, new Date().getFullYear());
    personalImportMode = "review";
    renderPersonalSchedule(container, navigate);
  });
  qs("#import-back", container)?.addEventListener("click", () => {
    personalImportMode = "input";
    renderPersonalSchedule(container, navigate);
  });
  qs("#import-confirm", container)?.addEventListener("click", async () => {
    const included = personalImportItems.filter((it) => it.include);
    if (!included.length) { toast("Nothing checked to add"); return; }
    let skipped = 0;
    for (const item of included) {
      if (item.type === "recurring-event" && item.daysOfWeek.length === 0) { skipped++; continue; }
      const payload = {
        title: item.title.trim() || item.activityType,
        activityType: item.activityType, priority: item.priority, allDay: item.allDay,
        start: item.allDay ? "" : item.start, end: item.allDay ? "" : item.end,
      };
      if (item.type === "recurring-event") {
        payload.date = null;
        payload.recurrence = { daysOfWeek: item.daysOfWeek, startDate: item.recurStartDate || todayDateStr(), endDate: item.recurEndDate || null };
      } else {
        payload.date = item.date || todayDateStr();
        payload.recurrence = null;
      }
      await storage.savePersonalEvent(payload);
    }
    const added = included.length - skipped;
    toast(`${added} event${added === 1 ? "" : "s"} added${skipped ? `, ${skipped} skipped (no days selected)` : ""}`);
    personalImportMode = null; personalImportRawText = ""; personalImportItems = null;
    renderPersonalSchedule(container, navigate);
  });

  if (personalImportMode === "review" && personalImportItems) {
    qsa(".import-include", container).forEach((cb) => {
      cb.addEventListener("change", (e) => { personalImportItems[Number(cb.dataset.idx)].include = e.target.checked; });
    });
    qsa('[data-act="import-remove"]', container).forEach((btn) => {
      btn.addEventListener("click", () => {
        personalImportItems.splice(Number(btn.dataset.idx), 1);
        renderPersonalSchedule(container, navigate);
      });
    });
    qsa(".import-field", container).forEach((el) => {
      const update = () => { personalImportItems[Number(el.dataset.idx)][el.dataset.field] = el.value; };
      el.addEventListener("input", update);
      el.addEventListener("change", update);
    });
    qsa(".import-allday", container).forEach((cb) => {
      cb.addEventListener("change", (e) => {
        personalImportItems[Number(cb.dataset.idx)].allDay = e.target.checked;
        renderPersonalSchedule(container, navigate);
      });
    });
    qsa(".import-type-toggle", container).forEach((toggle) => {
      qsa("button", toggle).forEach((btn) => {
        btn.addEventListener("click", () => {
          personalImportItems[Number(toggle.dataset.idx)].type = btn.dataset.value;
          renderPersonalSchedule(container, navigate);
        });
      });
    });
    qsa(".import-dow-btn", container).forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = personalImportItems[Number(btn.dataset.idx)];
        const dow = Number(btn.dataset.dow);
        const set = new Set(item.daysOfWeek);
        if (set.has(dow)) set.delete(dow); else set.add(dow);
        item.daysOfWeek = [...set].sort();
        renderPersonalSchedule(container, navigate);
      });
    });
  }
}

function renderRoutineBlockEditor(body, container, navigate, routine) {
  const draft = routineBlockDrafts[routine.id];
  body.innerHTML = `
    ${draft.map((b, i) => `
      <div class="routine-block-row" style="border-top:1px solid var(--c-hairline); padding:10px 0; display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; gap:6px;">
          <input type="text" data-idx="${i}" data-field="start" value="${escapeHtml(b.start || "")}" placeholder="Start (e.g. 8:00 AM)" style="flex:1; min-width:0; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:8px 8px; font-size:12.5px;">
          <input type="text" data-idx="${i}" data-field="end" value="${escapeHtml(b.end || "")}" placeholder="End (optional)" style="flex:1; min-width:0; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:8px 8px; font-size:12.5px;">
          <button class="link-btn" data-act="remove-block" data-idx="${i}" style="color:var(--c-crimson-bright); font-size:16px; padding:2px 6px; flex-shrink:0;">✕</button>
        </div>
        <input type="text" data-idx="${i}" data-field="label" value="${escapeHtml(b.label || "")}" placeholder="What happens" style="background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:8px 10px; font-size:13px;">
        <div style="display:flex; gap:6px;">
          <div style="flex:1;">${activityTypeSelectHtml(b.activityType).replace("<select ", `<select data-idx="${i}" `)}</div>
          <div style="flex:1;">${prioritySelectHtml(b.priority).replace("<select ", `<select data-idx="${i}" `)}</div>
        </div>
      </div>
    `).join("") || `<p class="text-faint" style="margin:10px 0;">No time blocks yet — add one below.</p>`}
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn" data-act="add-block" type="button">+ Add Block</button>
      <button class="btn btn-primary" data-act="save-blocks" type="button">Save</button>
    </div>
    <button class="btn btn-danger" data-act="delete-routine" type="button" style="width:100%; margin-top:10px;">Delete Routine</button>
  `;

  qsa("input[data-field]", body).forEach((input) => {
    input.addEventListener("input", () => { draft[Number(input.dataset.idx)][input.dataset.field] = input.value; });
  });
  qsa("select[data-field]", body).forEach((sel) => {
    sel.addEventListener("change", () => { draft[Number(sel.dataset.idx)][sel.dataset.field] = sel.value; });
  });
  qsa('[data-act="remove-block"]', body).forEach((btn) => {
    btn.addEventListener("click", () => {
      draft.splice(Number(btn.dataset.idx), 1);
      renderRoutineBlockEditor(body, container, navigate, routine);
    });
  });
  qs('[data-act="add-block"]', body).addEventListener("click", () => {
    draft.push(blankRoutineBlock());
    renderRoutineBlockEditor(body, container, navigate, routine);
  });
  qs('[data-act="save-blocks"]', body).addEventListener("click", async () => {
    const cleaned = draft.map((b) => ({ ...b, label: (b.label || "").trim() })).filter((b) => b.label);
    await storage.savePersonalRoutine({ ...routine, blocks: cleaned });
    toast("Routine saved");
    renderPersonalSchedule(container, navigate);
  });
  qs('[data-act="delete-routine"]', body).addEventListener("click", async () => {
    const ok = await confirmModal({ title: `Delete "${routine.name}"?`, body: "Any day currently assigned to this routine (weekly default or a temporary period) will show no routine until you pick another.", confirmLabel: "Delete", danger: true });
    if (!ok) return;
    delete routineBlockDrafts[routine.id];
    routineEditorOpenId = null;
    await storage.deletePersonalRoutine(routine.id);
    toast("Routine deleted");
    renderPersonalSchedule(container, navigate);
  });
}

function wireEventForm(container, navigate) {
  const modeToggle = qs("#event-mode-toggle", container);
  if (!modeToggle) return;
  qsa("button", modeToggle).forEach((btn) => {
    btn.addEventListener("click", () => { eventFormDraft.mode = btn.dataset.value; renderPersonalSchedule(container, navigate); });
  });
  qsa(".event-dow-btn", container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const dow = Number(btn.dataset.dow);
      if (!eventFormDraft.recurrence) eventFormDraft.recurrence = { daysOfWeek: [], startDate: todayDateStr(), endDate: null };
      const set = new Set(eventFormDraft.recurrence.daysOfWeek);
      if (set.has(dow)) set.delete(dow); else set.add(dow);
      eventFormDraft.recurrence.daysOfWeek = [...set].sort();
      renderPersonalSchedule(container, navigate);
    });
  });
  qs("#event-allday", container)?.addEventListener("change", (e) => { eventFormDraft.allDay = e.target.checked; renderPersonalSchedule(container, navigate); });
  qs("#event-cancel", container)?.addEventListener("click", () => { eventFormDraft = null; renderPersonalSchedule(container, navigate); });
  qs("#event-save", container)?.addEventListener("click", async () => {
    const title = qs("#event-title", container).value.trim();
    if (!title) { toast("Give the event a title"); return; }
    const activityType = qs("#event-activity-type", container).value;
    const priority = qs("#event-priority", container).value;
    const allDay = qs("#event-allday", container).checked;
    const start = allDay ? "" : (qs("#event-start-time", container)?.value.trim() || "");
    const end = allDay ? "" : (qs("#event-end-time", container)?.value.trim() || "");
    const payload = { id: eventFormDraft.id, title, activityType, priority, allDay, start, end };
    if (eventFormDraft.mode === "one-time") {
      const date = qs("#event-date", container).value;
      if (!date) { toast("Pick a date"); return; }
      payload.date = date; payload.recurrence = null;
    } else {
      const daysOfWeek = eventFormDraft.recurrence?.daysOfWeek || [];
      if (!daysOfWeek.length) { toast("Pick at least one day of the week"); return; }
      const startDate = qs("#event-recur-start", container).value;
      const endDate = qs("#event-recur-end", container).value || null;
      payload.date = null; payload.recurrence = { daysOfWeek, startDate, endDate };
    }
    await storage.savePersonalEvent(payload);
    eventFormDraft = null;
    toast("Event saved");
    renderPersonalSchedule(container, navigate);
  });
}

// ============================================================================
// DAY VIEW tab — the merged picture for one date: what the Training Schedule
// says, what the Personal Schedule says (routine + events + focus), whether
// they conflict, and quick actions to adjust just that date.
// ============================================================================

let dayViewDate = null;
let dayViewExplainOpen = false;

async function renderDayView(container, navigate) {
  if (!dayViewDate) dayViewDate = todayDateStr();

  const [settingsData, programState, trainingOverrides, routines, weeklyMap, periods, personalOverrides, events, programHistory] = await Promise.all([
    storage.getSettings(),
    storage.getProgramState(),
    storage.getScheduleOverrides(),
    storage.getPersonalRoutines(),
    storage.getWeeklyRoutineMap(),
    storage.getRoutinePeriods(),
    storage.getPersonalDateOverrides(),
    storage.getPersonalEvents(),
    storage.getProgramHistory(),
  ]);

  const [y, m, d] = dayViewDate.split("-").map(Number);
  const dateObj = new Date(y, m - 1, d);
  const patternLetter = patternLetterForDateV(dateObj, programHistory);
  const trainingLetter = effectiveDayTypeForDateV(dateObj, programHistory, trainingOverrides);
  const isPatternOverride = Object.prototype.hasOwnProperty.call(trainingOverrides, dayViewDate);
  const trainingLabels = dayTypeLabels();
  const plan = getPersonalDayPlan(dayViewDate, { routines, weeklyRoutineMap: weeklyMap, routinePeriods: periods, dateOverrides: personalOverrides, events });
  const status = personalDayStatus(plan);
  const advisory = trainingDayAdvisory(trainingLetter, plan);
  const explainReasons = explainTrainingDay({ trainingLetter, isPatternOverride, plan, advisory });
  const dateLabel = dateObj.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const isToday = dayViewDate === todayDateStr();
  const isRealWorkoutDay = !!trainingLetter && trainingLetter !== "R";

  container.innerHTML = `
    <div class="flex-between" style="margin-bottom:6px;">
      <button class="link-btn" id="day-prev" type="button">‹ Prev</button>
      <strong>${isToday ? "Today — " : ""}${escapeHtml(dateLabel)}</strong>
      <button class="link-btn" id="day-next" type="button">Next ›</button>
    </div>
    ${!isToday ? `<div class="text-center" style="margin-bottom:14px;"><button class="link-btn" id="day-today" type="button">Jump to today</button></div>` : `<div style="margin-bottom:14px;"></div>`}

    <div class="card" style="margin-bottom:14px;">
      <div class="flex-between">
        <span class="eyebrow">Training</span>
        <span class="badge" style="color:var(${dayTypeColorVar(trainingLetter)}); border-color:var(${dayTypeColorVar(trainingLetter)});">${trainingLetter ? escapeHtml(trainingLabels[trainingLetter] || trainingLetter) : "–"}</span>
      </div>
      ${advisory.level === "blocked" ? `<p style="color:var(--c-warn); font-size:12.5px; margin:10px 0 0;">⚠ ${escapeHtml(advisory.message)}</p>` : ""}
      ${advisory.level === "busy" ? `<p class="text-faint" style="font-size:12.5px; margin:10px 0 0;">${escapeHtml(advisory.message)}</p>` : ""}

    <div class="section-title"><h2>Timeline</h2></div>
    <div class="card" style="margin-bottom:14px;">

        <div style="padding:9px 0; border-top:1px solid var(--c-hairline);">

            <span style="font-size:13px;">${escapeHtml(b.label || b.activityType || "")}</span>

          <span class="text-faint" style="font-size:11.5px;">${b.allDay ? "All day" : [b.start, b.end].filter(Boolean).map(escapeHtml).join(" – ")} ${b.activityType ? "· " + escapeHtml(b.activityType) : ""} · ${b.source === "event" ? "event" : "routine"}</span>
        </div>
      `).join("") : `<p class="text-faint" style="margin:0;">Nothing on the personal schedule for this day.</p>`}
    </div>

    <div class="section-title"><h2>Personal Quick Actions</h2></div>
    <div class="card" style="margin-bottom:14px;">
      <div class="btn-row" style="flex-wrap:wrap; gap:8px;">
        <button class="btn btn-sm" data-act="mark-free" type="button">I'm Free</button>
        <button class="btn btn-sm" data-act="mark-unavailable" type="button">I'm Unavailable</button>
        <button class="btn btn-sm" data-act="swap-routine" type="button">Use a Different Routine</button>
        <button class="btn btn-sm" data-act="set-focus" type="button">Set Focus</button>
        ${plan.isDateOverridden ? `<button class="btn btn-sm btn-ghost" data-act="reset-day" type="button">Reset to Default</button>` : ""}
      </div>
    </div>

    <div class="section-title"><h2>Training Quick Actions</h2></div>
    <div class="card">
      <div class="btn-row" style="flex-wrap:wrap; gap:8px;">
        <button class="btn btn-sm" data-act="change-workout" type="button">Change Workout</button>
        ${isRealWorkoutDay ? `<button class="btn btn-sm" data-act="move-workout" type="button">Move Workout</button>` : ""}
        ${isRealWorkoutDay ? `<button class="btn btn-sm btn-ghost" data-act="skip-workout" type="button">Skip This Workout</button>` : ""}

      </div>
      <p class="text-faint" style="margin:12px 0 0; font-size:11.5px;">Changes here only affect this date — your training sequence keeps repeating from where it was.</p>
    </div>

  qs("#day-prev", container).addEventListener("click", () => { dayViewDate = addDaysToDateStr(dayViewDate, -1); renderDayView(container, navigate); });
  qs("#day-next", container).addEventListener("click", () => { dayViewDate = addDaysToDateStr(dayViewDate, 1); renderDayView(container, navigate); });
  qs("#day-today", container)?.addEventListener("click", () => { dayViewDate = todayDateStr(); renderDayView(container, navigate); });
  qs("#day-explain-toggle", container).addEventListener("click", () => { dayViewExplainOpen = !dayViewExplainOpen; renderDayView(container, navigate); });

  qs('[data-act="mark-free"]', container).addEventListener("click", async () => {
    await storage.setPersonalDateOverride(dayViewDate, { availability: "free" });
    toast("Marked free for this date");
    renderDayView(container, navigate);
  });
  qs('[data-act="mark-unavailable"]', container).addEventListener("click", async () => {
    await storage.setPersonalDateOverride(dayViewDate, { availability: "unavailable" });
    toast("Marked unavailable for this date");
    renderDayView(container, navigate);
  });
  qs('[data-act="reset-day"]', container)?.addEventListener("click", async () => {
    await storage.setPersonalDateOverride(dayViewDate, null);
    toast("Reset to default");
    renderDayView(container, navigate);
  });
  qs('[data-act="swap-routine"]', container).addEventListener("click", async () => {
    if (!routines.length) { toast("Add a routine first, in the Personal tab"); return; }
    const result = await pickOptionModal({
      title: "Use a different routine for this day only",
      body: "This changes just this one date — your weekly default and any routine period stay untouched.",
      options: routines.map((r) => ({ value: r.id, label: r.name })),
      currentValue: plan.routine?.id || null,
      allowClear: true,
      clearLabel: "Reset to default",
    });
    if (result === undefined) return;
    await storage.setPersonalDateOverride(dayViewDate, { routineId: result });
    toast(result === null ? "Reset to default routine" : "Routine updated for this day");
    renderDayView(container, navigate);
  });
  qs('[data-act="set-focus"]', container).addEventListener("click", async () => {
    const value = await textInputModal({ title: "Set a focus for this day", label: "Focus", placeholder: "e.g. Exam Prep", initialValue: plan.focus || "" });
    if (value === undefined) return;
    await storage.setPersonalDateOverride(dayViewDate, { focus: value.trim() || null });
    toast("Focus updated");
    renderDayView(container, navigate);
  });

  qs('[data-act="change-workout"]', container).addEventListener("click", async () => {
    if (!PROGRAM_DAY_TYPES.length) { toast("Finish Program Setup to unlock day types"); return; }
    const result = await scheduleOverrideModal({
      dateLabel, patternLetter, currentOverride: trainingOverrides[dayViewDate],
      dayTypeOptions: PROGRAM_DAY_TYPES, labelsMap: trainingLabels,
    });
    if (!result) return;
    await storage.setScheduleOverride(dayViewDate, result.action === "clear" ? null : result.value);
    toast(result.action === "clear" ? "Reset to sequence" : "Workout updated for this day");
    renderDayView(container, navigate);
  });
  qs('[data-act="reset-training"]', container)?.addEventListener("click", async () => {
    await storage.setScheduleOverride(dayViewDate, null);
    toast("Reset to sequence");
    renderDayView(container, navigate);
  });
  qs('[data-act="skip-workout"]', container)?.addEventListener("click", async () => {
    const ok = await confirmModal({ title: "Skip this workout?", body: "This date becomes a Rest day. Your sequence keeps repeating from where it was — nothing else shifts.", confirmLabel: "Skip It" });
    if (!ok) return;
    await storage.setScheduleOverride(dayViewDate, "R");
    toast("Marked as Rest");
    renderDayView(container, navigate);
  });
  qs('[data-act="move-workout"]', container)?.addEventListener("click", async () => {
    const targetDate = await dateInputModal({
      title: "Move this workout to...",
      body: `Pick the date you'd rather train ${trainingLabels[trainingLetter] || trainingLetter} instead.`,
      label: "New date",
      initialValue: addDaysToDateStr(dayViewDate, 1),
    });
    if (!targetDate) return;
    const preview = previewMoveWorkout(dayViewDate, targetDate, { history: programHistory, scheduleOverrides: trainingOverrides });
    if (preview.invalid) { toast("Pick a different date to move to"); return; }
    const [ty, tm, td] = targetDate.split("-").map(Number);
    const targetLabel = new Date(ty, tm - 1, td).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    const ok = await confirmModal({
      title: "Preview this move",
      body: `
        <strong>${escapeHtml(dateLabel)}</strong> becomes <em>Rest</em>.<br>
        <strong>${escapeHtml(targetLabel)}</strong> becomes <em>${escapeHtml(trainingLabels[preview.targetAfter] || preview.targetAfter)}</em>${preview.overwritesExistingWorkout ? `, replacing its currently-scheduled <em>${escapeHtml(trainingLabels[preview.targetBefore] || preview.targetBefore)}</em>` : ""}.
        <br><br>Nothing else in your sequence shifts — this only changes these two dates.
      `,
      confirmLabel: "Apply Move",
    });
    if (!ok) return;
    await storage.setScheduleOverride(preview.sourceDate, preview.sourceAfter);
    await storage.setScheduleOverride(preview.targetDate, preview.targetAfter);
    toast("Workout moved");
    renderDayView(container, navigate);
  });
}

// ============================================================================
// WHAT-IF tab — test a hypothetical change and see its effect before
// committing to anything. Nothing here writes to storage until "Apply".
// ============================================================================

let whatIfDate = null;
let whatIfType = "mark-unavailable";
let whatIfRoutineId = null;
let whatIfEventDraft = null; // { title, activityType, priority, allDay, start, end } while type === "add-event"
let whatIfResult = null;     // last runWhatIfSimulation() output, or null before running

const WHAT_IF_SCENARIOS = [
  { value: "mark-unavailable", label: "I can't do anything this day" },
  { value: "mark-free", label: "I suddenly have the whole day free" },
  { value: "swap-routine", label: "Use a different routine" },
  { value: "skip-workout", label: "Skip the scheduled workout" },
  { value: "add-event", label: "Add a one-time event" },
];

async function renderWhatIf(container, navigate) {
  if (!whatIfDate) whatIfDate = todayDateStr();

  const [settingsData, programState, trainingOverrides, routines, weeklyMap, periods, personalOverrides, events, programHistory] = await Promise.all([
    storage.getSettings(), storage.getProgramState(), storage.getScheduleOverrides(),
    storage.getPersonalRoutines(), storage.getWeeklyRoutineMap(), storage.getRoutinePeriods(),
    storage.getPersonalDateOverrides(), storage.getPersonalEvents(), storage.getProgramHistory(),
  ]);
  const trainingLabels = dayTypeLabels();
  const baseData = { dateOverrides: personalOverrides, personalEvents: events, scheduleOverrides: trainingOverrides, routines, weeklyRoutineMap: weeklyMap, routinePeriods: periods };
  const ctx = { history: programHistory };

  if (whatIfRoutineId === null && routines.length) whatIfRoutineId = routines[0].id;
  if (!whatIfEventDraft) whatIfEventDraft = { title: "", activityType: ACTIVITY_TYPE_SUGGESTIONS[0], priority: "normal", allDay: false, start: "", end: "" };

  container.innerHTML = `
    <div class="section-title"><h2>Test a Scenario</h2></div>
    <p class="text-faint" style="margin:-8px 0 10px;">Nothing changes until you review the result and choose to apply it.</p>
    <div class="card" style="margin-bottom:16px;">
      <div class="field"><label>Date</label><input type="date" id="whatif-date" value="${whatIfDate}"></div>
      <div class="field">
        <label>What if...</label>
        <select id="whatif-type">${WHAT_IF_SCENARIOS.map((s) => `<option value="${s.value}" ${s.value === whatIfType ? "selected" : ""}>${escapeHtml(s.label)}</option>`).join("")}</select>
      </div>
      ${whatIfType === "swap-routine" ? `
        <div class="field"><label>Routine to try</label><select id="whatif-routine">${routines.map((r) => `<option value="${r.id}" ${r.id === whatIfRoutineId ? "selected" : ""}>${escapeHtml(r.name)}</option>`).join("")}</select></div>
      ` : ""}
      ${whatIfType === "add-event" ? `
        <div class="field"><label>Title</label><input type="text" id="whatif-event-title" value="${escapeHtml(whatIfEventDraft.title)}" placeholder="e.g. Family visit"></div>
        <div style="display:flex; gap:8px;">
          <div class="field" style="flex:1;"><label>Type</label>${activityTypeSelectHtml(whatIfEventDraft.activityType, "whatif-event-type")}</div>
          <div class="field" style="flex:1;"><label>Priority</label>${prioritySelectHtml(whatIfEventDraft.priority, "whatif-event-priority")}</div>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px;"><input type="checkbox" id="whatif-event-allday" ${whatIfEventDraft.allDay ? "checked" : ""}> All day</label>
        ${!whatIfEventDraft.allDay ? `
          <div style="display:flex; gap:8px;">
            <div class="field" style="flex:1;"><label>Start</label><input type="text" id="whatif-event-start" value="${escapeHtml(whatIfEventDraft.start)}" placeholder="e.g. 2:00 PM"></div>
            <div class="field" style="flex:1;"><label>End</label><input type="text" id="whatif-event-end" value="${escapeHtml(whatIfEventDraft.end)}" placeholder="optional"></div>
          </div>
        ` : ""}
      ` : ""}
      <button class="btn btn-primary" id="whatif-run" type="button" style="width:100%; margin-top:4px;">Run Simulation</button>
    </div>

    ${whatIfResult ? `
      <div class="section-title"><h2>Result</h2></div>
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex; gap:10px;">
          <div style="flex:1;">
            <div class="eyebrow">Before</div>
            <p style="margin:6px 0 0; font-size:13px;">${escapeHtml(whatIfResult.before.trainingLetter ? (trainingLabels[whatIfResult.before.trainingLetter] || whatIfResult.before.trainingLetter) : "–")}</p>
            <p class="text-faint" style="margin:2px 0 0; font-size:11.5px;">${escapeHtml(whatIfResult.before.status)}${whatIfResult.before.advisory.level !== "none" ? " · " + whatIfResult.before.advisory.level : ""}</p>
          </div>
          <div style="flex:1;">
            <div class="eyebrow">After</div>
            <p style="margin:6px 0 0; font-size:13px;">${escapeHtml(whatIfResult.after.trainingLetter ? (trainingLabels[whatIfResult.after.trainingLetter] || whatIfResult.after.trainingLetter) : "–")}</p>
            <p class="text-faint" style="margin:2px 0 0; font-size:11.5px;">${escapeHtml(whatIfResult.after.status)}${whatIfResult.after.advisory.level !== "none" ? " · " + whatIfResult.after.advisory.level : ""}</p>
          </div>
        </div>
        ${whatIfResult.after.advisory.message ? `<p style="color:var(${whatIfResult.after.advisory.level === "blocked" ? "--c-warn" : "--c-off-dim"}); font-size:12px; margin:12px 0 0;">${escapeHtml(whatIfResult.after.advisory.message)}</p>` : ""}
      </div>
      ${whatIfResult.newConflicts.length ? `
        <div class="card" style="margin-bottom:12px; border-color:var(--c-warn);">
          <p style="margin:0 0 6px; font-size:12.5px; font-weight:600;">This would create ${whatIfResult.newConflicts.length} new upcoming conflict${whatIfResult.newConflicts.length === 1 ? "" : "s"}:</p>
          ${whatIfResult.newConflicts.map((c) => `<p class="text-faint" style="margin:2px 0; font-size:12px;">${escapeHtml(formatDateStrShort(c.date))} — ${escapeHtml(trainingLabels[c.trainingLetter] || c.trainingLetter)}</p>`).join("")}
        </div>
      ` : ""}
      ${whatIfResult.resolvedConflicts.length ? `
        <div class="card" style="margin-bottom:12px;">
          <p style="margin:0 0 6px; font-size:12.5px; font-weight:600;">This would resolve ${whatIfResult.resolvedConflicts.length} existing conflict${whatIfResult.resolvedConflicts.length === 1 ? "" : "s"}:</p>
          ${whatIfResult.resolvedConflicts.map((c) => `<p class="text-faint" style="margin:2px 0; font-size:12px;">${escapeHtml(formatDateStrShort(c.date))} — ${escapeHtml(trainingLabels[c.trainingLetter] || c.trainingLetter)}</p>`).join("")}
        </div>
      ` : ""}
      <div class="btn-row">
        <button class="btn btn-ghost" id="whatif-discard" type="button">Discard</button>
        <button class="btn btn-primary" id="whatif-apply" type="button">Apply This Change</button>
      </div>
    ` : ""}
  `;

  qs("#whatif-date", container).addEventListener("change", (e) => { whatIfDate = e.target.value; whatIfResult = null; renderWhatIf(container, navigate); });
  qs("#whatif-type", container).addEventListener("change", (e) => { whatIfType = e.target.value; whatIfResult = null; renderWhatIf(container, navigate); });
  qs("#whatif-routine", container)?.addEventListener("change", (e) => { whatIfRoutineId = e.target.value; });
  qs("#whatif-event-allday", container)?.addEventListener("change", (e) => { whatIfEventDraft.allDay = e.target.checked; renderWhatIf(container, navigate); });

  qs("#whatif-run", container).addEventListener("click", () => {
    let scenario = { type: whatIfType, date: whatIfDate };
    if (whatIfType === "swap-routine") {
      if (!routines.length) { toast("Add a routine first, in the Personal tab"); return; }
      scenario.routineId = qs("#whatif-routine", container).value;
    }
    if (whatIfType === "add-event") {
      const title = qs("#whatif-event-title", container).value.trim();
      if (!title) { toast("Give the hypothetical event a title"); return; }
      whatIfEventDraft.title = title;
      whatIfEventDraft.activityType = qs("#whatif-event-type", container).value;
      whatIfEventDraft.priority = qs("#whatif-event-priority", container).value;
      whatIfEventDraft.allDay = qs("#whatif-event-allday", container).checked;
      whatIfEventDraft.start = whatIfEventDraft.allDay ? "" : (qs("#whatif-event-start", container)?.value.trim() || "");
      whatIfEventDraft.end = whatIfEventDraft.allDay ? "" : (qs("#whatif-event-end", container)?.value.trim() || "");
      scenario.event = { ...whatIfEventDraft };
    }
    whatIfResult = runWhatIfSimulation(scenario, baseData, ctx);
    renderWhatIf(container, navigate);
  });

  qs("#whatif-discard", container)?.addEventListener("click", () => { whatIfResult = null; renderWhatIf(container, navigate); });
  qs("#whatif-apply", container)?.addEventListener("click", async () => {
    if (whatIfType === "mark-unavailable") await storage.setPersonalDateOverride(whatIfDate, { availability: "unavailable" });
    else if (whatIfType === "mark-free") await storage.setPersonalDateOverride(whatIfDate, { availability: "free" });
    else if (whatIfType === "swap-routine") await storage.setPersonalDateOverride(whatIfDate, { routineId: whatIfRoutineId });
    else if (whatIfType === "skip-workout") await storage.setScheduleOverride(whatIfDate, "R");
    else if (whatIfType === "add-event") await storage.savePersonalEvent({ ...whatIfEventDraft, date: whatIfDate, recurrence: null });
    whatIfResult = null;
    toast("Change applied");
    renderWhatIf(container, navigate);
  });
}

// ============================================================================
// SCHEDULE ROOT — the four sub-tabs (Training / Personal / Day / What If)
// that make up the Schedule nav destination.
// ============================================================================

let scheduleActiveTab = "training";

async function renderScheduleRoot(container, navigate) {
  container.innerHTML = `
    <h1 style="font-size:22px; margin:6px 0 16px;">Schedule</h1>
    <div class="toggle-row" id="schedule-root-toggle" style="margin-bottom:18px;">
      <button type="button" data-value="training" class="${scheduleActiveTab === "training" ? "active" : ""}">Training</button>
      <button type="button" data-value="personal" class="${scheduleActiveTab === "personal" ? "active" : ""}">Personal</button>
      <button type="button" data-value="day" class="${scheduleActiveTab === "day" ? "active" : ""}">Day</button>
      <button type="button" data-value="whatif" class="${scheduleActiveTab === "whatif" ? "active" : ""}">What If</button>
    </div>
    <div id="schedule-root-body"></div>
  `;
  qsa("button", qs("#schedule-root-toggle", container)).forEach((btn) => {
    btn.addEventListener("click", () => { scheduleActiveTab = btn.dataset.value; renderScheduleRoot(container, navigate); });
  });
  const body = qs("#schedule-root-body", container);
  if (scheduleActiveTab === "training") await renderSchedule(body, navigate);
  else if (scheduleActiveTab === "personal") await renderPersonalSchedule(body, navigate);
  else if (scheduleActiveTab === "day") await renderDayView(body, navigate);
  else await renderWhatIf(body, navigate);
}

const scheduleModule = { render: renderScheduleRoot };

// ============================================================================
// Program Setup Wizard — Program Type → Training Sequence. Establishes day
// types and a training sequence (pattern) only; no exercises are
// auto-assigned. Reachable at first run and again any time from
// Settings/Schedule to change the program type — never touches historical
// workout data.
// ============================================================================

let setupStep = "split"; // "split" | "sequence"
let setupChoice = { split: null };
let setupSequenceDraft = null; // array of dayType keys / "R", built during the sequence step

async function renderProgramSetup(container, navigate) {
  const programState = await storage.getProgramState();
  if (!setupChoice.split && programState.split) setupChoice = { split: programState.split };

  if (setupStep === "split") {
    container.innerHTML = `
      <h1 style="font-size:22px; margin:10px 0 6px;">Choose Your Program</h1>
      <p class="text-faint" style="margin:0 0 18px;">This sets up your day types — you'll add your own exercises after.</p>
      <div class="choice-grid">
        ${Object.entries(SPLIT_DEFS).map(([key, def]) => `
          <button class="choice-card" data-split="${key}">
            <div class="choice-icon">◆</div>
            <div class="choice-title">${escapeHtml(def.label)}</div>
          </button>`).join("")}
      </div>
    `;
    qsa("[data-split]", container).forEach((btn) => {
      btn.addEventListener("click", () => {
        setupChoice = { split: btn.dataset.split };
        setupSequenceDraft = SPLIT_DEFS[btn.dataset.split].defaultPattern.slice();
        setupStep = "sequence";
        renderProgramSetup(container, navigate);
      });
    });
    return;
  }

  // sequence
  const splitDef = SPLIT_DEFS[setupChoice.split];
  if (!setupSequenceDraft) setupSequenceDraft = splitDef.defaultPattern.slice();
  const labels = { ...Object.fromEntries(splitDef.dayTypes.map((dt) => [dt.key, dt.label])), R: "Rest" };

  container.innerHTML = `
    <button class="link-btn" data-act="back">‹ Change Program</button>
    <h1 style="font-size:22px; margin:10px 0 6px;">${escapeHtml(splitDef.label)}</h1>
    <p class="text-faint" style="margin:0 0 18px;">Build your training sequence. It repeats continuously from your start date — a new week never resets it.</p>
    <div class="section-title" style="margin-top:0;"><h2>Training Sequence</h2></div>
    <div id="setup-sequence-card"></div>
    <p class="text-faint" style="margin:10px 0 20px;">This only sets up the structure — no exercises are added automatically. You'll add your own via Add Exercise or Copy/Paste Program.</p>
    <button class="btn btn-primary" id="setup-finish" style="width:100%;">Finish Setup</button>
  `;

  const renderSeqCard = () => {
    const card = qs("#setup-sequence-card", container);
    card.innerHTML = sequenceEditorHTML(setupSequenceDraft, splitDef.dayTypes, labels);
    wireSequenceEditor(card, setupSequenceDraft, splitDef.dayTypes, renderSeqCard);
  };
  renderSeqCard();

  qs('[data-act="back"]', container).addEventListener("click", () => { setupStep = "split"; renderProgramSetup(container, navigate); });
  qs("#setup-finish", container).addEventListener("click", async () => {
    if (!setupSequenceDraft.length) {
      toast("Add at least one day to your sequence");
      return;
    }
    await storage.setProgramState({
      split: setupChoice.split,
      dayTypes: splitDef.dayTypes,
      pattern: setupSequenceDraft.slice(),
      setupComplete: true,
    });
    await storage.saveSettings({ scheduleStartDate: todayDateStr() });
    // A full program setup (first time, or "Change Program Type") is always
    // effective immediately — it's a fresh start, not a nuanced mid-rotation
    // change, since the split/day types themselves may be entirely different.
    await storage.commitProgramPatternChange(setupSequenceDraft, todayDateStr());
    setProgramDayTypes(splitDef.dayTypes);
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    setupStep = "split";
    setupChoice = { split: null };
    setupSequenceDraft = null;
    toast("Program set up");
    navigate("dashboard");
  });
}

const programSetupModule = { render: renderProgramSetup };

async function settingsRender(container, navigate) {
  const settings = await storage.getSettings();
  const meta = await storage.getMeta();
  const workouts = await storage.getWorkouts();
  const hasData = workouts.length > 0;
  const hasBackup = !!meta.lastBackupAt;
  const { data: userData } = await supa.auth.getUser();
  const userEmail = userData?.user?.email || "—";

  container.innerHTML = `

function wireToggle(row, onChange) {
  qsa("button", row).forEach((btn) => {
    btn.addEventListener("click", () => {
      qsa("button", row).forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      onChange(btn.dataset.value);
    });
  });
}

// Resizes/compresses an image file client-side before storing it, so a full
// phone-camera photo doesn't bloat the account's stored data or the JSON backup export.
function resizeImageFile(file, maxDim = MAX_BG_DIMENSION, quality = BG_JPEG_QUALITY) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Could not load that image.")); };
    img.src = objectUrl;
  });
}

async function doSetBackground(e, container, navigate) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const dataUrl = await resizeImageFile(file);
    await storage.saveSettings({ backgroundImage: dataUrl });
    applyBackground(dataUrl);
    toast("Background updated");
    settingsRender(container, navigate);
  } catch (err) {
    toast("Couldn't use that image — try a different one");
  }
}

async function doExport() {
  const data = await storage.exportAllData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const date = nowISO().slice(0, 10);
  const a = document.createElement("a");
  a.href = url;
  a.download = `gym-tracker-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  await storage.markBackupComplete();
  toast("Backup exported");
}

async function doImport(e, container, navigate) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;

  const ok = await confirmModal({
    title: "Replace current data?",
    body: "This backup will replace your current workout data. Make sure you have exported your current data first. Continue?",
    confirmLabel: "Continue",
    danger: true,
  });
  if (!ok) return;

  try {
    const text = await file.text();
    const result = await storage.importAllData(text);
    if (!result.ok) {
      await confirmModal({ title: "Import failed", body: escapeHtml(result.errors.join(" ")), confirmLabel: "OK", cancelLabel: "Close" });
      return;
    }
    const importedProgramState = await storage.getProgramState();
    setProgramDayTypes(importedProgramState.dayTypes);
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    const importedSettings = await storage.getSettings();
    applyTheme(importedSettings.theme);
    applyBackground(importedSettings.backgroundImage);
    applyAccentColor(importedSettings.accentColor);
    toast("Backup restored");
    settingsRender(container, navigate);
  } catch (err) {
    await confirmModal({ title: "Import failed", body: "The file could not be read. " + escapeHtml(err.message || ""), confirmLabel: "OK", cancelLabel: "Close" });
  }
}

async function doReset(container, navigate) {
  const first = await confirmModal({
    title: "Reset all data?",
    body: "This permanently deletes every workout, custom exercise, and setting on this device. This cannot be undone.",
    confirmLabel: "Continue",
    danger: true,
  });
  if (!first) return;
  const second = await confirmModal({
    title: "Are you sure?",
    body: "Type nothing — just confirm again. All training history will be permanently erased.",
    confirmLabel: "Erase Everything",
    danger: true,
  });
  if (!second) return;

  await storage.resetAllData();
  applyBackground(null);
  applyAccentColor(null);
  setProgramDayTypes([]);
  applyCustomExercises([], {}, {});
  toast("All data has been reset");
  settingsRender(container, navigate);
}

// Parses free-typed program text into { [dayTypeKey]: [...] } for the
// current PROGRAM_DAY_TYPES. A day type's label or key on its own line
// switches which section following exercise lines fall into (starts in the
// first day type until the first switch). Per exercise line: trailing "x4"
// / "4x" / "3 sets" sets the set count (default 2), and the word
// "unilateral" (or "uni", "single-arm", etc.) anywhere in the line marks it
// unilateral and gets stripped from the name.
function parseProgramText(text) {
  const lines = (text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const result = {};
  for (const dt of PROGRAM_DAY_TYPES) result[dt.key] = [];
  if (!PROGRAM_DAY_TYPES.length) return result;
  let section = PROGRAM_DAY_TYPES[0].key;

  const headerMatch = (lowerLine) => PROGRAM_DAY_TYPES.find((dt) =>
    lowerLine === dt.key.toLowerCase() || lowerLine === `${dt.key.toLowerCase()}:` || lowerLine === `${dt.key.toLowerCase()}-` ||
    lowerLine === dt.label.toLowerCase() || lowerLine === `${dt.label.toLowerCase()}:` || lowerLine === `${dt.label.toLowerCase()}-`
  );

  for (const raw of lines) {
    const lowerLine = raw.toLowerCase();
    const header = headerMatch(lowerLine);
    if (header) { section = header.key; continue; }

    let line = raw;

    let unilateral = false;
    const uniMatch = line.match(/[\(\[]?\s*\b(unilateral|uni|single[- ]arm|single[- ]leg|one[- ]arm|one[- ]leg)\b\s*[\)\]]?/i);
    if (uniMatch) {
      unilateral = true;
      line = line.replace(uniMatch[0], "");
    }

    let sets = 2;
    const setsMatch = line.match(/(?:(\d+)\s*(?:x|×)\b|\b(?:x|×)\s*(\d+)\b|(\d+)\s*sets?\b)/i);
    if (setsMatch) {
      sets = parseInt(setsMatch[1] || setsMatch[2] || setsMatch[3], 10);
      line = line.replace(setsMatch[0], "");
    }

    const name = line
      .replace(/^[-*•\d.\)]+\s*/, "")
      .replace(/[-–,:]+\s*$/, "")
      .replace(/\s{2,}/g, " ")
      .trim();

    if (!name) continue;
    result[section].push({ name, sets: Math.max(1, Math.min(10, sets || 2)), unilateral });
  }
  return result;
}

    const nameInput = qs("#custom-ex-name", container);
    const setsInput = qs("#custom-ex-sets", container);
    const name = nameInput.value.trim();
    const sets = Math.max(1, Math.min(10, Number(setsInput.value) || 1));

    if (!name) {
      toast("Enter a name for the exercise");
      return;
    }

    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const id = `custom-${slug || "exercise"}-${uid().slice(0, 6)}`;

    await storage.addCustomExercise({ id, name, type: selectedType, sets, unilateral: selectedUni, muscles: newExerciseMuscles, createdAt: nowISO() });
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    toast(`${name} added to ${PROGRAM[selectedType]?.label || selectedType}`);
    renderProgramOverview(container, navigate);
  });

  qs("#bulk-program-apply", container).addEventListener("click", async () => {
    const text = qs("#bulk-program-text", container).value;
    const parsed = parseProgramText(text);
    const total = PROGRAM_DAY_TYPES.reduce((sum, dt) => sum + (parsed[dt.key]?.length || 0), 0);
    if (!total) {
      toast("Couldn't find any exercises in that text");
      return;
    }

    const existing = await storage.getCustomExercises();
    const hasExisting = existing.length > 0;
    const breakdown = PROGRAM_DAY_TYPES.map((dt) => `${parsed[dt.key]?.length || 0} to ${dt.label}`).join(", ");
    const ok = await confirmModal({
      title: hasExisting ? `Replace exercises with these ${total}?` : `Add these ${total} exercises?`,
      body: hasExisting
        ? `This deletes your current exercise list and adds ${breakdown}.`
        : `This adds ${breakdown}.`,
      confirmLabel: hasExisting ? "Replace" : "Add",
      danger: hasExisting,
    });
    if (!ok) return;

    for (const c of existing) {
      await storage.deleteCustomExercise(c.id);
    }
    for (const dt of PROGRAM_DAY_TYPES) {
      for (const ex of (parsed[dt.key] || [])) {
        const slug = ex.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
        const id = `custom-${slug || "exercise"}-${uid().slice(0, 6)}`;
        await storage.addCustomExercise({ id, name: ex.name, type: dt.key, sets: ex.sets, unilateral: ex.unilateral, createdAt: nowISO() });
      }
    }
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    toast(`Program updated — ${total} exercises added`);
    renderProgramOverview(container, navigate);
  });
}

const settings = { render: settingsRender, renderProgramOverview };
const appEl = document.getElementById("app");
const navButtons = qsa(".nav-btn");

let currentParams = {};
let currentRoute = null;

const TOP_LEVEL = ["dashboard", "workout", "history", "exercises", "schedule", "settings"];

function navRootFor(route) {
  if (route.startsWith("workout")) return "workout";
  if (route.startsWith("history")) return "history";
  if (route.startsWith("exercise")) return "exercises";
  if (route === "schedule") return "schedule";
  if (route.startsWith("settings") || route === "program-overview" || route === "program-setup") return "settings";
  return "dashboard";
}

function navigate(route, params = {}) {
  currentParams = params;
  const id = params.workoutId || params.exerciseId || "";
  const hash = "#/" + route + (id ? "/" + id : "");
  if (window.location.hash === hash) {
    renderRoute(route, params);
  } else {
    window.location.hash = hash;
  }
}

function parseHash() {
  const raw = window.location.hash.replace(/^#\//, "");
  const [route, id] = raw.split("/");
  return { route: route || "dashboard", id: id || null };
}

async function renderRoute(route, params) {
  currentRoute = route;
  workout.teardown();

  navButtons.forEach((btn) => {
    const isActive = btn.dataset.route === navRootFor(route);
    btn.toggleAttribute("aria-current", isActive);
    if (isActive) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });

  appEl.scrollTop = 0;
  window.scrollTo(0, 0);

  try {
    switch (route) {
      case "dashboard":
        await dashboard.render(appEl, navigate);
        break;
      case "workout":
        await workout.renderWorkoutHome(appEl, navigate);
        break;
      case "workout-active":
        await workout.renderActiveWorkout(appEl, navigate);
        break;
      case "workout-summary":
        await workout.renderWorkoutSummary(appEl, navigate, params);
        break;
      case "history":
        await historyModule.renderList(appEl, navigate);
        break;
      case "history-detail":
        await historyModule.renderDetail(appEl, navigate, params);
        break;
      case "exercises":
        await exercisesModule.renderList(appEl, navigate);
        break;
      case "exercise-detail":
        await exercisesModule.renderDetail(appEl, navigate, params);
        break;
      case "schedule":
        await scheduleModule.render(appEl, navigate);
        break;
      case "settings":
        await settings.render(appEl, navigate);
        break;
      case "program-overview":
        await settings.renderProgramOverview(appEl, navigate);
        break;
      case "program-setup":
        await programSetupModule.render(appEl, navigate);
        break;
      default:
        await dashboard.render(appEl, navigate);
    }
  } catch (err) {
    console.error("[app] render failed for route", route, err);
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Something went wrong loading this screen</h3>
        <p>Your workout data is safe in local storage. Try going back to the dashboard.</p>
        <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" id="err-home">Go to Dashboard</button>
      </div>`;
    document.getElementById("err-home")?.addEventListener("click", () => navigate("dashboard"));
  }
  // Fade/rise the new screen in. Re-triggering a CSS animation on the same
  // element needs a forced reflow (re-adding a class that's already there
  // is a no-op), which is why the class is removed and read back before
  // being re-added — cheap way to get a per-route transition without
  // touching every individual render function.
  appEl.classList.remove("route-anim");
  void appEl.offsetWidth;
  appEl.classList.add("route-anim");
}

window.addEventListener("hashchange", () => {
  const { route, id } = parseHash();
  const params = id
    ? (currentParams.workoutId === id || currentParams.exerciseId === id ? currentParams : (route.startsWith("history") || route.startsWith("workout") ? { workoutId: id } : { exerciseId: id }))
    : {};
  renderRoute(route, params);
});

navButtons.forEach((btn) => {
  btn.addEventListener("click", () => navigate(btn.dataset.route));
});

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  try {
    // Relative path so this works when the app is deployed under a
    // sub-path, e.g. https://username.github.io/gym-tracker/
    await navigator.serviceWorker.register("./service-worker.js");
  } catch (err) {
    console.warn("[app] service worker registration failed:", err);
  }
}

// ============================================================================
// AUTH GATE — a bare sign-in/sign-up screen shown before the app boots.
// Every account is fully isolated by Supabase Row Level Security, so
// there's no cross-user data risk here; this is purely presentational.
// ============================================================================

let authMode = "signin"; // "signin" | "signup"

function renderAuthScreen() {
  document.body.classList.add("pre-auth");
  appEl.innerHTML = `
    <div style="max-width:360px; margin: 60px auto 0; padding: 0 20px;">
      <div style="text-align:center; margin-bottom:28px;">
        <div class="brand" style="justify-content:center; margin-bottom:6px;">
          <svg class="brand-mark" aria-hidden="true" viewBox="0 0 100 100" width="26" height="26">
            <path d="M88 8 L74 20 M74 20 L28 20 L28 34 L43 34 L43 40 L28 40 L28 52 L74 52 L74 80 L28 80" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="88" cy="8" r="6" fill="currentColor"/>
          </svg>
          <span class="brand-name" style="font-size:22px;">STIMULUS</span>
        </div>
        <p class="text-faint" style="margin:0;">${authMode === "signin" ? "Sign in to your account" : "Create your account"}</p>
      </div>
      <div class="card">
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="${authMode === "signin" ? "current-password" : "new-password"}" placeholder="At least 6 characters">
        </div>
        <p id="auth-msg" class="text-faint" style="display:none; margin:12px 0 0;"></p>
        <button class="btn btn-primary" id="auth-submit" style="width:100%; margin-top:16px;">${authMode === "signin" ? "Sign In" : "Create Account"}</button>
      </div>
      <p style="text-align:center; margin-top:18px;">
        <button class="link-btn" id="auth-toggle">${authMode === "signin" ? "Need an account? Sign up" : "Already have an account? Sign in"}</button>
      </p>
    </div>
  `;

  const msgEl = qs("#auth-msg", appEl);
  const showMsg = (text, isError = true) => {
    msgEl.textContent = text;
    msgEl.style.color = isError ? "var(--c-crimson-bright)" : "var(--c-off-faint)";
    msgEl.style.display = "block";
  };

  qs("#auth-toggle", appEl).addEventListener("click", () => {
    authMode = authMode === "signin" ? "signup" : "signin";
    renderAuthScreen();
  });

  qs("#auth-submit", appEl).addEventListener("click", async () => {
    const email = qs("#auth-email", appEl).value.trim();
    const password = qs("#auth-password", appEl).value;
    if (!email || !password) {
      showMsg("Enter an email and password.");
      return;
    }
    const submitBtn = qs("#auth-submit", appEl);
    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait…";

    const { data, error } = authMode === "signin"
      ? await supa.auth.signInWithPassword({ email, password })
      : await supa.auth.signUp({ email, password });

    if (error) {
      showMsg(error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = authMode === "signin" ? "Sign In" : "Create Account";
      return;
    }

    if (authMode === "signup" && !data.session) {
      // Email confirmation is required before a session exists.
      authMode = "signin";
      renderAuthScreen();
      showMsg("Account created — check your email to confirm, then sign in.", false);
      return;
    }

    document.body.classList.remove("pre-auth");
    bootApp();
  });
}

supa.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") {
    location.reload();
  }
});

async function boot() {
  try {
    const { data: sessionData } = await supa.auth.getSession();
    if (!sessionData.session) {
      renderAuthScreen();
      return;
    }
    await bootApp();
  } catch (err) {
    console.error("[app] boot failed", err);
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Couldn't start the app</h3>
        <p>${(err && err.message) ? escapeHtml(err.message) : "Unknown error"}</p>
        <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" id="boot-retry">Reload</button>
      </div>`;
    document.getElementById("boot-retry")?.addEventListener("click", () => location.reload());
  }
}

async function bootApp() {
  const result = await storage.init();
  initSaveIndicator(storage.onSaveStateChange);

  if (!result.ok) {
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Couldn't reach your data</h3>
        <p>Stimulus could not load your account's data (${result.reason || "unknown error"}). Check your internet connection and reload. If this keeps happening, the app's Supabase configuration may be incorrect.</p>
      </div>`;
    return;
  }

  const settingsData = await storage.getSettings();
  applyTheme(settingsData.theme);
  applyBackground(settingsData.backgroundImage);
  applyAccentColor(settingsData.accentColor);
  const programState = await storage.getProgramState();
  setProgramDayTypes(programState.dayTypes);
  applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());

  const { route, id } = parseHash();
  const params = id ? (route.startsWith("history") || route.startsWith("workout") ? { workoutId: id } : { exerciseId: id }) : {};
  await renderRoute(route, params);

  registerServiceWorker();
}

boot();

</script>
