<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>STIMULUS — Train. Track. Adapt.</title>
<meta name="description" content="Offline-first strength training log and progression tracker. Train. Track. Adapt.">
<meta name="theme-color" content="#0d0b0b">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stimulus">
<style>
/* ==========================================================================
   STIMULUS — design tokens
   Dark, scientific, data-driven training tool. Train. Track. Adapt.
   ========================================================================== */

:root{
  /* --- palette --- */
  --c-black:        #0a0808;
  --c-charcoal:      #121010;
  --c-panel:         #181414;
  --c-panel-raised:  #1e1a1a;
  --c-hairline:      rgba(237,230,219,0.10);
  --c-hairline-strong: rgba(237,230,219,0.18);
  --c-blood:         #5c1420;
  --c-crimson:       #a53347;
  --c-crimson-bright:#c9455c;
  --c-off:           #ece5d8;
  --c-off-dim:       #b9b0a2;
  --c-off-faint:     #837a6d;
  --c-gold:          #b7924f;
  --c-positive:      #7c9473;
  --c-warn:          #c9a23f;

  /* --- type --- */
  --f-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", "IBM Plex Mono", Consolas, monospace;

  /* --- scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --shadow-lift: 0 8px 24px rgba(0,0,0,0.45);

  --nav-h: 68px;
  --header-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

*, *::before, *::after{ box-sizing: border-box; }

html{ -webkit-text-size-adjust: 100%; }

body{
  margin:0;
  background-color: var(--c-black);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--c-off);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100dvh;
  position: relative;
}

/* When a custom wallpaper is set, dim it behind the UI so text stays readable.
   z-index -1 keeps it beneath the body's own background paint and all normal
   in-flow content, without needing every card to become semi-transparent. */
body.has-bg::after{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(13,11,11,0.62);
  pointer-events: none;
}
html[data-theme="light"] body.has-bg::after{
  background: rgba(237,230,217,0.68);
}

/* subtle grain texture, CSS-only noise, no external assets */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0.05;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size: 180px 180px;
}

h1,h2,h3,h4{
  font-family: var(--f-display);
  font-weight: 600;
  margin: 0;
  color: var(--c-off);
  letter-spacing: 0.01em;
}

button, input, select, textarea{ font-family: inherit; color: inherit; }
button{ cursor: pointer; }
a{ color: var(--c-crimson-bright); }

.eyebrow{
  font-family: var(--f-body);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-off-faint);
  font-weight: 600;
}

.numeric{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout shell
   ========================================================================== */

body.pre-auth .app-header,
body.pre-auth .bottom-nav{ display: none; }

.app-header{
  position: sticky;
  top:0;
  z-index: 40;
  height: calc(var(--header-h) + var(--safe-t));
  padding-top: var(--safe-t);
  display:flex;
  align-items:center;
  justify-content: space-between;
  padding-left: 18px;
  padding-right: 18px;
  background: linear-gradient(180deg, var(--c-black) 70%, rgba(13,11,11,0.85));
  border-bottom: 1px solid var(--c-hairline);
  backdrop-filter: blur(6px);
}

.brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ color: var(--c-crimson); font-size: 14px; }
.brand-name{
  font-family: var(--f-display);
  font-size: 19px;
  letter-spacing: 0.22em;
  font-weight: 700;
  color: var(--c-off);
}

.save-indicator{
  display:flex; align-items:center; gap:6px;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--c-off-faint);
  transition: opacity 0.3s ease;
}
.save-indicator .dot{
  width:6px; height:6px; border-radius:50%;
  background: var(--c-off-faint);
}
.save-indicator[data-state="saving"] .dot{ background: var(--c-warn); }
.save-indicator[data-state="saving"] .label::before{ content:"Saving…"; }
.save-indicator[data-state="saving"] .label{ font-size:0; }
.save-indicator[data-state="saving"] .label::before{ font-size: 11px; }
.save-indicator[data-state="saved"] .dot{ background: var(--c-positive); }
.save-indicator[data-state="idle"]{ opacity: 0.55; }
.save-indicator[data-state="error"] .dot{ background: var(--c-crimson-bright); }
.save-indicator[data-state="error"] .label::before{ content:"Save failed"; font-size:11px; }
.save-indicator[data-state="error"] .label{ font-size:0; }

.app-main{
  min-height: calc(100dvh - var(--header-h) - var(--nav-h) - var(--safe-t) - var(--safe-b));
  padding: 16px 16px calc(32px + var(--nav-h) + var(--safe-b));
  max-width: 640px;
  margin: 0 auto;
}

.bottom-nav{
  position: fixed;
  left:0; right:0; bottom:0;
  z-index: 50;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display:flex;
  background: var(--c-charcoal);
  border-top: 1px solid var(--c-hairline);
}
.nav-btn{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 3px;
  background: none; border: none;
  color: var(--c-off-faint);
  font-size: 10.5px;
  letter-spacing: 0.03em;
  padding: 6px 2px;
  min-height: 48px;
}
.nav-icon{ font-size: 17px; line-height:1; }
.nav-btn[aria-current="page"]{ color: var(--c-off); }
.nav-btn[aria-current="page"] .nav-icon{ color: var(--c-crimson-bright); }
.nav-btn:active{ opacity: 0.7; }

/* ==========================================================================
   Primitives
   ========================================================================== */

.card{
  background: var(--c-panel);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
}
.card-raised{ background: var(--c-panel-raised); }

.section-title{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 26px 0 10px;
}
.section-title h2{ font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
.section-title .link-btn{ font-size: 12px; }

.link-btn{
  background:none; border:none; color: var(--c-crimson-bright);
  padding: 4px 0; font-size: 13px; font-weight:600;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--c-hairline-strong);
  background: var(--c-panel-raised);
  color: var(--c-off);
  padding: 13px 18px;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  min-height: 48px;
  width: 100%;
  transition: transform 0.05s ease, opacity 0.15s ease;
}
.btn:active{ transform: scale(0.98); }
.btn-primary{
  background: var(--c-blood);
  border-color: var(--c-blood);
  color: var(--c-off);
}
.btn-primary:hover{ background: var(--c-crimson); }
.btn-ghost{ background: transparent; }
.btn-danger{ border-color: var(--c-crimson); color: var(--c-crimson-bright); background: transparent; }
.btn-sm{ padding: 9px 14px; min-height: 38px; font-size: 13px; width: auto; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ width: auto; flex:1; }
.btn:disabled{ opacity: 0.4; }

.badge{
  display:inline-flex; align-items:center;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 20px;
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off-dim);
}
.badge-uni{ color: var(--c-crimson-bright); border-color: var(--c-crimson); }
.badge-pr{ color: var(--c-gold); border-color: var(--c-gold); }
.badge-positive{ color: var(--c-positive); border-color: var(--c-positive); }
.badge-warn{ color: var(--c-warn); border-color: var(--c-warn); }

.empty-state{
  text-align:center; padding: 46px 18px;
  color: var(--c-off-faint);
}
.empty-state .glyph{ font-size: 26px; color: var(--c-crimson); margin-bottom: 12px; display:block; }
.empty-state h3{ font-size: 16px; color: var(--c-off); margin-bottom: 6px; }
.empty-state p{ font-size: 13.5px; margin:0; max-width: 320px; margin-inline:auto; }

.divider{ height:1px; background: var(--c-hairline); border:none; margin: 14px 0; }

.stat-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.stat-box{
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-md);
  padding: 12px;
}
.stat-box .stat-value{ font-family: var(--f-mono); font-size: 20px; color: var(--c-off); }
.stat-box .stat-label{ font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-off-faint); margin-top: 4px; }

.field{ margin-bottom: 14px; }
.field label{ display:block; font-size: 12px; letter-spacing: 0.04em; color: var(--c-off-dim); margin-bottom: 6px; }
.field input[type="text"], .field input[type="number"], .field textarea, .field select{
  width: 100%;
  background: var(--c-charcoal);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-md);
  padding: 11px 12px;
  font-size: 15px;
  color: var(--c-off);
  min-height: 46px;
}
.field textarea{ min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible, .nav-btn:focus-visible{
  outline: 2px solid var(--c-crimson-bright);
  outline-offset: 2px;
}

.toggle-row{ display:flex; border: 1px solid var(--c-hairline-strong); border-radius: var(--radius-md); overflow:hidden; }
.toggle-row button{
  flex:1; padding: 11px; background: var(--c-charcoal); border:none; color: var(--c-off-dim); font-size: 13.5px; font-weight:600;
}
.toggle-row button.active{ background: var(--c-blood); color: var(--c-off); }

/* ==========================================================================
   History calendar grid
   ========================================================================== */

.cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:11px; color: var(--c-off-faint); margin-bottom:6px; }
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
.cal-cell{
  aspect-ratio: 1; border-radius: var(--radius-sm); border: 1px solid var(--c-hairline);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:11px; color: var(--c-off-dim); background: var(--c-panel);
}
.cal-cell.cal-empty{ border-color: transparent; background: none; }
.cal-cell.cal-done{ background: var(--c-blood); border-color: var(--c-blood); color: var(--c-off); }
.cal-cell.cal-partial{ background: var(--c-panel-raised); border-color: var(--c-crimson); color: var(--c-off); }
.cal-daynum{ font-size:11px; opacity:0.85; }
.cal-tag{ font-size:10px; font-weight:700; letter-spacing:0.03em; }

/* ==========================================================================
   Toasts + modal
   ========================================================================== */

.toast-region{
  position: fixed; left:0; right:0; top: calc(var(--safe-t) + 10px);
  z-index: 200; display:flex; flex-direction:column; align-items:center; gap:8px;
  pointer-events:none;
}
.toast{
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off);
  padding: 11px 16px;
  border-radius: 30px;
  font-size: 13.5px;
  box-shadow: var(--shadow-lift);
  max-width: 88vw;
  display:flex; align-items:center; gap: 10px;
  animation: toast-in 0.22s ease;
}
.toast .undo-btn{ background:none;border:none;color:var(--c-crimson-bright);font-weight:700;font-size:13px; }
@keyframes toast-in{ from{ opacity:0; transform: translateY(-8px);} to{opacity:1; transform:translateY(0);} }

.modal-overlay{
  position: fixed; inset:0; background: rgba(6,5,5,0.72);
  z-index: 300; display:flex; align-items:flex-end; justify-content:center;
  animation: fade-in 0.15s ease;
}
@keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width: 560px;
  background: var(--c-panel);
  border: 1px solid var(--c-hairline-strong);
  border-bottom: none;
  border-radius: 18px 18px 0 0;
  padding: 22px 18px calc(22px + var(--safe-b));
  max-height: 86dvh;
  overflow-y:auto;
}
.modal-sheet h3{ font-size: 17px; margin-bottom: 8px; }
.modal-sheet p{ color: var(--c-off-dim); font-size: 14px; line-height:1.55; }

/* ==========================================================================
   Dashboard
   ========================================================================== */

.hero-card{
  background: var(--c-panel);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-lg);
  padding: 22px 18px;
  position: relative;
  overflow:hidden;
}
.hero-card::after{
  content:"✦";
  position:absolute; right: -6px; top:-10px; font-size: 90px;
  color: rgba(165,51,71,0.08);
}
.hero-eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--c-off-faint); }
.hero-title{ font-size: 30px; margin-top: 6px; letter-spacing: 0.03em; }
.hero-sub{ color: var(--c-off-dim); font-size: 13.5px; margin-top: 6px; }
.hero-actions{ margin-top: 18px; display:flex; gap:10px; }

.seal{
  width: 46px; height:46px; border-radius:50%;
  border: 2px solid var(--c-gold);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--f-display); font-size: 18px; color: var(--c-gold);
  flex-shrink:0;
  position: relative;
}
.seal::before{
  content:""; position:absolute; inset:-5px; border-radius:50%;
  border: 1px dashed rgba(183,146,79,0.4);
}

.pr-row{ display:flex; align-items:center; gap:12px; padding: 10px 0; border-bottom: 1px solid var(--c-hairline); }
.pr-row:last-child{ border-bottom:none; }
.pr-row .pr-name{ font-weight:600; font-size:14px; }
.pr-row .pr-detail{ font-size:12.5px; color: var(--c-off-faint); }

.history-item{
  display:flex; align-items:center; gap: 14px;
  padding: 13px 0; border-bottom: 1px solid var(--c-hairline);
}
.history-item:last-child{ border-bottom:none; }
.history-item .h-index{ font-family: var(--f-display); font-size: 20px; color: var(--c-off-faint); width: 30px; }
.history-item .h-body{ flex:1; }
.history-item .h-title{ font-weight:600; font-size: 14.5px; display:flex; gap:8px; align-items:center; }
.history-item .h-meta{ font-size: 12px; color: var(--c-off-faint); margin-top: 2px; }
.history-item .h-chevron{ color: var(--c-off-faint); }

/* ==========================================================================
   Workout / active session
   ========================================================================== */

.workout-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 6px;
}
.workout-progress-bar{
  height: 6px; border-radius: 4px; background: var(--c-charcoal);
  overflow:hidden; margin: 10px 0 16px;
  border: 1px solid var(--c-hairline);
}
.workout-progress-fill{ height:100%; background: linear-gradient(90deg, var(--c-blood), var(--c-crimson-bright)); transition: width 0.25s ease; }

.exercise-card{ }
.exercise-card .ex-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.exercise-card .ex-name{ font-size: 16px; font-weight:700; font-family: var(--f-display); }
.exercise-card .ex-sub{ font-size: 11.5px; color: var(--c-off-faint); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.exercise-card .ex-prev{
  font-size: 12px; color: var(--c-off-dim);
  background: var(--c-charcoal); border-radius: var(--radius-sm);
  padding: 8px 10px; margin: 10px 0; font-family: var(--f-mono);
}

.set-row{
  display:flex; align-items:center; gap:8px; padding: 8px 0;
  border-top: 1px solid var(--c-hairline);
}
.set-row:first-of-type{ border-top:none; }
.set-index{
  width: 26px; height:26px; border-radius:50%; flex-shrink:0;
  border: 1px solid var(--c-hairline-strong);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--f-mono); font-size: 12px; color: var(--c-off-dim);
}
.set-row.completed .set-index{ background: var(--c-blood); border-color: var(--c-blood); color:var(--c-off); }
.set-inputs{ display:flex; gap:6px; flex:1; }
.set-inputs input{
  width: 100%; min-width: 0;
  background: var(--c-charcoal); border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-sm); padding: 9px 6px; text-align:center;
  font-family: var(--f-mono); font-size: 15px; color: var(--c-off);
  min-height: 42px;
}
.set-unit-label{ font-size:10px; color:var(--c-off-faint); text-align:center; margin-top:2px; letter-spacing:0.04em; }
.set-side-label{ font-size: 10px; color: var(--c-off-faint); text-align:center; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:2px; }
.set-col{ flex:1; min-width:0; }
.set-complete-btn{
  width: 42px; height:42px; border-radius: 50%; flex-shrink:0;
  border: 1px solid var(--c-hairline-strong); background: var(--c-charcoal);
  color: var(--c-off-faint); font-size: 17px;
}
.set-row.completed .set-complete-btn{ background: var(--c-positive); border-color: var(--c-positive); color:#0d0b0b; }
.set-row.skipped .set-complete-btn{ background: var(--c-panel-raised); color: var(--c-off-faint); text-decoration: line-through; }
.set-row.skipped .set-index{ opacity:0.4; }

.quick-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

/* Per-exercise unit preference toggle, sits in the exercise card header */
.unit-toggle{ width:auto; }
.unit-toggle button{ padding: 6px 12px; font-size: 12px; min-height:0; }

/* RIR chip row under each set */
.rir-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding: 6px 0 10px 34px; margin-top:-2px;
}
.rir-label{ font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--c-off-faint); margin-right:2px; }
.rir-chip{ padding: 5px 9px; font-size:11px; }
.rir-chip.active{ background: var(--c-blood); border-color: var(--c-blood); color: var(--c-off); }
.tempo-chip{ padding: 6px 11px; font-size:11.5px; }
.tempo-chip.active{ background: var(--c-positive); border-color: var(--c-positive); color: var(--c-black); }
.tempo-chip.active.tempo-none{ background: var(--c-off-faint); border-color: var(--c-off-faint); }
.chip-btn{
  border: 1px solid var(--c-hairline-strong); background: var(--c-charcoal);
  color: var(--c-off-dim); border-radius: 20px; padding: 7px 12px; font-size: 12px;
}
.chip-btn:active{ background: var(--c-panel-raised); }

.cardio-card .cardio-timer{
  font-family: var(--f-mono); font-size: 44px; text-align:center; letter-spacing: 0.03em;
  padding: 10px 0 4px; color: var(--c-off);
}
.cardio-target{ text-align:center; font-size: 11.5px; color: var(--c-off-faint); letter-spacing:0.06em; text-transform:uppercase; }
.timer-controls{ display:flex; gap:8px; margin-top: 14px; }
.cardio-fields{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top: 12px; }

.resume-banner{
  border: 1px solid var(--c-crimson);
  background: rgba(165,51,71,0.08);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 18px;
}
.resume-banner h3{ font-size:15px; margin-bottom:4px; }
.resume-banner p{ font-size:12.5px; color: var(--c-off-dim); margin: 0 0 12px; }

.choice-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.choice-card{
  background: var(--c-panel); border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-lg); padding: 20px 14px; text-align:center;
}
.choice-card .choice-icon{ font-size:22px; color: var(--c-crimson); margin-bottom:8px; }

<script>
// ============================================================================

// dashboard → Project Settings → API). The anon/public key is safe to ship

// ============================================================================
const SUPABASE_URL = "https://jkjnkuiwtypywfreamrf.supabase.co";

// ============================================================================

// ============================================================================
// UTILS — pure helper functions. No storage access here.
// ============================================================================

const KG_PER_LB = 0.45359237;
const LB_PER_KG = 2.20462262185;

function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

function nowISO() {
  return new Date().toISOString();
}

// Today's date as a local YYYY-MM-DD string (not UTC) — used as the default
// "day 1" of a freshly-created training sequence.
function todayDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// ---- unit conversion. Internal storage is always kg / km. ----

function kgToLb(kg) { return kg * LB_PER_KG; }
function lbToKg(lb) { return lb * KG_PER_LB; }
function kmToMi(km) { return km * 0.621371; }
function miToKm(mi) { return mi / 0.621371; }

function displayWeight(kg, unit) {
  if (kg == null || Number.isNaN(kg)) return null;
  return unit === "lb" ? kgToLb(kg) : kg;
}
function toStorageWeight(value, unit) {
  if (value == null || Number.isNaN(value)) return null;
  return unit === "lb" ? lbToKg(value) : value;
}
function displayDistance(km, unit) {
  if (km == null || Number.isNaN(km)) return null;
  return unit === "miles" ? kmToMi(km) : km;
}
function toStorageDistance(value, unit) {
  if (value == null || Number.isNaN(value)) return null;
  return unit === "miles" ? miToKm(value) : value;
}

function roundTo(n, decimals = 1) {
  if (n == null || Number.isNaN(n)) return null;
  const f = Math.pow(10, decimals);
  return Math.round(n * f) / f;
}

// ---- formatting ----

function formatDate(iso, opts = {}) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric", ...opts });
}

function formatDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function formatDuration(seconds) {
  seconds = Math.max(0, Math.round(seconds || 0));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function formatMinutes(seconds) {
  return Math.round((seconds || 0) / 60);
}

// ---- exercise math ----

function setVolume(set) {
  if (!set || !set.completed) return 0;
  if (set.unilateral) {
    const l = (set.leftWeightKg || 0) * (set.leftReps || 0);
    const r = (set.rightWeightKg || 0) * (set.rightReps || 0);
    return l + r;
  }
  return (set.weightKg || 0) * (set.reps || 0);
}

function exerciseVolume(exerciseEntry) {
  if (!exerciseEntry || !exerciseEntry.sets) return 0;
  return exerciseEntry.sets.reduce((sum, s) => sum + setVolume(s), 0);
}

function workoutVolume(workout) {
  if (!workout || !workout.exercises) return 0;
  return workout.exercises.reduce((sum, e) => sum + exerciseVolume(e), 0);
}

function countCompletedSets(workout) {
  if (!workout) return { completed: 0, skipped: 0, programmed: 0 };
  let completed = 0, skipped = 0, programmed = 0;
  for (const e of workout.exercises) {
    for (const s of e.sets) {
      programmed++;
      if (s.completed) completed++;
      else if (s.skipped) skipped++;
    }
  }
  return { completed, skipped, programmed };
}

function computeWorkoutStatus(workout) {
  const { completed, programmed } = countCompletedSets(workout);
  if (completed === 0) return "abandoned";
  if (completed === programmed) return "completed";
  return "partial";
}

// ---- streak (consecutive training days with a completed workout) ----
function computeStreak(workouts) {
  const days = new Set(
    workouts
      .filter((w) => w.status === "completed")
      .map((w) => (w.completedAt || w.startedAt).slice(0, 10))
  );
  if (days.size === 0) return 0;

  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0, 0, 0, 0);

  // Allow the streak to count "today" only if trained, otherwise start from yesterday.
  const todayKey = cursor.toISOString().slice(0, 10);
  if (!days.has(todayKey)) {
    cursor.setDate(cursor.getDate() - 1);
  }

  while (true) {
    const key = cursor.toISOString().slice(0, 10);
    if (days.has(key)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ---- trend analysis for an exercise: improving / stable / declining ----
function computeTrend(exerciseHistory) {
  // exerciseHistory: array of {date, volume} sorted ascending, from completed workouts
  if (!exerciseHistory || exerciseHistory.length < 3) {
    return { trend: "insufficient", label: "Not enough data to determine a trend." };
  }
  const recent = exerciseHistory.slice(-3);
  const earlier = exerciseHistory.slice(-6, -3);
  if (earlier.length === 0) {
    return { trend: "insufficient", label: "Not enough data to determine a trend." };
  }
  const avg = (arr) => arr.reduce((s, x) => s + x.volume, 0) / arr.length;
  const recentAvg = avg(recent);
  const earlierAvg = avg(earlier);
  if (earlierAvg === 0) return { trend: "insufficient", label: "Not enough data to determine a trend." };
  const change = (recentAvg - earlierAvg) / earlierAvg;
  if (change > 0.05) return { trend: "improving", label: "Improving" };
  if (change < -0.05) return { trend: "declining", label: "Declining" };
  return { trend: "stable", label: "Stable" };
}

function debounce(fn, ms) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

// ---- best completed set for an exercise entry: heaviest weight (using the
// heavier side for unilateral work), tie-broken by reps at that weight ----
function bestSetOf(entry) {
  const completed = entry.sets.filter((s) => s.completed);
  if (!completed.length) return null;
  let best = null;
  let maxReps = 0;
  for (const s of completed) {
    let weight, reps;
    if (s.unilateral) {
      const lw = s.leftWeightKg ?? 0, rw = s.rightWeightKg ?? 0;
      if (lw >= rw) { weight = lw; reps = s.leftReps ?? 0; } else { weight = rw; reps = s.rightReps ?? 0; }
      maxReps = Math.max(maxReps, s.leftReps ?? 0, s.rightReps ?? 0);
    } else {
      weight = s.weightKg ?? 0;
      reps = s.reps ?? 0;
      maxReps = Math.max(maxReps, reps);
    }
    if (!best || weight > best.weight || (weight === best.weight && reps > best.reps)) {
      best = { weight, reps };
    }
  }
  if (!best) return null;
  return { ...best, maxReps };
}

// ---- automatic progression detection (item 7): compares this exercise's
// best set against its previous performance. Objective only — heavier
// weight, or more reps at the same weight. ----
function detectProgression(prevEntry, currEntry) {
  const prevBest = prevEntry ? bestSetOf(prevEntry) : null;
  const currBest = currEntry ? bestSetOf(currEntry) : null;
  if (!currBest) return null;
  if (!prevBest) return { type: "first", label: "First recorded performance" };
  if (currBest.weight > prevBest.weight) return { type: "weight", label: `Weight ↑ ${roundTo(currBest.weight)}kg (was ${roundTo(prevBest.weight)}kg)` };
  if (currBest.weight === prevBest.weight && currBest.reps > prevBest.reps) return { type: "reps", label: `Reps ↑ ${currBest.reps} (was ${prevBest.reps})` };
  if (currBest.weight === prevBest.weight && currBest.reps === prevBest.reps) return { type: "none", label: "Matched last time" };
  return { type: "none", label: "No progression this time" };

// ---- lightweight PR detection (item 9): given completed/partial workouts
// sorted OLDEST-FIRST, returns whether the given workout's entry for
// exerciseId set a Weight PR and/or Rep PR at the time it was logged.
// Independent, running-max flags — no separate PR database (item 17). ----
function computeEntryPRFlags(workoutsAsc, exerciseId, workoutId) {
  let maxWeight = 0, maxReps = 0;
  let result = { weightPR: false, repsPR: false };
  for (const w of workoutsAsc) {
    const entry = w.exercises.find((e) => e.exerciseId === exerciseId);
    if (!entry) continue;
    const best = bestSetOf(entry);
    if (!best) continue;
    const isWeightPR = best.weight > maxWeight;
    const isRepsPR = best.maxReps > maxReps;
    if (w.id === workoutId) result = { weightPR: isWeightPR, repsPR: isRepsPR };
    maxWeight = Math.max(maxWeight, best.weight);
    maxReps = Math.max(maxReps, best.maxReps);

  quads_vastus_lateralis: { muscle: "quads", area: "vastus_lateralis" },
  quads_vastus_medialis: { muscle: "quads", area: "vastus_medialis" },
  hamstrings_biceps_femoris: { muscle: "hamstrings", area: "biceps_femoris" },
  hamstrings_medial: { muscle: "hamstrings", area: "semitendinosus" },
  glutes_max: { muscle: "glutes", area: "glute_max" },
  glutes_med: { muscle: "glutes", area: "glute_med_min" },
  calves_gastroc: { muscle: "calves", area: "gastrocnemius" },
  calves_soleus: { muscle: "calves", area: "soleus" },
  abs_upper: { muscle: "abs", area: "abs_upper" },
  abs_lower: { muscle: "abs", area: "abs_lower" },
  traps_upper: { muscle: "traps", area: "traps_upper" },
  traps_mid_lower: { muscle: "traps", area: "traps_mid_lower" },
  forearms_flexors: { muscle: "forearms", area: "forearm_flexors" },
  forearms_extensors: { muscle: "forearms", area: "forearm_extensors" },
};

function legacyKeyToMuscleArea(key) {
  if (!key) return { muscle: "other", area: null };
  if (MUSCLE_BY_KEY.has(key)) return { muscle: key, area: null };
  if (LEGACY_SUBMUSCLE_MIGRATION[key]) return LEGACY_SUBMUSCLE_MIGRATION[key];
  return { muscle: "other", area: null };
}

// The 3 user-selectable detail levels for the Volume by Muscle Group
// display. Standard shows only muscle-level totals. Advanced lets you tap
// a muscle to expand/collapse its target-area breakdown. Anatomical shows
// every muscle's target-area breakdown expanded automatically.
const MUSCLE_DETAIL_LEVELS = [
  { key: "standard", label: "Standard", rank: 0 },
  { key: "advanced", label: "Advanced", rank: 1 },
  { key: "anatomical", label: "Anatomical", rank: 2 },
];
function muscleDetailRank(levelKey) {
  return MUSCLE_DETAIL_LEVELS.find((l) => l.key === levelKey)?.rank ?? 0;
}

function muscleLabel(key) {
  return MUSCLE_BY_KEY.get(key)?.label || "Other";
}

function targetAreaOptions(muscleKey) {
  return TARGET_AREAS_BY_MUSCLE[muscleKey] || [];
}

function areaPresetLabel(muscleKey, areaKey) {
  const found = targetAreaOptions(muscleKey).find((a) => a.key === areaKey);
  return found ? found.label : null;
}

// Cleans up a `muscles` array (from storage, or from the muscle editor) into
// a well-formed shape: every entry has a valid muscle key and an array of
// { key, label, custom } target areas. Always returns at least one entry.
function sanitizeMuscleEntries(list) {
  const cleaned = (Array.isArray(list) ? list : [])
    .filter((m) => m && m.muscle)
    .map((m) => ({
      muscle: MUSCLE_BY_KEY.has(m.muscle) ? m.muscle : "other",
      areas: Array.isArray(m.areas)
        ? m.areas
            .filter((a) => a && a.key)
            .map((a) => ({ key: a.key, label: a.label || areaPresetLabel(m.muscle, a.key) || a.key, custom: !!a.custom }))
        : [],
    }));
  return cleaned.length ? cleaned : [{ muscle: "other", areas: [] }];
}

// Normalizes any exercise-like object into the current `muscles` array
// shape, migrating the old `muscleGroup` / `secondaryMuscle` fields the
// first time an exercise tagged under the old system is read. Nothing is
// deleted: a primary + secondary pairing becomes a primary + additional
// muscle pairing, preserving the same relative volume weighting.
function normalizeExerciseMuscles(c) {
  if (Array.isArray(c.muscles) && c.muscles.length) return sanitizeMuscleEntries(c.muscles);
  const entries = [];
  const pushLegacy = (key) => {
    const resolved = legacyKeyToMuscleArea(key);
    const areas = resolved.area ? [{ key: resolved.area, label: areaPresetLabel(resolved.muscle, resolved.area) || resolved.area, custom: false }] : [];
    entries.push({ muscle: resolved.muscle, areas });
  };
  pushLegacy(c.muscleGroup || "other");
  if (c.secondaryMuscle) pushLegacy(c.secondaryMuscle);
  return entries.length ? entries : [{ muscle: "other", areas: [] }];
}

let PROGRAM = {};
let PROGRAM_DAY_TYPES = []; // [{key,label}, ...] — set from programState at boot

function setProgramDayTypes(dayTypes) {
  PROGRAM_DAY_TYPES = dayTypes || [];
}

// Rebuilds PROGRAM as { [dayTypeKey]: {key,label,exercises:[...]} } from the
// current day types plus whatever custom exercises/overrides/order are in
// storage. Called at boot and again right after adding/editing/removing an
// exercise, changing the split, or editing day types.
function rebuildProgram(customList, overrides, order) {
  const list = customList || [];
  const ov = overrides || {};
  const ord = order || {};
  const next = {};
  for (const dt of PROGRAM_DAY_TYPES) {
    const custom = list
      .filter((c) => c.type === dt.key)
      .map((c) => ({ id: c.id, name: c.name, sets: c.sets, unilateral: !!c.unilateral, muscles: normalizeExerciseMuscles(c), custom: true }));
    const withOverrides = custom
      .filter((e) => !ov[e.id]?.removed)
      .map((e) => {
        const o = ov[e.id];
        if (!o) return e;
        return {
          ...e,
          ...(typeof o.sets === "number" ? { sets: o.sets } : {}),
          ...(typeof o.unilateral === "boolean" ? { unilateral: o.unilateral } : {}),
          ...(Array.isArray(o.muscles) ? { muscles: sanitizeMuscleEntries(o.muscles) } : {}),
        };
      });

    const orderIds = ord[dt.key] || [];
    if (orderIds.length) {
      const pos = new Map(orderIds.map((id, i) => [id, i]));
      withOverrides.sort((a, b) => {
        const pa = pos.has(a.id) ? pos.get(a.id) : Infinity;
        const pb = pos.has(b.id) ? pos.get(b.id) : Infinity;
        if (pa === pb) return 0;
        return pa - pb;
      });
    }

    next[dt.key] = { key: dt.key, label: dt.label, exercises: withOverrides };
  }
  PROGRAM = next;
}

// Backward-compatible name used throughout the app at every call site that
// previously rebuilt the built-in-plus-custom program.
const applyCustomExercises = rebuildProgram;

function programTotalSets(type) {
  return PROGRAM[type] ? PROGRAM[type].exercises.reduce((sum, e) => sum + e.sets, 0) : 0;
}

// Unilateral exercise volume rule: a unilateral exercise's programmed set
// count (e.g. "2 sets") means 2 sets per side — both the left and the right
// side perform the prescribed sets. So for training-volume purposes each
// unilateral exercise contributes double its programmed sets, while its own
// programmed set count (shown elsewhere, and what the user edits) never
// changes. Applies uniformly across every workout day type (Upper, Lower,
// Full Body, or any custom split) since it operates on PROGRAM[type] generically.
const UNILATERAL_VOLUME_MULTIPLIER = 2;

function exerciseVolumeSets(e) {
  if (!e) return 0;
  return e.sets * (e.unilateral ? UNILATERAL_VOLUME_MULTIPLIER : 1);
}

// Total training volume for a workout day type, in "volume sets": bilateral
// exercises count their programmed sets once; unilateral exercises count
// double (once per side). This is the figure used for total workout volume
// — never the per-exercise programmed set count itself, which stays as-is.
function programVolumeSets(type) {
  return PROGRAM[type] ? PROGRAM[type].exercises.reduce((sum, e) => sum + exerciseVolumeSets(e), 0) : 0;
}

// Weight applied to an exercise's additional (non-primary) muscles, relative
// to its primary muscle (which always counts as 1.0×). Reflects that an
// additional mover is worked, but less directly than the primary target, so
// it doesn't add a full extra set of volume for that muscle.
const SECONDARY_MUSCLE_VOLUME_WEIGHT = 0.5;

// A normalized `muscles` array for any exercise-like object, always at
// least one entry. Falls back gracefully for anything unexpected.
function exerciseMuscles(e) {
  return Array.isArray(e && e.muscles) && e.muscles.length ? e.muscles : [{ muscle: "other", areas: [] }];
}

// Per-muscle AND per-target-area volume for a workout day type. Returns
// { muscleTotals: {muscleKey: volumeSets}, areaTotals: {"muscle::area":
// {muscle,label,value}} }. Uses the same unilateral doubling as
// programVolumeSets. A muscle entry's volume is weighted by its position
// (1.0× primary, 0.5× each additional muscle) and then split evenly across
// however many target areas are selected for it — so a muscle's total
// always equals the sum of its own area totals, and an exercise tagged with
// just a muscle (no specific area) still counts fully toward that muscle.
function programMuscleVolume(type) {
  const muscleTotals = {};
  const areaTotals = {};
  if (!PROGRAM[type]) return { muscleTotals, areaTotals };
  for (const e of PROGRAM[type].exercises) {
    const vol = exerciseVolumeSets(e);
    exerciseMuscles(e).forEach((m, idx) => {
      const weight = idx === 0 ? 1 : SECONDARY_MUSCLE_VOLUME_WEIGHT;
      const muscleVol = vol * weight;
      muscleTotals[m.muscle] = (muscleTotals[m.muscle] || 0) + muscleVol;
      const areas = m.areas || [];
      if (areas.length) {
        const perArea = muscleVol / areas.length;
        for (const a of areas) {
          const k = `${m.muscle}::${a.key}`;
          if (!areaTotals[k]) areaTotals[k] = { muscle: m.muscle, label: a.label, value: 0 };
          areaTotals[k].value += perArea;
        }
      }
    });
  }
  return { muscleTotals, areaTotals };
}

// Same breakdown, aggregated across every day type in the current program —
// e.g. "how much volume does chest get across my whole split".
function programMuscleVolumeAll() {
  const muscleTotals = {};
  const areaTotals = {};
  for (const dt of PROGRAM_DAY_TYPES) {
    const day = programMuscleVolume(dt.key);
    for (const [key, val] of Object.entries(day.muscleTotals)) {
      muscleTotals[key] = (muscleTotals[key] || 0) + val;
    }
    for (const [key, val] of Object.entries(day.areaTotals)) {
      if (!areaTotals[key]) areaTotals[key] = { muscle: val.muscle, label: val.label, value: 0 };
      areaTotals[key].value += val.value;
    }
  }
  return { muscleTotals, areaTotals };
}

// Transient UI state: which muscle rows are expanded in the Volume by
// Muscle Group display at the Advanced detail level. Keyed by
// "<contextKey>:<muscleKey>" so the per-day-type blocks and the
// whole-program block can each expand independently. Resets on navigation,
// which is fine — it's just a display preference, not user data.
const expandedVolumeMuscles = new Set();

// Renders a muscle-volume breakdown with expandable target-area detail.
// Standard (levelRank 0): muscle totals only.
// Advanced (levelRank 1): muscle totals, each with a ▸/▾ toggle to reveal
// its target-area breakdown.
// Anatomical (levelRank 2): muscle totals with target-area breakdown always
// shown, no toggle needed.
function muscleVolumeBreakdownHtml(totals, levelRank, contextKey) {
  const { muscleTotals, areaTotals } = totals;
  const lines = MUSCLE_GROUPS.map((main) => {
    const total = muscleTotals[main.key];
    if (!total || total <= 0) return null;
    const areaEntries = Object.values(areaTotals).filter((a) => a.muscle === main.key && a.value > 0);
    const expandKey = `${contextKey}:${main.key}`;
    const hasAreas = levelRank > 0 && areaEntries.length > 0;
    const isExpanded = levelRank >= 2 || (levelRank === 1 && expandedVolumeMuscles.has(expandKey));
    const toggle = hasAreas && levelRank === 1
      ? `<button type="button" class="link-btn" data-act="toggle-vol-expand" data-key="${escapeHtml(expandKey)}" style="font-size:11px; padding:0 4px;">${isExpanded ? "▾" : "▸"}</button>`
      : "";
    const areaHtml = hasAreas && isExpanded
      ? `<div style="margin:2px 0 6px 4px; padding-left:10px; border-left:1px solid var(--c-hairline); display:flex; flex-direction:column; gap:3px;">${areaEntries
          .map((a) => `<span class="text-faint" style="font-size:12px;">${escapeHtml(a.label)} — ${roundTo(a.value)}</span>`)
          .join("")}</div>`
      : "";
    return `<div style="padding:3px 0;"><div class="flex-between" style="align-items:center;"><span>${escapeHtml(main.label)} — ${roundTo(total)}</span>${toggle}</div>${areaHtml}</div>`;
  }).filter(Boolean);
  if (!lines.length) return "";
  return `<div style="margin-top:4px; font-size:13px;">${lines.join("")}</div>`;
}

// Wires the ▸/▾ expand toggles rendered by muscleVolumeBreakdownHtml.
// re-render is a no-arg callback that redraws whatever contains them.
function wireVolumeExpandToggles(container, reRender) {
  qsa('[data-act="toggle-vol-expand"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      if (expandedVolumeMuscles.has(key)) expandedVolumeMuscles.delete(key);
      else expandedVolumeMuscles.add(key);
      reRender();
    });
  });
}

// A compact one-line summary of what an exercise targets, e.g.
// "Back (Lats, Upper Back) + Rear Delts" — used wherever an exercise is
// listed (program overview, exercise list, exercise detail).
function muscleSummaryText(e) {
  return exerciseMuscles(e)
    .map((m) => {
      const label = muscleLabel(m.muscle);
      const areas = (m.areas || []).map((a) => a.label);
      return areas.length ? `${label} (${areas.join(", ")})` : label;
    })
    .join(" + ");
}

// A short label for the compact "Muscles" button shown on each program
// exercise row and the Add Exercise form.
function muscleChipText(e) {
  const muscles = exerciseMuscles(e);
  const primary = muscles[0];
  const primaryLabel = muscleLabel(primary.muscle);
  const areas = primary.areas || [];
  let text = primaryLabel;
  if (areas.length === 1) text += ` · ${areas[0].label}`;
  else if (areas.length > 1) text += ` · ${areas[0].label} +${areas.length - 1}`;
  if (muscles.length > 1) text += ` · +${muscles.length - 1} more`;
  return text;
}

function allExerciseDefs() {
  return PROGRAM_DAY_TYPES.flatMap((dt) => (PROGRAM[dt.key] ? PROGRAM[dt.key].exercises : []));
}

function findExerciseDef(id) {
  return allExerciseDefs().find((e) => e.id === id) || null;
}

// ============================================================================
// PROGRAM TYPE DEFINITIONS — the three program types a user can choose from
// (Full Body / Anterior-Posterior / Upper-Lower). Each just lists its day
// types and a sensible default training sequence to start the sequence
// builder from — the user can freely edit that sequence during setup and
// any time after via the Schedule tab. Nothing here is a complete exercise
// program — the user still builds that via Add Exercise / Copy-Paste Program.
// ============================================================================

const SPLIT_DEFS = {
  fullbody: {
    label: "Full Body",
    dayTypes: [{ key: "FB", label: "Full Body" }],
    defaultPattern: ["FB", "R", "FB", "R", "FB", "R", "R"],
  },
  ap: {
    label: "Anterior / Posterior",
    dayTypes: [{ key: "A", label: "Anterior" }, { key: "P", label: "Posterior" }],
    defaultPattern: ["A", "P", "R", "A", "P", "R", "R"],
  },
  ul: {
    label: "Upper / Lower",
    dayTypes: [{ key: "U", label: "Upper" }, { key: "L", label: "Lower" }],
    defaultPattern: ["U", "L", "R", "U", "L", "R", "R"],
  },
};

// Builds the compact letter code (e.g. "ULUR") and its full spelled-out
// meaning (e.g. "Upper → Lower → Upper → Rest") for a training sequence.
function sequenceSummary(seq, labelsMap) {
  return {
    code: seq.join(""),
    meaning: seq.map((k) => labelsMap[k] || k).join(" → "),
  };
}

function dayTypeLabels() {
  const map = { R: "Rest" };
  for (const dt of PROGRAM_DAY_TYPES) map[dt.key] = dt.label;
  return map;
}

// Assigns a stable color to each day-type key so the same type always
// looks the same across the Next-7-Days strip and the month calendar.
// "R" (Rest) always gets the dim/neutral treatment; everything else
// cycles through a small accent palette by position in PROGRAM_DAY_TYPES.
const DAY_TYPE_COLOR_VARS = ["--c-positive", "--c-crimson-bright", "--c-gold", "--c-warn"];
function dayTypeColorVar(key) {
  if (!key || key === "R") return "--c-off-faint";
  const idx = PROGRAM_DAY_TYPES.findIndex((dt) => dt.key === key);
  if (idx < 0) return "--c-off-faint";
  return DAY_TYPE_COLOR_VARS[idx % DAY_TYPE_COLOR_VARS.length];
}

// Which day type (or "R" for rest) the training pattern schedules for a
// given date, cycling the pattern from settings.scheduleStartDate. Returns
// null if there's no pattern yet (setup not complete, or a freshly-created
// Modified split with no days added).
function cycleLetterForDate(dateObj, startDateStr, pattern) {
  if (!pattern || !pattern.length) return null;
  const [sy, sm, sd] = (startDateStr || DEFAULT_SETTINGS.scheduleStartDate).split("-").map(Number);
  const s = new Date(sy, sm - 1, sd);
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const diffDays = Math.round((d - s) / 86400000);
  const idx = ((diffDays % pattern.length) + pattern.length) % pattern.length;
  return pattern[idx];
}

// A YYYY-MM-DD key for a date, in local time (not UTC) — used to key
// per-date schedule overrides so "today" means the user's actual today.
function dateKey(dateObj) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, "0");
  const d = String(dateObj.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// Adds (or subtracts, with a negative delta) whole days to a "YYYY-MM-DD"
// string, returning a new "YYYY-MM-DD" string. Used by the Schedule tab's
// "shift everything forward/back a day" quick actions.
function addDaysToDateStr(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return dateKey(dt);
}

// Like cycleLetterForDate, but lets a per-date override (set from the
// Schedule tab) take precedence over the repeating pattern for that one
// day — e.g. swapping a single Tuesday to Rest without touching the cycle.
// overrides is a map of dateKey -> dayType key (or "R"), from
// storage.getScheduleOverrides().
function effectiveDayTypeForDate(dateObj, startDateStr, pattern, overrides) {
  const key = dateKey(dateObj);
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, key)) {
    return overrides[key];
  }
  return cycleLetterForDate(dateObj, startDateStr, pattern);
}

// What the training pattern schedules for today, given today's date —
// returns a day-type key, "R" for a rest day, or null if no pattern is set
// yet. Used to drive the dashboard/workout-home "Suggested" badge.
// overrides is optional; pass storage.getScheduleOverrides() result when
// available so a manual swap for today is respected.
function todaysScheduledType(settings, programState, overrides) {
  const startDateStr = settings.scheduleStartDate || DEFAULT_SETTINGS.scheduleStartDate;
  return effectiveDayTypeForDate(new Date(), startDateStr, programState.pattern || [], overrides || {});
}
// ============================================================================
// DB — low-level Supabase-backed storage engine.
//
// This module ONLY knows how to open the database and do generic CRUD against
// its object stores. It has no knowledge of workouts, settings, or program
// concepts — that logic lives in storage.js, which is the layer the rest of
// the app is supposed to talk to. Nothing outside db.js/storage.js should
// touch Supabase directly.
//
// Backing store: a single Postgres table (see supabase-schema.sql) shaped
// like (user_id, store, record_id, data jsonb). Every row is scoped to the
// signed-in user via Row Level Security, so this file never has to filter
// by user itself — Postgres refuses any row that isn't theirs. This mirrors
// the previous local-only layout 1:1 (three "stores": kv / workouts /
// activeWorkout) so every function below it (storage.js) is unchanged.
// ============================================================================

const STORE_WORKOUTS = "workouts";
const STORE_ACTIVE = "activeWorkout";
const STORE_KV = "kv";
const TABLE = "app_records";

let unavailableReason = null;

function getUnavailableReason() {
  return unavailableReason;
}

// The "id" a record is keyed by, matching the old keyPath per store
// (workouts/activeWorkout keyed by their own "id" field, kv keyed by "key").
function recordIdOf(storeName, value) {
  return String(storeName === STORE_KV ? value.key : value.id);
}

async function currentUserId() {
  const { data, error } = await supa.auth.getUser();
  if (error || !data.user) throw new Error("Not signed in.");
  return data.user.id;
}

const db = {
  async getAll(storeName) {
    const uid = await currentUserId();
    const { data, error } = await supa.from(TABLE).select("data").eq("user_id", uid).eq("store", storeName);
    if (error) throw error;
    return data.map((row) => row.data);
  },
  async get(storeName, key) {
    const uid = await currentUserId();
    const { data, error } = await supa.from(TABLE).select("data").eq("user_id", uid).eq("store", storeName).eq("record_id", String(key)).maybeSingle();
    if (error) throw error;
    return data ? data.data : undefined;
  },
  async put(storeName, value) {
    const uid = await currentUserId();
    const record_id = recordIdOf(storeName, value);
    const { error } = await supa.from(TABLE).upsert(
      { user_id: uid, store: storeName, record_id, data: value, updated_at: new Date().toISOString() },
      { onConflict: "user_id,store,record_id" }
    );
    if (error) throw error;
    return value;
  },
  async delete(storeName, key) {
    const uid = await currentUserId();
    const { error } = await supa.from(TABLE).delete().eq("user_id", uid).eq("store", storeName).eq("record_id", String(key));
    if (error) throw error;
  },
  async clear(storeName) {
    const uid = await currentUserId();
    const { error } = await supa.from(TABLE).delete().eq("user_id", uid).eq("store", storeName);
    if (error) throw error;
  },
  async count(storeName) {
    const uid = await currentUserId();
    const { count, error } = await supa.from(TABLE).select("record_id", { count: "exact", head: true }).eq("user_id", uid).eq("store", storeName);
    if (error) throw error;
    return count || 0;
  },
};

const STORES = { WORKOUTS: STORE_WORKOUTS, ACTIVE: STORE_ACTIVE, KV: STORE_KV };

// Probe used at boot to detect an unreachable/misconfigured backend early so
// the UI can show recovery instructions instead of failing silently later.
async function probeDB() {
  try {
    await db.count(STORE_KV);
    return { ok: true };
  } catch (err) {
    unavailableReason = err.message || String(err);
    return { ok: false, reason: unavailableReason };
  }
}

// STORAGE — the data layer. UI code must go through this module only; it must
// never touch db.js or Supabase directly. This indirection is what makes a
// future upgrade (e.g. syncing to a cloud database) possible without
// rewriting every screen.
// ============================================================================

const KV_SETTINGS = "settings";
const KV_PROGRAM_STATE = "programState";
const KV_META = "meta";
const KV_CUSTOM_EXERCISES = "customExercises";
const KV_PROGRAM_OVERRIDES = "programOverrides";
const KV_EXERCISE_ORDER = "exerciseOrder";
const KV_SCHEDULE_BLOCKS = "scheduleBlocks";
const KV_SCHEDULE_OVERRIDES = "scheduleOverrides";

// New/reset users start with no schedule blocks at all — the Schedule tab
// shows "No blocks set for this day type yet" until they add their own.
const DEFAULT_SCHEDULE_BLOCKS = {
  training: [],
  rest: [],
};
const ACTIVE_ID = "active";

  theme: "dark",
  backgroundImage: null,
  accentColor: null, // null = default crimson; else a "#rrggbb" hex string
  scheduleStartDate: todayDateStr(), // ISO date — day 1 of the training sequence cycle (see programState.pattern); reset to today whenever setup finishes
  exerciseUnits: {}, // { [exerciseId]: "kg" | "lb" }, missing entries default to kg
  muscleDetailLevel: "standard", // "standard" | "advanced" | "anatomical" — see MUSCLE_DETAIL_LEVELS
};

const DEFAULT_PROGRAM_STATE = {
  lastCompletedType: null,
  setupComplete: false,
  split: null,        // "fullbody" | "ap" | "ul" — the Program Type
  dayTypes: [],        // [{key,label}, ...] — the program's current day types
  pattern: [],          // array of dayType keys or "R", cycled from scheduleStartDate — the Training Sequence
};
const DEFAULT_META = { schemaVersion: SCHEMA_VERSION, lastBackupAt: null };

let saveListeners = [];
function onSaveStateChange(fn) {
  saveListeners.push(fn);
  return () => { saveListeners = saveListeners.filter((f) => f !== fn); };
}
function emitSaveState(state) {
  for (const fn of saveListeners) fn(state);
}

// Wrap every mutating call so the UI can show a "Saving… / Saved / Save failed" indicator.
async function saving(fn) {
  emitSaveState("saving");
  try {
    const result = await fn();
    emitSaveState("saved");
    return result;
  } catch (err) {
    emitSaveState("error");
    throw err;
  }
}

async function init() {
  const probe = await probeDB();
  if (!probe.ok) {
    return { ok: false, reason: probe.reason };
  }

  // No "force reset" trick needed anymore — every signed-in Supabase user
  // gets their own isolated rows (enforced by Row Level Security), so a new
  // account is guaranteed to start with zero records. Just seed defaults
  // for anything this user doesn't have yet.
  const meta = await db.get(STORES.KV, KV_META);
  if (!meta) {
    await db.put(STORES.KV, { key: KV_META, ...DEFAULT_META });
  }
  const settings = await db.get(STORES.KV, KV_SETTINGS);
  if (!settings) {
    await db.put(STORES.KV, { key: KV_SETTINGS, ...DEFAULT_SETTINGS });
  }
  const programState = await db.get(STORES.KV, KV_PROGRAM_STATE);
  if (!programState) {
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...DEFAULT_PROGRAM_STATE });
  }
  const customExercises = await db.get(STORES.KV, KV_CUSTOM_EXERCISES);
  if (!customExercises) {
    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: [] });
  }
  const programOverrides = await db.get(STORES.KV, KV_PROGRAM_OVERRIDES);
  if (!programOverrides) {
    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: {} });
  }
  const exerciseOrder = await db.get(STORES.KV, KV_EXERCISE_ORDER);
  if (!exerciseOrder) {
    await db.put(STORES.KV, { key: KV_EXERCISE_ORDER, data: {} });
  }
  const scheduleBlocks = await db.get(STORES.KV, KV_SCHEDULE_BLOCKS);
  if (!scheduleBlocks) {
    await db.put(STORES.KV, { key: KV_SCHEDULE_BLOCKS, data: DEFAULT_SCHEDULE_BLOCKS });
  }
  return { ok: true };
}

    await db.put(STORES.WORKOUTS, workout);

      await setLastCompletedType(workout.type);

  return saving(async () => {
    await db.delete(STORES.WORKOUTS, id);

    // the most recent completed workout doesn't leave a stale suggestion.
    const remaining = await getWorkouts();
    const lastCompleted = remaining.find((w) => w.status === "completed");
    const current = await getProgramState();
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...current, lastCompletedType: lastCompleted ? lastCompleted.type : null });

function validateBackup(data) {
  const errors = [];
  if (!data || typeof data !== "object") { errors.push("File is not a valid backup object."); return errors; }
  if (typeof data.schemaVersion !== "number") errors.push("Missing or invalid schemaVersion.");
  if (data.schemaVersion > SCHEMA_VERSION) errors.push(`Backup was created by a newer app version (v${data.schemaVersion}). Update the app before importing.`);
  if (!data.settings || typeof data.settings !== "object") errors.push("Missing settings object.");
  if (!Array.isArray(data.workouts)) errors.push("Missing or invalid workouts array.");
  else {
    data.workouts.forEach((w, i) => {
      if (!w.id) errors.push(`Workout at index ${i} is missing an id.`);
      if (!w.type) errors.push(`Workout at index ${i} is missing a type.`);
      if (!Array.isArray(w.exercises)) errors.push(`Workout at index ${i} is missing exercises.`);
    });
  }
  return errors;
}

async function importAllData(raw) {
  return saving(async () => {
    let data;
    try {
      data = typeof raw === "string" ? JSON.parse(raw) : raw;
    } catch (err) {
      return { ok: false, errors: ["The file is not valid JSON and could not be read."] };
    }

    const errors = validateBackup(data);
    if (errors.length) return { ok: false, errors };

    // Migration hook: if a future schemaVersion introduces structural
    // changes, transform `data` here before writing, keyed off data.schemaVersion.
    // Historical data is always preserved — never silently dropped.

    await db.clear(STORES.WORKOUTS);
    for (const w of data.workouts) {
      await db.put(STORES.WORKOUTS, w);
    }

    if (data.activeWorkout) {
      await db.put(STORES.ACTIVE, { ...data.activeWorkout, id: ACTIVE_ID });
    } else {
      await db.delete(STORES.ACTIVE, ACTIVE_ID);
    }

    const mergedSettings = { ...DEFAULT_SETTINGS, ...data.settings };
    await db.put(STORES.KV, { key: KV_SETTINGS, ...mergedSettings });

    const mergedProgram = { ...DEFAULT_PROGRAM_STATE, ...(data.program || {}) };
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...mergedProgram });

    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: Array.isArray(data.customExercises) ? data.customExercises : [] });

    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: (data.programOverrides && typeof data.programOverrides === "object") ? data.programOverrides : {} });

    await db.put(STORES.KV, { key: KV_EXERCISE_ORDER, data: (data.exerciseOrder && typeof data.exerciseOrder === "object") ? data.exerciseOrder : {} });

    await db.put(STORES.KV, { key: KV_SCHEDULE_BLOCKS, data: (data.scheduleBlocks && typeof data.scheduleBlocks === "object") ? data.scheduleBlocks : DEFAULT_SCHEDULE_BLOCKS });

    await db.put(STORES.KV, { key: KV_SCHEDULE_OVERRIDES, data: (data.scheduleOverrides && typeof data.scheduleOverrides === "object") ? data.scheduleOverrides : {} });

    await db.put(STORES.KV, { key: KV_META, schemaVersion: SCHEMA_VERSION, lastBackupAt: (await getMeta()).lastBackupAt });

    return { ok: true };
  });
}

  return saving(async () => {
    await db.clear(STORES.WORKOUTS);
    await db.delete(STORES.ACTIVE, ACTIVE_ID);
    await db.put(STORES.KV, { key: KV_SETTINGS, ...DEFAULT_SETTINGS });

    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: [] });
    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: {} });
    await db.put(STORES.KV, { key: KV_EXERCISE_ORDER, data: {} });
    await db.put(STORES.KV, { key: KV_SCHEDULE_BLOCKS, data: DEFAULT_SCHEDULE_BLOCKS });

    await db.put(STORES.KV, { key: KV_META, schemaVersion: SCHEMA_VERSION, lastBackupAt: null });
  });
}

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#ede6d9" : "#0d0b0b");

  document.body.classList.toggle("has-bg", !!dataUrl);

// Nudges a hex color lighter (positive percent) or darker (negative percent).
function shadeHex(hex, percent) {
  const clean = (hex || "").replace("#", "");
  const num = parseInt(clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean, 16);
  if (Number.isNaN(num)) return hex;
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp(((num >> 16) & 0xff) + Math.round(255 * percent));
  const g = clamp(((num >> 8) & 0xff) + Math.round(255 * percent));
  const b = clamp((num & 0xff) + Math.round(255 * percent));
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

// Overrides the app's accent (crimson) color family with a user-chosen hue,
// deriving a brighter hover shade and a darker "blood" shade from it so
// buttons/highlights/progress bars all stay consistent. Pass null/falsy to
// go back to the built-in crimson.
function applyAccentColor(hex) {
  const root = document.documentElement;
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) {
    root.style.removeProperty("--c-crimson");
    root.style.removeProperty("--c-crimson-bright");
    root.style.removeProperty("--c-blood");
    return;
  }
  root.style.setProperty("--c-crimson", hex);
  root.style.setProperty("--c-crimson-bright", shadeHex(hex, 0.14));
  root.style.setProperty("--c-blood", shadeHex(hex, -0.2));
}
// ============================================================================
// UI helpers — toasts, modals, small DOM utilities shared across views.
// ============================================================================

const toastRegion = document.getElementById("toast-region");
const modalRoot = document.getElementById("modal-root");

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function toast(message, { undo, duration = 3200 } = {}) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${escapeHtml(message)}</span>` + (undo ? `<button class="undo-btn" type="button">Undo</button>` : "");
  toastRegion.appendChild(el);

  let removed = false;
  const remove = () => {
    if (removed) return;
    removed = true;
    el.style.transition = "opacity 0.2s ease";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 200);
  };

  if (undo) {
    el.querySelector(".undo-btn").addEventListener("click", () => {
      remove();
      undo();
    });
  }

  setTimeout(remove, duration);
  return remove;
}

// Returns a Promise<boolean> resolved true if the user confirms.
function confirmModal({ title, body, confirmLabel = "Confirm", cancelLabel = "Cancel", danger = false }) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">${escapeHtml(title)}</h3>
        <p>${body}</p>
        <div class="btn-row" style="margin-top:18px;">
          <button class="btn btn-ghost" data-act="cancel" type="button">${escapeHtml(cancelLabel)}</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-act="confirm" type="button">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>`;
    modalRoot.appendChild(overlay);

    function close(result) {
      overlay.remove();
      resolve(result);
    }
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(false); });
    overlay.querySelector('[data-act="cancel"]').addEventListener("click", () => close(false));
    overlay.querySelector('[data-act="confirm"]').addEventListener("click", () => close(true));
  });
}

function closeAnyModal() {
  modalRoot.innerHTML = "";
}

// ---------------------------------------------------------------------------
// Muscle targeting editor — lets the user pick a muscle, tick any number of
// its target areas, add their own custom target area, and tag additional
// muscles beyond the primary one. Resolves to the new `muscles` array, or
// null if cancelled. Nothing here is hard-coded to a specific exercise —
// the same editor is used for every Add/Edit flow.
// ---------------------------------------------------------------------------
function openMuscleEditorModal(initialMuscles) {
  return new Promise((resolve) => {
    let working = sanitizeMuscleEntries(initialMuscles).map((m) => ({ muscle: m.muscle, areas: m.areas.map((a) => ({ ...a })) }));
    let addingAreaForIdx = null;

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    modalRoot.appendChild(overlay);

    function firstUnusedMuscle() {
      const used = new Set(working.map((m) => m.muscle));
      const next = MUSCLE_GROUPS.find((m) => !used.has(m.key) && m.key !== "other");
      return next ? next.key : "other";
    }

    function blockHtml(m, i) {
      const presets = targetAreaOptions(m.muscle);
      const presetKeys = new Set(presets.map((a) => a.key));
      const customAreas = m.areas.filter((a) => a.custom || !presetKeys.has(a.key));
      const isChecked = (key) => m.areas.some((a) => a.key === key);
      const areaRows = [
        ...presets.map((a) => ({ key: a.key, label: a.label, custom: false, group: a.group || null })),
        ...customAreas.map((a) => ({ ...a, group: null })),
      ];
      // Groups areas under a small header when the muscle's taxonomy defines
      // one (e.g. Back's Lats / Upper Back / Erectors) — purely a display
      // aid for scanning a longer list; every area still counts toward
      // volume independently, grouped or not.
      const groups = [];
      const groupIndex = new Map();
      for (const a of areaRows) {
        const g = a.group;
        if (!groupIndex.has(g)) { groupIndex.set(g, []); groups.push(g); }
        groupIndex.get(g).push(a);
      }
      const checkboxHtml = (a) => `
        <label style="display:flex; align-items:center; gap:9px; font-size:14px;">
          <input type="checkbox" data-act="toggle-area" data-idx="${i}" data-key="${escapeHtml(a.key)}" data-label="${escapeHtml(a.label)}" data-custom="${a.custom ? "true" : "false"}" ${isChecked(a.key) ? "checked" : ""}>
          ${escapeHtml(a.label)}
        </label>`;
      const areaListHtml = groups.map((g, gi) => `
        ${g ? `<div class="text-faint" style="font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; margin:${gi === 0 ? "0" : "10px"} 0 2px;">${escapeHtml(g)}</div>` : ""}
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${groupIndex.get(g).map(checkboxHtml).join("")}
        </div>`).join("");
      return `
        <div class="muscle-block" style="${i > 0 ? "border-top:1px solid var(--c-hairline); margin-top:16px; padding-top:16px;" : ""}">
          <div class="flex-between" style="align-items:center;">
            <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--c-off-faint);">${i === 0 ? "Muscle" : "Additional Muscle"}</label>
            ${working.length > 1 ? `<button type="button" class="link-btn" data-act="remove-muscle" data-idx="${i}" style="color:var(--c-crimson-bright); font-size:12px;">Remove</button>` : ""}
          </div>
          <select data-act="pick-muscle" data-idx="${i}" style="width:100%; margin-top:6px; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:10px; font-size:14px;">
            ${MUSCLE_GROUPS.map((g) => `<option value="${g.key}" ${g.key === m.muscle ? "selected" : ""}>${escapeHtml(g.label)}</option>`).join("")}
          </select>
          ${areaRows.length || m.muscle !== "other" ? `
            <div style="margin-top:12px;">
              <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--c-off-faint);">Target Areas</label>
              <div style="margin-top:8px;">${areaListHtml}</div>
            </div>` : ""}
          ${addingAreaForIdx === i
            ? `<div style="display:flex; gap:6px; margin-top:10px;">
                 <input type="text" id="new-area-input" placeholder="e.g. Rotator Cuff" style="flex:1; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:8px 10px; font-size:13px;">
                 <button type="button" class="btn btn-primary" data-act="confirm-add-area" data-idx="${i}" style="padding:8px 14px; font-size:13px;">Add</button>
               </div>`
            : `<button type="button" class="link-btn" data-act="start-add-area" data-idx="${i}" style="margin-top:10px; font-size:12.5px;">+ Add Target Area</button>`}
        </div>`;
    }

    function render() {
      overlay.innerHTML = `
        <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="muscle-modal-title">
          <h3 id="muscle-modal-title">What does this exercise target?</h3>
          <div id="muscle-blocks">${working.map(blockHtml).join("")}</div>
          <button type="button" class="link-btn" data-act="add-muscle" style="margin-top:16px; font-size:13px;">+ Add Muscle</button>
          <div class="btn-row" style="margin-top:20px;">
            <button class="btn btn-ghost" data-act="cancel" type="button">Cancel</button>
            <button class="btn btn-primary" data-act="save" type="button">Save</button>
          </div>
        </div>`;
      wire();
      if (addingAreaForIdx !== null) qs("#new-area-input", overlay)?.focus();
    }

    function wire() {
      qsa('[data-act="pick-muscle"]', overlay).forEach((sel) => {
        sel.addEventListener("change", () => {
          working[Number(sel.dataset.idx)] = { muscle: sel.value, areas: [] };
          addingAreaForIdx = null;
          render();
        });
      });
      qsa('[data-act="toggle-area"]', overlay).forEach((cb) => {
        cb.addEventListener("change", () => {
          const entry = working[Number(cb.dataset.idx)];
          const key = cb.dataset.key;
          if (cb.checked) {
            if (!entry.areas.some((a) => a.key === key)) entry.areas.push({ key, label: cb.dataset.label, custom: cb.dataset.custom === "true" });
          } else {
            entry.areas = entry.areas.filter((a) => a.key !== key);
          }
        });
      });
      qsa('[data-act="start-add-area"]', overlay).forEach((btn) => {
        btn.addEventListener("click", () => { addingAreaForIdx = Number(btn.dataset.idx); render(); });
      });
      qsa('[data-act="confirm-add-area"]', overlay).forEach((btn) => {
        const idx = Number(btn.dataset.idx);
        const commit = () => {
          const input = qs("#new-area-input", overlay);
          const label = (input?.value || "").trim();
          addingAreaForIdx = null;
          if (!label) { render(); return; }
          const key = `custom-${label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")}-${uid().slice(0, 5)}`;
          working[idx].areas.push({ key, label, custom: true });
          render();
        };
        btn.addEventListener("click", commit);
        qs("#new-area-input", overlay)?.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); commit(); } });
      });
      qsa('[data-act="remove-muscle"]', overlay).forEach((btn) => {
        btn.addEventListener("click", () => {
          working.splice(Number(btn.dataset.idx), 1);
          addingAreaForIdx = null;
          render();
        });
      });
      qs('[data-act="add-muscle"]', overlay).addEventListener("click", () => {
        working.push({ muscle: firstUnusedMuscle(), areas: [] });
        addingAreaForIdx = null;
        render();
      });
      overlay.querySelector('[data-act="cancel"]').addEventListener("click", () => close(null));
      overlay.querySelector('[data-act="save"]').addEventListener("click", () => close(sanitizeMuscleEntries(working)));
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(null); });
    }

    function close(result) {
      overlay.remove();
      resolve(result);
    }

    render();
  });
}

// Lets the user override a single date's day type (or clear an existing
// override to fall back to the repeating pattern). Resolves to:
//   { action: "set", value: dayTypeKey|"R" } | { action: "clear" } | null
function scheduleOverrideModal({ dateLabel, patternLetter, currentOverride, dayTypeOptions, labelsMap }) {
  return new Promise((resolve) => {
    const options = [...dayTypeOptions.map((dt) => dt.key), "R"];
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="override-modal-title">
        <h3 id="override-modal-title">${escapeHtml(dateLabel)}</h3>
        <p class="text-faint" style="margin-top:0;">Pattern says ${escapeHtml(patternLetter ? (labelsMap[patternLetter] || patternLetter) : "–")}. Pick a different type just for this day, without changing your sequence.</p>
        <div class="btn-row" style="flex-wrap:wrap; gap:8px; margin:14px 0;">
          ${options.map((k) => `<button class="btn ${k === currentOverride ? "btn-primary" : ""}" data-act="pick" data-value="${k}" type="button">${escapeHtml(labelsMap[k] || k)}</button>`).join("")}
        </div>
        <div class="btn-row" style="margin-top:6px;">
          ${currentOverride ? `<button class="btn btn-ghost" data-act="clear" type="button">Reset to pattern</button>` : ""}
          <button class="btn btn-ghost" data-act="cancel" type="button">Cancel</button>
        </div>
      </div>`;
    modalRoot.appendChild(overlay);

    function close(result) {
      overlay.remove();
      resolve(result);
    }
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(null); });
    overlay.querySelector('[data-act="cancel"]').addEventListener("click", () => close(null));
    overlay.querySelector('[data-act="clear"]')?.addEventListener("click", () => close({ action: "clear" }));
    overlay.querySelectorAll('[data-act="pick"]').forEach((btn) => {
      btn.addEventListener("click", () => close({ action: "set", value: btn.dataset.value }));
    });
  });

// Wires the header save indicator to storage.js's onSaveStateChange stream.

const dashboard = { render: dashboardRender };
let tickInterval = null;
let cachedSettings = null;
let cachedPreviousByExercise = {}; // exerciseId -> last completed entry (from history, excluding current active workout)
let dashboardPeriodRange = "weekly"; // weekly | monthly | yearly — Dashboard's period-comparison bar chart

// Buckets a workout list into fixed windows for the given range and sums
// each bucket's training volume, oldest to newest — e.g. weekly gives the
// last 8 rolling 7-day windows, so you can compare week-over-week rather
// than just see a single sliding trend line.
const DASHBOARD_PERIOD_BUCKET_COUNT = { weekly: 8, monthly: 6, yearly: 5 };

function periodBuckets(workouts, range) {
  const now = new Date();
  const count = DASHBOARD_PERIOD_BUCKET_COUNT[range];
  const windows = [];

  if (range === "weekly") {
    for (let i = count - 1; i >= 0; i--) {
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i * 7, 23, 59, 59, 999);
      const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 6, 0, 0, 0, 0);
      windows.push({ start, end, label: `${start.getMonth() + 1}/${start.getDate()}` });
    }
  } else if (range === "monthly") {
    for (let i = count - 1; i >= 0; i--) {
      const start = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59, 999);
      windows.push({ start, end, label: start.toLocaleDateString(undefined, { month: "short" }) });
    }
  } else {
    for (let i = count - 1; i >= 0; i--) {
      const y = now.getFullYear() - i;
      windows.push({ start: new Date(y, 0, 1), end: new Date(y, 11, 31, 23, 59, 59, 999), label: String(y) });
    }
  }

  const completed = workouts.filter((w) => w.status !== "abandoned");
  return windows.map((win) => ({
    label: win.label,
    value: completed
      .filter((w) => {
        const t = new Date(w.startedAt).getTime();
        return t >= win.start.getTime() && t <= win.end.getTime();
      })
      .reduce((sum, w) => sum + workoutVolume(w), 0),
  }));
}

// Minimal bar chart, styled to match sparkline() — bars for each bucket's
// value plus a small label underneath.
function barChart(buckets) {
  const values = buckets.map((b) => b.value);
  const max = Math.max(...values, 1);
  const w = 300, h = 120, pad = 6, gap = 5, labelH = 14;
  const plotH = h - pad * 2 - labelH;
  const barW = (w - pad * 2 - gap * (values.length - 1)) / values.length;
  const bars = values.map((v, i) => {
    const barH = max > 0 ? (v / max) * plotH : 0;
    const x = pad + i * (barW + gap);
    const y = pad + (plotH - barH);
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH, 1)}" rx="2" fill="var(--c-crimson-bright)"/>`;
  }).join("");
  const labels = buckets.map((b, i) => {
    const x = pad + i * (barW + gap) + barW / 2;
    return `<text x="${x}" y="${h - 3}" font-size="9" fill="var(--c-off-faint)" text-anchor="middle">${escapeHtml(b.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}${labels}</svg>`;
}

function stopTicking() {
  if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
}

function teardown() {
  stopTicking();
}

async function startNewWorkout(type) {
  const def = PROGRAM[type];
  const exercises = def.exercises.map((e) => ({
    exerciseId: e.id,
    name: e.name,
    unilateral: e.unilateral,
    sets: Array.from({ length: e.sets }, (_, i) => baseSet(i, e.unilateral)),
    tempo: null, // null | "improved" | "none" — manual execution feedback, item 8
    notes: "",
    substitutedFrom: null, // { exerciseId, name } if this entry replaced another exercise for this workout only
  }));

  const workout = {
    id: uid(),
    type,
    startedAt: nowISO(),
    completedAt: null,
    status: "active",
    exercises,
    cardio: {
      pre: baseCardio(),
      post: baseCardio(),
    },
    notes: "",
  };

  await storage.saveActiveWorkout(workout);
}

function baseSet(index, unilateral) {
  return unilateral
    ? { index, unilateral: true, leftWeightKg: null, leftReps: null, rightWeightKg: null, rightReps: null, weightUnit: null, rir: null, completed: false, skipped: false, notes: "" }
    : { index, unilateral: false, weightKg: null, reps: null, weightUnit: null, rir: null, completed: false, skipped: false, notes: "" };
}

function baseCardio() {
  return {
    status: "idle", // idle | completed | skipped
  };
}
