<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>STIMULUS — Train. Track. Adapt.</title>
<meta name="description" content="Offline-first strength training log and progression tracker. Train. Track. Adapt.">
<meta name="theme-color" content="#0d0b0b">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stimulus">
<style>
/* ==========================================================================
   STIMULUS — design tokens
   Dark, scientific, data-driven training tool. Train. Track. Adapt.
   ========================================================================== */

:root{
  /* --- palette --- */
  --c-black:        #0a0808;
  --c-charcoal:      #121010;
  --c-panel:         #181414;
  --c-panel-raised:  #1e1a1a;
  --c-hairline:      rgba(237,230,219,0.10);
  --c-hairline-strong: rgba(237,230,219,0.18);
  --c-blood:         #5c1420;
  --c-crimson:       #a53347;
  --c-crimson-bright:#c9455c;
  --c-off:           #ece5d8;
  --c-off-dim:       #b9b0a2;
  --c-off-faint:     #837a6d;
  --c-gold:          #b7924f;
  --c-positive:      #7c9473;
  --c-warn:          #c9a23f;

  /* --- type --- */
  --f-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", "IBM Plex Mono", Consolas, monospace;

  /* --- scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --shadow-lift: 0 8px 24px rgba(0,0,0,0.45);

  --nav-h: 68px;
  --header-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  /* subtle overlay for hover/press feedback on interactive surfaces —
     tuned per-theme below since --c-off flips between light and dark text */
  --c-hover: rgba(237,230,219,0.05);
  --c-press: rgba(237,230,219,0.09);
}

*, *::before, *::after{ box-sizing: border-box; }

html{ -webkit-text-size-adjust: 100%; }

body{
  margin:0;
  background-color: var(--c-black);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--c-off);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100dvh;
  position: relative;
  /* Fixed-width digits everywhere — weights, reps, and timers no longer
     shift the layout by a pixel or two as they tick up/down, which is a
     small thing but reads as noticeably more polished in constant-motion
     UI like set counters and rest timers. */
  font-variant-numeric: tabular-nums;
}

/* When a custom wallpaper is set, dim it behind the UI so text stays readable.
   z-index -1 keeps it beneath the body's own background paint and all normal
   in-flow content, without needing every card to become semi-transparent. */
body.has-bg::after{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(13,11,11,0.62);
  pointer-events: none;
}
html[data-theme="light"] body.has-bg::after{
  background: rgba(237,230,217,0.68);
}

/* subtle grain texture, CSS-only noise, no external assets */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0.05;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size: 180px 180px;
}

h1,h2,h3,h4{
  font-family: var(--f-display);
  font-weight: 600;
  margin: 0;
  color: var(--c-off);
  letter-spacing: 0.01em;
}

button, input, select, textarea{ font-family: inherit; color: inherit; }
button{ cursor: pointer; }
a{ color: var(--c-crimson-bright); }

.eyebrow{
  font-family: var(--f-body);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-off-faint);
  font-weight: 600;
}

.numeric{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout shell
   ========================================================================== */

body.pre-auth .app-header,
body.pre-auth .bottom-nav{ display: none; }

.app-header{
  position: sticky;
  top:0;
  z-index: 40;
  height: calc(var(--header-h) + var(--safe-t));
  padding-top: var(--safe-t);
  display:flex;
  align-items:center;
  justify-content: space-between;
  padding-left: 18px;
  padding-right: 18px;
  background: linear-gradient(180deg, var(--c-black) 70%, rgba(13,11,11,0.85));
  border-bottom: 1px solid var(--c-hairline);
  box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  backdrop-filter: blur(6px);
}

.brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ color: var(--c-crimson); font-size: 14px; }
.brand-name{
  font-family: var(--f-display);
  font-size: 19px;
  letter-spacing: 0.22em;
  font-weight: 700;
  color: var(--c-off);
}

.save-indicator{
  display:flex; align-items:center; gap:6px;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--c-off-faint);
  transition: opacity 0.3s ease;
}
.save-indicator .dot{
  width:6px; height:6px; border-radius:50%;
  background: var(--c-off-faint);
}
.save-indicator[data-state="saving"] .dot{ background: var(--c-warn); }
.save-indicator[data-state="saving"] .label::before{ content:"Saving…"; }
.save-indicator[data-state="saving"] .label{ font-size:0; }
.save-indicator[data-state="saving"] .label::before{ font-size: 11px; }
.save-indicator[data-state="saved"] .dot{ background: var(--c-positive); }
.save-indicator[data-state="idle"]{ opacity: 0.55; }
.save-indicator[data-state="error"] .dot{ background: var(--c-crimson-bright); }
.save-indicator[data-state="error"] .label::before{ content:"Save failed"; font-size:11px; }
.save-indicator[data-state="error"] .label{ font-size:0; }

.app-main{
  min-height: calc(100dvh - var(--header-h) - var(--nav-h) - var(--safe-t) - var(--safe-b));
  padding: 16px 16px calc(32px + var(--nav-h) + var(--safe-b));
  max-width: 640px;
  margin: 0 auto;
}
@keyframes route-in{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform: translateY(0);} }
.app-main.route-anim{ animation: route-in 0.26s ease-out; }

.bottom-nav{
  position: fixed;
  left:0; right:0; bottom:0;
  z-index: 50;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display:flex;
  background: var(--c-charcoal);
  border-top: 1px solid var(--c-hairline);
  box-shadow: 0 -8px 20px rgba(0,0,0,0.30);
}
.nav-btn{
  position: relative;
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 4px;
  background: none; border: none;
  color: var(--c-off-faint);
  font-size: 10.5px;
  letter-spacing: 0.03em;
  padding: 6px 2px;
  min-height: 48px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease;
}
/* Accent bar above the active tab — the pill below marks "which", this
   marks "you're here" at a glance without needing to read the label. */
.nav-btn::before{
  content:"";
  position:absolute; top:0; left:50%;
  width:22px; height:2px; border-radius:0 0 3px 3px;
  background: var(--c-crimson-bright);
  transform: translateX(-50%) scaleX(0);
  transition: transform 0.22s ease;
}
.nav-btn[aria-current="page"]::before{ transform: translateX(-50%) scaleX(1); }
.nav-icon{
  font-size: 17px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  width: 32px; height: 24px;
  border-radius: 10px;
  transition: background-color 0.22s ease, color 0.22s ease, transform 0.15s ease;
}
.nav-btn[aria-current="page"]{ color: var(--c-off); }
.nav-btn[aria-current="page"] .nav-icon{
  color: var(--c-crimson-bright);
  background: rgba(165,51,71,0.16);
}
.nav-btn[aria-current="page"] span:last-child{ font-weight: 600; }
@media (hover: hover){
  .nav-btn:hover{ color: var(--c-off-dim); }
  .nav-btn:hover .nav-icon{ background: var(--c-hover); }
}
.nav-btn:active .nav-icon{ transform: scale(0.88); }
.nav-btn:active{ color: var(--c-off); }

/* ==========================================================================
   Primitives
   ========================================================================== */

.card{
  background: var(--c-panel);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  transition: border-color 0.2s ease;
}
.card-raised{ background: var(--c-panel-raised); }

.section-title{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 26px 0 10px;
}
.section-title h2{
  font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase;
  position: relative; padding-left: 12px;
}
.section-title h2::before{
  content:"";
  position:absolute; left:0; top:2px; bottom:2px;
  width:3px; border-radius:2px;
  background: var(--c-crimson);
}
.section-title .link-btn{ font-size: 12px; }

.link-btn{
  background:none; border:none; color: var(--c-crimson-bright);
  padding: 4px 0; font-size: 13px; font-weight:600;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--c-hairline-strong);
  background: var(--c-panel-raised);
  color: var(--c-off);
  padding: 13px 18px;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  min-height: 48px;
  width: 100%;
  transition: transform 0.05s ease, opacity 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active{ transform: scale(0.98); }
.btn-primary{
  background: var(--c-blood);
  border-color: var(--c-blood);
  color: var(--c-off);
  box-shadow: 0 3px 12px rgba(92,20,32,0.35);
}
.btn-primary:hover{ background: var(--c-crimson); }
.btn-primary:active{ box-shadow: 0 1px 4px rgba(92,20,32,0.35); }
.btn-ghost{ background: transparent; }
.btn-ghost:hover{ background: var(--c-hover); }
.btn-danger{ border-color: var(--c-crimson); color: var(--c-crimson-bright); background: transparent; }
.btn-danger:hover{ background: rgba(165,51,71,0.10); }
.btn-sm{ padding: 9px 14px; min-height: 38px; font-size: 13px; width: auto; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ width: auto; flex:1; }
.btn:disabled{ opacity: 0.4; }

.badge{
  display:inline-flex; align-items:center;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 20px;
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off-dim);
}
.badge-uni{ color: var(--c-crimson-bright); border-color: var(--c-crimson); }
.badge-pr{ color: var(--c-gold); border-color: var(--c-gold); }
.badge-positive{ color: var(--c-positive); border-color: var(--c-positive); }
.badge-warn{ color: var(--c-warn); border-color: var(--c-warn); }

.empty-state{
  text-align:center; padding: 46px 18px;
  color: var(--c-off-faint);
}
.empty-state .glyph{ font-size: 26px; color: var(--c-crimson); margin-bottom: 12px; display:block; }
.empty-state h3{ font-size: 16px; color: var(--c-off); margin-bottom: 6px; }
.empty-state p{ font-size: 13.5px; margin:0; max-width: 320px; margin-inline:auto; }

.divider{ height:1px; background: var(--c-hairline); border:none; margin: 14px 0; }

.stat-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.stat-box{
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-md);
  padding: 12px;
}
.stat-box .stat-value{ font-family: var(--f-mono); font-size: 20px; color: var(--c-off); }
.stat-box .stat-label{ font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-off-faint); margin-top: 4px; }

.field{ margin-bottom: 14px; }
.field label{ display:block; font-size: 12px; letter-spacing: 0.04em; color: var(--c-off-dim); margin-bottom: 6px; }
.field input[type="text"], .field input[type="number"], .field textarea, .field select{
  width: 100%;
  background: var(--c-charcoal);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-md);
  padding: 11px 12px;
  font-size: 15px;
  color: var(--c-off);
  min-height: 46px;
}
.field textarea{ min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible, .nav-btn:focus-visible{
  outline: 2px solid var(--c-crimson-bright);
  outline-offset: 2px;
}

.toggle-row{ display:flex; border: 1px solid var(--c-hairline-strong); border-radius: var(--radius-md); overflow:hidden; }
.toggle-row button{
  flex:1; padding: 11px; background: var(--c-charcoal); border:none; color: var(--c-off-dim); font-size: 13.5px; font-weight:600;
}
.toggle-row button.active{ background: var(--c-blood); color: var(--c-off); }

/* A plain select styled to match .field select, for selects used outside a
   .field wrapper (e.g. compact rows in the Personal Schedule tab). */
.select-inline{
  background: var(--c-charcoal);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-md);
  padding: 8px 8px;
  font-size: 12.5px;
  color: var(--c-off);
  width: 100%;
}

/* ==========================================================================
   History calendar grid
   ========================================================================== */

.cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:11px; color: var(--c-off-faint); margin-bottom:6px; }
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
.cal-cell{
  aspect-ratio: 1; border-radius: var(--radius-sm); border: 1px solid var(--c-hairline);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:11px; color: var(--c-off-dim); background: var(--c-panel);
}
.cal-cell.cal-empty{ border-color: transparent; background: none; }
.cal-cell.cal-done{ background: var(--c-blood); border-color: var(--c-blood); color: var(--c-off); }
.cal-cell.cal-partial{ background: var(--c-panel-raised); border-color: var(--c-crimson); color: var(--c-off); }
.cal-daynum{ font-size:11px; opacity:0.85; }
.cal-tag{ font-size:10px; font-weight:700; letter-spacing:0.03em; }

/* ==========================================================================
   Toasts + modal
   ========================================================================== */

.toast-region{
  position: fixed; left:0; right:0; top: calc(var(--safe-t) + 10px);
  z-index: 200; display:flex; flex-direction:column; align-items:center; gap:8px;
  pointer-events:none;
}
.toast{
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off);
  padding: 11px 16px;
  border-radius: 30px;
  font-size: 13.5px;
  box-shadow: var(--shadow-lift);
  max-width: 88vw;
  display:flex; align-items:center; gap: 10px;
  animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toast .undo-btn{ background:none;border:none;color:var(--c-crimson-bright);font-weight:700;font-size:13px; }
@keyframes toast-in{ from{ opacity:0; transform: translateY(-10px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }

.modal-overlay{
  position: fixed; inset:0; background: rgba(6,5,5,0.72);
  z-index: 300; display:flex; align-items:flex-end; justify-content:center;
  animation: fade-in 0.15s ease;
}
@keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width: 560px;
  background: var(--c-panel);
  border: 1px solid var(--c-hairline-strong);
  border-bottom: none;
  border-radius: 18px 18px 0 0;
  padding: 22px 18px calc(22px + var(--safe-b));
  max-height: 86dvh;
  overflow-y:auto;
  animation: sheet-up 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sheet-up{ from{ transform: translateY(28px); opacity: 0.5;} to{ transform: translateY(0); opacity:1;} }
.modal-sheet h3{ font-size: 17px; margin-bottom: 8px; }
.modal-sheet p{ color: var(--c-off-dim); font-size: 14px; line-height:1.55; }

/* ==========================================================================
   Dashboard
   ========================================================================== */

.hero-card{
  background: var(--c-panel);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-lg);
  padding: 22px 18px;
  position: relative;
  overflow:hidden;
}
.hero-card::after{
  content:"✦";
  position:absolute; right: -6px; top:-10px; font-size: 90px;
  color: rgba(165,51,71,0.08);
}
.hero-eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--c-off-faint); }
.hero-title{ font-size: 30px; margin-top: 6px; letter-spacing: 0.03em; }
.hero-sub{ color: var(--c-off-dim); font-size: 13.5px; margin-top: 6px; }
.hero-actions{ margin-top: 18px; display:flex; gap:10px; }

.seal{
  width: 46px; height:46px; border-radius:50%;
  border: 2px solid var(--c-gold);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--f-display); font-size: 18px; color: var(--c-gold);
  flex-shrink:0;
  position: relative;
}
.seal::before{
  content:""; position:absolute; inset:-5px; border-radius:50%;
  border: 1px dashed rgba(183,146,79,0.4);
}

.pr-row{ display:flex; align-items:center; gap:12px; padding: 10px 0; border-bottom: 1px solid var(--c-hairline); }
.pr-row:last-child{ border-bottom:none; }
.pr-row .pr-name{ font-weight:600; font-size:14px; }
.pr-row .pr-detail{ font-size:12.5px; color: var(--c-off-faint); }

.history-item{
  transition: background-color 0.15s ease;
  display:flex; align-items:center; gap: 14px;
  padding: 13px 0; border-bottom: 1px solid var(--c-hairline);
}
.history-item:hover{ background: var(--c-hover); }
.history-item:active{ background: var(--c-press); }
.history-item:last-child{ border-bottom:none; }
.history-item .h-index{ font-family: var(--f-display); font-size: 20px; color: var(--c-off-faint); width: 30px; }
.history-item .h-body{ flex:1; }
.history-item .h-title{ font-weight:600; font-size: 14.5px; display:flex; gap:8px; align-items:center; }
.history-item .h-meta{ font-size: 12px; color: var(--c-off-faint); margin-top: 2px; }
.history-item .h-chevron{ color: var(--c-off-faint); }

/* ==========================================================================
   Workout / active session
   ========================================================================== */

.workout-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 6px;
}
.workout-progress-bar{
  height: 6px; border-radius: 4px; background: var(--c-charcoal);
  overflow:hidden; margin: 10px 0 16px;
  border: 1px solid var(--c-hairline);
}
.workout-progress-fill{ height:100%; background: linear-gradient(90deg, var(--c-blood), var(--c-crimson-bright)); transition: width 0.25s ease; }

.exercise-card{ }
.exercise-card .ex-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.exercise-card .ex-name{ font-size: 16px; font-weight:700; font-family: var(--f-display); }
.exercise-card .ex-sub{ font-size: 11.5px; color: var(--c-off-faint); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.exercise-card .ex-prev{
  font-size: 12px; color: var(--c-off-dim);
  background: var(--c-charcoal); border-radius: var(--radius-sm);
  padding: 8px 10px; margin: 10px 0; font-family: var(--f-mono);
}

.set-row{
  display:flex; align-items:center; gap:8px; padding: 8px 0;
  border-top: 1px solid var(--c-hairline);
}
.set-row:first-of-type{ border-top:none; }
.set-index{
  width: 26px; height:26px; border-radius:50%; flex-shrink:0;
  border: 1px solid var(--c-hairline-strong);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--f-mono); font-size: 12px; color: var(--c-off-dim);
}
.set-row.completed .set-index{ background: var(--c-blood); border-color: var(--c-blood); color:var(--c-off); }
.set-inputs{ display:flex; gap:6px; flex:1; }
.set-inputs input{
  width: 100%; min-width: 0;
  background: var(--c-charcoal); border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-sm); padding: 9px 6px; text-align:center;
  font-family: var(--f-mono); font-size: 15px; color: var(--c-off);
  min-height: 42px;
}
.set-unit-label{ font-size:10px; color:var(--c-off-faint); text-align:center; margin-top:2px; letter-spacing:0.04em; }

<script>
// ============================================================================
// SUPABASE CONFIG — fill these in with your own project's values (Supabase

// ============================================================================
const SUPABASE_URL = "https://jkjnkuiwtypywfreamrf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vOCwH2n9O2yWFR5qv8xJjA_bwiKH7Es";
