async function renderWorkoutSummary(container, navigate, params) {
  teardown();
  const workout = await storage.getWorkout(params.workoutId);
  if (!workout) { navigate("dashboard"); return; }

  const def = PROGRAM[workout.type];
  const { completed, programmed } = countCompletedSets(workout);
  const volume = workoutVolume(workout);
  const durationMin = workout.completedAt ? Math.round((new Date(workout.completedAt) - new Date(workout.startedAt)) / 60000) : null;

  const preCardio = workout.cardio.pre, postCardio = workout.cardio.post;
  const cardioDoneCount = (preCardio.status === "completed" ? 1 : 0) + (postCardio.status === "completed" ? 1 : 0);

  // Progressions detected + PRs achieved (item 14), using existing workout
  // history — no separate tracking, computed the same way as everywhere else.
  const allWorkouts = await storage.getWorkouts();
  const workoutsAsc = completedWorkoutsAsc(allWorkouts);
  const priorAsc = workoutsAsc.filter((w) => w.id !== workout.id && new Date(w.startedAt) < new Date(workout.startedAt));

  const progressions = [];
  const prs = [];
  for (const entry of workout.exercises) {
    const prev = [...priorAsc].reverse().map((w) => findExerciseEntryInWorkout(w, entry.exerciseId, entry.name)).find(Boolean) || null;
    const prog = detectProgression(prev, entry);
    if (prog && (prog.type === "weight" || prog.type === "reps")) {
      progressions.push(`${entry.name}: ${prog.label}`);
    }
    const flags = computeEntryPRFlags(workoutsAsc, entry.exerciseId, workout.id, entry.name);
    if (flags.weightPR) prs.push(`${entry.name} — Weight PR`);
    if (flags.repsPR) prs.push(`${entry.name} — Rep PR`);
  }

  container.innerHTML = `
    <div class="summary-hero">
      <div class="seal">✦</div>
      <h1>Workout Complete</h1>
      <div class="summary-type">${def?.label || workout.type} · ${workout.status}</div>
    </div>

    <div class="stat-grid mb-16">
      <div class="stat-box"><div class="stat-value">${completed}/${programmed}</div><div class="stat-label">Sets completed</div></div>
      <div class="stat-box"><div class="stat-value">${roundTo(volume, 0) ?? 0}</div><div class="stat-label">Total volume (kg)</div></div>
      <div class="stat-box"><div class="stat-value">${cardioDoneCount}/2</div><div class="stat-label">Cardio done</div></div>
      <div class="stat-box"><div class="stat-value">${durationMin != null ? durationMin : "–"}</div><div class="stat-label">Workout time (min)</div></div>
    </div>

    ${progressions.length ? `
    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px;">Progressions Detected</div>
      ${progressions.map((p) => `<div class="text-dim" style="padding:4px 0; font-size:13.5px;">↑ ${escapeHtml(p)}</div>`).join("")}
    </div>` : ""}

    ${prs.length ? `
    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px;">PRs Achieved</div>
      ${prs.map((p) => `<div class="text-dim" style="padding:4px 0; font-size:13.5px;">★ ${escapeHtml(p)}</div>`).join("")}
    </div>` : ""}

    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px;">Cardio</div>
      <div class="flex-between"><span class="text-dim">Pre-workout</span><span>${preCardio.status === "completed" ? "✓ Done" : preCardio.status === "skipped" ? "Skipped" : "Not logged"}</span></div>
      <div class="flex-between" style="margin-top:6px;"><span class="text-dim">Post-workout</span><span>${postCardio.status === "completed" ? "✓ Done" : postCardio.status === "skipped" ? "Skipped" : "Not logged"}</span></div>
    </div>

    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-ghost" data-act="view-details">View Details</button>
      <button class="btn btn-primary" data-act="done">Done</button>
    </div>
  `;

  qs('[data-act="done"]', container).addEventListener("click", () => navigate("dashboard"));
  qs('[data-act="view-details"]', container).addEventListener("click", () => navigate("history-detail", { workoutId: workout.id }));
}

const workout = { renderWorkoutHome, startNewWorkout, renderActiveWorkout, renderWorkoutSummary, teardown };
let historyViewMode = "list";
let historyCalendarCursor = null;

function renderHistoryCalendarHtml(workouts, skipLogs = []) {
  if (!historyCalendarCursor) {
    const d = new Date();
    historyCalendarCursor = { year: d.getFullYear(), month: d.getMonth() };
  }
  const cursor = historyCalendarCursor;

  const byDate = new Map();
  for (const w of workouts) {
    const d = new Date(w.startedAt);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    byDate.set(key, w);
  }

  const skipByDate = new Map(skipLogs.map((e) => [e.date, e]));
  const todayKeyCal = todayDateStr();

  const first = new Date(cursor.year, cursor.month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString(undefined, { year: "numeric", month: "long" });

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const w = byDate.get(key);
    const skip = w ? null : skipByDate.get(key);
    const label = w ? (w.type || "") : skip ? "×" : "";
    const cls = w ? (w.status === "completed" ? "cal-done" : "cal-partial") : skip ? "cal-skipped" : "";
    const canLog = !w && key <= todayKeyCal;
    cells += `<div class="cal-cell ${cls}" ${w ? `data-id="${w.id}" style="cursor:pointer;"` : canLog ? `data-skip-date="${key}"` : ""}>
      <span class="cal-daynum">${day}</span>${label ? `<span class="cal-tag">${label}</span>` : ""}
    </div>`;
  }

  return `
    <div class="flex-between" style="margin-bottom:10px;">
      <button class="link-btn" data-act="cal-prev">‹</button>
      <span style="font-weight:600;">${monthLabel}</span>
      <button class="link-btn" data-act="cal-next">›</button>
    </div>
    <div class="cal-weekdays">${["S", "M", "T", "W", "T", "F", "S"].map((d) => `<span>${d}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <p class="text-faint" style="margin-top:14px;">Solid = completed, outlined = partial, × = skipped. Tap an empty day to log a skip.</p>
  `;
}

async function historyRenderList(container, navigate) {
  const workouts = await storage.getWorkouts();

  if (workouts.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="glyph">☰</span><h3>No workouts yet</h3><p>Start your first workout to begin tracking your progress.</p></div>`;
    return;
  }

  const toggleHtml = `
    <div class="toggle-row" id="history-view-toggle" style="margin-bottom:16px;">
      <button type="button" data-value="list" class="${historyViewMode === "list" ? "active" : ""}">List</button>
      <button type="button" data-value="calendar" class="${historyViewMode === "calendar" ? "active" : ""}">Calendar</button>
    </div>`;

  if (historyViewMode === "calendar") {
    const skipLogs = await storage.getSkipLogs();
    container.innerHTML = toggleHtml + renderHistoryCalendarHtml(workouts, skipLogs);
    wireHistoryViewToggle(container, navigate);
    qs('[data-act="cal-prev"]', container)?.addEventListener("click", () => {
      historyCalendarCursor.month -= 1;
      if (historyCalendarCursor.month < 0) { historyCalendarCursor.month = 11; historyCalendarCursor.year -= 1; }
      historyRenderList(container, navigate);
    });
    qs('[data-act="cal-next"]', container)?.addEventListener("click", () => {
      historyCalendarCursor.month += 1;
      if (historyCalendarCursor.month > 11) { historyCalendarCursor.month = 0; historyCalendarCursor.year += 1; }
      historyRenderList(container, navigate);
    });
    qsa(".cal-cell[data-id]", container).forEach((el) => {
      el.addEventListener("click", () => navigate("history-detail", { workoutId: el.dataset.id }));
    });
    qsa(".cal-cell[data-skip-date]", container).forEach((el) => {
      el.addEventListener("click", () => openSkipDayModal(el.dataset.skipDate, container, navigate, () => historyRenderList(container, navigate)));
    });
    return;
  }

  // Group by month for a ledger-like feel.
  const groups = new Map();
  for (const w of workouts) {
    const d = new Date(w.startedAt);
    const key = d.toLocaleDateString(undefined, { year: "numeric", month: "long" });
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  }

  let html = toggleHtml;
  for (const [monthLabel, list] of groups) {
    html += `<div class="section-title"><h2>${escapeHtml(monthLabel)}</h2></div><div class="card">`;
    html += list.map((w, i) => {
      const { completed, programmed } = countCompletedSets(w);
      const cardioDone = (w.cardio?.pre?.status === "completed" ? 1 : 0) + (w.cardio?.post?.status === "completed" ? 1 : 0);
      return `
        <div class="history-item" data-id="${w.id}" style="cursor:pointer;">
          <div class="h-index">${formatDateShort(w.startedAt)}</div>
          <div class="h-body">
            <div class="h-title">${PROGRAM[w.type]?.label || w.type} <span class="badge ${w.status === "completed" ? "badge-positive" : w.status === "partial" ? "badge-warn" : ""}">${w.status}</span></div>
            <div class="h-meta">${completed}/${programmed} sets${cardioDone ? ` · cardio ${cardioDone}/2` : ""}</div>
          </div>
          <div class="h-chevron">›</div>
        </div>`;
    }).join("");
    html += `</div>`;
  }

  container.innerHTML = html;
  wireHistoryViewToggle(container, navigate);
  qsa(".history-item", container).forEach((el) => {
    el.addEventListener("click", () => navigate("history-detail", { workoutId: el.dataset.id }));
  });
}

function wireHistoryViewToggle(container, navigate) {
  const toggle = qs("#history-view-toggle", container);
  qsa("button", toggle).forEach((btn) => {
    btn.addEventListener("click", () => {
      historyViewMode = btn.dataset.value;
      historyRenderList(container, navigate);
    });
  });
}

async function historyRenderDetail(container, navigate, params, { editMode = false } = {}) {
  const workout = await storage.getWorkout(params.workoutId);
  if (!workout) {
    container.innerHTML = `<div class="empty-state"><h3>Workout not found</h3><p>It may have been deleted.</p></div>`;
    return;
  }
  const settings = await storage.getSettings();
  const { completed, programmed, skipped } = countCompletedSets(workout);
  const volume = workoutVolume(workout);
  const durationMin = workout.completedAt ? Math.round((new Date(workout.completedAt) - new Date(workout.startedAt)) / 60000) : null;

  let html = `
    <button class="link-btn" data-act="back">‹ History</button>
    <div class="flex-between" style="margin-top:10px;">
      <div>
        <div class="eyebrow">${formatDate(workout.startedAt)}</div>
        <h1 style="font-size:22px;">${PROGRAM[workout.type]?.label || workout.type} Workout</h1>
      </div>
      <span class="badge ${workout.status === "completed" ? "badge-positive" : workout.status === "partial" ? "badge-warn" : ""}">${workout.status}</span>
    </div>

    <div class="stat-grid" style="margin-top:14px;">
      <div class="stat-box"><div class="stat-value">${completed}/${programmed}</div><div class="stat-label">Sets completed</div></div>
      <div class="stat-box"><div class="stat-value">${roundTo(volume, 0) ?? 0}</div><div class="stat-label">Volume (kg)</div></div>
      <div class="stat-box"><div class="stat-value">${durationMin ?? "–"}</div><div class="stat-label">Duration (min)</div></div>
      <div class="stat-box"><div class="stat-value">${skipped}</div><div class="stat-label">Skipped sets</div></div>
    </div>

    <div class="btn-row" style="margin:16px 0;">
      <button class="btn ${editMode ? "btn-primary" : ""}" data-act="toggle-edit">${editMode ? "Done Editing" : "Edit Workout"}</button>
      <button class="btn btn-danger" data-act="delete">Delete</button>
    </div>
  `;

  const workoutsAsc = completedWorkoutsAsc(await storage.getWorkouts());

  for (const entry of workout.exercises) {
    const prFlags = computeEntryPRFlags(workoutsAsc, entry.exerciseId, workout.id, entry.name);
    html += `<div class="card exercise-card">
      <div class="ex-head">
        <div>
          <div class="ex-name">${escapeHtml(entry.name)}${entry.substitutedFrom ? `<span class="text-faint" style="font-size:11.5px; font-weight:400;"> (sub for ${escapeHtml(entry.substitutedFrom.name)})</span>` : ""}</div>
          <div class="ex-sub">
            ${entry.unilateral ? `<span class="badge badge-uni">Unilateral</span>` : ""}
            ${prFlags.weightPR ? `<span class="badge badge-positive">Weight PR</span>` : ""}
            ${prFlags.repsPR ? `<span class="badge badge-positive">Rep PR</span>` : ""}
          </div>
        </div>
      </div>
      <div class="sets-list">`;
    entry.sets.forEach((set, i) => {
      html += renderHistSetRow(entry, set, i, settings, editMode);
    });
    html += `</div>`;
    if (entry.tempo || editMode) {
      html += `<div class="tempo-row" style="margin-top:10px;">
        <span class="rir-label" style="display:block; margin-bottom:6px;">Execution</span>
        ${editMode ? `
          <button type="button" class="chip-btn tempo-chip ${entry.tempo === "improved" ? "active" : ""}" data-act="hist-set-tempo" data-exercise="${entry.exerciseId}" data-tempo="improved">Improved tempo/control</button>
          <button type="button" class="chip-btn tempo-chip tempo-none ${entry.tempo === "none" ? "active" : ""}" data-act="hist-set-tempo" data-exercise="${entry.exerciseId}" data-tempo="none">No improvement</button>
        ` : `<span class="text-dim" style="font-size:13px;">${entry.tempo === "improved" ? "Improved tempo/control" : "No improvement"}</span>`}
      </div>`;
    }
    if (editMode) {
      const curUnit = (entry.sets.find((x) => x.weightUnit) || {}).weightUnit || "kg";
      html += `<div style="display:flex; gap:6px; align-items:center; margin-top:10px;"><span class="text-faint" style="font-size:12px;">Weight unit</span>${["kg","lb"].map((u) => `<button type="button" class="chip-btn ${curUnit === u ? "active" : ""}" data-act="hist-unit" data-exercise="${entry.exerciseId}" data-unit="${u}">${u}</button>`).join("")}</div>`;
    }
    if (entry.notes || editMode) {
      html += `<div class="field" style="margin-top:10px; margin-bottom:0;">
        ${editMode
          ? `<textarea data-act="hist-ex-notes" data-exercise="${entry.exerciseId}" rows="2" placeholder="Notes on this exercise…">${escapeHtml(entry.notes || "")}</textarea>`
          : `<p class="text-dim" style="font-size:13px; margin:0;">${escapeHtml(entry.notes)}</p>`}
      </div>`;
    }
    html += `</div>`;
  }

  if (editMode) {
    html += `<div style="display:flex; gap:6px; align-items:center; margin:14px 0 0;"><span class="text-faint" style="font-size:12px;">All exercises</span>${["kg","lb"].map((u) => `<button type="button" class="chip-btn ${"" === u ? "active" : ""}" data-act="hist-unit" data-exercise="*" data-unit="${u}">${u}</button>`).join("")}</div>`;
  }
  html += renderHistCardio("pre", workout, "Pre-Workout Cardio", settings, editMode);
  html += renderHistCardio("post", workout, "Post-Workout Cardio", settings, editMode);

  html += `
    <div class="field">
      <label>Notes</label>
      ${editMode
        ? `<textarea id="hist-notes">${escapeHtml(workout.notes || "")}</textarea>`
        : `<p class="text-dim" style="font-size:13.5px;">${workout.notes ? escapeHtml(workout.notes) : "No notes."}</p>`}
    </div>
  `;

  container.innerHTML = html;

  qs('[data-act="back"]', container).addEventListener("click", () => navigate("history"));
  qs('[data-act="toggle-edit"]', container).addEventListener("click", () => historyRenderDetail(container, navigate, params, { editMode: !editMode }));
  qs('[data-act="delete"]', container).addEventListener("click", async () => {
    const ok = await confirmModal({
      title: "Delete this workout?",
      body: "Deleting this workout may change your PRs, volume, exercise history, charts, and streak.",
      confirmLabel: "Delete",
      danger: true,
    });
    if (ok) {
      const snapshot = workout;
      await storage.deleteWorkout(workout.id);
      toast("Workout deleted", {
        undo: async () => { await storage.saveWorkout(snapshot); navigate("history-detail", { workoutId: snapshot.id }); },
      });
      navigate("history");
    }
  });

  if (editMode) wireEditHandlers(container, workout, navigate, params);
}

function renderHistSetRow(entry, set, i, settings, editMode) {
  const rowClass = set.completed ? "completed" : set.skipped ? "skipped" : "";
  const icon = set.completed ? "✓" : set.skipped ? "–" : "";
  // Historical sets always display/edit in the unit they were originally
  // recorded with — never the exercise's current preference.
  const unit = set.weightUnit || "kg";

  if (!editMode) {
    let text;
    if (set.unilateral) {
      const lw = set.leftWeightKg != null ? roundTo(displayWeight(set.leftWeightKg, unit)) : "–";
      const rw = set.rightWeightKg != null ? roundTo(displayWeight(set.rightWeightKg, unit)) : "–";
      text = `L ${lw}${unit}×${set.leftReps ?? "–"}  ·  R ${rw}${unit}×${set.rightReps ?? "–"}`;
    } else {
      const w = set.weightKg != null ? roundTo(displayWeight(set.weightKg, unit)) : "–";
      text = `${w}${unit} × ${set.reps ?? "–"}`;
    }
    return `
      <div class="set-row ${rowClass}">
        <div class="set-index">${i + 1}</div>
        <div class="set-inputs"><div class="set-col numeric" style="padding:9px 0;">${text}</div></div>
        <div class="set-complete-btn" style="pointer-events:none;">${icon}</div>
      </div>
      ${renderHistRirInfo(set)}`;
  }

  let inputs;
  if (set.unilateral) {
    const lw = set.leftWeightKg != null ? roundTo(displayWeight(set.leftWeightKg, unit)) : "";
    const rw = set.rightWeightKg != null ? roundTo(displayWeight(set.rightWeightKg, unit)) : "";
    inputs = `
      <div class="set-col">
        <div class="set-side-label">Left</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${unit}" value="${lw}" data-field="leftWeightKg" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="reps" value="${set.leftReps ?? ""}" data-field="leftReps" data-set="${i}">
        </div>
      </div>
      <div class="set-col">
        <div class="set-side-label">Right</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${unit}" value="${rw}" data-field="rightWeightKg" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="reps" value="${set.rightReps ?? ""}" data-field="rightReps" data-set="${i}">
        </div>
      </div>`;
  } else {
    const w = set.weightKg != null ? roundTo(displayWeight(set.weightKg, unit)) : "";
    inputs = `
      <div class="set-col"><input type="number" inputmode="decimal" placeholder="${unit}" value="${w}" data-field="weightKg" data-set="${i}"></div>
      <div class="set-col"><input type="number" inputmode="numeric" placeholder="reps" value="${set.reps ?? ""}" data-field="reps" data-set="${i}"></div>`;
  }

  return `
    <div class="set-row ${rowClass}" data-set="${i}">
      <div class="set-index" data-act="toggle-skip" data-set="${i}" style="cursor:pointer;">${i + 1}</div>
      <div class="set-inputs">${inputs}</div>
      <button class="set-complete-btn" data-act="toggle-complete" data-set="${i}">${icon}</button>
    </div>
    ${renderHistRirRow(set, i)}`;
}

function renderHistRirInfo(set) {
  if (set.unilateral) {
    const l = set.leftRir ? RIR_OPTIONS.find((o) => o.value === set.leftRir)?.label : null;
    const r = set.rightRir ? RIR_OPTIONS.find((o) => o.value === set.rightRir)?.label : null;
    if (!l && !r) return "";
    return `<div class="text-faint" style="padding-left:34px; margin-top:-6px; margin-bottom:6px;">${escapeHtml(`RIR L ${l || "–"}  ·  R ${r || "–"}`)}</div>`;
  }
  if (!set.rir) return "";
  const rirLabel = RIR_OPTIONS.find((o) => o.value === set.rir)?.label;
  if (!rirLabel) return "";
  return `<div class="text-faint" style="padding-left:34px; margin-top:-6px; margin-bottom:6px;">${escapeHtml(`RIR ${rirLabel}`)}</div>`;
}

function renderHistRirRow(set, i) {
  if (set.unilateral) {
    return `
      <div class="rir-row" data-set="${i}" data-side="left">
        <span class="rir-label">L RIR</span>
        ${rirChipsHtml("hist-set-rir", `data-set="${i}" data-side="left"`, set.leftRir)}
      </div>
      <div class="rir-row" data-set="${i}" data-side="right">
        <span class="rir-label">R RIR</span>
        ${rirChipsHtml("hist-set-rir", `data-set="${i}" data-side="right"`, set.rightRir)}
      </div>
    `;
  }
  return `
    <div class="rir-row" data-set="${i}">
      <span class="rir-label">RIR</span>
      ${rirChipsHtml("hist-set-rir", `data-set="${i}"`, set.rir)}
    </div>
  `;
}

function renderHistCardio(phase, workout, title, settings, editMode) {
  const c = workout.cardio?.[phase];
  if (!c) return "";

  if (!editMode) {
    if (c.status !== "completed" && c.status !== "skipped") return "";
    return `
      <div class="card">
        <div class="eyebrow" style="font-size:14px; font-weight:600; color:var(--c-off);">${title}</div>
        <div class="text-dim" style="margin-top:6px;">${c.status === "completed" ? "✓ Done" : "Skipped"}</div>
      </div>`;
  }

  return `
    <div class="card" data-cardio-edit="${phase}">
      <div class="eyebrow" style="margin-bottom:8px;">${title.toUpperCase()}</div>
      <div class="toggle-row">
        <button type="button" data-cardio-status="completed" class="${c.status === "completed" ? "active" : ""}">Done</button>
        <button type="button" data-cardio-status="skipped" class="${c.status === "skipped" ? "active" : ""}">Skipped</button>
      </div>
    </div>`;
}

function wireEditHandlers(container, workout, navigate, params) {
  // Switch the display unit of a past session's sets. Weights are stored in kg,
  // so this only changes how they're shown and typed, never the lifted amount.
  qsa('[data-act="hist-unit"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const all = btn.dataset.exercise === "*";
      for (const en of workout.exercises) {
        if (!all && en.exerciseId !== btn.dataset.exercise) continue;
        for (const st of en.sets) st.weightUnit = btn.dataset.unit;
      }
      persistEdit(workout);
      historyRenderDetail(container, navigate, params, { editMode: true });
    });
  });

  qsa('.exercise-card', container).forEach((card, cardIdx) => {
    const entry = workout.exercises[cardIdx];

    qsa('input[data-field]', card).forEach((input) => {
      input.addEventListener("change", () => {
        const { field, set } = input.dataset;
        const s = entry.sets[Number(set)];
        const raw = input.value === "" ? null : Number(input.value);
        if (field.toLowerCase().includes("weight")) {
          // Edits to an existing recorded set stay in the unit it was
          // originally recorded with — never reinterpreted under today's
          // exercise preference.
          const unit = s.weightUnit || "kg";
          s[field] = raw == null ? null : toStorageWeight(raw, unit);
          if (raw != null && !s.weightUnit) s.weightUnit = unit;
        } else {
          s[field] = raw;
        }
        persistEdit(workout);
      });
    });

    qsa('[data-act="toggle-complete"]', card).forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = entry.sets[Number(btn.dataset.set)];
        if (!s.completed && !s.skipped) s.completed = true; else if (s.completed) s.completed = false;
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="toggle-skip"]', card).forEach((el) => {
      el.addEventListener("click", () => {
        const s = entry.sets[Number(el.dataset.set)];
        if (s.skipped) s.skipped = false; else { s.skipped = true; s.completed = false; }
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="hist-set-rir"]', card).forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = entry.sets[Number(btn.dataset.set)];
        const { rir, side } = btn.dataset;
        if (side === "left") s.leftRir = s.leftRir === rir ? null : rir;
        else if (side === "right") s.rightRir = s.rightRir === rir ? null : rir;
        else s.rir = s.rir === rir ? null : rir;
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="hist-set-tempo"]', card).forEach((btn) => {
      btn.addEventListener("click", () => {
        entry.tempo = entry.tempo === btn.dataset.tempo ? null : btn.dataset.tempo;
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="hist-ex-notes"]', card).forEach((ta) => {
      ta.addEventListener("change", () => {
        entry.notes = ta.value;
        persistEdit(workout);
      });
    });
  });

  ["pre", "post"].forEach((phase) => {
    const card = qs(`[data-cardio-edit="${phase}"]`, container);
    if (!card) return;
    qsa('[data-cardio-status]', card).forEach((btn) => {
      btn.addEventListener("click", async () => {
        const c = workout.cardio[phase];
        c.status = btn.dataset.cardioStatus;
        await persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
  });

  const notes = qs("#hist-notes", container);
  if (notes) notes.addEventListener("change", () => { workout.notes = notes.value; persistEdit(workout); });
}

async function persistEdit(workout) {
  await storage.updateWorkout(workout);
}

const historyModule = { renderList: historyRenderList, renderDetail: historyRenderDetail };
async function exercisesRenderList(container, navigate, query = "") {
  const defs = allExerciseDefs();
  const workouts = await storage.getWorkouts();

  const filtered = query
    ? defs.filter((d) => d.name.toLowerCase().includes(query.toLowerCase()))
    : defs;

  // Keyed by normalized exercise name rather than exerciseId — same
  // reasoning as findExerciseEntryInWorkout above: an exercise that's been
  // deleted and re-added (or carried into a new program) gets a fresh id,
  // and without this "last performed" would wrongly reset to blank even
  // though you did it last week under its previous id.
  const lastPerformedByName = {};
  for (const w of workouts) {
    for (const e of w.exercises) {
      const key = normalizeExerciseName(e.name);
      if (key && !lastPerformedByName[key] && e.sets.some((s) => s.completed)) {
        lastPerformedByName[key] = w.startedAt;
      }
    }
  }

  // The search box is rendered once and left alone; only the list below it is
  // redrawn as you type. Re-rendering the whole screen on every keystroke used
  // to destroy the input, so focus (and the keyboard) was lost after each letter.
  container.innerHTML = `
    <input class="search-input" id="ex-search" type="text" placeholder="Search exercises…" value="${escapeHtml(query)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="card" id="ex-list"></div>
  `;

  const paintList = (q) => {
    const rows = q ? defs.filter((d) => d.name.toLowerCase().includes(q.toLowerCase())) : defs;
    const listEl = qs("#ex-list", container);
    listEl.innerHTML = rows.length === 0
      ? `<div class="empty-state"><h3>No matches</h3><p>Try a different search term.</p></div>`
      : rows.map((d) => `
          <div class="history-item" data-id="${d.id}" style="cursor:pointer;">
            <div class="h-body">
              <div class="h-title">${escapeHtml(d.name)} ${d.unilateral ? `<span class="badge badge-uni">Unilateral</span>` : ""}</div>
              <div class="h-meta">${escapeHtml(muscleSummaryText(d))} · ${d.sets} programmed set${d.sets > 1 ? "s" : ""}${lastPerformedByName[normalizeExerciseName(d.name)] ? ` · last ${formatDateShort(lastPerformedByName[normalizeExerciseName(d.name)])}` : ""}</div>
            </div>
            <div class="h-chevron">›</div>
          </div>`).join("");
    qsa(".history-item", listEl).forEach((el) => {
      el.addEventListener("click", () => navigate("exercise-detail", { exerciseId: el.dataset.id }));
    });
  };
  paintList(query);

  qs("#ex-search", container).addEventListener("input", (e) => paintList(e.target.value));
}

let exerciseGraphRange = "monthly"; // weekly | monthly | yearly — item 10, no "All Time" option
let exerciseGraphMetric = "volume"; // "volume" | "1rm" — which line the Progression Graph plots
const GRAPH_RANGE_DAYS = { weekly: 7, monthly: 30, yearly: 365 };

async function exercisesRenderDetail(container, navigate, params) {
  const def = findExerciseDef(params.exerciseId);
  if (!def) {
    container.innerHTML = `<div class="empty-state"><h3>Exercise not found</h3></div>`;
    return;
  }
  const settings = await storage.getSettings();
  const workouts = await storage.getWorkouts();
  const preferredUnit = getExerciseUnit(settings, def.id);

  // Build history of completed entries for this exercise, oldest -> newest.
  // Matches by name as well as id (see findExerciseEntryInWorkout) so this
  // graph doesn't silently truncate to "since the last program change" —
  // sets logged under this exercise's previous id, before it got a new one,
  // still show up here as the same continuous history.
  const history = [];
  for (const w of workouts.slice().reverse()) {
    const entry = findExerciseEntryInWorkout(w, def.id, def.name);
    if (!entry) continue;
    const hasCompleted = entry.sets.some((s) => s.completed);
    if (!hasCompleted) continue;
    const best = bestSetOf(entry);
    history.push({ date: w.startedAt, workoutId: w.id, volume: exerciseVolume(entry), oneRM: best ? estimate1RM(best.weight, best.reps) : 0, entry });
  }

  const trend = computeTrend(history);
  const workoutsAsc = completedWorkoutsAsc(workouts);
  const latestProgression = history.length ? detectProgression(history.length > 1 ? history[history.length - 2].entry : null, history[history.length - 1].entry) : null;

  const rangeDays = GRAPH_RANGE_DAYS[exerciseGraphRange];
  const cutoff = Date.now() - rangeDays * 86400000;
  const windowedHistory = history.filter((h) => new Date(h.date).getTime() >= cutoff);

  let html = `
    <button class="link-btn" data-act="back">‹ Exercises</button>
    <h1 style="font-size:22px; margin-top:10px;">${escapeHtml(def.name)}</h1>
    <div class="ex-sub" style="margin-top:6px; display:flex; gap:8px; align-items:center;">
      <span class="text-faint">${def.sets} programmed sets · ${escapeHtml(muscleSummaryText(def))}</span>
      ${def.unilateral ? `<span class="badge badge-uni">Unilateral</span>` : ""}
    </div>

    <div class="section-title"><h2>Preferred Unit</h2></div>
    <div class="card">
      <div class="toggle-row" id="ex-unit-toggle" style="max-width:220px;">
        <button type="button" data-value="kg" class="${preferredUnit === "kg" ? "active" : ""}">kg</button>
        <button type="button" data-value="lb" class="${preferredUnit === "lb" ? "active" : ""}">lb</button>
      </div>
      <p class="text-faint" style="margin:10px 0 0;">New sets for this exercise will default to this unit. Past sets keep the unit they were recorded with.</p>
    </div>

    <div class="section-title"><h2>Trend</h2></div>
    <div class="card">
      <span class="trend-tag" style="color:${trend.trend === "improving" ? "var(--c-positive)" : trend.trend === "declining" ? "var(--c-danger)" : "var(--c-off-dim)"}">${trend.label}</span>
      ${latestProgression ? `<p class="text-dim" style="margin:10px 0 0; font-size:13.5px;">Last session: ${escapeHtml(latestProgression.label)}</p>` : ""}
      ${history.length ? `<p class="text-dim" style="margin:6px 0 0; font-size:13.5px;">Estimated 1RM: <span class="numeric" style="font-weight:600;">${roundTo(displayWeight(history[history.length - 1].oneRM, preferredUnit), 1) ?? 0} ${preferredUnit}</span> <span class="text-faint">(from your last session's top set, Epley formula — an estimate, not a tested max)</span></p>` : ""}
    </div>

    <div class="section-title"><h2>Progression Graph</h2></div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:12px; gap:10px; flex-wrap:wrap;">
        <div class="toggle-row" id="ex-graph-range" style="max-width:320px;">
          <button type="button" data-value="weekly" class="${exerciseGraphRange === "weekly" ? "active" : ""}">Weekly</button>
          <button type="button" data-value="monthly" class="${exerciseGraphRange === "monthly" ? "active" : ""}">Monthly</button>
          <button type="button" data-value="yearly" class="${exerciseGraphRange === "yearly" ? "active" : ""}">Yearly</button>
        </div>
        <div class="toggle-row" id="ex-graph-metric" style="width:auto;">
          <button type="button" data-value="volume" class="${exerciseGraphMetric === "volume" ? "active" : ""}">Volume</button>
          <button type="button" data-value="1rm" class="${exerciseGraphMetric === "1rm" ? "active" : ""}">Est. 1RM</button>
        </div>
      </div>
      ${windowedHistory.length >= 2
        ? `<div class="chart-wrap">${sparkline(windowedHistory.map((h) => roundTo(displayWeight(exerciseGraphMetric === "1rm" ? h.oneRM : h.volume, preferredUnit), 1) ?? 0))}</div><p class="text-faint" style="margin:10px 0 0;">${exerciseGraphMetric === "1rm" ? `Estimated 1-rep max (${preferredUnit}, Epley formula from your top set each session)` : `Volume (${preferredUnit})`} over the last ${rangeDays} days.</p>`

    </div>

    <div class="section-title"><h2>History</h2></div>
  `;

  if (history.length === 0) {
    html += `<div class="empty-state"><span class="glyph">✦</span><h3>No history yet</h3><p>Complete this exercise in a workout to start tracking progress.</p></div>`;
  } else {
    html += `<div class="card">` + history.slice().reverse().map((h) => renderHistoryRow(h, def, workoutsAsc)).join("") + `</div>`;
  }

  container.innerHTML = html;
  qs('[data-act="back"]', container).addEventListener("click", () => navigate("exercises"));
  qsa('[data-act="open-workout"]', container).forEach((el) => {
    el.addEventListener("click", () => navigate("history-detail", { workoutId: el.dataset.id }));
  });

  qsa("#ex-unit-toggle button", container).forEach((btn) => {
    btn.addEventListener("click", async () => {
      const value = btn.dataset.value;

      await storage.saveSettings({ exerciseUnits: { ...current, [def.id]: value } });

  qsa("#ex-graph-range button", container).forEach((btn) => {
    btn.addEventListener("click", () => {

    });
  });
  qsa("#ex-graph-metric button", container).forEach((btn) => {
    btn.addEventListener("click", () => {
      exerciseGraphMetric = btn.dataset.value;
      exercisesRenderDetail(container, navigate, params);
    });
  });
}

function renderHistoryRow(h, def, workoutsAsc) {
  const flags = computeEntryPRFlags(workoutsAsc, def.id, h.workoutId, def.name);
  const lines = h.entry.sets.filter((s) => s.completed).map((s) => {
    const unit = s.weightUnit || "kg";
    if (def.unilateral) {
      const lw = s.leftWeightKg != null ? roundTo(displayWeight(s.leftWeightKg, unit)) : "–";
      const rw = s.rightWeightKg != null ? roundTo(displayWeight(s.rightWeightKg, unit)) : "–";
      return `L ${lw}${unit}×${s.leftReps ?? "–"} · R ${rw}${unit}×${s.rightReps ?? "–"}`;
    }
    const w = s.weightKg != null ? roundTo(displayWeight(s.weightKg, unit)) : "–";
    return `${w}${unit} × ${s.reps ?? "–"}`;
  });
  return `
    <div class="history-item" data-act="open-workout" data-id="${h.workoutId}" style="cursor:pointer;">
      <div class="h-index">${formatDateShort(h.date)}</div>
      <div class="h-body">
        <div class="h-title numeric" style="font-size:13px; font-weight:500;">${lines.join(" · ")} ${flags.weightPR ? `<span class="badge badge-positive">Weight PR</span>` : ""} ${flags.repsPR ? `<span class="badge badge-positive">Rep PR</span>` : ""}</div>
      </div>
      <div class="h-chevron">›</div>
    </div>`;
}

// Progression timeline (item 11) — chronological oldest-first, reusing the
// same history array already built for the graph/history list; no separate
// database.
function renderTimelineRow(h, def, workoutsAsc) {
  const flags = computeEntryPRFlags(workoutsAsc, def.id, h.workoutId, def.name);
  const best = bestSetOf(h.entry);
  const monthLabel = new Date(h.date).toLocaleDateString(undefined, { month: "short", year: "numeric" });
  const perf = best ? `${roundTo(displayWeight(best.weight, "kg"))}kg × ${best.reps}` : "–";
  return `
    <div class="flex-between" data-act="open-workout" data-id="${h.workoutId}" style="padding:8px 0; border-top:1px solid var(--c-hairline); cursor:pointer;">
      <span class="text-dim" style="font-size:12.5px;">${monthLabel}</span>
      <span class="numeric">${perf} ${flags.weightPR || flags.repsPR ? `<span class="badge badge-positive" style="margin-left:6px;">PR</span>` : ""}</span>
    </div>`;
}

// Epley formula — a reasonable, widely-used estimate from a single set's
// weight and reps. Like any formula-based estimate it gets less reliable
// above ~12 reps (fatigue changes the weight/reps relationship), but it's
// the standard choice and good enough to show a directional trend line.
function estimate1RM(weight, reps) {
  if (!weight || !reps || reps <= 0) return weight || 0;
  if (reps === 1) return weight;
  return weight * (1 + reps / 30);
}

function sparkline(values) {
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min;
  const w = 300, h = 100, pad = 10;
  const step = values.length > 1 ? (w - pad * 2) / (values.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = pad + i * step;
    const y = range ? h - pad - ((v - min) / range) * (h - pad * 2) : h / 2;
    return `${x},${y}`;
  });
  const path = "M" + points.join(" L");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <path d="${path} L${w - pad},${h} L${pad},${h} Z" fill="var(--c-off)" opacity="0.06"/>
    <polyline points="${points.join(" ")}" fill="none" stroke="var(--c-off)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// ============================================================================
// Schedule — two independent things layered on the same tab:

//      repeats from settings.scheduleStartDate. Fully user-editable — add/
//      remove days, reassign a day's type, reorder. This is what item 4 of

let patternDraft = null; // array of dayType keys / "R", edited in place before Save
let calendarMonthOffset = 0; // months from current month, for the month-view nav

async function renderSchedule(container, navigate) {
  const settingsData = await storage.getSettings();
  const programState = await storage.getProgramState();
  const overrides = await storage.getScheduleOverrides();
  const programHistory = await storage.getProgramHistory();
  // The Cycle Start Date shown/edited below must reflect whichever version
  // actually governs today, not the separate settings.scheduleStartDate
  // field — that field is only set once (at full Program Setup) and is
  // never updated by ordinary Training Sequence edits, so it silently goes
  // stale the moment you edit your sequence in place rather than redoing
  // setup. Deriving it from program history instead keeps it truthful, and
  // is also what fixes "Shift Forward/Back" actually shifting by the day
  // you asked for instead of some stale, unrelated amount.
  const currentHistoryVersion = resolvePatternVersion(todayDateStr(), programHistory);
  const startDateStr = currentHistoryVersion ? currentHistoryVersion.effectiveFrom : (settingsData.scheduleStartDate || DEFAULT_SETTINGS.scheduleStartDate);
  patternDraft = (programState.pattern || []).slice();

  const labels = dayTypeLabels();
  const pattern = programState.pattern || [];

  const today = new Date();

    const key = dateKey(d);
    next7.push({
      date: d,
      key,
      patternLetter: patternLetterForDateV(d, programHistory),
      letter: effectiveDayTypeForDateV(d, programHistory, overrides),

  const todayLetter = next7[0].letter;

  const viewMonth = new Date(today.getFullYear(), today.getMonth() + calendarMonthOffset, 1);
  const monthLabel = viewMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const firstWeekday = viewMonth.getDay();
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  const todayKey = dateKey(today);

  const calendarCells = [];
  for (let i = 0; i < firstWeekday; i++) calendarCells.push(null);

    const d = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);

      day,
      date: d,
      key,

          <span style="display:flex; align-items:center; gap:6px;">

            <span class="badge" style="color:var(${dayTypeColorVar(letter)}); border-color:var(${dayTypeColorVar(letter)});">${letter ? (labels[letter] || letter) : "–"}</span>
          </span>
        </button>`).join("")}
    </div>

    <div class="section-title"><h2>Month View</h2></div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:12px;">
        <button class="link-btn" id="cal-prev" type="button">‹ Prev</button>
        <strong>${escapeHtml(monthLabel)}</strong>
        <button class="link-btn" id="cal-next" type="button">Next ›</button>

              color:var(--c-off); font:inherit; font-size:12px; cursor:${pattern.length ? "pointer" : "default"};

              padding:0;
            ">

              ${c.isOverride ? `<span style="position:absolute; top:2px; right:3px; font-size:8px; color:var(--c-off-faint);">✦</span>` : ""}
            </button>`;

      </div>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;">
        ${[...PROGRAM_DAY_TYPES, { key: "R", label: "Rest" }].map((dt) => `
          <span style="display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--c-off-dim);">
            <span style="width:8px; height:8px; border-radius:50%; background:var(${dayTypeColorVar(dt.key)});"></span>${escapeHtml(dt.label)}
          </span>`).join("")}
      </div>
      ${!pattern.length ? `<p class="text-faint" style="margin:12px 0 0;">Set a Training Sequence below to see it mapped onto the calendar.</p>` : ""}
    </div>

    <div class="section-title"><h2>Missed a Day?</h2></div>
    <div class="card">
      <p class="text-faint" style="margin:0 0 12px;">Push every day in your sequence forward or back by one — useful after a missed or unplanned extra rest day. This only affects today onward; past workout history is untouched.</p>

    </div>

    <div class="section-title"><h2>Training Sequence</h2></div>
    <div class="card" id="pattern-editor-card"></div>
    <p class="text-faint" style="margin:10px 0 22px;">This sequence repeats continuously from your cycle start date below — it does not reset each week, and a new week does not mean day 1. Reorder, retype, add, or remove positions any time; it never touches past workout history.</p>

    <div class="section-title"><h2>Program History</h2></div>
    <p class="text-faint" style="margin:-8px 0 10px;">Every change to your training sequence, and when it took (or will take) effect.</p>
    <div class="card">
      ${programHistory.length ? [...programHistory].sort((a, b) => b.effectiveFrom.localeCompare(a.effectiveFrom)).map((v) => {
        const isFuture = v.effectiveFrom > dateKey(today);
        const isCurrent = !isFuture && v.effectiveFrom === (resolvePatternVersion(dateKey(today), programHistory) || {}).effectiveFrom;
        return `
          <div class="flex-between" style="padding:10px 0; border-top:1px solid var(--c-hairline); gap:10px;">
            <span>
              <strong>${v.pattern.map((k) => escapeHtml(k)).join(" · ")}</strong>
              <span class="text-faint" style="display:block; font-size:11.5px;">
                ${isFuture ? "Scheduled — starts " : isCurrent ? "Current — since " : "Was in effect from "}${escapeHtml(formatDateStrShort(v.effectiveFrom))}
              </span>
            </span>
            ${isFuture ? `<button class="link-btn" data-act="cancel-scheduled" data-id="${v.id}" style="color:var(--c-danger); flex-shrink:0;">Cancel</button>` : ""}
          </div>
        `;
      }).join("") : `<p class="text-faint" style="margin:0;">No history yet.</p>`}
    </div>
    <p class="text-faint" style="margin:10px 0 10px;">A pattern shown as letters uses your day-type keys (e.g. U/L/R) — check Training Sequence above for what each one means today.</p>
    ${programHistory.length > 1 ? `<button class="link-btn" id="reset-history-btn" style="color:var(--c-danger); margin-bottom:22px;">Reset Program History</button>` : ""}

    <div class="section-title"><h2>Cycle Start Date</h2></div>
    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label for="schedule-start-date">First day of your training sequence above</label>
        <input type="date" id="schedule-start-date" value="${startDateStr}">
      </div>
      <button class="btn" id="schedule-start-save" style="margin-top:14px;">Save</button>
    </div>

    <div class="section-title"><h2>Program Type</h2></div>
    <div class="card">
      <p class="text-faint" style="margin:0 0 12px;">Currently ${SPLIT_DEFS[programState.split]?.label || "–"}${programState.split === "custom" && programState.dayTypes?.length ? ` (${programState.dayTypes.map((dt) => escapeHtml(dt.label)).join(" + ")})` : ""}.</p>
      <button class="link-btn" id="restart-setup-btn">Change Program Type</button>

  renderPatternEditor(container, navigate);

  qsa(".schedule-day-row", container).forEach((btn) => {

      const idx = Number(btn.dataset.idx);

      const dateLabel = idx === 0 ? "Today" : entry.date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      const result = await scheduleOverrideModal({
        dateLabel,
        patternLetter: entry.patternLetter,

      if (result.action === "clear") {
        await storage.setScheduleOverride(entry.key, null);

    });
  });

  qsa(".cal-day-cell", container).forEach((btn) => {
    if (btn.disabled) return;
    btn.addEventListener("click", async () => {
      const key = btn.dataset.key;
      const [y, m, d] = key.split("-").map(Number);
      const cellDate = new Date(y, m - 1, d);
      const patternLetter = patternLetterForDateV(cellDate, programHistory);
      const isOverride = Object.prototype.hasOwnProperty.call(overrides, key);
      const currentLetter = isOverride ? overrides[key] : patternLetter;
      const dateLabel = cellDate.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      const result = await scheduleOverrideModal({
        dateLabel,
        patternLetter,
        currentOverride: isOverride ? currentLetter : null,
        dayTypeOptions: PROGRAM_DAY_TYPES,
        labelsMap: labels,
      });
      if (!result) return;
      if (result.action === "clear") {
        await storage.setScheduleOverride(key, null);
        toast("Reset to pattern");
      } else {
        await storage.setScheduleOverride(key, result.value);
        toast(`${dateLabel} swapped to ${labels[result.value] || result.value}`);
      }
      renderSchedule(container, navigate);
    });
  });

  qs("#cal-prev", container)?.addEventListener("click", () => {
    calendarMonthOffset -= 1;
    renderSchedule(container, navigate);
  });
  qs("#cal-next", container)?.addEventListener("click", () => {

  qs("#shift-forward-btn", container)?.addEventListener("click", async () => {

      title: "Shift schedule forward 1 day?",

      confirmLabel: "Shift Forward",

  qsa('[data-act="cancel-scheduled"]', container).forEach((btn) => {
    btn.addEventListener("click", async () => {
      const ok = await confirmModal({
        title: "Cancel this scheduled change?",

  });

  qs("#reset-history-btn", container)?.addEventListener("click", async () => {
    const ok = await confirmModal({
      title: "Reset Program History?",

      confirmLabel: "Reset History",

    if (!ok) return;

  qs("#shift-back-btn", container)?.addEventListener("click", async () => {

    const newStart = addDaysToDateStr(startDateStr, 1);

  qs("#restart-setup-btn", container).addEventListener("click", async () => {

// ============================================================================
// Sequence editor — shared building blocks for the "Training Sequence"
// builder used both in the first-run Program Setup wizard and on the
// Schedule tab. A sequence is an array of day-type keys (or "R" for rest)
// that repeats continuously — see cycleLetterForDate(). Building blocks:
//   - sequenceEditorHTML(seq, dayTypeOptions, labelsMap): the chip/code/
//     meaning summary plus the reorderable position list, as an HTML string.
//   - wireSequenceEditor(card, seq, dayTypeOptions, rerender): attaches all
//     interaction handlers (reorder, change type, delete, add workout, add
//     rest). `seq` is mutated in place; `rerender` is called after any edit.
// ============================================================================

function sequenceEditorHTML(seq, dayTypeOptions, labelsMap) {
  const typeOptions = [...dayTypeOptions.map((dt) => dt.key), "R"];
  const { code, meaning } = sequenceSummary(seq, labelsMap);

  const chips = seq.length
    ? `<div class="sequence-chip-row">${seq.map((k, i) => `<span class="sequence-chip${k === "R" ? " is-rest" : ""}">${escapeHtml(labelsMap[k] || k)}</span>${i < seq.length - 1 ? `<span class="sequence-arrow">→</span>` : ""}`).join("")}</div>`
    : `<p class="text-faint" style="margin:0;">No days yet — add your first workout below.</p>`;

  return `
    <div class="sequence-summary-card" style="margin-bottom:14px;">
      ${chips}
      ${seq.length ? `<div class="sequence-code">${escapeHtml(code)}</div><div class="sequence-meaning text-faint">${escapeHtml(meaning)}</div>` : ""}
    </div>
    <div id="seq-rows">
      ${seq.map((key, i) => `
        <div class="flex-between" style="gap:8px; padding:7px 0; border-top:1px solid var(--c-hairline); align-items:center;">
          <span style="display:flex; flex-direction:column; gap:1px;">
            <button class="link-btn" data-act="seq-up" data-idx="${i}" ${i === 0 ? "disabled" : ""} style="font-size:10px; padding:0 6px; line-height:1.3; ${i === 0 ? "opacity:0.3;" : ""}">▲</button>
            <button class="link-btn" data-act="seq-down" data-idx="${i}" ${i === seq.length - 1 ? "disabled" : ""} style="font-size:10px; padding:0 6px; line-height:1.3; ${i === seq.length - 1 ? "opacity:0.3;" : ""}">▼</button>
          </span>
          <span class="text-faint numeric" style="min-width:20px;">${i + 1}</span>
          <select data-idx="${i}" class="seq-type-select" style="flex:1; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:9px 8px; font-size:13px;">

function wireSequenceEditor(card, seq, dayTypeOptions, rerender) {
  qsa('[data-act="seq-up"], [data-act="seq-down"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.idx);
      const delta = btn.dataset.act === "seq-up" ? -1 : 1;
      const swap = idx + delta;
      if (swap < 0 || swap >= seq.length) return;
      [seq[idx], seq[swap]] = [seq[swap], seq[idx]];
      rerender();
    });
  });
  qsa(".seq-type-select", card).forEach((sel) => {
    sel.addEventListener("change", () => {
      seq[Number(sel.dataset.idx)] = sel.value;
      rerender();
    });
  });
  qsa('[data-act="seq-remove"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      seq.splice(Number(btn.dataset.idx), 1);
      rerender();
    });
  });
  qs('[data-act="seq-add-workout"]', card)?.addEventListener("click", () => {
    seq.push(dayTypeOptions[0]?.key || "R");
    rerender();
  });
  qs('[data-act="seq-add-rest"]', card)?.addEventListener("click", () => {
    seq.push("R");
    rerender();
  });
}

function renderPatternEditor(container, navigate) {

    </div>
    ${PROGRAM_DAY_TYPES.length ? "" : `<p class="text-faint" style="margin-top:10px;">Finish Program Setup to unlock day types.</p>`}
  `;

  wireSequenceEditor(card, patternDraft, PROGRAM_DAY_TYPES, () => renderPatternEditor(container, navigate));

  qs("#pattern-save", card).addEventListener("click", async () => {
    if (!patternDraft.length) {
      toast("Add at least one day");
      return;
    }
    const newPattern = patternDraft.slice();
    const history = await storage.getProgramHistory();
    const todayStr = todayDateStr();
    const currentVersion = resolvePatternVersion(todayStr, history);

    if (currentVersion && JSON.stringify(currentVersion.pattern) === JSON.stringify(newPattern)) {
      toast("No changes to save");
      return;
    }

    let effectiveFrom = todayStr;
    if (currentVersion) {
      const rotationEnd = nextRotationBoundary(todayStr, currentVersion.effectiveFrom, currentVersion.pattern.length);
      const choice = await pickOptionModal({
        title: "When should this take effect?",
        body: "Your training sequence keeps repeating — this only changes what happens going forward. Nothing already logged is affected.",
        options: [
          { value: "now", label: "Start Immediately (Today)" },
          { value: "rotation-end", label: `Finish Current Rotation (starts ${formatDateStrShort(rotationEnd)})` },
          { value: "custom", label: "Pick a Specific Date" },
        ],
        currentValue: null,
      });
      if (choice === undefined) return;
      if (choice === "now") effectiveFrom = todayStr;
      else if (choice === "rotation-end") effectiveFrom = rotationEnd;
      else {
        const picked = await dateInputModal({ title: "Start the new sequence on...", label: "Effective date", initialValue: todayStr });
        if (!picked) return;
        effectiveFrom = picked;
      }
    }

    await storage.commitProgramPatternChange(newPattern, effectiveFrom);
    toast(effectiveFrom === todayStr ? "Training sequence updated" : `Change scheduled for ${formatDateStrShort(effectiveFrom)}`);
    renderSchedule(container, navigate);
  });
}

// Program Setup Wizard — Program Type → Training Sequence. Establishes day
// types and a training sequence (pattern) only; no exercises are
// auto-assigned. Reachable at first run and again any time from
// Settings/Schedule to change the program type — never touches historical
// workout data.
// ============================================================================

let setupStep = "split"; // "split" | "blocks" | "sequence" — "blocks" only applies to the "custom" split
let setupChoice = { split: null }; // { split, blocks? } — blocks is an array of DAY_TYPE_LIBRARY keys, only used when split === "custom"
let setupSequenceDraft = null; // array of dayType keys / "R", built during the sequence step

// Resolves the working "split definition" for whichever step is showing —
// a real SPLIT_DEFS entry for the three built-ins, or a synthetic one built
// from the user's block selection for "custom".
function resolveSetupSplitDef(choice) {
  if (choice.split === "custom") {
    const dayTypes = DAY_TYPE_LIBRARY.filter((b) => (choice.blocks || []).includes(b.key));
    return { label: "Custom / Hybrid", dayTypes, defaultPattern: dayTypes.map((dt) => dt.key) };
  }
  return SPLIT_DEFS[choice.split];
}

async function renderProgramSetup(container, navigate) {
  const programState = await storage.getProgramState();
  if (!setupChoice.split && programState.split) {
    setupChoice = programState.split === "custom"
      ? { split: "custom", blocks: (programState.dayTypes || []).map((dt) => dt.key) }
      : { split: programState.split };
  }

  if (setupStep === "split") {
    container.innerHTML = `
      <h1 style="font-size:22px; margin:10px 0 6px;">Choose Your Program</h1>
      <p class="text-faint" style="margin:0 0 18px;">This sets up your day types — you'll add your own exercises after.</p>
      <div class="choice-grid">
        ${Object.entries(SPLIT_DEFS).map(([key, def]) => `
          <button class="choice-card" data-split="${key}">
            <div class="choice-icon">◆</div>
            <div class="choice-title">${escapeHtml(def.label)}</div>
            <div class="choice-sets">${escapeHtml(def.description || "")}</div>
          </button>`).join("")}
      </div>
    `;
    qsa("[data-split]", container).forEach((btn) => {
      btn.addEventListener("click", () => {
        const splitKey = btn.dataset.split;
        if (splitKey === "custom") {
          setupChoice = { split: "custom", blocks: setupChoice.blocks || [] };
          setupSequenceDraft = null;
          setupStep = "blocks";
        } else {
          setupChoice = { split: splitKey };
          setupSequenceDraft = SPLIT_DEFS[splitKey].defaultPattern.slice();
          setupStep = "sequence";
        }
        renderProgramSetup(container, navigate);
      });
    });
    return;
  }

  if (setupStep === "blocks") {
    const selected = setupChoice.blocks || [];
    container.innerHTML = `
      <button class="link-btn" data-act="back">‹ Change Program</button>
      <h1 style="font-size:22px; margin:10px 0 6px;">Build Your Hybrid</h1>
      <p class="text-faint" style="margin:0 0 18px;">Pick the day types to mix — e.g. Anterior + Posterior + Full Body, or Upper + Lower + Full Body. You'll arrange the order next.</p>
      <div class="card">
        ${DAY_TYPE_LIBRARY.map((b, i) => `
          <label style="display:flex; align-items:center; gap:10px; padding:10px 0; ${i > 0 ? "border-top:1px solid var(--c-hairline);" : ""}">
            <input type="checkbox" data-key="${b.key}" ${selected.includes(b.key) ? "checked" : ""}>
            <span>${escapeHtml(b.label)}</span>
          </label>`).join("")}
      </div>
      <button class="btn btn-primary" id="blocks-continue" style="width:100%; margin-top:16px;">Continue</button>
    `;
    qs('[data-act="back"]', container).addEventListener("click", () => { setupStep = "split"; renderProgramSetup(container, navigate); });
    qsa('input[type="checkbox"]', container).forEach((cb) => {
      cb.addEventListener("change", () => {
        const current = setupChoice.blocks || [];
        const next = cb.checked
          ? [...current, cb.dataset.key] // append in the order checked — the default sequence below follows this same order
          : current.filter((k) => k !== cb.dataset.key);
        setupChoice = { ...setupChoice, blocks: next };
      });
    });
    qs("#blocks-continue", container).addEventListener("click", () => {
      if (!(setupChoice.blocks || []).length) {
        toast("Pick at least one day type");
        return;
      }
      setupSequenceDraft = [...setupChoice.blocks, "R"];
      setupStep = "sequence";
      renderProgramSetup(container, navigate);
    });
    return;
  }

  // sequence
  const splitDef = resolveSetupSplitDef(setupChoice);
  if (!setupSequenceDraft) setupSequenceDraft = splitDef.defaultPattern.slice();
  const labels = { ...Object.fromEntries(splitDef.dayTypes.map((dt) => [dt.key, dt.label])), R: "Rest" };

  container.innerHTML = `
    <button class="link-btn" data-act="back">‹ Change Program</button>
    <h1 style="font-size:22px; margin:10px 0 6px;">${escapeHtml(splitDef.label)}</h1>
    <p class="text-faint" style="margin:0 0 18px;">Build your training sequence. It repeats continuously from your start date — a new week never resets it.</p>
    <div class="section-title" style="margin-top:0;"><h2>Training Sequence</h2></div>
    <div id="setup-sequence-card"></div>
    <p class="text-faint" style="margin:10px 0 20px;">This only sets up the structure — no exercises are added automatically. You'll add your own via Add Exercise or Copy/Paste Program.</p>
    <button class="btn btn-primary" id="setup-finish" style="width:100%;">Finish Setup</button>
  `;

  const renderSeqCard = () => {
    const card = qs("#setup-sequence-card", container);
    card.innerHTML = sequenceEditorHTML(setupSequenceDraft, splitDef.dayTypes, labels);
    wireSequenceEditor(card, setupSequenceDraft, splitDef.dayTypes, renderSeqCard);
  };
  renderSeqCard();

  qs('[data-act="back"]', container).addEventListener("click", () => {
    setupStep = setupChoice.split === "custom" ? "blocks" : "split";
    renderProgramSetup(container, navigate);
  });
  qs("#setup-finish", container).addEventListener("click", async () => {
    if (!setupSequenceDraft.length) {
      toast("Add at least one day to your sequence");
      return;
    }
    await storage.setProgramState({
      split: setupChoice.split,
      dayTypes: splitDef.dayTypes,
      pattern: setupSequenceDraft.slice(),
      setupComplete: true,
    });
    await storage.saveSettings({ scheduleStartDate: todayDateStr() });
    // A full program setup (first time, or "Change Program Type") is always
    // effective immediately — it's a fresh start, not a nuanced mid-rotation
    // change, since the split/day types themselves may be entirely different.
    await storage.commitProgramPatternChange(setupSequenceDraft, todayDateStr());
    setProgramDayTypes(splitDef.dayTypes);
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    setupStep = "split";
    setupChoice = { split: null };
    setupSequenceDraft = null;
    toast("Program set up");
    navigate("dashboard");
  });
}

function wireToggle(row, onChange) {
  qsa("button", row).forEach((btn) => {
    btn.addEventListener("click", () => {
      qsa("button", row).forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      onChange(btn.dataset.value);
    });
  });
}

// Resizes/compresses an image file client-side before storing it, so a full
// phone-camera photo doesn't bloat the account's stored data or the JSON backup export.
function resizeImageFile(file, maxDim = MAX_BG_DIMENSION, quality = BG_JPEG_QUALITY) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Could not load that image.")); };
    img.src = objectUrl;
  });
}

// One row per completed set (two for a unilateral set: left and right), in the
// unit each set was recorded in. Opens directly in Excel / Google Sheets.
async function doExportCsv() {
  const workouts = (await storage.getWorkouts()).slice().reverse();
  const cell = (v) => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rirText = (v) => (v == null ? "" : v === "failure" ? "Failure" : v);
  const rows = [["Date", "Workout", "Exercise", "Set", "Side", "Weight", "Unit", "Reps", "RIR"]];
  for (const w of workouts) {
    if (w.status === "abandoned") continue;
    const date = dateKey(new Date(w.startedAt));
    const typeLabel = PROGRAM[w.type]?.label || w.type;
    for (const e of w.exercises) {
      e.sets.forEach((s, i) => {
        if (!s.completed) return;
        const unit = s.weightUnit || "kg";
        const wt = (kg) => (kg == null ? "" : roundTo(displayWeight(kg, unit), 2));
        if (s.unilateral) {
          rows.push([date, typeLabel, e.name, i + 1, "Left", wt(s.leftWeightKg), unit, s.leftReps ?? "", rirText(s.leftRir)]);
          rows.push([date, typeLabel, e.name, i + 1, "Right", wt(s.rightWeightKg), unit, s.rightReps ?? "", rirText(s.rightRir)]);
        } else {
          rows.push([date, typeLabel, e.name, i + 1, "", wt(s.weightKg), unit, s.reps ?? "", rirText(s.rir)]);
        }
      });
    }
  }
  if (rows.length === 1) { toast("No completed sets to export yet"); return; }
  const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `stimulus-sets-${nowISO().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(`Exported ${rows.length - 1} rows`);
}

// Extracts a set count (and, where present, a target rep count/range) from
// one exercise line. Tries the richer "sets × reps" phrasings first so a
// "4x10" line is read as 4 sets of 10 rather than falling through to a
// bare "sets" match and silently losing the reps half. Returns null if no
// set count is found at all (name-only lines keep the caller's default).
//
// BUGFIX: the previous version used a single regex requiring a \b word
// boundary around "x" — e.g. (\d+)\s*(?:x|×)\b. That boundary only exists
// when nothing word-like follows the "x" (so "4x " or "4x" at line-end
// matched). The instant reps were attached with no space — "4x10", "3x8-12",
// "5×5" — there's no boundary between the "x" and the following digit
// (both are word characters), so the whole match silently failed and the
// exercise defaulted to 2 sets with the "10"/"8-12" reps info discarded
// entirely. That exact shorthand ("NxM") is the single most common way
// people write a program, so this was the main thing broken.
//
// BUGFIX: a bare "NxM" has no way to know which side is sets and which is
// reps, so that shorthand stays sets-first by convention. But when the
// words "reps" and "sets" are spelled out, the order is no longer
// ambiguous — "10 reps x 4 sets" unambiguously means 4 sets of 10, not 10
// sets of 4. The repsFirst patterns below catch that explicit-word reversed
// order (checked before the generic setsOnly fallback, which would
// otherwise match just the "4 sets" half and silently drop the reps, the
// same failure mode as the "NxM" bug above).
function extractSetsReps(line) {
  const repsFirst = [
    /(\d+(?:\s*-\s*\d+)?)\s*reps?\s*[x×]\s*(\d+)\s*sets?\b/i,        // 10 reps x 4 sets, 8-12 reps x 3 sets
    /(\d+(?:\s*-\s*\d+)?)\s*reps?\s*[,\-–]\s*(\d+)\s*sets?\b/i,       // 10 reps, 4 sets
    /(\d+(?:\s*-\s*\d+)?)\s*reps?\s*of\s*(\d+)\s*sets?\b/i,           // 10 reps of 4 sets
  ];
  for (const re of repsFirst) {
    const m = line.match(re);
    if (m) return { sets: parseInt(m[2], 10), reps: m[1].replace(/\s+/g, ""), text: m[0] };
  }
  const withReps = [
    /(\d+)\s*(?:sets?)?\s*[x×]\s*(\d+(?:\s*-\s*\d+)?)\s*(?:reps?)?\b/i, // 4x10, 4 sets x 10, 3×8-12, 5x5
    /(\d+)\s*sets?\s*(?:of\s*)?(\d+(?:\s*-\s*\d+)?)\s*reps?\b/i,        // 4 sets of 10 reps, 4 sets 8-12 reps
    /(\d+)\s*sets?\s*[,\-–]\s*(\d+(?:\s*-\s*\d+)?)\s*reps?\b/i,         // 4 sets, 10 reps / 4 sets - 8-12 reps
    /(\d+)\s*sets?\s*of\s*(\d+(?:\s*-\s*\d+)?)\b/i,                    // 4 sets of 10 (no "reps" word)
  ];
  for (const re of withReps) {
    const m = line.match(re);
    if (m) return { sets: parseInt(m[1], 10), reps: m[2].replace(/\s+/g, ""), text: m[0] };
  }
  const setsOnly = [
    /(\d+)\s*sets?\b/i,      // 4 sets
    /(\d+)\s*[x×](?!\d)/i,   // 4x  (not immediately followed by a digit — that case is handled above)
    /[x×]\s*(\d+)\b/i,       // x4
  ];
  for (const re of setsOnly) {
    const m = line.match(re);
    if (m) return { sets: parseInt(m[1], 10), reps: null, text: m[0] };
  }
  return null;
}

// Extracts a per-exercise rest duration (in seconds) from one program line,
// keyed off the word "rest" so it can never be confused with a sets/reps
// count. Checked in both directions, since real pasted programs write the
// time on either side of the word ("rest 90s" as often as "90s rest"), and
// in order: "1m30s" / "1 min 30 sec" (compound minutes+seconds), "2:00"
// (mm:ss), "90s" / "90 sec", "2min" / "1.5 minutes", then a bare "90" with
// no unit — for the bare case, 10-or-under is read as minutes and anything
// above that as seconds, since that matches how people actually shorthand
// rest ("rest 2" means 2:00, "rest 90" means 0:90). A few common filler
// words ("rest period: 90s", "rest time 90s") are tolerated between "rest"
// and the number. Returns null if the line has no "rest" mention near a
// number at all.
const REST_FILLER = "(?:\\s+(?:period|time|interval|duration))?";
const REST_GAP = ".{0,15}";
function extractRest(line) {
  const compound = line.match(new RegExp(`\\brest${REST_FILLER}\\s*:?\\s*(\\d+)\\s*(?:m|min|mins|minute|minutes)\\s*(\\d{1,2})\\s*(?:s|sec|secs|second|seconds)?\\b`, "i"))
    || line.match(new RegExp(`\\b(\\d+)\\s*(?:m|min|mins|minute|minutes)\\s*(\\d{1,2})\\s*(?:s|sec|secs|second|seconds)?\\b${REST_GAP}\\brest\\b`, "i"));
  if (compound) return { seconds: parseInt(compound[1], 10) * 60 + parseInt(compound[2], 10), text: compound[0] };

  const mmss = line.match(new RegExp(`\\brest${REST_FILLER}\\s*:?\\s*(\\d+)\\s*:\\s*([0-5]\\d)\\b`, "i"))
    || line.match(new RegExp(`\\b(\\d+)\\s*:\\s*([0-5]\\d)\\b${REST_GAP}\\brest\\b`, "i"));
  if (mmss) return { seconds: parseInt(mmss[1], 10) * 60 + parseInt(mmss[2], 10), text: mmss[0] };

  const mins = line.match(new RegExp(`\\brest${REST_FILLER}\\s*:?\\s*(\\d+(?:\\.\\d+)?)\\s*(?:min(?:ute)?s?|m)\\b`, "i"))
    || line.match(new RegExp(`\\b(\\d+(?:\\.\\d+)?)\\s*(?:min(?:ute)?s?|m)\\b${REST_GAP}\\brest\\b`, "i"));
  if (mins) return { seconds: Math.round(parseFloat(mins[1]) * 60), text: mins[0] };

  const secs = line.match(new RegExp(`\\brest${REST_FILLER}\\s*:?\\s*(\\d+)\\s*(?:sec(?:ond)?s?|s)\\b`, "i"))
    || line.match(new RegExp(`\\b(\\d+)\\s*(?:sec(?:ond)?s?|s)\\b${REST_GAP}\\brest\\b`, "i"));
  if (secs) return { seconds: parseInt(secs[1], 10), text: secs[0] };

  const bare = line.match(new RegExp(`\\brest${REST_FILLER}\\s*:?\\s*(\\d+)\\b`, "i"))
    || line.match(/\b(\d+)\b\s*\brest\b/i);
  if (bare) {
    const n = parseInt(bare[1], 10);
    return { seconds: n <= 10 ? n * 60 : n, text: bare[0] };
  }

  return null;
}

// Parses free-typed program text into { [dayTypeKey]: [...] } for the
// current PROGRAM_DAY_TYPES. A day type's label or key on its own line
// switches which section following exercise lines fall into (starts in the
// first day type until the first switch) — header lines tolerate common
// decoration (markdown symbols, dashes, a trailing "Day 1", a colon), so
// "## Upper ##", "-- Lower Day 2 --", and "Full Body:" all work, not just
// an exact bare "Upper" / "Lower" / "Full Body" line. Per exercise line:
// "4x10", "4x", "x4", "4 sets", "4 sets of 10", or "4 sets, 8-12 reps" all
// set the set count (default 2) and, where a rep number/range is present,
// the target reps shown alongside it later. The word "unilateral" (or
// "uni", "single-arm", etc.) anywhere in the line marks it unilateral and
// gets stripped from the name. A "rest" mention ("rest 90s", "90s rest",
// "rest 2min", "rest 2:00", "1m30s rest") — time before or after the word
// — sets that exercise's per-exercise rest timer override (see extractRest)
// and is likewise stripped from the name; exercises with no "rest" mention
// keep using the global rest timer default. Note: RIR is
// not part of this text — it's logged per set during a workout, not
// planned ahead of time, so there's nothing to parse here for it.
function parseProgramText(text) {
  const lines = (text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const result = {};
  for (const dt of PROGRAM_DAY_TYPES) result[dt.key] = [];
  if (!PROGRAM_DAY_TYPES.length) return result;
  let section = PROGRAM_DAY_TYPES[0].key;

  const headerMatch = (lowerLine) => {
    const cleaned = lowerLine
      .replace(/^[#*\-–—_=\s]+|[#*\-–—_=\s:]+$/g, "")
      .replace(/\bday\s*\d*\b/g, "")
      .trim();
    return PROGRAM_DAY_TYPES.find((dt) => cleaned === dt.key.toLowerCase() || cleaned === dt.label.toLowerCase());
  };

  for (const raw of lines) {
    const lowerLine = raw.toLowerCase();
    const header = headerMatch(lowerLine);
    if (header) { section = header.key; continue; }

    let line = raw;

    let unilateral = false;
    const uniMatch = line.match(/[\(\[]?\s*\b(unilateral|uni|single[- ]arm|single[- ]leg|one[- ]arm|one[- ]leg)\b\s*[\)\]]?/i);
    if (uniMatch) {
      unilateral = true;
      // Replace with a single space, not "": the match's \s* eats the
      // whitespace on BOTH sides of the word, so stripping it to nothing
      // glues whatever came before and after together (e.g. "12-15
      // unilateral rest 60s" -> "12-15rest 60s", which then breaks both
      // the reps-range and the rest-time parsing below). A space keeps
      // them separated; the later whitespace cleanup on `name` collapses
      // any doubled-up spaces this leaves behind.
      line = line.replace(uniMatch[0], " ");
    }

    let sets = 2;
    let reps = null;
    const setsReps = extractSetsReps(line);
    if (setsReps) {
      sets = setsReps.sets;
      reps = setsReps.reps;
      line = line.replace(setsReps.text, "");
    }

    let restSeconds = null;
    const rest = extractRest(line);
    if (rest) {
      restSeconds = rest.seconds;
      line = line.replace(rest.text, "");
    }

    const name = line
      .replace(/^[-*•\d.\)]+\s*/, "")
      .replace(/\(\s*\)|\[\s*\]/g, " ")
      .replace(/(^|\s)[,;:\-–—.]+(?=\s|$)/g, "$1")
      .replace(/[-–—,:]+\s*$/, "")
      .replace(/\s{2,}/g, " ")
      .trim();

    if (!name) continue;
    result[section].push({ name, sets: Math.max(1, Math.min(10, sets || 2)), unilateral, reps, restSeconds });
  }
  return result;
}
