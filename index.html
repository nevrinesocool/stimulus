<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>STIMULUS — Train. Track. Adapt.</title>
<meta name="description" content="Cloud-synced strength training log and progression tracker. Train. Track. Adapt.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stimulus">
<style>
/* ==========================================================================
   STIMULUS — design tokens
   Dark, scientific, data-driven training tool. Train. Track. Adapt.
   ========================================================================== */

:root{
  /* --- palette --- */
  --c-black:        #000000;
  --c-charcoal:      #1a1a1a;
  --c-panel:         #0d0d0d;
  --c-panel-raised:  #141414;
  --c-hairline:      rgba(255,255,255,0.10);
  --c-hairline-strong: rgba(255,255,255,0.20);
  --c-blood:         #2c2c2c;
  --c-crimson:       #8f8f8f;
  --c-crimson-bright:#d2d2d2;
  --c-danger:        #d65c5c;
  --c-off:           #f2f2f2;
  --c-off-dim:       #b4b4b4;
  --c-off-faint:     #7c7c7c;
  --c-gold:          #9a9a9a;
  --c-positive:      #f2f2f2;
  --c-warn:          #6f6f6f;
  --c-primary-bg:    #f2f2f2;
  --c-primary-fg:    #000000;
  --c-primary-hover: #ffffff;

  /* --- type scale --- */
  /* Consolidates what used to be ~19 near-duplicate one-off sizes (10 vs
     10.5, 12 vs 12.5, 13 vs 13.5, ...) scattered across the stylesheet into
     8 deliberate steps. Each step below folds in its former near-duplicates
     via a <=1px nudge, chosen toward whichever value was already more
     common, so this is a consolidation rather than a visual redesign. Large
     "hero" numbers (stat boxes, the cardio timer, page titles) are
     intentionally left as their own bespoke sizes below this range — those
     are one-off display moments, not part of the running text scale. */
  --fs-2xs: 10px;
  --fs-xs:  11px;
  --fs-sm:  12px;
  --fs-md:  13px;
  --fs-lg:  14px;
  --fs-xl:  15px;
  --fs-2xl: 16px;
  --fs-3xl: 18px;

  /* --- type --- */
  --f-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", "IBM Plex Mono", Consolas, monospace;

  /* --- scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --shadow-lift: 0 8px 24px rgba(0,0,0,0.45);

  --nav-h: 68px;
  --header-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  /* subtle overlay for hover/press feedback on interactive surfaces —
     tuned per-theme below since --c-off flips between light and dark text */
  --c-hover: rgba(255,255,255,0.05);
  --c-press: rgba(255,255,255,0.09);
}

*, *::before, *::after{ box-sizing: border-box; }

html{ -webkit-text-size-adjust: 100%; }

body{
  margin:0;
  background-color: var(--c-black);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--c-off);
  font-family: var(--f-body);
  font-size: var(--fs-2xl);
  line-height: 1.45;
  min-height: 100dvh;
  position: relative;
  /* Fixed-width digits everywhere — weights, reps, and timers no longer
     shift the layout by a pixel or two as they tick up/down, which is a
     small thing but reads as noticeably more polished in constant-motion
     UI like set counters and rest timers. */
  font-variant-numeric: tabular-nums;
}

/* When a custom wallpaper is set, dim it behind the UI so text stays readable.
   z-index -1 keeps it beneath the body's own background paint and all normal
   in-flow content, without needing every card to become semi-transparent. */
body.has-bg::after{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(0,0,0,0.62);
  pointer-events: none;
}
html[data-theme="light"] body.has-bg::after{
  background: rgba(242,242,242,0.68);
}

/* subtle grain texture, CSS-only noise, no external assets */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0.05;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size: 180px 180px;
}

h1,h2,h3,h4{
  font-family: var(--f-display);
  font-weight: 600;
  margin: 0;
  color: var(--c-off);
  letter-spacing: 0.01em;
}

button, input, select, textarea{ font-family: inherit; color: inherit; }
button{ cursor: pointer; }
a{ color: var(--c-crimson-bright); }

.eyebrow{
  font-family: var(--f-body);
  font-size: var(--fs-xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-off-faint);
  font-weight: 600;
}

.numeric{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout shell
   ========================================================================== */

body.pre-auth .app-header,
body.pre-auth .bottom-nav{ display: none; }

.app-header{
  position: sticky;
  top:0;
  z-index: 40;
  height: calc(var(--header-h) + var(--safe-t));
  padding-top: var(--safe-t);
  display:flex;
  align-items:center;
  justify-content: space-between;
  padding-left: 18px;
  padding-right: 18px;
  background: linear-gradient(180deg, var(--c-black) 70%, rgba(0,0,0,0.85));
  border-bottom: 1px solid var(--c-hairline);
  box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  backdrop-filter: blur(6px);
}

.brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ color: var(--c-crimson); font-size: var(--fs-lg); }
.brand-name{
  font-family: var(--f-display);
  font-size: var(--fs-3xl);
  letter-spacing: 0.22em;
  font-weight: 700;
  color: var(--c-off);
}

.save-indicator{
  display:flex; align-items:center; gap:6px;
  font-size: var(--fs-xs); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--c-off-faint);
  transition: opacity 0.3s ease;
}
.save-indicator .dot{
  width:6px; height:6px; border-radius:50%;
  background: var(--c-off-faint);
}
.save-indicator[data-state="saving"] .dot{ background: var(--c-warn); }
.save-indicator[data-state="saving"] .label::before{ content:"Saving…"; }
.save-indicator[data-state="saving"] .label{ font-size:0; }
.save-indicator[data-state="saving"] .label::before{ font-size: var(--fs-xs); }
.save-indicator[data-state="saved"] .dot{ background: var(--c-positive); }
.save-indicator[data-state="idle"]{ opacity: 0.55; }
.save-indicator[data-state="error"] .dot{ background: var(--c-danger); }
.save-indicator[data-state="error"] .label::before{ content:"Save failed"; font-size: var(--fs-xs); }
.save-indicator[data-state="error"] .label{ font-size:0; }

.app-main{
  min-height: calc(100dvh - var(--header-h) - var(--nav-h) - var(--safe-t) - var(--safe-b));
  padding: 16px 16px calc(32px + var(--nav-h) + var(--safe-b));
  max-width: 640px;
  margin: 0 auto;
}
@keyframes route-in{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform: translateY(0);} }
.app-main.route-anim{ animation: route-in 0.26s ease-out; }

.bottom-nav{
  position: fixed;
  left:0; right:0; bottom:0;
  z-index: 50;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display:flex;
  background: var(--c-charcoal);
  border-top: 1px solid var(--c-hairline);
  box-shadow: 0 -8px 20px rgba(0,0,0,0.30);
}
/* ==========================================================================
   Rest timer — floating bar that sits above the bottom nav and persists
   across screen navigation (it lives in its own fixed region, outside the
   router's re-rendered <main>, so switching tabs never interrupts it).
   ========================================================================== */
#rest-timer-region{
  position: fixed;
  left:0; right:0;
  bottom: calc(var(--nav-h) + var(--safe-b));
  z-index: 45;
  display:flex;
  justify-content:center;
  padding: 0 12px;
  pointer-events: none;
}
.rest-timer-bar{
  pointer-events: auto;
  width: 100%;
  max-width: 640px;
  display:flex;
  align-items:center;
  gap: 12px;
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline-strong);
  border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: var(--shadow-lift);
  padding: 10px 12px;
  animation: rest-timer-in 0.22s ease-out;
}
@keyframes rest-timer-in{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform: translateY(0);} }
.rest-timer-bar.paused{ opacity: 0.72; }
.rest-timer-ring{
  position: relative;
  width: 42px; height: 42px;
  border-radius: 50%;
  flex-shrink: 0;
  background: conic-gradient(var(--c-crimson-bright) calc(var(--rt-pct, 100) * 1%), var(--c-hairline) 0);
  display:flex; align-items:center; justify-content:center;
  transition: background 0.2s linear;
}
.rest-timer-ring::before{
  content:"";
  position:absolute; inset: 3px;
  border-radius: 50%;
  background: var(--c-panel-raised);
}
.rest-timer-time{
  position: relative;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--c-off);
}
.rest-timer-mid{ flex:1; min-width:0; }
.rest-timer-mid .eyebrow{ margin-bottom: 1px; }
.rest-timer-label{
  font-size: var(--fs-md);
  color: var(--c-off-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rest-timer-actions{ display:flex; align-items:center; gap: 6px; flex-shrink:0; }
.rt-btn{
  background: var(--c-charcoal);
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off);
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  font-weight: 600;
  padding: 7px 9px;
  line-height: 1;
}
.rt-btn:active{ background: var(--c-press); }
.rt-btn-primary{
  background: var(--c-primary-bg);
  border-color: var(--c-primary-bg);
  color: var(--c-primary-fg);
  min-width: 30px;
  text-align: center;
  font-size: var(--fs-md);
}
.rt-btn-skip{ color: var(--c-off-faint); }

.nav-btn{
  position: relative;
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 4px;
  background: none; border: none;
  color: var(--c-off-faint);
  font-size: var(--fs-2xs);
  letter-spacing: 0.03em;
  padding: 6px 2px;
  min-height: 48px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease;
}
/* Accent bar above the active tab — the pill below marks "which", this
   marks "you're here" at a glance without needing to read the label. */
.nav-btn::before{
  content:"";
  position:absolute; top:0; left:50%;
  width:22px; height:2px; border-radius:0 0 3px 3px;
  background: var(--c-crimson-bright);
  transform: translateX(-50%) scaleX(0);
  transition: transform 0.22s ease;
}
.nav-btn[aria-current="page"]::before{ transform: translateX(-50%) scaleX(1); }
.nav-icon{
  font-size: var(--fs-3xl); line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  width: 32px; height: 24px;
  border-radius: 10px;
  transition: background-color 0.22s ease, color 0.22s ease, transform 0.15s ease;
}
.nav-icon svg{ width: 20px; height: 20px; display:block; }
.nav-btn[aria-current="page"]{ color: var(--c-off); }
.nav-btn[aria-current="page"] .nav-icon{
  color: var(--c-crimson-bright);
  background: var(--c-press);
}
.nav-btn[aria-current="page"] span:last-child{ font-weight: 600; }
@media (hover: hover){
  .nav-btn:hover{ color: var(--c-off-dim); }
  .nav-btn:hover .nav-icon{ background: var(--c-hover); }
}
.nav-btn:active .nav-icon{ transform: scale(0.88); }
.nav-btn:active{ color: var(--c-off); }

/* ==========================================================================
   Primitives
   ========================================================================== */

.card{
  background: var(--c-panel);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  transition: border-color 0.2s ease;
}
.card-raised{ background: var(--c-panel-raised); }

.section-title{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 26px 0 10px;
}
.section-title h2{
  font-size: var(--fs-xl); letter-spacing: 0.08em; text-transform: uppercase;
  position: relative; padding-left: 12px;
}
.section-title h2::before{
  content:"";
  position:absolute; left:0; top:2px; bottom:2px;
  width:3px; border-radius:2px;
  background: var(--c-crimson);
}
.section-title .link-btn{ font-size: var(--fs-sm); }

.link-btn{
  background:none; border:none; color: var(--c-crimson-bright);
  padding: 4px 0; font-size: var(--fs-md); font-weight:600;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--c-hairline-strong);
  background: var(--c-panel-raised);
  color: var(--c-off);
  padding: 13px 18px;
  font-size: var(--fs-lg);
  font-weight: 600;
  letter-spacing: 0.02em;
  min-height: 48px;
  width: 100%;
  transition: transform 0.05s ease, opacity 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active{ transform: scale(0.98); }
.btn-primary{
  background: var(--c-primary-bg);
  border-color: var(--c-primary-bg);
  color: var(--c-primary-fg);
  box-shadow: 0 3px 12px rgba(0,0,0,0.45);
}
.btn-primary:hover{ background: var(--c-primary-hover); }
.btn-primary:active{ box-shadow: 0 1px 4px rgba(0,0,0,0.45); }
.btn-ghost{ background: transparent; }
.btn-ghost:hover{ background: var(--c-hover); }
.btn-danger{ border-color: var(--c-danger); color: var(--c-danger); background: transparent; }
.btn-danger:hover{ background: rgba(201,69,92,0.10); }
.btn-sm{ padding: 9px 14px; min-height: 38px; font-size: var(--fs-md); width: auto; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ width: auto; flex:1; }
.btn:disabled{ opacity: 0.4; }

.badge{
  display:inline-flex; align-items:center;
  font-size: var(--fs-2xs); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 20px;
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off-dim);
}
.badge-uni{ color: var(--c-crimson-bright); border-color: var(--c-crimson); }
.badge-pr{ color: var(--c-off); border-color: var(--c-off); }
.badge-positive{ color: var(--c-positive); border-color: var(--c-positive); }
.badge-warn{ color: var(--c-warn); border-color: var(--c-warn); }

.empty-state{
  text-align:center; padding: 46px 18px;
  color: var(--c-off-faint);
}
.empty-state .glyph{ font-size: 26px; color: var(--c-crimson); margin-bottom: 12px; display:block; }
.empty-state h3{ font-size: var(--fs-2xl); color: var(--c-off); margin-bottom: 6px; }
.empty-state p{ font-size: var(--fs-md); margin:0; max-width: 320px; margin-inline:auto; }

.divider{ height:1px; background: var(--c-hairline); border:none; margin: 14px 0; }

.stat-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.stat-box{
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-md);
  padding: 12px;
}
.stat-box .stat-value{ font-family: var(--f-mono); font-size: 20px; color: var(--c-off); }
.stat-box .stat-label{ font-size: var(--fs-2xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-off-faint); margin-top: 4px; }

.field{ margin-bottom: 14px; }
.field label{ display:block; font-size: var(--fs-sm); letter-spacing: 0.04em; color: var(--c-off-dim); margin-bottom: 6px; }
.field input[type="text"], .field input[type="number"], .field textarea, .field select{
  width: 100%;
  background: var(--c-charcoal);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-md);
  padding: 11px 12px;
  font-size: var(--fs-xl);
  color: var(--c-off);
  min-height: 46px;
}
.field textarea{ min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible, .nav-btn:focus-visible{
  outline: 2px solid var(--c-crimson-bright);
  outline-offset: 2px;
}

.toggle-row{ display:flex; border: 1px solid var(--c-hairline-strong); border-radius: var(--radius-md); overflow:hidden; }
.toggle-row button{
  flex:1; padding: 11px; background: var(--c-charcoal); border:none; color: var(--c-off-dim); font-size: var(--fs-md); font-weight:600;
}
.toggle-row button.active{ background: var(--c-blood); color: #f5f5f5; }

/* A plain select styled to match .field select, for selects used outside a
   .field wrapper (e.g. compact rows in the Personal Schedule tab). */
.select-inline{
  background: var(--c-charcoal);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-md);
  padding: 8px 8px;
  font-size: var(--fs-sm);
  color: var(--c-off);
  width: 100%;
}

/* ==========================================================================
   History calendar grid
   ========================================================================== */

.cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size: var(--fs-xs); color: var(--c-off-faint); margin-bottom:6px; }
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
.cal-cell{
  aspect-ratio: 1; border-radius: var(--radius-sm); border: 1px solid var(--c-hairline);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size: var(--fs-xs); color: var(--c-off-dim); background: var(--c-panel);
}
.cal-cell.cal-empty{ border-color: transparent; background: none; }
.cal-cell.cal-done{ background: var(--c-blood); border-color: var(--c-blood); color: var(--c-off); }
.cal-cell.cal-partial{ background: var(--c-panel-raised); border-color: var(--c-crimson); color: var(--c-off); }
.cal-daynum{ font-size: var(--fs-xs); opacity:0.85; }
.cal-tag{ font-size: var(--fs-2xs); font-weight:700; letter-spacing:0.03em; }

/* ==========================================================================
   Toasts + modal
   ========================================================================== */

.toast-region{
  position: fixed; left:0; right:0; top: calc(var(--safe-t) + 10px);
  z-index: 200; display:flex; flex-direction:column; align-items:center; gap:8px;
  pointer-events:none;
}
.toast{
  background: var(--c-panel-raised);
  border: 1px solid var(--c-hairline-strong);
  color: var(--c-off);
  padding: 11px 16px;
  border-radius: 30px;
  font-size: var(--fs-md);
  box-shadow: var(--shadow-lift);
  max-width: 88vw;
  display:flex; align-items:center; gap: 10px;
  animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toast .undo-btn{ background:none;border:none;color:var(--c-crimson-bright);font-weight:700;font-size: var(--fs-md); }
@keyframes toast-in{ from{ opacity:0; transform: translateY(-10px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }

.modal-overlay{
  position: fixed; inset:0; background: rgba(6,5,5,0.72);
  z-index: 300; display:flex; align-items:flex-end; justify-content:center;
  animation: fade-in 0.15s ease;
}
@keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width: 560px;
  background: var(--c-panel);
  border: 1px solid var(--c-hairline-strong);
  border-bottom: none;
  border-radius: 18px 18px 0 0;
  padding: 22px 18px calc(22px + var(--safe-b));
  max-height: 86dvh;
  overflow-y:auto;
  animation: sheet-up 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sheet-up{ from{ transform: translateY(28px); opacity: 0.5;} to{ transform: translateY(0); opacity:1;} }
.modal-sheet h3{ font-size: var(--fs-3xl); margin-bottom: 8px; }
.modal-sheet p{ color: var(--c-off-dim); font-size: var(--fs-lg); line-height:1.55; }

/* ==========================================================================
   Dashboard
   ========================================================================== */

.hero-card{
  background: var(--c-panel);
  border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-lg);
  padding: 22px 18px;
  position: relative;
  overflow:hidden;
}
.hero-card::after{
  content:"✦";
  position:absolute; right: -6px; top:-10px; font-size: 90px;
  color: var(--c-hover);
}
.hero-eyebrow{ font-size: var(--fs-xs); letter-spacing:0.14em; text-transform:uppercase; color:var(--c-off-faint); }
.hero-title{ font-size: 30px; margin-top: 6px; letter-spacing: 0.03em; }
.hero-sub{ color: var(--c-off-dim); font-size: var(--fs-md); margin-top: 6px; }
.hero-actions{ margin-top: 18px; display:flex; gap:10px; }

.seal{
  width: 46px; height:46px; border-radius:50%;
  border: 2px solid var(--c-gold);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--f-display); font-size: var(--fs-3xl); color: var(--c-gold);
  flex-shrink:0;
  position: relative;
}
.seal::before{
  content:""; position:absolute; inset:-5px; border-radius:50%;
  border: 1px dashed rgba(183,146,79,0.4);
}

.pr-row{ display:flex; align-items:center; gap:12px; padding: 10px 0; border-bottom: 1px solid var(--c-hairline); }
.pr-row:last-child{ border-bottom:none; }
.pr-row .pr-name{ font-weight:600; font-size: var(--fs-lg); }
.pr-row .pr-detail{ font-size: var(--fs-sm); color: var(--c-off-faint); }

.history-item{
  transition: background-color 0.15s ease;
  display:flex; align-items:center; gap: 14px;
  padding: 13px 0; border-bottom: 1px solid var(--c-hairline);
}
.history-item:hover{ background: var(--c-hover); }
.history-item:active{ background: var(--c-press); }
.history-item:last-child{ border-bottom:none; }
.history-item .h-index{ font-family: var(--f-display); font-size: 20px; color: var(--c-off-faint); width: 30px; }
.history-item .h-body{ flex:1; }
.history-item .h-title{ font-weight:600; font-size: var(--fs-lg); display:flex; gap:8px; align-items:center; }
.history-item .h-meta{ font-size: var(--fs-sm); color: var(--c-off-faint); margin-top: 2px; }
.history-item .h-chevron{ color: var(--c-off-faint); }

/* ==========================================================================
   Workout / active session
   ========================================================================== */

.workout-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 6px;
}
.workout-progress-bar{
  height: 6px; border-radius: 4px; background: var(--c-charcoal);
  overflow:hidden; margin: 10px 0 16px;
  border: 1px solid var(--c-hairline);
}
.workout-progress-fill{ height:100%; background: linear-gradient(90deg, var(--c-blood), var(--c-crimson-bright)); transition: width 0.25s ease; }

.exercise-card{ }
.exercise-card .ex-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.exercise-card .ex-name{ font-size: var(--fs-2xl); font-weight:700; font-family: var(--f-display); }
.exercise-card .ex-sub{ font-size: var(--fs-xs); color: var(--c-off-faint); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.exercise-card .ex-prev{
  font-size: var(--fs-sm); color: var(--c-off-dim);
  background: var(--c-charcoal); border-radius: var(--radius-sm);
  padding: 8px 10px; margin: 10px 0; font-family: var(--f-mono);
}

.set-row{
  display:flex; align-items:center; gap:8px; padding: 8px 0;
  border-top: 1px solid var(--c-hairline);
}
.set-row:first-of-type{ border-top:none; }
.set-index{
  width: 26px; height:26px; border-radius:50%; flex-shrink:0;
  border: 1px solid var(--c-hairline-strong);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--f-mono); font-size: var(--fs-sm); color: var(--c-off-dim);
}
.set-row.completed .set-index{ background: var(--c-blood); border-color: var(--c-blood); color:var(--c-off); }
.set-inputs{ display:flex; gap:6px; flex:1; }
.set-inputs input{
  width: 100%; min-width: 0;
  background: var(--c-charcoal); border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-sm); padding: 9px 6px; text-align:center;
  font-family: var(--f-mono); font-size: var(--fs-xl); color: var(--c-off);
  min-height: 42px;
}
.set-unit-label{ font-size: var(--fs-2xs); color:var(--c-off-faint); text-align:center; margin-top:2px; letter-spacing:0.04em; }
.set-side-label{ font-size: var(--fs-2xs); color: var(--c-off-faint); text-align:center; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:2px; }
.set-col{ flex:1; min-width:0; }
.set-complete-btn{
  width: 42px; height:42px; border-radius: 50%; flex-shrink:0;
  border: 1px solid var(--c-hairline-strong); background: var(--c-charcoal);
  color: var(--c-off-faint); font-size: var(--fs-3xl);
}
.set-row.completed .set-complete-btn{ background: var(--c-positive); border-color: var(--c-positive); color:#000000; }
.set-row.skipped .set-complete-btn{ background: var(--c-panel-raised); color: var(--c-off-faint); text-decoration: line-through; }
.set-row.skipped .set-index{ opacity:0.4; }

.quick-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

/* RIR chip row under each set */
.rir-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding: 6px 0 10px 34px; margin-top:-2px;
}
.rir-label{ font-size: var(--fs-2xs); letter-spacing:0.06em; text-transform:uppercase; color:var(--c-off-faint); margin-right:2px; }
.rir-chip{ padding: 5px 9px; font-size: var(--fs-xs); }
.rir-chip.active{ background: var(--c-blood); border-color: var(--c-blood); color: var(--c-off); }
.tempo-chip{ padding: 6px 11px; font-size: var(--fs-xs); }
.tempo-chip.active{ background: var(--c-positive); border-color: var(--c-positive); color: var(--c-black); }
.tempo-chip.active.tempo-none{ background: var(--c-off-faint); border-color: var(--c-off-faint); }
.chip-btn{
  border: 1px solid var(--c-hairline-strong); background: var(--c-charcoal);
  color: var(--c-off-dim); border-radius: 20px; padding: 7px 12px; font-size: var(--fs-sm);
}
.chip-btn:active{ background: var(--c-panel-raised); }
.icon-btn{
  border: 1px solid var(--c-hairline-strong); background: var(--c-charcoal);
  color: var(--c-off-dim); border-radius: 50%; width: 30px; height: 30px;
  font-size: var(--fs-2xl); line-height: 1; display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{ background: var(--c-panel-raised); }

.cardio-card .cardio-timer{
  font-family: var(--f-mono); font-size: 44px; text-align:center; letter-spacing: 0.03em;
  padding: 10px 0 4px; color: var(--c-off);
}
.cardio-target{ text-align:center; font-size: var(--fs-xs); color: var(--c-off-faint); letter-spacing:0.06em; text-transform:uppercase; }
.timer-controls{ display:flex; gap:8px; margin-top: 14px; }
.cardio-fields{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top: 12px; }

.resume-banner{
  border: 1px solid var(--c-crimson);
  background: var(--c-hover);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 18px;
}
.resume-banner h3{ font-size: var(--fs-xl); margin-bottom:4px; }
.resume-banner p{ font-size: var(--fs-sm); color: var(--c-off-dim); margin: 0 0 12px; }

.choice-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.choice-card{
  background: var(--c-panel); border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-lg); padding: 20px 14px; text-align:center;
  transition: border-color 0.18s ease, transform 0.08s ease, background-color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.choice-card:not(:disabled):active{ transform: scale(0.97); background: var(--c-panel-raised); }
@media (hover: hover){
  .choice-card:not(:disabled):hover{ border-color: var(--c-crimson); }
}
.choice-card:disabled{ opacity: 0.5; }
.choice-card .choice-icon{ font-size:22px; color: var(--c-crimson); margin-bottom:8px; }
.choice-card .choice-title{ font-family: var(--f-display); font-size: var(--fs-3xl); }
.choice-card .choice-sets{ font-size: var(--fs-xs); color: var(--c-off-faint); margin: 4px 0 14px; }

.sequence-summary-card{
  text-align:center; background: var(--c-panel); border: 1px solid var(--c-hairline-strong);
  border-radius: var(--radius-lg); padding: 18px 14px;
}
.sequence-chip-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; }
.sequence-chip{
  display:inline-block; background: var(--c-charcoal); border: 1px solid var(--c-hairline-strong);
  border-radius: 8px; padding: 7px 12px; font-size: var(--fs-md); font-weight:600; color: var(--c-off);
}
.sequence-chip.is-rest{ color: var(--c-off-faint); border-style: dashed; font-weight:500; }
.sequence-arrow{ color: var(--c-off-faint); font-size: var(--fs-md); }
.sequence-code{
  font-family: var(--f-mono); font-size: 20px; letter-spacing: 0.08em; color: var(--c-crimson-bright);
  margin-top: 14px;
}
.sequence-meaning{ font-size: var(--fs-sm); margin-top: 4px; }

/* ==========================================================================
   Summary
   ========================================================================== */

.summary-hero{ text-align:center; padding: 10px 0 20px; }
.summary-hero .seal{ margin: 0 auto 14px; width:64px; height:64px; font-size:26px; }
.summary-hero h1{ font-size: 26px; }
.summary-hero .summary-type{ color: var(--c-off-faint); font-size: var(--fs-md); letter-spacing:0.1em; text-transform:uppercase; margin-top:4px; }

/* ==========================================================================
   Charts (simple sparkline / bar)
   ========================================================================== */

.chart-wrap{ padding: 6px 0; }
.chart-wrap svg{ width:100%; height: 110px; display:block; }
.trend-tag{ font-size: var(--fs-sm); letter-spacing:0.04em; }

/* ==========================================================================
   Misc utility
   ========================================================================== */

.flex-between{ display:flex; align-items:center; justify-content:space-between; }
.mt-0{ margin-top:0; }
.text-dim{ color: var(--c-off-dim); }
.text-faint{ color: var(--c-off-faint); font-size: var(--fs-sm); }
.text-center{ text-align:center; }
.mb-16{ margin-bottom:16px; }

.search-input{
  width:100%; background: var(--c-panel); border: 1px solid var(--c-hairline-strong);
  border-radius: 30px; padding: 12px 16px; color: var(--c-off); font-size: var(--fs-lg);
  margin-bottom: 16px; min-height: 46px;
}

.list-plain{ list-style:none; margin:0; padding:0; }

@media (min-width: 480px){
  .app-main{ padding-left: 22px; padding-right: 22px; }
}

/* ==========================================================================
   Light theme — aged paper / editorial ledger, same accent family
   ========================================================================== */

html[data-theme="light"]{
  --c-black:        #f2f2f2;
  --c-charcoal:      #e6e6e6;
  --c-panel:         #fafafa;
  --c-panel-raised:  #efefef;
  --c-hairline:      rgba(0,0,0,0.14);
  --c-hairline-strong: rgba(0,0,0,0.30);
  --c-blood:         #3a3a3a;
  --c-crimson:       #6a6a6a;
  --c-crimson-bright:#2a2a2a;
  --c-danger:        #b03a3a;
  --c-off:           #111111;
  --c-off-dim:       #444444;
  --c-off-faint:     #777777;
  --c-gold:          #6b6b6b;
  --c-positive:      #111111;
  --c-warn:          #909090;
  --c-primary-bg:    #111111;
  --c-primary-fg:    #ffffff;
  --c-primary-hover: #000000;
  --c-hover: rgba(0,0,0,0.045);
  --c-press: rgba(0,0,0,0.08);
}
html[data-theme="light"] body::before{ opacity: 0.035; }

/* Themed scrollbar — mostly noticed in the PWA's desktop/installed window
   where the default OS scrollbar would otherwise clash with the dark UI. */
::-webkit-scrollbar{ width: 8px; height: 8px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: var(--c-hairline-strong); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover{ background: var(--c-off-faint); }
* { scrollbar-width: thin; scrollbar-color: var(--c-hairline-strong) transparent; }

/* ==========================================================================
   Stats cards — one shared component for every number on the Dashboard
   ========================================================================== */
.stats-grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
.stats-grid .span-2{ grid-column: 1 / -1; }
@media (max-width: 359px){ .stats-grid{ grid-template-columns: 1fr; } }
.stat-card{
  display:flex; flex-direction:column; min-width:0;
  padding: 14px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--c-hairline);
  background: linear-gradient(180deg, var(--c-panel-raised), var(--c-panel));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.sc-head{ display:flex; align-items:center; gap:8px; margin-bottom: 10px; }
.sc-icon{
  width: 26px; height: 26px; flex-shrink:0; border-radius: 8px;
  display:flex; align-items:center; justify-content:center;
  color: var(--c-crimson-bright); background: var(--c-press);
}
.sc-title{ flex:1; min-width:0; font-size: var(--fs-lg); font-weight: 600; }
.sc-value{ font-family: var(--f-mono); font-size: 26px; font-weight: 600; line-height: 1.1; color: var(--c-off); }
.sc-unit{ font-family: var(--f-body); font-size: var(--fs-md); font-weight: 400; color: var(--c-off-dim); margin-left: 5px; }
.sc-caption{ font-size: var(--fs-sm); color: var(--c-off-faint); margin-top: 6px; line-height: 1.4; }
.split-row{ display:flex; align-items:center; gap: 8px; padding: 4px 0; font-size: var(--fs-sm); }
.split-label{ width: 56px; flex-shrink:0; color: var(--c-off-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.split-bar{ flex:1; min-width:0; height: 6px; border-radius: 4px; background: var(--c-charcoal); overflow:hidden; }
.split-fill{ height:100%; border-radius: 4px; background: linear-gradient(90deg, var(--c-blood), var(--c-crimson-bright)); }
.split-pct{ width: 30px; flex-shrink:0; text-align:right; font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--c-off-faint); }
.orm-row{ display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--c-hairline); }
.orm-row:first-of-type{ border-top: none; padding-top: 2px; }
.orm-name{ font-size: var(--fs-xl); font-weight: 500; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.orm-val{ font-family: var(--f-mono); font-size: var(--fs-2xl); font-weight: 700; white-space:nowrap; }

/* ==========================================================================
   v2 refinements — one clean sans, floating nav, big "today" hero, calmer
   cards. Appended last on purpose so it layers over everything above.
   ========================================================================== */
:root{
  --f-display: var(--f-body);
  --f-mono: var(--f-body);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --nav-h: 88px;
  --header-h: 52px;
}
body::before{ display:none; }
h1,h2,h3,h4{ font-weight:700; letter-spacing:-0.02em; }
.eyebrow{ text-transform:none; letter-spacing:0; font-size:13px; font-weight:500; color:var(--c-off-faint); }
.badge{ text-transform:none; letter-spacing:0; font-size:11px; padding:3px 8px; }

/* leave room under the last item for the rest timer + floating nav */
.app-main{ padding-bottom: calc(112px + var(--nav-h) + var(--safe-b)); }

/* header: quiet, no rule, status as a dot */
.app-header{
  background: rgba(0,0,0,0.72);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: none; box-shadow: none;
  padding-left: 20px; padding-right: 20px;
}
html[data-theme="light"] .app-header{ background: rgba(242,242,242,0.78); }
.brand-name{ font-size:14px; letter-spacing:0.32em; font-weight:800; }
.brand-mark{ color: var(--c-off); }
.save-indicator{ text-transform:none; letter-spacing:0; }
.save-indicator .label{ font-size:0; }

/* floating pill nav */
.bottom-nav{
  left:50%; right:auto; transform: translateX(-50%);
  width: min(calc(100% - 24px), 616px);
  bottom: calc(12px + var(--safe-b));
  height: 64px; padding: 6px; gap: 2px;
  border-radius: 26px;
  background: rgba(20,20,20,0.78);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--c-hairline-strong);
  box-shadow: 0 14px 40px rgba(0,0,0,0.65);
}
html[data-theme="light"] .bottom-nav{ background: rgba(250,250,250,0.84); box-shadow: 0 10px 30px rgba(0,0,0,0.16); }
.nav-btn{ border-radius:20px; min-height:0; padding:0; gap:3px; font-size:10px; letter-spacing:0; }
.nav-btn::before{ display:none; }
.bottom-nav .nav-btn .nav-icon{ width:auto; height:auto; background:none; border-radius:0; }
.nav-btn[aria-current="page"]{ background: var(--c-off); color: var(--c-black); }
.bottom-nav .nav-btn[aria-current="page"] .nav-icon{ color: var(--c-black); background:none; }
.nav-btn:focus-visible{ outline-offset:-2px; }

/* rest timer floats above the pill */
.rest-timer-bar{
  border-radius: 22px;
  border-bottom: 1px solid var(--c-hairline-strong);
  background: rgba(24,24,24,0.92);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
}
html[data-theme="light"] .rest-timer-bar{ background: rgba(255,255,255,0.92); }

/* cards, sections, controls */
.card{ border-radius:20px; padding:18px; }
.stat-card{ background: var(--c-panel); box-shadow:none; border-radius:20px; }
.sc-icon{ background: var(--c-charcoal); }
.sc-value{ font-size:30px; font-weight:300; letter-spacing:-0.035em; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:6px; }
.sc-unit{ font-size:14px; letter-spacing:0; font-weight:400; margin-left:0; }
.orm-val{ font-weight:600; }
.section-title{ margin: 34px 0 12px; }
.section-title h2{ font-size:20px; letter-spacing:-0.025em; text-transform:none; padding-left:0; font-weight:700; }
.section-title h2::before{ display:none; }
.btn{ border-radius:14px; letter-spacing:0; }
.btn-primary{ box-shadow:none; }
.field input[type="date"]{
  width:100%; background: var(--c-charcoal); border:1px solid var(--c-hairline-strong);
  border-radius: var(--radius-md); padding:11px 12px; font-size: var(--fs-xl);
  color: var(--c-off); min-height:46px; color-scheme: dark;
}
html[data-theme="light"] .field input[type="date"]{ color-scheme: light; }
.toggle-row{ border:none; background: var(--c-charcoal); border-radius:12px; padding:3px; gap:3px; }
.toggle-row button{ background:transparent; border-radius:9px; }
.toggle-row button.active{ background: var(--c-off); color: var(--c-black); }
.chip-btn{ border-color: transparent; background: var(--c-charcoal); padding:8px 14px; font-weight:500; }
.chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-btn.skip-chip.active, .rir-chip.active{ background: var(--c-off); border-color: var(--c-off); color: var(--c-black); }
.resume-banner{ background: var(--c-off); border-color: var(--c-off); color: var(--c-black); border-radius:22px; padding:20px; }
.resume-banner h3{ color: var(--c-black); font-size:20px; }
.resume-banner p{ color: rgba(0,0,0,0.6); font-size:14px; }
.resume-banner .btn-primary{ background: var(--c-black); border-color: var(--c-black); color: var(--c-off); min-height:54px; font-size:16px; }

/* Home: the "today" hero */
.hero-card{ background:none; border:none; border-radius:0; padding:14px 0 4px; overflow:visible; }
.hero-card::after{ display:none; }
.hero-eyebrow{ text-transform:none; letter-spacing:0; font-size:14px; font-weight:500; color: var(--c-off-faint); }
.hero-title{ font-size: clamp(48px, 16vw, 72px); font-weight:300; letter-spacing:-0.05em; line-height:1; margin-top:10px; }
.hero-sub{ font-size:15px; margin-top:14px; }
.hero-actions{ margin-top:24px; }
.hero-actions .btn{ width:auto; min-height:58px; font-size:17px; border-radius:18px; }
.hero-actions .btn-primary{ flex:2; }
.hero-actions .btn-ghost{ flex:1; }

.week-strip{ display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; margin-top:30px; }
.wk-day{
  appearance:none; background:none; border:none; padding:6px 0;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  color: var(--c-off-faint); font-size:12px; font-weight:500; border-radius:14px;
  -webkit-tap-highlight-color: transparent;
}
.wk-day:disabled{ opacity:0.45; cursor:default; }
.wk-day:not(:disabled):active{ background: var(--c-press); }
.wk-dot{
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color: var(--c-off-dim);
  border:1.5px solid transparent;
}
.wk-day[data-state="done"] .wk-dot{ background: var(--c-off); color: var(--c-black); }
.wk-day[data-state="planned"] .wk-dot{ border-color: var(--c-hairline-strong); }
.wk-day[data-state="missed"] .wk-dot{ border:1.5px dashed var(--c-off-faint); color: var(--c-off-faint); }
.wk-day[data-state="skipped"] .wk-dot{ background: var(--c-charcoal); color: var(--c-off-dim); border-color: var(--c-hairline-strong); font-size:16px; }
.wk-day[data-state="rest"] .wk-dot::after{ content:""; width:4px; height:4px; border-radius:50%; background: var(--c-hairline-strong); }
.wk-day.today{ color: var(--c-off); }
.wk-day.today .wk-dot{ box-shadow: 0 0 0 2px var(--c-black), 0 0 0 3.5px var(--c-off); }

<script>
// ============================================================================
// SUPABASE CONFIG — fill these in with your own project's values (Supabase
// dashboard → Project Settings → API). The anon/public key is safe to ship
// in client code as long as Row Level Security policies are set up (see the
// SQL in supabase-schema.sql) — it can only do what your RLS policies allow.
// ============================================================================
const SUPABASE_URL = "https://jkjnkuiwtypywfreamrf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vOCwH2n9O2yWFR5qv8xJjA_bwiKH7Es";
if (!window.supabase) {
  document.getElementById("app").innerHTML = `
    <div class="empty-state">
      <span class="glyph">⚠</span>
      <h3>Couldn't load the app</h3>
      <p>A required library failed to download. Check your connection and reload.</p>
      <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" onclick="location.reload()">Reload</button>
    </div>`;
  throw new Error("Supabase library failed to load");
}
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================================
// STIMULUS — single-file build. Train. Track. Adapt.
// ============================================================================

// ============================================================================
// UTILS — pure helper functions. No storage access here.
// ============================================================================

const KG_PER_LB = 0.45359237;
const LB_PER_KG = 2.20462262185;

function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

// A short, silent-on-failure haptic tap for key in-workout moments (set
// completed, workout finished). Purely a feel-good touch — most desktop
// browsers and iOS Safari simply don't have navigator.vibrate, so this
// no-ops there rather than erroring.
function hapticTap(pattern = 10) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (_) {
    /* ignore — vibration is a nicety, never worth surfacing an error for */
  }
}

function nowISO() {
  return new Date().toISOString();
}

// Today's date as a local YYYY-MM-DD string (not UTC) — used as the default
// "day 1" of a freshly-created training sequence.
function todayDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// ---- unit conversion. Internal storage is always kg / km. ----

function kgToLb(kg) { return kg * LB_PER_KG; }
function lbToKg(lb) { return lb * KG_PER_LB; }
function kmToMi(km) { return km * 0.621371; }
function miToKm(mi) { return mi / 0.621371; }

function displayWeight(kg, unit) {
  if (kg == null || Number.isNaN(kg)) return null;
  return unit === "lb" ? kgToLb(kg) : kg;
}
function toStorageWeight(value, unit) {
  if (value == null || Number.isNaN(value)) return null;
  return unit === "lb" ? lbToKg(value) : value;
}
function displayDistance(km, unit) {
  if (km == null || Number.isNaN(km)) return null;
  return unit === "miles" ? kmToMi(km) : km;
}
function toStorageDistance(value, unit) {
  if (value == null || Number.isNaN(value)) return null;
  return unit === "miles" ? miToKm(value) : value;
}

function roundTo(n, decimals = 1) {
  if (n == null || Number.isNaN(n)) return null;
  const f = Math.pow(10, decimals);
  return Math.round(n * f) / f;
}

// ---- formatting ----

function formatDate(iso, opts = {}) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric", ...opts });
}

function formatDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function formatDuration(seconds) {
  seconds = Math.max(0, Math.round(seconds || 0));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function formatMinutes(seconds) {
  return Math.round((seconds || 0) / 60);
}

// ---- exercise math ----

function setVolume(set) {
  if (!set || !set.completed) return 0;
  if (set.unilateral) {
    const l = (set.leftWeightKg || 0) * (set.leftReps || 0);
    const r = (set.rightWeightKg || 0) * (set.rightReps || 0);
    return l + r;
  }
  return (set.weightKg || 0) * (set.reps || 0);
}

function exerciseVolume(exerciseEntry) {
  if (!exerciseEntry || !exerciseEntry.sets) return 0;
  return exerciseEntry.sets.reduce((sum, s) => sum + setVolume(s), 0);
}

function workoutVolume(workout) {
  if (!workout || !workout.exercises) return 0;
  return workout.exercises.reduce((sum, e) => sum + exerciseVolume(e), 0);
}

function countCompletedSets(workout) {
  if (!workout) return { completed: 0, skipped: 0, programmed: 0 };
  let completed = 0, skipped = 0, programmed = 0;
  for (const e of workout.exercises) {
    for (const s of e.sets) {
      programmed++;
      if (s.completed) completed++;
      else if (s.skipped) skipped++;
    }
  }
  return { completed, skipped, programmed };
}

function computeWorkoutStatus(workout) {
  const { completed, programmed } = countCompletedSets(workout);
  if (completed === 0) return "abandoned";
  if (completed === programmed) return "completed";
  return "partial";
}

// ---- streak (consecutive training days with a completed workout) ----
// Uses local calendar days throughout (via dateKey), matching the rest of
// the app's date handling. completedAt/startedAt are stored as UTC ISO
// strings (nowISO()), so slicing the first 10 chars would key workouts by
// their UTC date instead of the day the user actually trained on — for
// anyone east of UTC, or anyone training late at night, that silently
// shifts workouts onto the wrong day and can break a real streak (or
// paper over a broken one).
function computeStreak(workouts) {
  const days = new Set(
    workouts
      .filter((w) => w.status === "completed")
      .map((w) => dateKey(new Date(w.completedAt || w.startedAt)))
  );
  if (days.size === 0) return 0;

  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0, 0, 0, 0);

  // Allow the streak to count "today" only if trained, otherwise start from yesterday.
  const todayKey = dateKey(cursor);
  if (!days.has(todayKey)) {
    cursor.setDate(cursor.getDate() - 1);
  }

  while (true) {
    const key = dateKey(cursor);
    if (days.has(key)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ---- trend analysis for an exercise: improving / stable / declining ----
function computeTrend(exerciseHistory) {
  // exerciseHistory: array of {date, volume} sorted ascending, from completed workouts
  if (!exerciseHistory || exerciseHistory.length < 3) {
    return { trend: "insufficient", label: "Not enough data to determine a trend." };
  }
  const recent = exerciseHistory.slice(-3);
  const earlier = exerciseHistory.slice(-6, -3);
  if (earlier.length === 0) {
    return { trend: "insufficient", label: "Not enough data to determine a trend." };
  }
  const avg = (arr) => arr.reduce((s, x) => s + x.volume, 0) / arr.length;
  const recentAvg = avg(recent);
  const earlierAvg = avg(earlier);
  if (earlierAvg === 0) return { trend: "insufficient", label: "Not enough data to determine a trend." };
  const change = (recentAvg - earlierAvg) / earlierAvg;
  if (change > 0.05) return { trend: "improving", label: "Improving" };
  if (change < -0.05) return { trend: "declining", label: "Declining" };
  return { trend: "stable", label: "Stable" };
}

// ---- best completed set for an exercise entry: heaviest weight (using the
// heavier side for unilateral work), tie-broken by reps at that weight ----
function bestSetOf(entry) {
  const completed = entry.sets.filter((s) => s.completed);
  if (!completed.length) return null;
  let best = null;
  let maxReps = 0;
  for (const s of completed) {
    let weight, reps;
    if (s.unilateral) {
      const lw = s.leftWeightKg ?? 0, rw = s.rightWeightKg ?? 0;
      if (lw >= rw) { weight = lw; reps = s.leftReps ?? 0; } else { weight = rw; reps = s.rightReps ?? 0; }
      maxReps = Math.max(maxReps, s.leftReps ?? 0, s.rightReps ?? 0);
    } else {
      weight = s.weightKg ?? 0;
      reps = s.reps ?? 0;
      maxReps = Math.max(maxReps, reps);
    }
    if (!best || weight > best.weight || (weight === best.weight && reps > best.reps)) {
      best = { weight, reps };
    }
  }
  if (!best) return null;
  return { ...best, maxReps };
}

// ---- automatic progression detection (item 7): compares this exercise's
// best set against its previous performance. Objective only — heavier
// weight, or more reps at the same weight. ----
function detectProgression(prevEntry, currEntry) {
  const prevBest = prevEntry ? bestSetOf(prevEntry) : null;
  const currBest = currEntry ? bestSetOf(currEntry) : null;
  if (!currBest) return null;
  if (!prevBest) return { type: "first", label: "First recorded performance" };
  if (currBest.weight > prevBest.weight) return { type: "weight", label: `Weight ↑ ${roundTo(currBest.weight)}kg (was ${roundTo(prevBest.weight)}kg)` };
  if (currBest.weight === prevBest.weight && currBest.reps > prevBest.reps) return { type: "reps", label: `Reps ↑ ${currBest.reps} (was ${prevBest.reps})` };
  if (currBest.weight === prevBest.weight && currBest.reps === prevBest.reps) return { type: "none", label: "Matched last time" };
  return { type: "none", label: "No progression this time" };
}

// ---- exercise identity across program changes ----
// Every exercise lookup below used to match strictly by exerciseId. That's
// fine within a single active workout, but it quietly breaks continuity the
// moment an exercise's id changes for a reason that has nothing to do with
// it being a different exercise — most commonly: changing program type,
// or deleting and re-adding a custom exercise (each gets a fresh random
// id). "Previous weight", PR badges, and the progress graph would all
// silently reset to empty for an exercise you've actually been running for
// months, just because its id changed. Matching on name too (normalized:
// trimmed, lowercased, collapsed whitespace) as well as id means the app
// still recognizes "Bench Press" as the same lift it's always been, no
// matter which program or which id it's currently attached to — while an
// exercise you deliberately renamed (id unchanged) keeps matching via id
// exactly as before.
function normalizeExerciseName(name) {
  return (name || "").trim().toLowerCase().replace(/\s+/g, " ");
}
function findExerciseEntryInWorkout(workout, exerciseId, exerciseName) {
  const normalizedTarget = normalizeExerciseName(exerciseName);
  return workout.exercises.find((e) =>
    e.exerciseId === exerciseId || (normalizedTarget && normalizeExerciseName(e.name) === normalizedTarget)
  );
}

// ---- lightweight PR detection (item 9): given completed/partial workouts
// sorted OLDEST-FIRST, returns whether the given workout's entry for
// exerciseId set a Weight PR and/or Rep PR at the time it was logged.
// Independent, running-max flags — no separate PR database (item 17). ----
function computeEntryPRFlags(workoutsAsc, exerciseId, workoutId, exerciseName) {
  let maxWeight = 0, maxReps = 0;
  let result = { weightPR: false, repsPR: false };
  for (const w of workoutsAsc) {
    const entry = findExerciseEntryInWorkout(w, exerciseId, exerciseName);
    if (!entry) continue;
    const best = bestSetOf(entry);
    if (!best) continue;
    const isWeightPR = best.weight > maxWeight;
    const isRepsPR = best.maxReps > maxReps;
    if (w.id === workoutId) result = { weightPR: isWeightPR, repsPR: isRepsPR };
    maxWeight = Math.max(maxWeight, best.weight);
    maxReps = Math.max(maxReps, best.maxReps);
  }
  return result;
}

function completedWorkoutsAsc(workouts) {
  return workouts
    .filter((w) => w.status === "completed" || w.status === "partial")
    .slice()
    .sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt));
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

// ---- RIR (Reps In Reserve) — Failure, 0, 1, 2, or 2+. "Failure" is kept
// distinct from RIR 0: RIR 0 means "no more reps left in reserve, but I
// could still complete the one I just did," while Failure means the set
// ended because a rep couldn't be finished. "2+" covers anything looser
// than RIR 2 without asking the user to pick an exact number. ----
const RIR_OPTIONS = [
  { value: "failure", label: "Failure" },
  { value: "0", label: "0" },
  { value: "1", label: "1" },
  { value: "2", label: "2" },
  { value: "2+", label: "2+" },
];

// ---- per-exercise weight unit preference ----
// settings.exerciseUnits is a { [exerciseId]: "kg" | "lb" } map. Exercises
// with no explicit preference fall back to kg. Changing one exercise's unit
// never touches this map's other entries.
function getExerciseUnit(settings, exerciseId) {
  return (settings && settings.exerciseUnits && settings.exerciseUnits[exerciseId]) || "kg";
}

// ---- per-exercise rest timer duration ----
// Mirrors exerciseUnits: settings.exerciseRestSeconds is a { [exerciseId]:
// seconds } map. An exercise with no explicit override falls back to the
// global restTimerSeconds default (Settings > Rest Timer), so e.g. squats
// can rest 3:00 while curls rest 1:30 without touching the global default.
const REST_TIMER_PRESETS = [90, 120, 150, 180];
function getExerciseRestSeconds(settings, exerciseId) {
  const perExercise = settings && settings.exerciseRestSeconds && settings.exerciseRestSeconds[exerciseId];
  return perExercise || (settings && settings.restTimerSeconds) || DEFAULT_SETTINGS.restTimerSeconds;
}
function nextRestPreset(current) {
  const idx = REST_TIMER_PRESETS.indexOf(current);
  return REST_TIMER_PRESETS[(idx === -1 ? 0 : idx + 1) % REST_TIMER_PRESETS.length];
}

// ============================================================================
// PROGRAM DEFINITION — Stimulus has no built-in starter program. Instead the
// user picks a split (Full Body / Anterior-Posterior / Upper-Lower) and a
// training sequence during first-run setup (see PROGRAM SETUP below), which just
// establishes the *day types* and a default training pattern — no exercises
// are auto-assigned. Exercises are always added by the user via the existing
// Add Exercise / Copy-Paste Program features, exactly as before.
//
// PROGRAM is rebuilt at runtime (rebuildProgram()) from:
//   - PROGRAM_DAY_TYPES: [{key,label}, ...] — stored in programState.dayTypes
//   - custom exercises + per-exercise overrides — stored server-side, per account
// Editing any of this only affects *future* workouts — historical workout
// records store their own snapshot of what was actually performed and are
// never mutated by changes here (see storage.js / db.js).
// ============================================================================

const SCHEMA_VERSION = 1;

// Flexible muscle targeting system --------------------------------------
//
// An exercise is tagged with one or more MUSCLES (e.g. "Back"), and each
// muscle can carry any number of specific TARGET AREAS (e.g. "Lats",
// "Upper Back"). The first entry in an exercise's `muscles` array is its
// primary muscle; any further entries are "additional" muscles it also
// trains. The user decides what an exercise targets — nothing here is
// hard-coded to specific exercises.
const MUSCLE_GROUPS = [
  { key: "chest", label: "Chest" },
  { key: "back", label: "Back" },
  { key: "shoulders", label: "Shoulders" },
  { key: "arms", label: "Arms" },
  { key: "forearms", label: "Forearms" },
  { key: "legs", label: "Legs" },
  { key: "core", label: "Core" },
  { key: "other", label: "Other" },
];
const MUSCLE_BY_KEY = new Map(MUSCLE_GROUPS.map((m) => [m.key, m]));

// Preset target areas offered for each muscle. Purely a menu of suggestions
// — the user can always add their own via "+ Add Target Area", and can
// select any number of these for a given muscle.
const TARGET_AREAS_BY_MUSCLE = {
  chest: [
    { key: "chest_upper", label: "Upper Chest" },
    { key: "chest_mid", label: "Mid Chest" },
    { key: "chest_lower", label: "Lower Chest" },
  ],
  back: [
    { key: "upper_lat", label: "Upper Lat" },
    { key: "lower_lat", label: "Lower Lat" },
    { key: "upper_back", label: "Upper Back" },
    { key: "erectors", label: "Erectors" },
  ],
  shoulders: [
    { key: "front_delts", label: "Front Delts" },
    { key: "lateral_delts", label: "Lateral Delts" },
    { key: "rear_delts", label: "Rear Delts" },
  ],
  arms: [
    { key: "biceps", label: "Biceps" },
    { key: "brachialis", label: "Brachialis" },
    { key: "triceps", label: "Triceps" },
  ],
  forearms: [
    { key: "brachioradialis", label: "Brachioradialis" },
    { key: "flexors", label: "Flexors" },
    { key: "extensors", label: "Extensors" },
  ],
  legs: [
    { key: "quads", label: "Quads" },
    { key: "hamstring", label: "Hamstring" },
    { key: "glutes", label: "Glutes" },
    { key: "calves", label: "Calves" },
  ],
  core: [
    { key: "abs", label: "Abs" },
    { key: "obliques", label: "Obliques" },
  ],
  other: [],
};

// Maps every muscle key from earlier versions of this taxonomy (both the
// original 13-muscle flat list, and the anatomical sub-muscle keys that
// existed under it) onto the current { muscle, area } shape, so existing
// exercises migrate automatically the first time they're read — nothing
// gets dropped or reset to "Other" unnecessarily. A sub-muscle with no
// clean equivalent still maps to its correct muscle, just without a
// pre-picked target area.
const LEGACY_SUBMUSCLE_MIGRATION = {
  // Former standalone primary muscles, now folded into a broader group.
  biceps: { muscle: "arms", area: "biceps" },
  triceps: { muscle: "arms", area: "triceps" },
  quads: { muscle: "legs", area: "quads" },
  hamstrings: { muscle: "legs", area: "hamstring" },
  glutes: { muscle: "legs", area: "glutes" },
  calves: { muscle: "legs", area: "calves" },
  abs: { muscle: "core", area: "abs" },
  traps: { muscle: "back", area: "upper_back" },
  // Older anatomical sub-muscle keys.
  lats: { muscle: "back", area: null },
  rhomboids: { muscle: "back", area: "upper_back" },
  erectors: { muscle: "back", area: "erectors" },
  teres_major: { muscle: "back", area: "upper_back" },
  teres_minor: { muscle: "back", area: "upper_back" },
  infraspinatus: { muscle: "back", area: "upper_back" },
  brachialis: { muscle: "arms", area: "brachialis" },
  brachioradialis: { muscle: "forearms", area: "brachioradialis" },
  adductors: { muscle: "legs", area: "glutes" },
  abductors: { muscle: "legs", area: "glutes" },
  obliques: { muscle: "core", area: "obliques" },
  hip_flexors: { muscle: "legs", area: "quads" },
  chest_upper: { muscle: "chest", area: "chest_upper" },
  chest_lower: { muscle: "chest", area: "chest_lower" },
  triceps_long: { muscle: "arms", area: "triceps" },
  triceps_lateral: { muscle: "arms", area: "triceps" },
  triceps_medial: { muscle: "arms", area: "triceps" },
  biceps_long: { muscle: "arms", area: "biceps" },
  biceps_short: { muscle: "arms", area: "biceps" },
  delts_front: { muscle: "shoulders", area: "front_delts" },
  delts_side: { muscle: "shoulders", area: "lateral_delts" },
  delts_rear: { muscle: "shoulders", area: "rear_delts" },
  quads_rectus_femoris: { muscle: "legs", area: "quads" },
  quads_vastus_lateralis: { muscle: "legs", area: "quads" },
  quads_vastus_medialis: { muscle: "legs", area: "quads" },
  hamstrings_biceps_femoris: { muscle: "legs", area: "hamstring" },
  hamstrings_medial: { muscle: "legs", area: "hamstring" },
  glutes_max: { muscle: "legs", area: "glutes" },
  glutes_med: { muscle: "legs", area: "glutes" },
  calves_gastroc: { muscle: "legs", area: "calves" },
  calves_soleus: { muscle: "legs", area: "calves" },
  abs_upper: { muscle: "core", area: "abs" },
  abs_lower: { muscle: "core", area: "abs" },
  traps_upper: { muscle: "back", area: "upper_back" },
  traps_mid_lower: { muscle: "back", area: "upper_back" },
  forearms_flexors: { muscle: "forearms", area: "flexors" },
  forearms_extensors: { muscle: "forearms", area: "extensors" },
};

function legacyKeyToMuscleArea(key) {
  if (!key) return { muscle: "other", area: null };
  if (MUSCLE_BY_KEY.has(key)) return { muscle: key, area: null };
  if (LEGACY_SUBMUSCLE_MIGRATION[key]) return LEGACY_SUBMUSCLE_MIGRATION[key];
  return { muscle: "other", area: null };
}

function muscleLabel(key) {
  return MUSCLE_BY_KEY.get(key)?.label || "Other";
}

function targetAreaOptions(muscleKey) {
  return TARGET_AREAS_BY_MUSCLE[muscleKey] || [];
}

function areaPresetLabel(muscleKey, areaKey) {
  const found = targetAreaOptions(muscleKey).find((a) => a.key === areaKey);
  return found ? found.label : null;
}

// Migrates one `muscles` array entry whose `.muscle` is a key from a
// previous version of MUSCLE_GROUPS (e.g. "biceps" back when it was its
// own primary muscle) onto the current taxonomy. If the entry already has
// specific target areas tagged, those are kept as-is (their labels still
// display correctly even if the key no longer matches a current preset).
// If it has no areas at all, a fallback area representing the old primary
// muscle's identity is added so that specificity isn't silently lost.
function migrateLegacyMuscleEntry(m) {
  if (MUSCLE_BY_KEY.has(m.muscle)) return m;
  const mapped = LEGACY_SUBMUSCLE_MIGRATION[m.muscle];
  if (!mapped) return { muscle: "other", areas: m.areas || [] };
  const hasAreas = Array.isArray(m.areas) && m.areas.length > 0;
  if (hasAreas) return { muscle: mapped.muscle, areas: m.areas };
  const areas = mapped.area ? [{ key: mapped.area, label: areaPresetLabel(mapped.muscle, mapped.area) || mapped.area, custom: false }] : [];
  return { muscle: mapped.muscle, areas };
}

// Cleans up a `muscles` array (from storage, or from the muscle editor) into
// a well-formed shape: every entry has a valid muscle key and an array of
// { key, label, custom } target areas. Always returns at least one entry.
function sanitizeMuscleEntries(list) {
  const cleaned = (Array.isArray(list) ? list : [])
    .filter((m) => m && m.muscle)
    .map((m) => migrateLegacyMuscleEntry(m))
    .map((m) => ({
      muscle: MUSCLE_BY_KEY.has(m.muscle) ? m.muscle : "other",
      areas: Array.isArray(m.areas)
        ? m.areas
            .filter((a) => a && a.key)
            .map((a) => ({ key: a.key, label: a.label || areaPresetLabel(m.muscle, a.key) || a.key, custom: !!a.custom }))
        : [],
    }));
  return cleaned.length ? cleaned : [{ muscle: "other", areas: [] }];
}

// Normalizes any exercise-like object into the current `muscles` array
// shape, migrating the old `muscleGroup` / `secondaryMuscle` fields the
// first time an exercise tagged under the old system is read. Nothing is
// deleted: a primary + secondary pairing becomes a primary + additional
// muscle pairing, preserving the same relative volume weighting.
function normalizeExerciseMuscles(c) {
  if (Array.isArray(c.muscles) && c.muscles.length) return sanitizeMuscleEntries(c.muscles);
  const entries = [];
  const pushLegacy = (key) => {
    const resolved = legacyKeyToMuscleArea(key);
    const areas = resolved.area ? [{ key: resolved.area, label: areaPresetLabel(resolved.muscle, resolved.area) || resolved.area, custom: false }] : [];
    entries.push({ muscle: resolved.muscle, areas });
  };
  pushLegacy(c.muscleGroup || "other");
  if (c.secondaryMuscle) pushLegacy(c.secondaryMuscle);
  return entries.length ? entries : [{ muscle: "other", areas: [] }];
}

let PROGRAM = {};
let PROGRAM_DAY_TYPES = []; // [{key,label}, ...] — set from programState at boot

function setProgramDayTypes(dayTypes) {
  PROGRAM_DAY_TYPES = dayTypes || [];
}

// Rebuilds PROGRAM as { [dayTypeKey]: {key,label,exercises:[...]} } from the
// current day types plus whatever custom exercises/overrides/order are in
// storage. Called at boot and again right after adding/editing/removing an
// exercise, changing the split, or editing day types.
function rebuildProgram(customList, overrides, order) {
  const list = customList || [];
  const ov = overrides || {};
  const ord = order || {};
  const next = {};
  for (const dt of PROGRAM_DAY_TYPES) {
    const custom = list
      .filter((c) => c.type === dt.key)
      .map((c) => ({ id: c.id, name: c.name, sets: c.sets, unilateral: !!c.unilateral, muscles: normalizeExerciseMuscles(c), regions: normalizeExerciseRegions(c), custom: true }));
    const withOverrides = custom
      .filter((e) => !ov[e.id]?.removed)
      .map((e) => {
        const o = ov[e.id];
        if (!o) return e;
        return {
          ...e,
          ...(typeof o.sets === "number" ? { sets: o.sets } : {}),
          ...(typeof o.unilateral === "boolean" ? { unilateral: o.unilateral } : {}),
          ...(Array.isArray(o.muscles) ? { muscles: sanitizeMuscleEntries(o.muscles) } : {}),
          ...(o.regions && typeof o.regions === "object" ? { regions: sanitizeRegions(o.regions) } : {}),
        };
      });

    const orderIds = ord[dt.key] || [];
    if (orderIds.length) {
      const pos = new Map(orderIds.map((id, i) => [id, i]));
      withOverrides.sort((a, b) => {
        const pa = pos.has(a.id) ? pos.get(a.id) : Infinity;
        const pb = pos.has(b.id) ? pos.get(b.id) : Infinity;
        if (pa === pb) return 0;
        return pa - pb;
      });
    }

    next[dt.key] = { key: dt.key, label: dt.label, exercises: withOverrides };
  }
  PROGRAM = next;
}

// Backward-compatible name used throughout the app at every call site that
// previously rebuilt the built-in-plus-custom program.
const applyCustomExercises = rebuildProgram;

function programTotalSets(type) {
  return PROGRAM[type] ? PROGRAM[type].exercises.reduce((sum, e) => sum + e.sets, 0) : 0;
}

// Unilateral exercise volume rule: a unilateral exercise's programmed set
// count (e.g. "2 sets") counts as 2 sets of volume, same as a bilateral
// exercise — one side or both sides, a "set" is a set. The per-exercise
// programmed set count (shown elsewhere, and what the user edits) never
// changes either way. Applies uniformly across every workout day type
// (Upper, Lower, Full Body, or any custom split) since it operates on
// PROGRAM[type] generically.
const UNILATERAL_VOLUME_MULTIPLIER = 1;

function exerciseVolumeSets(e) {
  if (!e) return 0;
  return e.sets * (e.unilateral ? UNILATERAL_VOLUME_MULTIPLIER : 1);
}

// Total training volume for a workout day type, in "volume sets": every
// exercise, bilateral or unilateral, counts its programmed sets once. This
// is the figure used for total workout volume — never the per-exercise
// programmed set count itself, which stays as-is.
function programVolumeSets(type) {
  return PROGRAM[type] ? PROGRAM[type].exercises.reduce((sum, e) => sum + exerciseVolumeSets(e), 0) : 0;
}

// Weight applied to an exercise's additional (non-primary) muscles, relative
// to its primary muscle (which always counts as 1.0×). Reflects that an
// additional mover is worked, but less directly than the primary target, so
// it doesn't add a full extra set of volume for that muscle.
const SECONDARY_MUSCLE_VOLUME_WEIGHT = 0.5;

// A normalized `muscles` array for any exercise-like object, always at
// least one entry. Falls back gracefully for anything unexpected.
function exerciseMuscles(e) {
  return Array.isArray(e && e.muscles) && e.muscles.length ? e.muscles : [{ muscle: "other", areas: [] }];
}

// Planned volume per Group for a day type: { groupKey: sets }. Each exercise counts
// once per Group at its highest credit (see addExerciseVolume).
function programMuscleVolume(type) {
  return programVolume(type).groups;
}

// Same breakdown, aggregated across every day type in the current program —
// e.g. "how much volume does chest get across my whole split".
function programMuscleVolumeAll() {
  const totals = {};
  for (const dt of PROGRAM_DAY_TYPES) {
    const day = programMuscleVolume(dt.key);
    for (const [key, val] of Object.entries(day)) {
      totals[key] = (totals[key] || 0) + val;
    }
  }
  return totals;
}

// Weekly per-muscle volume from the training sequence: each day type counts as
// often as it appears, scaled to 7 days; rest days ("R") count zero.
function programMuscleVolumeWeekly(pattern) {
  const seq = Array.isArray(pattern) ? pattern : [];
  if (!seq.length) return { totals: programMuscleVolumeAll(), perWeek: false };
  const factor = 7 / seq.length;
  const totals = {};
  for (const key of seq) {
    if (key === "R" || !PROGRAM[key]) continue;
    for (const [m, val] of Object.entries(programMuscleVolume(key))) {
      totals[m] = (totals[m] || 0) + val * factor;
    }
  }
  return { totals, perWeek: true };
}

// Flat one-line-per-group breakdown (Program Overview).
function muscleVolumeBreakdownHtml(totals) {
  const lines = REGION_GROUPS.map((g) => ({ label: g.label, total: totals[g.key] })).filter((x) => x.total > 0);
  if (!lines.length) return "";
  return `<div style="margin-top:4px; font-size:13px;">${lines.map((x) => `<div style="padding:3px 0;">${escapeHtml(x.label)} — ${Math.round(x.total)}</div>`).join("")}</div>`;
}

// ============================================================================
// REGION TAGGING — Exercise -> Group -> Region. An exercise carries
// `regions: { regionKey: 1 | 0.5 }`. Regions roll up into their Group, but an
// exercise counts ONCE per Group at its highest single credit (no double-counting).
// ============================================================================

const REGION_TARGET_FACTOR = 0.5;

function sanitizeRegions(obj) {

const LEGACY_AREA_TO_REGIONS = {
  chest_upper: ["chest_clavicular"], chest_mid: ["chest_sternal"], chest_lower: ["chest_costal"],
  upper_lat: ["upper_lat"], lower_lat: ["lower_lat"], upper_back: ["mid_traps", "rhomboids"], erectors: ["erectors"],
  front_delts: ["front_delts"], lateral_delts: ["lateral_delts"], rear_delts: ["rear_delts"],

  triceps: ["triceps_long", "triceps_lateral", "triceps_medial"],
  brachioradialis: ["brachioradialis"], flexors: ["wrist_flexors", "finger_flexors"], extensors: ["wrist_extensors"],
  quads: ["rectus_femoris", "vastus_lateralis", "vastus_medialis", "vastus_intermedius"],
  hamstring: ["biceps_femoris_long", "biceps_femoris_short", "semitendinosus", "semimembranosus"],
  glutes: ["glute_max_upper", "glute_max_lower", "glute_medius"],

function regionsFromLegacyMuscles(muscles) {
  const out = {};
  (muscles || []).forEach((m, i) => {
    const credit = i === 0 ? 1 : 0.5;
    for (const a of m.areas || []) for (const r of LEGACY_AREA_TO_REGIONS[a.key] || []) if (!(out[r] >= credit)) out[r] = credit;

function normalizeExerciseRegions(c) {

  return regionsFromLegacyMuscles(normalizeExerciseMuscles(c || {}));

// ---- Aggregation -----------------------------------------------------------
// Per-exercise credit table, compiled once per regions object:
// list = [[regionKey, credit]], groupMax = { groupKey: highest credit in that group }.
const _creditCache = new WeakMap();
function creditTable(regions) {
  let t = _creditCache.get(regions);
  if (t) return t;
  const list = [], groupMax = {};
  for (const k in regions) {
    const r = REGION_BY_KEY.get(k);
    if (!r) continue;
    const c = regions[k];
    list.push([k, c]);
    if (c > (groupMax[r.group] || 0)) groupMax[r.group] = c;
  }
  t = { list, groupMax };
  _creditCache.set(regions, t);
  return t;
}
function createVolumeAcc() { return { sets: 0, groups: {}, regions: {} }; }

// One exercise instance of `sets` sets. Each region gets sets x its credit; each
// Group gets sets x the HIGHEST credit among that exercise's regions in the group.
function addExerciseVolume(acc, regions, sets) {
  if (!regions || !sets) return acc;
  const t = creditTable(regions);
  for (const [k, c] of t.list) acc.regions[k] = (acc.regions[k] || 0) + sets * c;
  for (const g in t.groupMax) acc.groups[g] = (acc.groups[g] || 0) + sets * t.groupMax[g];
  return acc;
}
function mergeVolume(into, from) {
  into.sets += from.sets;
  for (const k in from.groups) into.groups[k] = (into.groups[k] || 0) + from.groups[k];
  for (const k in from.regions) into.regions[k] = (into.regions[k] || 0) + from.regions[k];
  return into;
}
function mondayOf(d) {
  const m = new Date(d);
  m.setHours(0, 0, 0, 0);
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
function makeDefResolver() {
  const byId = new Map(), byName = new Map();
  for (const d of allExerciseDefs()) { byId.set(d.id, d); byName.set(normalizeExerciseName(d.name), d); }
  return (en) => byId.get(en.exerciseId) || byName.get(normalizeExerciseName(en.name)) || null;
}
// Completed-set volume, bucketed in a single pass over the workouts.
// bucket: "day" | "week" (keyed by Monday) | "all". range: { from, to } dateKeys, inclusive.
// Returns Map(bucketKey -> { sets, groups, regions }).
function volumeByBucket(workouts, bucket = "day", range = null) {
  const resolve = makeDefResolver();
  const out = new Map();
  for (const w of workouts) {
    if (w.status !== "completed" && w.status !== "partial") continue;
    const d = new Date(w.startedAt);
    const day = dateKey(d);
    if (range && ((range.from && day < range.from) || (range.to && day > range.to))) continue;
    const key = bucket === "week" ? dateKey(mondayOf(d)) : bucket === "all" ? "all" : day;
    let acc = out.get(key);
    if (!acc) { acc = createVolumeAcc(); out.set(key, acc); }
    for (const en of w.exercises) {
      let n = 0;
      for (const st of en.sets) if (st.completed) n++;
      if (!n) continue;
      acc.sets += n;
      const def = resolve(en);
      if (def) addExerciseVolume(acc, def.regions, n);
    }
  }
  return out;
}
// Planned volume for one day type of the program.
function programVolume(type) {
  const acc = createVolumeAcc();
  const p = PROGRAM[type];
  if (!p) return acc;
  for (const e of p.exercises) {
    const n = exerciseVolumeSets(e);
    acc.sets += n;
    addExerciseVolume(acc, e.regions, n);
  }
  return acc;
}

// ---- Display helpers -------------------------------------------------------
function muscleSummaryText(e) {
  const by = {};
  for (const [k, c] of creditTable(e.regions || {}).list) {
    const r = REGION_BY_KEY.get(k);
    (by[r.group] = by[r.group] || []).push(r.label.replace(/ \(.*\)$/, "") + (c < 1 ? " ½" : ""));
  }
  const parts = REGION_GROUPS.filter((g) => by[g.key]).map((g) => `${g.label} (${by[g.key].join(", ")})`);
  return parts.length ? parts.join(" + ") : "Untagged";
}
function muscleChipText(e) {
  const t = creditTable(e.regions || {});
  const n = t.list.length;
  if (!n) return "Tag regions";
  const gs = REGION_GROUPS.filter((g) => t.groupMax[g.key]);
  return `${n} region${n > 1 ? "s" : ""} · ${gs[0].label}${gs.length > 1 ? ` +${gs.length - 1}` : ""}`;
}

// ---- Shared region picker (single-exercise modal + bulk editor panel) -------
const regionTag = (s) => (s === "mixed" ? "~" : s === 1 ? "Full" : s === 0.5 ? "½" : "");
const nextRegionState = (s) => (s === 1 ? 0.5 : s === 0.5 ? 0 : 1); // 0 -> 1 -> 0.5 -> 0 (mixed -> 1)
function regionBtnHtml(key, state) {
  return `<button type="button" class="rg-btn" data-region="${key}" data-state="${state}" aria-pressed="${state !== 0}"><span>${escapeHtml(REGION_BY_KEY.get(key).label)}</span><span class="rg-tag">${regionTag(state)}</span></button>`;
}
function regionPickerHtml(stateOf, query) {
  const q = (query || "").trim().toLowerCase();
  let html = "";
  for (const g of REGION_GROUPS) {
    const groupHit = !!q && (g.label.toLowerCase().includes(q) || g.family.toLowerCase().includes(q));
    const rs = g.regions.filter((r) => !q || groupHit || r.label.toLowerCase().includes(q));

function mountRegionPicker(root, { getState, onCycle }) {
  root.innerHTML = `<input type="search" class="rg-search" placeholder="Search regions…" aria-label="Search regions" autocomplete="off"><div class="rg-scroll"></div>`;
  const input = qs(".rg-search", root), list = qs(".rg-scroll", root);
  const draw = () => { list.innerHTML = regionPickerHtml(getState, input.value); };
  input.addEventListener("input", draw);
