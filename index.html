// ============================================================================
// STIMULUS — single-file build. Train. Track. Adapt.
// ============================================================================

// ============================================================================
// UTILS — pure helper functions. No storage access here.
// ============================================================================

const KG_PER_LB = 0.45359237;
const LB_PER_KG = 2.20462262185;

function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

// A short, silent-on-failure haptic tap for key in-workout moments (set
// completed, workout finished). Purely a feel-good touch — most desktop
// browsers and iOS Safari simply don't have navigator.vibrate, so this
// no-ops there rather than erroring.
function hapticTap(pattern = 10) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (_) {
    /* ignore — vibration is a nicety, never worth surfacing an error for */
  }
}

function nowISO() {
  return new Date().toISOString();
}

// Today's date as a local YYYY-MM-DD string (not UTC) — used as the default
// "day 1" of a freshly-created training sequence.
function todayDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// ---- unit conversion. Internal storage is always kg / km. ----

function kgToLb(kg) { return kg * LB_PER_KG; }
function lbToKg(lb) { return lb * KG_PER_LB; }
function kmToMi(km) { return km * 0.621371; }
function miToKm(mi) { return mi / 0.621371; }

function displayWeight(kg, unit) {
  if (kg == null || Number.isNaN(kg)) return null;
  return unit === "lb" ? kgToLb(kg) : kg;
}
function toStorageWeight(value, unit) {
  if (value == null || Number.isNaN(value)) return null;
  return unit === "lb" ? lbToKg(value) : value;
}
function displayDistance(km, unit) {
  if (km == null || Number.isNaN(km)) return null;
  return unit === "miles" ? kmToMi(km) : km;
}
function toStorageDistance(value, unit) {
  if (value == null || Number.isNaN(value)) return null;
  return unit === "miles" ? miToKm(value) : value;
}

function roundTo(n, decimals = 1) {
  if (n == null || Number.isNaN(n)) return null;
  const f = Math.pow(10, decimals);
  return Math.round(n * f) / f;
}

// ---- formatting ----

function formatDate(iso, opts = {}) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric", ...opts });
}

function formatDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function formatDuration(seconds) {
  seconds = Math.max(0, Math.round(seconds || 0));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function formatMinutes(seconds) {
  return Math.round((seconds || 0) / 60);
}

// ---- exercise math ----

function setVolume(set) {
  if (!set || !set.completed) return 0;
  if (set.unilateral) {
    const l = (set.leftWeightKg || 0) * (set.leftReps || 0);
    const r = (set.rightWeightKg || 0) * (set.rightReps || 0);
    return l + r;
  }
  return (set.weightKg || 0) * (set.reps || 0);
}

function exerciseVolume(exerciseEntry) {
  if (!exerciseEntry || !exerciseEntry.sets) return 0;
  return exerciseEntry.sets.reduce((sum, s) => sum + setVolume(s), 0);
}

function workoutVolume(workout) {
  if (!workout || !workout.exercises) return 0;
  return workout.exercises.reduce((sum, e) => sum + exerciseVolume(e), 0);
}

function countCompletedSets(workout) {
  if (!workout) return { completed: 0, skipped: 0, programmed: 0 };
  let completed = 0, skipped = 0, programmed = 0;
  for (const e of workout.exercises) {
    for (const s of e.sets) {
      programmed++;
      if (s.completed) completed++;
      else if (s.skipped) skipped++;
    }
  }
  return { completed, skipped, programmed };
}

function computeWorkoutStatus(workout) {
  const { completed, programmed } = countCompletedSets(workout);
  if (completed === 0) return "abandoned";
  if (completed === programmed) return "completed";
  return "partial";
}

// ---- streak (consecutive training days with a completed workout) ----
// Uses local calendar days throughout (via dateKey), matching the rest of
// the app's date handling. completedAt/startedAt are stored as UTC ISO
// strings (nowISO()), so slicing the first 10 chars would key workouts by
// their UTC date instead of the day the user actually trained on — for
// anyone east of UTC, or anyone training late at night, that silently
// shifts workouts onto the wrong day and can break a real streak (or
// paper over a broken one).
function computeStreak(workouts) {
  const days = new Set(
    workouts
      .filter((w) => w.status === "completed")
      .map((w) => dateKey(new Date(w.completedAt || w.startedAt)))
  );
  if (days.size === 0) return 0;

  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0, 0, 0, 0);

  // Allow the streak to count "today" only if trained, otherwise start from yesterday.
  const todayKey = dateKey(cursor);
  if (!days.has(todayKey)) {
    cursor.setDate(cursor.getDate() - 1);
  }

  while (true) {
    const key = dateKey(cursor);
    if (days.has(key)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ---- trend analysis for an exercise: improving / stable / declining ----
function computeTrend(exerciseHistory) {
  // exerciseHistory: array of {date, volume} sorted ascending, from completed workouts
  if (!exerciseHistory || exerciseHistory.length < 3) {
    return { trend: "insufficient", label: "Not enough data to determine a trend." };
  }
  const recent = exerciseHistory.slice(-3);
  const earlier = exerciseHistory.slice(-6, -3);
  if (earlier.length === 0) {
    return { trend: "insufficient", label: "Not enough data to determine a trend." };
  }
  const avg = (arr) => arr.reduce((s, x) => s + x.volume, 0) / arr.length;
  const recentAvg = avg(recent);
  const earlierAvg = avg(earlier);
  if (earlierAvg === 0) return { trend: "insufficient", label: "Not enough data to determine a trend." };
  const change = (recentAvg - earlierAvg) / earlierAvg;
  if (change > 0.05) return { trend: "improving", label: "Improving" };
  if (change < -0.05) return { trend: "declining", label: "Declining" };
  return { trend: "stable", label: "Stable" };
}

function debounce(fn, ms) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

// ---- best completed set for an exercise entry: heaviest weight (using the
// heavier side for unilateral work), tie-broken by reps at that weight ----
function bestSetOf(entry) {
  const completed = entry.sets.filter((s) => s.completed);
  if (!completed.length) return null;
  let best = null;
  let maxReps = 0;
  for (const s of completed) {
    let weight, reps;
    if (s.unilateral) {
      const lw = s.leftWeightKg ?? 0, rw = s.rightWeightKg ?? 0;
      if (lw >= rw) { weight = lw; reps = s.leftReps ?? 0; } else { weight = rw; reps = s.rightReps ?? 0; }
      maxReps = Math.max(maxReps, s.leftReps ?? 0, s.rightReps ?? 0);
    } else {
      weight = s.weightKg ?? 0;
      reps = s.reps ?? 0;
      maxReps = Math.max(maxReps, reps);
    }
    if (!best || weight > best.weight || (weight === best.weight && reps > best.reps)) {
      best = { weight, reps };
    }
  }
  if (!best) return null;
  return { ...best, maxReps };
}

// ---- automatic progression detection (item 7): compares this exercise's
// best set against its previous performance. Objective only — heavier
// weight, or more reps at the same weight. ----
function detectProgression(prevEntry, currEntry) {
  const prevBest = prevEntry ? bestSetOf(prevEntry) : null;
  const currBest = currEntry ? bestSetOf(currEntry) : null;
  if (!currBest) return null;
  if (!prevBest) return { type: "first", label: "First recorded performance" };
  if (currBest.weight > prevBest.weight) return { type: "weight", label: `Weight ↑ ${roundTo(currBest.weight)}kg (was ${roundTo(prevBest.weight)}kg)` };
  if (currBest.weight === prevBest.weight && currBest.reps > prevBest.reps) return { type: "reps", label: `Reps ↑ ${currBest.reps} (was ${prevBest.reps})` };
  if (currBest.weight === prevBest.weight && currBest.reps === prevBest.reps) return { type: "none", label: "Matched last time" };
  return { type: "none", label: "No progression this time" };
}

// ---- lightweight PR detection (item 9): given completed/partial workouts
// sorted OLDEST-FIRST, returns whether the given workout's entry for
// exerciseId set a Weight PR and/or Rep PR at the time it was logged.
// Independent, running-max flags — no separate PR database (item 17). ----
function computeEntryPRFlags(workoutsAsc, exerciseId, workoutId) {
  let maxWeight = 0, maxReps = 0;
  let result = { weightPR: false, repsPR: false };
  for (const w of workoutsAsc) {
    const entry = w.exercises.find((e) => e.exerciseId === exerciseId);
    if (!entry) continue;
    const best = bestSetOf(entry);
    if (!best) continue;
    const isWeightPR = best.weight > maxWeight;
    const isRepsPR = best.maxReps > maxReps;
    if (w.id === workoutId) result = { weightPR: isWeightPR, repsPR: isRepsPR };
    maxWeight = Math.max(maxWeight, best.weight);
    maxReps = Math.max(maxReps, best.maxReps);
  }
  return result;
}

function completedWorkoutsAsc(workouts) {
  return workouts
    .filter((w) => w.status === "completed" || w.status === "partial")
    .slice()
    .sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt));
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

// ---- RIR (Reps In Reserve) — 0, 1, or 2 only. There is no "train to
// failure" option: RIR 0 already means no reps left in reserve. ----
const RIR_OPTIONS = [
  { value: "2", label: "2" },
  { value: "1", label: "1" },
  { value: "0", label: "0" },
];

// ---- per-exercise weight unit preference ----
// settings.exerciseUnits is a { [exerciseId]: "kg" | "lb" } map. Exercises
// with no explicit preference fall back to kg. Changing one exercise's unit
// never touches this map's other entries.
function getExerciseUnit(settings, exerciseId) {
  return (settings && settings.exerciseUnits && settings.exerciseUnits[exerciseId]) || "kg";
}
// ============================================================================
// PROGRAM DEFINITION — Stimulus has no built-in starter program. Instead the
// user picks a split (Full Body / Anterior-Posterior / Upper-Lower) and a
// training sequence during first-run setup (see PROGRAM SETUP below), which just
// establishes the *day types* and a default training pattern — no exercises
// are auto-assigned. Exercises are always added by the user via the existing
// Add Exercise / Copy-Paste Program features, exactly as before.
//
// PROGRAM is rebuilt at runtime (rebuildProgram()) from:
//   - PROGRAM_DAY_TYPES: [{key,label}, ...] — stored in programState.dayTypes
//   - custom exercises + per-exercise overrides — stored server-side, per account
// Editing any of this only affects *future* workouts — historical workout
// records store their own snapshot of what was actually performed and are
// never mutated by changes here (see storage.js / db.js).
// ============================================================================

const SCHEMA_VERSION = 1;

// Flexible muscle targeting system --------------------------------------
//
// An exercise is tagged with one or more MUSCLES (e.g. "Back"), and each
// muscle can carry any number of specific TARGET AREAS (e.g. "Lats",
// "Upper Back"). The first entry in an exercise's `muscles` array is its
// primary muscle; any further entries are "additional" muscles it also
// trains. The user decides what an exercise targets — nothing here is
// hard-coded to specific exercises.
const MUSCLE_GROUPS = [
  { key: "chest", label: "Chest" },
  { key: "back", label: "Back" },
  { key: "shoulders", label: "Shoulders" },
  { key: "arms", label: "Arms" },
  { key: "forearms", label: "Forearms" },
  { key: "legs", label: "Legs" },
  { key: "core", label: "Core" },
  { key: "other", label: "Other" },
];
const MUSCLE_BY_KEY = new Map(MUSCLE_GROUPS.map((m) => [m.key, m]));

// Preset target areas offered for each muscle. Purely a menu of suggestions
// — the user can always add their own via "+ Add Target Area", and can
// select any number of these for a given muscle.
const TARGET_AREAS_BY_MUSCLE = {
  chest: [
    { key: "chest_upper", label: "Upper Chest" },
    { key: "chest_mid", label: "Mid Chest" },
    { key: "chest_lower", label: "Lower Chest" },
  ],
  back: [
    { key: "upper_lat", label: "Upper Lat" },
    { key: "lower_lat", label: "Lower Lat" },
    { key: "upper_back", label: "Upper Back" },
    { key: "erectors", label: "Erectors" },
  ],
  shoulders: [
    { key: "front_delts", label: "Front Delts" },
    { key: "lateral_delts", label: "Lateral Delts" },
    { key: "rear_delts", label: "Rear Delts" },
  ],
  arms: [
    { key: "biceps", label: "Biceps" },
    { key: "brachialis", label: "Brachialis" },
    { key: "triceps", label: "Triceps" },
  ],
  forearms: [
    { key: "brachioradialis", label: "Brachioradialis" },
    { key: "flexors", label: "Flexors" },
    { key: "extensors", label: "Extensors" },
  ],
  legs: [
    { key: "quads", label: "Quads" },
    { key: "hamstring", label: "Hamstring" },
    { key: "glutes", label: "Glutes" },
    { key: "calves", label: "Calves" },
  ],
  core: [
    { key: "abs", label: "Abs" },
    { key: "obliques", label: "Obliques" },
  ],
  other: [],
};

// Maps every muscle key from earlier versions of this taxonomy (both the
// original 13-muscle flat list, and the anatomical sub-muscle keys that
// existed under it) onto the current { muscle, area } shape, so existing
// exercises migrate automatically the first time they're read — nothing
// gets dropped or reset to "Other" unnecessarily. A sub-muscle with no
// clean equivalent still maps to its correct muscle, just without a
// pre-picked target area.
const LEGACY_SUBMUSCLE_MIGRATION = {
  // Former standalone primary muscles, now folded into a broader group.
  biceps: { muscle: "arms", area: "biceps" },
  triceps: { muscle: "arms", area: "triceps" },
  quads: { muscle: "legs", area: "quads" },
  hamstrings: { muscle: "legs", area: "hamstring" },
  glutes: { muscle: "legs", area: "glutes" },
  calves: { muscle: "legs", area: "calves" },
  abs: { muscle: "core", area: "abs" },
  traps: { muscle: "back", area: "upper_back" },
  // Older anatomical sub-muscle keys.
  lats: { muscle: "back", area: null },
  rhomboids: { muscle: "back", area: "upper_back" },
  erectors: { muscle: "back", area: "erectors" },
  teres_major: { muscle: "back", area: "upper_back" },
  teres_minor: { muscle: "back", area: "upper_back" },
  infraspinatus: { muscle: "back", area: "upper_back" },
  brachialis: { muscle: "arms", area: "brachialis" },
  brachioradialis: { muscle: "forearms", area: "brachioradialis" },
  adductors: { muscle: "legs", area: "glutes" },
  abductors: { muscle: "legs", area: "glutes" },
  obliques: { muscle: "core", area: "obliques" },
  hip_flexors: { muscle: "legs", area: "quads" },
  chest_upper: { muscle: "chest", area: "chest_upper" },
  chest_lower: { muscle: "chest", area: "chest_lower" },
  triceps_long: { muscle: "arms", area: "triceps" },
  triceps_lateral: { muscle: "arms", area: "triceps" },
  triceps_medial: { muscle: "arms", area: "triceps" },
  biceps_long: { muscle: "arms", area: "biceps" },
  biceps_short: { muscle: "arms", area: "biceps" },
  delts_front: { muscle: "shoulders", area: "front_delts" },
  delts_side: { muscle: "shoulders", area: "lateral_delts" },
  delts_rear: { muscle: "shoulders", area: "rear_delts" },
  quads_rectus_femoris: { muscle: "legs", area: "quads" },
  quads_vastus_lateralis: { muscle: "legs", area: "quads" },
  quads_vastus_medialis: { muscle: "legs", area: "quads" },
  hamstrings_biceps_femoris: { muscle: "legs", area: "hamstring" },
  hamstrings_medial: { muscle: "legs", area: "hamstring" },
  glutes_max: { muscle: "legs", area: "glutes" },
  glutes_med: { muscle: "legs", area: "glutes" },
  calves_gastroc: { muscle: "legs", area: "calves" },
  calves_soleus: { muscle: "legs", area: "calves" },
  abs_upper: { muscle: "core", area: "abs" },
  abs_lower: { muscle: "core", area: "abs" },
  traps_upper: { muscle: "back", area: "upper_back" },
  traps_mid_lower: { muscle: "back", area: "upper_back" },
  forearms_flexors: { muscle: "forearms", area: "flexors" },
  forearms_extensors: { muscle: "forearms", area: "extensors" },
};

function legacyKeyToMuscleArea(key) {
  if (!key) return { muscle: "other", area: null };
  if (MUSCLE_BY_KEY.has(key)) return { muscle: key, area: null };
  if (LEGACY_SUBMUSCLE_MIGRATION[key]) return LEGACY_SUBMUSCLE_MIGRATION[key];
  return { muscle: "other", area: null };
}

function muscleLabel(key) {
  return MUSCLE_BY_KEY.get(key)?.label || "Other";
}

function targetAreaOptions(muscleKey) {
  return TARGET_AREAS_BY_MUSCLE[muscleKey] || [];
}

function areaPresetLabel(muscleKey, areaKey) {
  const found = targetAreaOptions(muscleKey).find((a) => a.key === areaKey);
  return found ? found.label : null;
}

// Migrates one `muscles` array entry whose `.muscle` is a key from a
// previous version of MUSCLE_GROUPS (e.g. "biceps" back when it was its
// own primary muscle) onto the current taxonomy. If the entry already has
// specific target areas tagged, those are kept as-is (their labels still
// display correctly even if the key no longer matches a current preset).
// If it has no areas at all, a fallback area representing the old primary
// muscle's identity is added so that specificity isn't silently lost.
function migrateLegacyMuscleEntry(m) {
  if (MUSCLE_BY_KEY.has(m.muscle)) return m;
  const mapped = LEGACY_SUBMUSCLE_MIGRATION[m.muscle];
  if (!mapped) return { muscle: "other", areas: m.areas || [] };
  const hasAreas = Array.isArray(m.areas) && m.areas.length > 0;
  if (hasAreas) return { muscle: mapped.muscle, areas: m.areas };
  const areas = mapped.area ? [{ key: mapped.area, label: areaPresetLabel(mapped.muscle, mapped.area) || mapped.area, custom: false }] : [];
  return { muscle: mapped.muscle, areas };
}

// Cleans up a `muscles` array (from storage, or from the muscle editor) into
// a well-formed shape: every entry has a valid muscle key and an array of
// { key, label, custom } target areas. Always returns at least one entry.
function sanitizeMuscleEntries(list) {
  const cleaned = (Array.isArray(list) ? list : [])
    .filter((m) => m && m.muscle)
    .map((m) => migrateLegacyMuscleEntry(m))
    .map((m) => ({
      muscle: MUSCLE_BY_KEY.has(m.muscle) ? m.muscle : "other",
      areas: Array.isArray(m.areas)
        ? m.areas
            .filter((a) => a && a.key)
            .map((a) => ({ key: a.key, label: a.label || areaPresetLabel(m.muscle, a.key) || a.key, custom: !!a.custom }))
        : [],
    }));
  return cleaned.length ? cleaned : [{ muscle: "other", areas: [] }];
}

// Normalizes any exercise-like object into the current `muscles` array
// shape, migrating the old `muscleGroup` / `secondaryMuscle` fields the
// first time an exercise tagged under the old system is read. Nothing is
// deleted: a primary + secondary pairing becomes a primary + additional
// muscle pairing, preserving the same relative volume weighting.
function normalizeExerciseMuscles(c) {
  if (Array.isArray(c.muscles) && c.muscles.length) return sanitizeMuscleEntries(c.muscles);
  const entries = [];
  const pushLegacy = (key) => {
    const resolved = legacyKeyToMuscleArea(key);
    const areas = resolved.area ? [{ key: resolved.area, label: areaPresetLabel(resolved.muscle, resolved.area) || resolved.area, custom: false }] : [];
    entries.push({ muscle: resolved.muscle, areas });
  };
  pushLegacy(c.muscleGroup || "other");
  if (c.secondaryMuscle) pushLegacy(c.secondaryMuscle);
  return entries.length ? entries : [{ muscle: "other", areas: [] }];
}

let PROGRAM = {};
let PROGRAM_DAY_TYPES = []; // [{key,label}, ...] — set from programState at boot

function setProgramDayTypes(dayTypes) {
  PROGRAM_DAY_TYPES = dayTypes || [];
}

// Rebuilds PROGRAM as { [dayTypeKey]: {key,label,exercises:[...]} } from the
// current day types plus whatever custom exercises/overrides/order are in
// storage. Called at boot and again right after adding/editing/removing an
// exercise, changing the split, or editing day types.
function rebuildProgram(customList, overrides, order) {
  const list = customList || [];
  const ov = overrides || {};
  const ord = order || {};
  const next = {};
  for (const dt of PROGRAM_DAY_TYPES) {
    const custom = list
      .filter((c) => c.type === dt.key)
      .map((c) => ({ id: c.id, name: c.name, sets: c.sets, unilateral: !!c.unilateral, muscles: normalizeExerciseMuscles(c), custom: true }));
    const withOverrides = custom
      .filter((e) => !ov[e.id]?.removed)
      .map((e) => {
        const o = ov[e.id];
        if (!o) return e;
        return {
          ...e,
          ...(typeof o.sets === "number" ? { sets: o.sets } : {}),
          ...(typeof o.unilateral === "boolean" ? { unilateral: o.unilateral } : {}),
          ...(Array.isArray(o.muscles) ? { muscles: sanitizeMuscleEntries(o.muscles) } : {}),
        };
      });

    const orderIds = ord[dt.key] || [];
    if (orderIds.length) {
      const pos = new Map(orderIds.map((id, i) => [id, i]));
      withOverrides.sort((a, b) => {
        const pa = pos.has(a.id) ? pos.get(a.id) : Infinity;
        const pb = pos.has(b.id) ? pos.get(b.id) : Infinity;
        if (pa === pb) return 0;
        return pa - pb;
      });
    }

    next[dt.key] = { key: dt.key, label: dt.label, exercises: withOverrides };
  }
  PROGRAM = next;
}

// Backward-compatible name used throughout the app at every call site that
// previously rebuilt the built-in-plus-custom program.
const applyCustomExercises = rebuildProgram;

function programTotalSets(type) {
  return PROGRAM[type] ? PROGRAM[type].exercises.reduce((sum, e) => sum + e.sets, 0) : 0;
}

// Unilateral exercise volume rule: a unilateral exercise's programmed set
// count (e.g. "2 sets") counts as 2 sets of volume, same as a bilateral
// exercise — one side or both sides, a "set" is a set. The per-exercise
// programmed set count (shown elsewhere, and what the user edits) never
// changes either way. Applies uniformly across every workout day type
// (Upper, Lower, Full Body, or any custom split) since it operates on
// PROGRAM[type] generically.
const UNILATERAL_VOLUME_MULTIPLIER = 1;

function exerciseVolumeSets(e) {
  if (!e) return 0;
  return e.sets * (e.unilateral ? UNILATERAL_VOLUME_MULTIPLIER : 1);
}

// Total training volume for a workout day type, in "volume sets": every
// exercise, bilateral or unilateral, counts its programmed sets once. This
// is the figure used for total workout volume — never the per-exercise
// programmed set count itself, which stays as-is.
function programVolumeSets(type) {
  return PROGRAM[type] ? PROGRAM[type].exercises.reduce((sum, e) => sum + exerciseVolumeSets(e), 0) : 0;
}

// Weight applied to an exercise's additional (non-primary) muscles, relative
// to its primary muscle (which always counts as 1.0×). Reflects that an
// additional mover is worked, but less directly than the primary target, so
// it doesn't add a full extra set of volume for that muscle.
const SECONDARY_MUSCLE_VOLUME_WEIGHT = 0.5;

// A normalized `muscles` array for any exercise-like object, always at
// least one entry. Falls back gracefully for anything unexpected.
function exerciseMuscles(e) {
  return Array.isArray(e && e.muscles) && e.muscles.length ? e.muscles : [{ muscle: "other", areas: [] }];
}

// Per-muscle volume for a workout day type: { muscleKey: volumeSets }. Uses
// the same set-counting rule as programVolumeSets (unilateral sets count
// the same as bilateral sets). A muscle entry's
// volume is weighted by its position (1.0× primary, 0.5× each additional
// muscle) — an exercise tagged with just a muscle (no specific target area)
// still counts fully toward that muscle. Target areas are still tracked per
// exercise (for tagging precision) but aren't broken out here — this is
// muscle-group volume only, on purpose, to keep the summary readable.
function programMuscleVolume(type) {
  const totals = {};
  if (!PROGRAM[type]) return totals;
  for (const e of PROGRAM[type].exercises) {
    const vol = exerciseVolumeSets(e);
    exerciseMuscles(e).forEach((m, idx) => {
      const weight = idx === 0 ? 1 : SECONDARY_MUSCLE_VOLUME_WEIGHT;
      totals[m.muscle] = (totals[m.muscle] || 0) + vol * weight;
    });
  }
  return totals;
}

// Same breakdown, aggregated across every day type in the current program —
// e.g. "how much volume does chest get across my whole split".
function programMuscleVolumeAll() {
  const totals = {};
  for (const dt of PROGRAM_DAY_TYPES) {
    const day = programMuscleVolume(dt.key);
    for (const [key, val] of Object.entries(day)) {
      totals[key] = (totals[key] || 0) + val;
    }
  }
  return totals;
}

// Renders a simple, flat muscle-volume breakdown — one line per muscle
// group with volume, no expandable target-area detail. Volume tracking is
// intentionally kept to this single level so the summary stays readable.
function muscleVolumeBreakdownHtml(totals) {
  const lines = MUSCLE_GROUPS
    .map((main) => ({ label: main.label, total: totals[main.key] }))
    .filter((x) => x.total > 0);
  if (!lines.length) return "";
  return `<div style="margin-top:4px; font-size:13px;">${lines.map((x) => `<div style="padding:3px 0;">${escapeHtml(x.label)} — ${roundTo(x.total)}</div>`).join("")}</div>`;
}

// A compact one-line summary of what an exercise targets, e.g.
// "Back (Lats, Upper Back) + Rear Delts" — used wherever an exercise is
// listed (program overview, exercise list, exercise detail).
function muscleSummaryText(e) {
  return exerciseMuscles(e)
    .map((m) => {
      const label = muscleLabel(m.muscle);
      const areas = (m.areas || []).map((a) => a.label);
      return areas.length ? `${label} (${areas.join(", ")})` : label;
    })
    .join(" + ");
}

// A short label for the compact "Muscles" button shown on each program
// exercise row and the Add Exercise form.
function muscleChipText(e) {
  const muscles = exerciseMuscles(e);
  const primary = muscles[0];
  const primaryLabel = muscleLabel(primary.muscle);
  const areas = primary.areas || [];
  let text = primaryLabel;
  if (areas.length === 1) text += ` · ${areas[0].label}`;
  else if (areas.length > 1) text += ` · ${areas[0].label} +${areas.length - 1}`;
  if (muscles.length > 1) text += ` · +${muscles.length - 1} more`;
  return text;
}

function allExerciseDefs() {
  return PROGRAM_DAY_TYPES.flatMap((dt) => (PROGRAM[dt.key] ? PROGRAM[dt.key].exercises : []));
}

function findExerciseDef(id) {
  return allExerciseDefs().find((e) => e.id === id) || null;
}

// ============================================================================
// PROGRAM TYPE DEFINITIONS — the three program types a user can choose from
// (Full Body / Anterior-Posterior / Upper-Lower). Each just lists its day
// types and a sensible default training sequence to start the sequence
// builder from — the user can freely edit that sequence during setup and
// any time after via the Schedule tab. Nothing here is a complete exercise
// program — the user still builds that via Add Exercise / Copy-Paste Program.
// ============================================================================

const SPLIT_DEFS = {
  fullbody: {
    label: "Full Body",
    dayTypes: [{ key: "FB", label: "Full Body" }],
    defaultPattern: ["FB", "R", "FB", "R", "FB", "R", "R"],
  },
  ap: {
    label: "Anterior / Posterior",
    dayTypes: [{ key: "A", label: "Anterior" }, { key: "P", label: "Posterior" }],
    defaultPattern: ["A", "P", "R", "A", "P", "R", "R"],
  },
  ul: {
    label: "Upper / Lower",
    dayTypes: [{ key: "U", label: "Upper" }, { key: "L", label: "Lower" }],
    defaultPattern: ["U", "L", "R", "U", "L", "R", "R"],
  },
};

// Builds the compact letter code (e.g. "ULUR") and its full spelled-out
// meaning (e.g. "Upper → Lower → Upper → Rest") for a training sequence.
function sequenceSummary(seq, labelsMap) {
  return {
    code: seq.join(""),
    meaning: seq.map((k) => labelsMap[k] || k).join(" → "),
  };
}

function dayTypeLabels() {
  const map = { R: "Rest" };
  for (const dt of PROGRAM_DAY_TYPES) map[dt.key] = dt.label;
  return map;
}

// Assigns a stable color to each day-type key so the same type always
// looks the same across the Next-7-Days strip and the month calendar.
// "R" (Rest) always gets the dim/neutral treatment; everything else
// cycles through a small accent palette by position in PROGRAM_DAY_TYPES.
const DAY_TYPE_COLOR_VARS = ["--c-positive", "--c-crimson-bright", "--c-gold", "--c-warn"];
function dayTypeColorVar(key) {
  if (!key || key === "R") return "--c-off-faint";
  const idx = PROGRAM_DAY_TYPES.findIndex((dt) => dt.key === key);
  if (idx < 0) return "--c-off-faint";
  return DAY_TYPE_COLOR_VARS[idx % DAY_TYPE_COLOR_VARS.length];
}

// Which day type (or "R" for rest) the training pattern schedules for a
// given date, cycling the pattern from settings.scheduleStartDate. Returns
// null if there's no pattern yet (setup not complete, or a freshly-created
// Modified split with no days added).
function cycleLetterForDate(dateObj, startDateStr, pattern) {
  if (!pattern || !pattern.length) return null;
  const [sy, sm, sd] = (startDateStr || DEFAULT_SETTINGS.scheduleStartDate).split("-").map(Number);
  const s = new Date(sy, sm - 1, sd);
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const diffDays = Math.round((d - s) / 86400000);
  const idx = ((diffDays % pattern.length) + pattern.length) % pattern.length;
  return pattern[idx];
}

// A YYYY-MM-DD key for a date, in local time (not UTC) — used to key
// per-date schedule overrides so "today" means the user's actual today.
function dateKey(dateObj) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, "0");
  const d = String(dateObj.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// Adds (or subtracts, with a negative delta) whole days to a "YYYY-MM-DD"
// string, returning a new "YYYY-MM-DD" string. Used by the Schedule tab's
// "shift everything forward/back a day" quick actions.
function addDaysToDateStr(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return dateKey(dt);
}

// Like cycleLetterForDate, but lets a per-date override (set from the
// What the training pattern schedules for today, given today's date —
// returns a day-type key, "R" for a rest day, or null if no pattern is set
// yet. Used to drive the dashboard/workout-home "Suggested" badge.
// overrides is optional; pass storage.getScheduleOverrides() result when
// available so a manual swap for today is respected.
function todaysScheduledType(history, overrides) {
  return effectiveDayTypeForDateV(new Date(), history, overrides || {});
}

// ============================================================================
// PROGRAM VERSION HISTORY — the training sequence itself can change over
// time (new split, new frequency, entirely different program), and a change
// must never rewrite what earlier dates — or already-logged workouts —
// were scheduled as. programHistory is an append-only list of
// { id, pattern, effectiveFrom, createdAt }; a date resolves to whichever
// entry's effectiveFrom is the most recent one on or before it, cycling
// from THAT entry's own effectiveFrom (so a new pattern always starts at
// day 0 on the date it takes effect, however far in the future that is).
// ============================================================================

function resolvePatternVersion(dateStr, history) {
  if (!history || !history.length) return null;
  const sorted = [...history].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
  let match = sorted[0];
  for (const v of sorted) {
    if (v.effectiveFrom <= dateStr) match = v;
    else break;
  }
  return match;
}

// The pure sequence letter for a date — no manual overrides applied. Used
// wherever the UI needs to show "what the sequence itself says" (e.g. to
// detect and label a manual override as "(swapped)").
function patternLetterForDateV(dateObj, history) {
  const version = resolvePatternVersion(dateKey(dateObj), history);
  if (!version) return null;
  return cycleLetterForDate(dateObj, version.effectiveFrom, version.pattern);
}

// The version-aware replacement for effectiveDayTypeForDate — resolves the
// right program version for the date first, then applies any one-date
// manual override on top (an override always wins, regardless of version).
function effectiveDayTypeForDateV(dateObj, history, overrides) {
  const key = dateKey(dateObj);
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, key)) return overrides[key];
  return patternLetterForDateV(dateObj, history);
}

// The next date on which the current rotation would naturally restart at
// position 0 — the natural seam to slot a new pattern into without cutting
// the current rotation short. Powers the "Finish Current Rotation" choice
// when changing the training sequence.
function nextRotationBoundary(dateStr, effectiveFromAnchor, patternLength) {
  if (!patternLength) return dateStr;
  const [y, m, d] = dateStr.split("-").map(Number);
  const dateObj = new Date(y, m - 1, d);
  const [ay, am, ad] = effectiveFromAnchor.split("-").map(Number);
  const anchorObj = new Date(ay, am - 1, ad);
  const diffDays = Math.round((dateObj - anchorObj) / 86400000);
  const position = ((diffDays % patternLength) + patternLength) % patternLength;
  const daysUntilBoundary = position === 0 ? patternLength : (patternLength - position);
  return addDaysToDateStr(dateStr, daysUntilBoundary);
}

// Parses a "YYYY-MM-DD" string into a short local-date label without ever
// going through UTC parsing (new Date("2026-09-08") can render as Sept 7 in
// timezones behind UTC) — mirrors the local-time convention dateKey() uses.
function formatDateStrShort(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// ============================================================================
// PERSONAL SCHEDULE — pure logic, layered on top of (never replacing) the
// Training Schedule above. A Routine is a reusable named day template (time
// blocks with a purpose + priority) — e.g. "Weekday Routine", "Exam Week".
// Every date resolves to a routine via, in order of precedence:
//   1. a one-date override (set from Day View — swaps just that date)
//   2. an active Routine Period (a temporary date-range assignment)
//   3. the weekly day-of-week default
// Personal Events (recurring or one-time) layer on top of whichever routine
// is resolved. Every override/period/event is its own independent record,
// so changing one date's routine never touches any other date, and deleting
// an event never touches a routine or vice versa.
// ============================================================================

const PRIORITY_LEVELS = [
  { key: "hard", label: "Hard Restriction", colorVar: "--c-crimson-bright" },
  { key: "high", label: "High Priority", colorVar: "--c-warn" },
  { key: "normal", label: "Normal", colorVar: "--c-off-dim" },
  { key: "preference", label: "Preference", colorVar: "--c-gold" },
  { key: "flexible", label: "Flexible", colorVar: "--c-positive" },
];
function priorityLabel(key) { return (PRIORITY_LEVELS.find((p) => p.key === key) || {}).label || key || "Normal"; }
function priorityColorVar(key) { return (PRIORITY_LEVELS.find((p) => p.key === key) || {}).colorVar || "--c-off-faint"; }

const ACTIVITY_TYPE_SUGGESTIONS = [
  "School", "Work", "Class", "Exam", "Appointment", "Travel", "Family",
  "Study", "Project", "Hobby", "Recovery", "Training Focus", "Free Time", "Custom",
];

// 0 = Sunday .. 6 = Saturday, matching Date#getDay(). Parses in local time.
function dowOfDateStr(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).getDay();
}

// Finds the routine period (if any) covering a date. If more than one
// overlaps, the most recently created (last in the array) wins — periods
// are meant to be short, deliberate exceptions, so a newer one reflects the
// user's latest intent without deleting the older record.
function routinePeriodForDate(dateStr, periods) {
  let match = null;
  for (const p of periods || []) {
    if (dateStr >= p.startDate && dateStr <= p.endDate) match = p;
  }
  return match;
}

// Which routine id governs a given date, in precedence order: per-date
// override > active routine period > weekly day-of-week default.
function resolveRoutineIdForDate(dateStr, { weeklyRoutineMap, routinePeriods, dateOverrides }) {
  const override = (dateOverrides || {})[dateStr];
  if (override && override.routineId !== undefined && override.routineId !== null) return override.routineId;
  const period = routinePeriodForDate(dateStr, routinePeriods);
  if (period) return period.routineId;
  const dow = dowOfDateStr(dateStr);
  const map = weeklyRoutineMap || {};
  const v = map[dow] !== undefined ? map[dow] : map[String(dow)];
  return v ?? null;
}

// Expands recurring + one-time personal events to the ones occurring on a
// given date. A recurring event's date range is independent of any routine,
// so it never disappears just because the routine for that day changed.
function eventsOccurringOnDate(dateStr, events) {
  const dow = dowOfDateStr(dateStr);
  return (events || []).filter((e) => {
    if (e.recurrence) {
      const r = e.recurrence;
      if (!r.daysOfWeek || !r.daysOfWeek.includes(dow)) return false;
      if (r.startDate && dateStr < r.startDate) return false;
      if (r.endDate && dateStr > r.endDate) return false;
      return true;
    }
    return e.date === dateStr;
  });
}

// Merges a routine's time blocks with the day's events into one
// chronologically-sorted timeline for display. All-day items float to top.
function mergeDayTimeline(routineBlocks, dayEvents) {
  const items = [
    ...(routineBlocks || []).map((b) => ({ ...b, source: "routine" })),
    ...(dayEvents || []).map((e) => ({
      id: e.id, start: e.start, end: e.end, label: e.title,
      activityType: e.activityType, priority: e.priority,
      allDay: e.allDay, source: "event",
    })),
  ];
  items.sort((a, b) => {
    if (a.allDay && !b.allDay) return -1;
    if (b.allDay && !a.allDay) return 1;
    return (a.start || "").localeCompare(b.start || "");
  });
  return items;
}

// The full picture for one date: which routine governs it (and why),
// whether the user has forced the day free/unavailable, any focus they've
// assigned, the events on it, and the merged timeline. Both the Personal
// tab's Day View and the merged calendar read from this single function.
function getPersonalDayPlan(dateStr, data) {
  const { routines, weeklyRoutineMap, routinePeriods, dateOverrides, events } = data;
  const override = (dateOverrides || {})[dateStr] || null;
  const period = routinePeriodForDate(dateStr, routinePeriods);
  let routineSource = "weekly";
  if (override && override.routineId !== undefined && override.routineId !== null) routineSource = "override";
  else if (period) routineSource = "period";
  const routineId = resolveRoutineIdForDate(dateStr, { weeklyRoutineMap, routinePeriods, dateOverrides });
  const routine = (routines || []).find((r) => r.id === routineId) || null;
  const dayEvents = eventsOccurringOnDate(dateStr, events);
  const timeline = mergeDayTimeline(routine ? routine.blocks : [], dayEvents);
  const availabilityOverride = override && override.availability ? override.availability : null;
  const focus = override && override.focus ? override.focus : null;
  const hasHardBlock = timeline.some((b) => b.priority === "hard");
  return {
    date: dateStr, routine, routineSource, routinePeriod: period,
    availabilityOverride, focus, events: dayEvents, timeline,
    hasHardBlock, isDateOverridden: !!override,
  };
}

// Day-level status headline (Free / Limited / Busy / Unavailable / Open) —
// the fine-grained detail lives in the timeline; this just drives badges.
function personalDayStatus(plan) {
  if (plan.availabilityOverride === "unavailable") return "Unavailable";
  if (plan.availabilityOverride === "free") return "Free";
  if (plan.hasHardBlock) return "Busy";
  if (plan.timeline.length) return "Limited";
  return "Open";
}

// Phase-1/2 conflict detection: does a scheduled training day land on a
// date the user has explicitly marked unavailable ("blocked"), or one
// that's merely busy with a hard-priority block but not fully blocked
// ("busy")? Nothing is moved automatically — this only classifies the day
// so Day View can show the right message and offer the right actions.
function trainingDayAdvisory(trainingLetter, plan) {
  if (!trainingLetter || trainingLetter === "R") return { level: "none", message: null, hardBlocks: [] };
  // An explicit "I'm free" declaration is the user overriding whatever the
  // routine implies — it wins over a routine's hard blocks, the same way
  // any date override wins over its routine in getPersonalDayPlan.
  if (plan.availabilityOverride === "free") return { level: "none", message: null, hardBlocks: [] };
  const hardBlocks = plan.timeline.filter((b) => b.priority === "hard");
  if (plan.availabilityOverride === "unavailable") {
    return { level: "blocked", message: "This is scheduled as a training day, but you've marked this date unavailable.", hardBlocks };
  }
  if (hardBlocks.length) {
    return {
      level: "busy",
      message: `This date is busy (${hardBlocks.map((b) => b.label || b.activityType).join(", ")}) — there may still be time to train around it.`,
      hardBlocks,
    };
  }
  return { level: "none", message: null, hardBlocks: [] };
}

// Kept for the Dashboard hero, which only wants to know about a hard block
// (fully unavailable) — a merely-busy day isn't worth interrupting "today's
// session" for.
function trainingConflictForDate(trainingLetter, plan) {
  const advisory = trainingDayAdvisory(trainingLetter, plan);
  return advisory.level === "blocked" ? advisory.message : null;
}

// Plain-language reasons a date's training slot is what it is — purely
// explanatory, changes nothing. Powers "Why is this scheduled here?".
function explainTrainingDay({ trainingLetter, isPatternOverride, plan, advisory }) {
  const reasons = [];
  if (!trainingLetter) { reasons.push("No training pattern is set yet."); return reasons; }
  if (trainingLetter === "R") {
    reasons.push(isPatternOverride ? "This date was manually swapped to a Rest day." : "Rest falls here in your training sequence.");
  } else {
    reasons.push(isPatternOverride ? "This date was manually swapped to this workout." : "This is what your training sequence schedules for this date.");
  }
  if (plan.routine) {
    reasons.push(`Your "${plan.routine.name}" routine applies to this date${plan.routineSource === "override" ? " (swapped for just this day)" : plan.routineSource === "period" ? " (from a temporary routine period)" : ""}.`);
  } else {
    reasons.push("No personal routine is assigned to this date.");
  }
  if (advisory.level === "blocked") reasons.push("You've marked this date unavailable, which conflicts with the scheduled workout.");
  else if (advisory.level === "busy") reasons.push(`This date is busy (${advisory.hardBlocks.map((b) => b.label || b.activityType).join(", ")}), but there's no full-day restriction.`);
  else if (trainingLetter !== "R") reasons.push("No personal-schedule conflicts were found for this date.");
  return reasons;
}

// Scans forward for training days worth reviewing — a date explicitly
// marked unavailable, or one covered by a temporary Routine Period (Exam
// Week, Vacation, etc.) that leaves it busy or unavailable. Deliberately
// does NOT flag ordinary hard blocks from the everyday weekly routine (e.g.
// school every weekday) — the training pattern was already built around
// that normal week, so flagging every school day would just be noise.
// Only genuine anomalies (one-date overrides, temporary periods) surface.
function findUpcomingTrainingConflicts(startDateStr, numDays, ctx) {
  const { history, scheduleOverrides, routines, weeklyRoutineMap, routinePeriods, dateOverrides, events } = ctx;
  const results = [];
  for (let i = 0; i < numDays; i++) {
    const dateStr = addDaysToDateStr(startDateStr, i);
    const [y, m, d] = dateStr.split("-").map(Number);
    const dateObj = new Date(y, m - 1, d);
    const trainingLetter = effectiveDayTypeForDateV(dateObj, history, scheduleOverrides);
    if (!trainingLetter || trainingLetter === "R") continue;
    const plan = getPersonalDayPlan(dateStr, { routines, weeklyRoutineMap, routinePeriods, dateOverrides, events });
    const isAnomalous = plan.availabilityOverride === "unavailable" || (plan.routineSource === "period" && (plan.hasHardBlock || plan.availabilityOverride === "unavailable"));
    if (!isAnomalous) continue;
    const advisory = trainingDayAdvisory(trainingLetter, plan);
    results.push({ date: dateStr, trainingLetter, advisory, routineName: plan.routine ? plan.routine.name : null, routineSource: plan.routineSource });
  }
  return results;
}

// Pure preview for "Move Workout" — what would change on both dates if the
// user moves a scheduled workout from sourceDate to targetDate. Nothing is
// written; the caller shows this and only applies it on explicit confirm.
function previewMoveWorkout(sourceDate, targetDate, { history, scheduleOverrides }) {
  const dateObjOf = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const sourceLetter = effectiveDayTypeForDateV(dateObjOf(sourceDate), history, scheduleOverrides);
  const targetBefore = effectiveDayTypeForDateV(dateObjOf(targetDate), history, scheduleOverrides);
  return {
    sourceDate, sourceBefore: sourceLetter, sourceAfter: "R",
    targetDate, targetBefore, targetAfter: sourceLetter,
    overwritesExistingWorkout: !!targetBefore && targetBefore !== "R" && targetDate !== sourceDate,
    invalid: sourceDate === targetDate || !sourceLetter || sourceLetter === "R",
  };
}

// ============================================================================
// WHAT-IF SIMULATION — lets the user test a hypothetical change ("what if
// I mark tomorrow unavailable?") and see its effect before committing to
// anything. applyWhatIfScenario builds an in-memory overlay of the relevant
// data; nothing here ever touches storage. The caller (renderWhatIf) only
// writes for real when the user explicitly applies the result.
// ============================================================================

function applyWhatIfScenario(scenario, base) {
  const dateOverrides = { ...base.dateOverrides };
  const personalEvents = base.personalEvents.slice();
  const scheduleOverrides = { ...base.scheduleOverrides };
  switch (scenario.type) {
    case "mark-unavailable":
      dateOverrides[scenario.date] = { ...(dateOverrides[scenario.date] || {}), availability: "unavailable" };
      break;
    case "mark-free":
      dateOverrides[scenario.date] = { ...(dateOverrides[scenario.date] || {}), availability: "free" };
      break;
    case "swap-routine":
      dateOverrides[scenario.date] = { ...(dateOverrides[scenario.date] || {}), routineId: scenario.routineId };
      break;
    case "skip-workout":
      scheduleOverrides[scenario.date] = "R";
      break;
    case "add-event":
      personalEvents.push({ id: "whatif-temp", ...scenario.event, date: scenario.date, recurrence: null });
      break;
  }
  return { dateOverrides, personalEvents, scheduleOverrides };
}

function computeDaySnapshot(dateStr, data, ctx) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dateObj = new Date(y, m - 1, d);
  const trainingLetter = effectiveDayTypeForDateV(dateObj, ctx.history, data.scheduleOverrides);
  const plan = getPersonalDayPlan(dateStr, { routines: data.routines, weeklyRoutineMap: data.weeklyRoutineMap, routinePeriods: data.routinePeriods, dateOverrides: data.dateOverrides, events: data.personalEvents });
  const advisory = trainingDayAdvisory(trainingLetter, plan);
  return { trainingLetter, plan, advisory, status: personalDayStatus(plan) };
}

// Runs a scenario and returns before/after snapshots for its date, plus any
// upcoming (30-day) conflicts the change would newly create or resolve.
function runWhatIfSimulation(scenario, baseData, ctx) {
  const before = computeDaySnapshot(scenario.date, baseData, ctx);
  const overlay = applyWhatIfScenario(scenario, baseData);
  const afterData = { ...baseData, ...overlay };
  const after = computeDaySnapshot(scenario.date, afterData, ctx);
  const commonConflictCtx = { history: ctx.history, routines: baseData.routines, weeklyRoutineMap: baseData.weeklyRoutineMap, routinePeriods: baseData.routinePeriods };
  const beforeConflicts = findUpcomingTrainingConflicts(scenario.date, 30, { ...commonConflictCtx, scheduleOverrides: baseData.scheduleOverrides, dateOverrides: baseData.dateOverrides, events: baseData.personalEvents });
  const afterConflicts = findUpcomingTrainingConflicts(scenario.date, 30, { ...commonConflictCtx, scheduleOverrides: overlay.scheduleOverrides, dateOverrides: overlay.dateOverrides, events: overlay.personalEvents });
  const beforeDates = new Set(beforeConflicts.map((c) => c.date));
  const afterDates = new Set(afterConflicts.map((c) => c.date));
  return {
    before, after,
    newConflicts: afterConflicts.filter((c) => !beforeDates.has(c.date)),
    resolvedConflicts: beforeConflicts.filter((c) => !afterDates.has(c.date)),
  };
}

// ============================================================================
// SCHEDULE IMPORT — a beginner-friendly, heuristic parser that turns
// plain-English lines into draft Personal Events. It never guesses its way
// into Routines or Routine Periods (too much to infer reliably); a detected
// date RANGE always collapses to a single low-confidence one-time entry on
// the start date, flagged for the user to edit or split up themselves.
// Nothing is saved until the user reviews the "Here's what we understood"
// list and explicitly confirms — low-confidence items start unchecked.
// ============================================================================

const WEEKDAY_ALIASES = {
  sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, weds: 3, wednesday: 3,
  thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6,
};
const MONTH_ALIASES = {
  jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3, may: 4,
  jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7, sep: 8, sept: 8, september: 8,
  oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11,
};

function detectWeekdays(line) {
  const lower = line.toLowerCase();
  if (/\bevery ?day\b|\bdaily\b/.test(lower)) return [0, 1, 2, 3, 4, 5, 6];
  if (/\bweekdays?\b/.test(lower)) return [1, 2, 3, 4, 5];
  if (/\bweekends?\b/.test(lower)) return [0, 6];
  const found = new Set();
  const tokens = lower.match(/[a-z]+/g) || [];
  for (const t of tokens) {
    const stripped = t.endsWith("s") ? t.slice(0, -1) : t;
    if (WEEKDAY_ALIASES[t] !== undefined) found.add(WEEKDAY_ALIASES[t]);
    else if (WEEKDAY_ALIASES[stripped] !== undefined) found.add(WEEKDAY_ALIASES[stripped]);
  }
  return [...found].sort();
}

function detectTimeRange(line) {
  const re = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i;
  const match = line.match(re);
  if (!match) return null;
  const h1 = match[1], min1 = match[2], ap1raw = match[3], h2 = match[4], min2 = match[5], ap2raw = match[6];
  // If only one side has am/pm, infer the other from it (e.g. "6-7pm").
  let ap1 = ap1raw, ap2 = ap2raw;
  if (!ap1 && ap2) ap1 = ap2;
  if (!ap2 && ap1) ap2 = ap1;
  const fmt = (h, min, ap) => {
    const hour = Number(h);
    const suffix = ap ? ap.toLowerCase() : (hour < 8 ? "pm" : "am"); // rough guess when totally absent
    return `${hour}${min ? ":" + min : ":00"} ${suffix.toUpperCase()}`;
  };
  return { start: fmt(h1, min1, ap1), end: fmt(h2, min2, ap2), hasAmPm: !!(ap1raw || ap2raw) };
}

function detectDate(line, referenceYear) {
  const monthRe = /\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s*(?:-|–|to)\s*(\d{1,2})(?:st|nd|rd|th)?)?\b/i;
  const m = line.match(monthRe);
  if (m) {
    const month = MONTH_ALIASES[m[1].toLowerCase()];
    const startDay = Number(m[2]);
    const endDay = m[3] ? Number(m[3]) : null;
    const pad = (n) => String(n).padStart(2, "0");
    const startDate = `${referenceYear}-${pad(month + 1)}-${pad(startDay)}`;
    const endDate = endDay ? `${referenceYear}-${pad(month + 1)}-${pad(endDay)}` : null;
    return { startDate, endDate, isRange: !!endDate };
  }
  const slashRe = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/;
  const s = line.match(slashRe);
  if (s) {
    const month = Number(s[1]) - 1;
    const day = Number(s[2]);
    const year = s[3] ? (s[3].length === 2 ? 2000 + Number(s[3]) : Number(s[3])) : referenceYear;
    const pad = (n) => String(n).padStart(2, "0");
    return { startDate: `${year}-${pad(month + 1)}-${pad(day)}`, endDate: null, isRange: false };
  }
  return null;
}

function guessActivityType(line) {
  const lower = line.toLowerCase();
  const rules = [
    [/\b(exam|test|final)\b/, "Exam"], [/\b(appointment|doctor|dentist)\b/, "Appointment"],
    [/\b(work|shift)\b/, "Work"], [/\bschool\b/, "School"], [/\b(class|lecture)\b/, "Class"],
    [/\b(study|homework)\b/, "Study"], [/\bproject\b/, "Project"],
    [/\b(travel|flight|trip)\b/, "Travel"], [/\b(family|dinner)\b/, "Family"],
    [/\b(gym|practice|training|workout)\b/, "Training Focus"],
    [/\b(hobby|lesson|guitar|piano|music)\b/, "Hobby"], [/\b(recovery|rest)\b/, "Recovery"],
    [/\bfree\b/, "Free Time"],
  ];
  for (const [re, label] of rules) if (re.test(lower)) return label;
  return "Custom";
}

function guessPriority(line, activityType) {
  const lower = line.toLowerCase();
  if (/\b(exam|test|final|appointment|school|work)\b/.test(lower)) return "hard";
  if (/\b(free|flexible)\b/.test(lower) || activityType === "Free Time") return "flexible";
  if (activityType === "Hobby" || activityType === "Recovery") return "preference";
  return "normal";
}

// Strips recognized date/time/weekday fragments to leave a title guess.
function guessTitle(line, activityType) {
  let cleaned = line
    .replace(/\b(mon|tue|tues|wed|weds|thu|thur|thurs|fri|sat|sun)[a-z]*\.?,?\s*/gi, "")
    .replace(/\bevery ?day\b|\bdaily\b|\bweekdays?\b|\bweekends?\b/gi, "")
    .replace(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:\s*(?:-|–|to)\s*\d{1,2}(?:st|nd|rd|th)?)?/gi, "")
    .replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g, "")
    .replace(/\d{1,2}(?::\d{2})?\s*(am|pm)?\s*(?:-|–|to)\s*\d{1,2}(?:\d{2})?\s*(am|pm)?/gi, "")
    .replace(/[,:\-–\/]+/g, " ")
    .replace(/\s{2,}/g, " ")
    .trim();
  if (!cleaned) cleaned = activityType;
  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
}

function parseScheduleLine(line, referenceYear) {
  const daysOfWeek = detectWeekdays(line);
  const dateInfo = detectDate(line, referenceYear);
  const timeInfo = detectTimeRange(line);
  const activityType = guessActivityType(line);
  const priority = guessPriority(line, activityType);
  const title = guessTitle(line, activityType);
  const notes = [];

  let type, date = null, resolvedDaysOfWeek = [];
  if (daysOfWeek.length) {
    type = "recurring-event";
    resolvedDaysOfWeek = daysOfWeek;
  } else if (dateInfo) {
    type = "one-time-event";
    date = dateInfo.startDate;
    if (dateInfo.isRange) notes.push(`Date range detected (through ${dateInfo.endDate}) — imported using the start date only; edit or add more entries as needed`);
  } else {
    type = "one-time-event";
    date = null;
    notes.push("No date or day detected — defaulting to today");
  }

  const allDay = !timeInfo;
  if (!timeInfo) notes.push("No time detected — marked all day");
  else if (!timeInfo.hasAmPm) notes.push("Time guessed without AM/PM in the text — double-check it");

  const highConfidence = !!((type === "recurring-event" || (type === "one-time-event" && date)) && timeInfo && !(dateInfo && dateInfo.isRange));

  return {
    raw: line, type, title, activityType, priority, allDay,
    start: timeInfo ? timeInfo.start : "", end: timeInfo ? timeInfo.end : "",
    date: date || null, daysOfWeek: resolvedDaysOfWeek,
    recurStartDate: null, recurEndDate: null,
    confidence: highConfidence ? "high" : "low",
    include: highConfidence,
    notes,
  };
}

function parseScheduleText(text, referenceYear) {
  return (text || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => parseScheduleLine(l, referenceYear));
}

// ============================================================================
// DB — low-level Supabase-backed storage engine.
//
// This module ONLY knows how to open the database and do generic CRUD against
// its object stores. It has no knowledge of workouts, settings, or program
// concepts — that logic lives in storage.js, which is the layer the rest of
// the app is supposed to talk to. Nothing outside db.js/storage.js should
// touch Supabase directly.
//
// Backing store: a single Postgres table (see supabase-schema.sql) shaped
// like (user_id, store, record_id, data jsonb). Every row is scoped to the
// signed-in user via Row Level Security, so this file never has to filter
// by user itself — Postgres refuses any row that isn't theirs. This mirrors
// the previous local-only layout 1:1 (three "stores": kv / workouts /
// activeWorkout) so every function below it (storage.js) is unchanged.
// ============================================================================

const STORE_WORKOUTS = "workouts";
const STORE_ACTIVE = "activeWorkout";
const STORE_KV = "kv";
const TABLE = "app_records";

let unavailableReason = null;

function getUnavailableReason() {
  return unavailableReason;
}

// The "id" a record is keyed by, matching the old keyPath per store
// (workouts keyed by their own "id" field, kv keyed by "key").
//
// activeWorkout is a single fixed slot ("only one in-progress workout at a
// time") — the record_id used for the database row must always be the
// constant ACTIVE_ID regardless of the workout's own id. Previously this was
// done by overwriting the workout object's own `id` field to ACTIVE_ID
// before saving it, but that corrupted the field once the object was read
// back: getActiveWorkout() would hand back a workout whose `id` was now
// literally "active", and that polluted id then flowed through to
// finishWorkout() -> saveWorkout(), so every completed workout was written
// to the SAME row in the workouts table, silently overwriting all prior
// history. Keying off the constant here, independent of the value's own
// id, keeps the single-slot behavior without ever touching the workout's
// real id.
function recordIdOf(storeName, value) {
  if (storeName === STORE_KV) return String(value.key);
  if (storeName === STORE_ACTIVE) return "active";
  return String(value.id);
}

async function currentUserId() {
  const { data, error } = await supa.auth.getUser();
  if (error || !data.user) throw new Error("Not signed in.");
  return data.user.id;
}

const db = {
  async getAll(storeName) {
    const uid = await currentUserId();
    const { data, error } = await supa.from(TABLE).select("data").eq("user_id", uid).eq("store", storeName);
    if (error) throw error;
    return data.map((row) => row.data);
  },
  async get(storeName, key) {
    const uid = await currentUserId();
    const { data, error } = await supa.from(TABLE).select("data").eq("user_id", uid).eq("store", storeName).eq("record_id", String(key)).maybeSingle();
    if (error) throw error;
    return data ? data.data : undefined;
  },
  async put(storeName, value) {
    const uid = await currentUserId();
    const record_id = recordIdOf(storeName, value);
    const { error } = await supa.from(TABLE).upsert(
      { user_id: uid, store: storeName, record_id, data: value, updated_at: new Date().toISOString() },
      { onConflict: "user_id,store,record_id" }
    );
    if (error) throw error;
    return value;
  },
  async delete(storeName, key) {
    const uid = await currentUserId();
    const { error } = await supa.from(TABLE).delete().eq("user_id", uid).eq("store", storeName).eq("record_id", String(key));
    if (error) throw error;
  },
  async clear(storeName) {
    const uid = await currentUserId();
    const { error } = await supa.from(TABLE).delete().eq("user_id", uid).eq("store", storeName);
    if (error) throw error;
  },
  async count(storeName) {
    const uid = await currentUserId();
    const { count, error } = await supa.from(TABLE).select("record_id", { count: "exact", head: true }).eq("user_id", uid).eq("store", storeName);
    if (error) throw error;
    return count || 0;
  },
};

const STORES = { WORKOUTS: STORE_WORKOUTS, ACTIVE: STORE_ACTIVE, KV: STORE_KV };

// Probe used at boot to detect an unreachable/misconfigured backend early so
// the UI can show recovery instructions instead of failing silently later.
async function probeDB() {
  try {
    await db.count(STORE_KV);
    return { ok: true };
  } catch (err) {
    unavailableReason = err.message || String(err);
    return { ok: false, reason: unavailableReason };
  }
}
// ============================================================================
// STORAGE — the data layer. UI code must go through this module only; it must
// never touch db.js or Supabase directly. This indirection is what makes a
// future upgrade (e.g. syncing to a cloud database) possible without
// rewriting every screen.
// ============================================================================

const KV_SETTINGS = "settings";
const KV_PROGRAM_STATE = "programState";
const KV_META = "meta";
const KV_CUSTOM_EXERCISES = "customExercises";
const KV_PROGRAM_OVERRIDES = "programOverrides";
const KV_PROGRAM_HISTORY = "programHistory";
const KV_EXERCISE_ORDER = "exerciseOrder";
const KV_SCHEDULE_BLOCKS = "scheduleBlocks";
const KV_SCHEDULE_OVERRIDES = "scheduleOverrides";
const KV_PERSONAL_ROUTINES = "personalRoutines";
const KV_WEEKLY_ROUTINE_MAP = "weeklyRoutineMap";
const KV_ROUTINE_PERIODS = "routinePeriods";
const KV_PERSONAL_EVENTS = "personalEvents";
const KV_PERSONAL_OVERRIDES = "personalDateOverrides";

// New/reset users start with no schedule blocks at all — the Schedule tab
// shows "No blocks set for this day type yet" until they add their own.
const DEFAULT_SCHEDULE_BLOCKS = {
  training: [],
  rest: [],
};
// New/reset users start with two named-but-empty routines (Weekday/Weekend)
// mapped Mon-Fri / Sat-Sun, so the Personal tab has sensible defaults to
// build on rather than nothing at all. 0 = Sunday .. 6 = Saturday.
const DEFAULT_PERSONAL_ROUTINES = [
  { id: "routine-weekday", name: "Weekday Routine", blocks: [] },
  { id: "routine-weekend", name: "Weekend Routine", blocks: [] },
];
const DEFAULT_WEEKLY_ROUTINE_MAP = {
  0: "routine-weekend", 1: "routine-weekday", 2: "routine-weekday", 3: "routine-weekday",
  4: "routine-weekday", 5: "routine-weekday", 6: "routine-weekend",
};
const ACTIVE_ID = "active";

const DEFAULT_SETTINGS = {
  theme: "dark",
  backgroundImage: null,
  accentColor: null, // null = default crimson; else a "#rrggbb" hex string
  scheduleStartDate: todayDateStr(), // ISO date — day 1 of the training sequence cycle (see programState.pattern); reset to today whenever setup finishes
  exerciseUnits: {}, // { [exerciseId]: "kg" | "lb" }, missing entries default to kg
};

const DEFAULT_PROGRAM_STATE = {
  lastCompletedType: null,
  setupComplete: false,
  split: null,        // "fullbody" | "ap" | "ul" — the Program Type
  dayTypes: [],        // [{key,label}, ...] — the program's current day types
  pattern: [],          // array of dayType keys or "R", cycled from scheduleStartDate — the Training Sequence
};
const DEFAULT_META = { schemaVersion: SCHEMA_VERSION, lastBackupAt: null };

let saveListeners = [];
function onSaveStateChange(fn) {
  saveListeners.push(fn);
  return () => { saveListeners = saveListeners.filter((f) => f !== fn); };
}
function emitSaveState(state) {
  for (const fn of saveListeners) fn(state);
}

// Wrap every mutating call so the UI can show a "Saving… / Saved / Save failed" indicator.
async function saving(fn) {
  emitSaveState("saving");
  try {
    const result = await fn();
    emitSaveState("saved");
    return result;
  } catch (err) {
    emitSaveState("error");
    throw err;
  }
}

async function init() {
  const probe = await probeDB();
  if (!probe.ok) {
    return { ok: false, reason: probe.reason };
  }

  // No "force reset" trick needed anymore — every signed-in Supabase user
  // gets their own isolated rows (enforced by Row Level Security), so a new
  // account is guaranteed to start with zero records. Just seed defaults
  // for anything this user doesn't have yet.
  const meta = await db.get(STORES.KV, KV_META);
  if (!meta) {
    await db.put(STORES.KV, { key: KV_META, ...DEFAULT_META });
  }
  const settings = await db.get(STORES.KV, KV_SETTINGS);
  if (!settings) {
    await db.put(STORES.KV, { key: KV_SETTINGS, ...DEFAULT_SETTINGS });
  }
  const programState = await db.get(STORES.KV, KV_PROGRAM_STATE);
  if (!programState) {
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...DEFAULT_PROGRAM_STATE });
  }
  const customExercises = await db.get(STORES.KV, KV_CUSTOM_EXERCISES);
  if (!customExercises) {
    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: [] });
  }
  const programOverrides = await db.get(STORES.KV, KV_PROGRAM_OVERRIDES);
  if (!programOverrides) {
    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: {} });
  }
  const programHistory = await db.get(STORES.KV, KV_PROGRAM_HISTORY);
  if (!programHistory) {
    // Migration for accounts created before program history existed: seed
    // one entry from whatever pattern/start-date they already had, so their
    // existing schedule keeps resolving exactly as it did before.
    const psForMigration = programState || DEFAULT_PROGRAM_STATE;
    const settingsForMigration = settings || DEFAULT_SETTINGS;
    const seedList = (psForMigration.setupComplete && psForMigration.pattern && psForMigration.pattern.length)
      ? [{ id: uid(), pattern: psForMigration.pattern.slice(), effectiveFrom: settingsForMigration.scheduleStartDate || DEFAULT_SETTINGS.scheduleStartDate, createdAt: nowISO() }]
      : [];
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: seedList });
  }
  const exerciseOrder = await db.get(STORES.KV, KV_EXERCISE_ORDER);
  if (!exerciseOrder) {
    await db.put(STORES.KV, { key: KV_EXERCISE_ORDER, data: {} });
  }
  const scheduleBlocks = await db.get(STORES.KV, KV_SCHEDULE_BLOCKS);
  if (!scheduleBlocks) {
    await db.put(STORES.KV, { key: KV_SCHEDULE_BLOCKS, data: DEFAULT_SCHEDULE_BLOCKS });
  }
  const personalRoutines = await db.get(STORES.KV, KV_PERSONAL_ROUTINES);
  if (!personalRoutines) {
    await db.put(STORES.KV, { key: KV_PERSONAL_ROUTINES, list: DEFAULT_PERSONAL_ROUTINES.map((r) => ({ ...r })) });
  }
  const weeklyRoutineMap = await db.get(STORES.KV, KV_WEEKLY_ROUTINE_MAP);
  if (!weeklyRoutineMap) {
    await db.put(STORES.KV, { key: KV_WEEKLY_ROUTINE_MAP, data: { ...DEFAULT_WEEKLY_ROUTINE_MAP } });
  }
  const routinePeriods = await db.get(STORES.KV, KV_ROUTINE_PERIODS);
  if (!routinePeriods) {
    await db.put(STORES.KV, { key: KV_ROUTINE_PERIODS, list: [] });
  }
  const personalEvents = await db.get(STORES.KV, KV_PERSONAL_EVENTS);
  if (!personalEvents) {
    await db.put(STORES.KV, { key: KV_PERSONAL_EVENTS, list: [] });
  }
  const personalOverrides = await db.get(STORES.KV, KV_PERSONAL_OVERRIDES);
  if (!personalOverrides) {
    await db.put(STORES.KV, { key: KV_PERSONAL_OVERRIDES, data: {} });
  }
  return { ok: true };
}

function dbUnavailableReason() {
  return getUnavailableReason();
}

async function getSettings() {
  const s = await db.get(STORES.KV, KV_SETTINGS);
  if (!s) return { ...DEFAULT_SETTINGS };
  const { key, ...rest } = s;
  return { ...DEFAULT_SETTINGS, ...rest };
}

async function saveSettings(partial) {
  return saving(async () => {
    const current = await getSettings();
    const merged = { ...current, ...partial };
    await db.put(STORES.KV, { key: KV_SETTINGS, ...merged });
    return merged;
  });
}

  const { key, ...rest } = s;

async function setLastCompletedType(type) {

async function setProgramState(partial) {

    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...merged });

// ---------------------------------------------------------------------------
// Workouts
// ---------------------------------------------------------------------------

async function getWorkouts() {
  const all = await db.getAll(STORES.WORKOUTS);
  return all.sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
}

async function getWorkout(id) {
  return db.get(STORES.WORKOUTS, id);
}

async function saveWorkout(workout) {
  return saving(async () => {
    if (!workout.id) workout.id = uid();
    await db.put(STORES.WORKOUTS, workout);
    if (workout.status === "completed") {
      await setLastCompletedType(workout.type);
    }
    return workout;
  });
}

const updateWorkout = saveWorkout;

async function deleteWorkout(id) {
  return saving(async () => {
    await db.delete(STORES.WORKOUTS, id);
    // Recompute the program cycle pointer from remaining history so deleting
    // the most recent completed workout doesn't leave a stale suggestion.
    const remaining = await getWorkouts();
    const lastCompleted = remaining.find((w) => w.status === "completed");
    const current = await getProgramState();
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...current, lastCompletedType: lastCompleted ? lastCompleted.type : null });
  });
}

// ---------------------------------------------------------------------------
// Active (in-progress) workout — survives refresh / app restart

async function getActiveWorkout() {
  const w = await db.get(STORES.ACTIVE, ACTIVE_ID);
  return w || null;
}

async function saveActiveWorkout(workout) {
  return saving(async () => {
    // Do NOT override workout.id here — recordIdOf() already keys the
    // activeWorkout store's single row on the ACTIVE_ID constant. Forcing
    // the workout's own id field to ACTIVE_ID used to leak into the object
    // that later gets saved as permanent history (see recordIdOf's comment).
    await db.put(STORES.ACTIVE, workout);
  });
}

async function deleteActiveWorkout() {
  return saving(async () => {
    await db.delete(STORES.ACTIVE, ACTIVE_ID);
  });
}

async function deleteCustomExercise(id) {

// Edit a custom exercise's planned sets (or name) in place.
async function updateCustomExercise(id, patch) {
  return saving(async () => {

// ---------------------------------------------------------------------------
// Program overrides — per-exercise tweaks (sets count, removed) layered onto
// the built-in program. Keyed by exercise id. Built-in source is never
// touched; a "removed" exercise can always be restored later.
// ---------------------------------------------------------------------------

async function getProgramOverrides() {
  const rec = await db.get(STORES.KV, KV_PROGRAM_OVERRIDES);
  return rec ? rec.data : {};
}

async function setProgramOverride(id, patch) {
  return saving(async () => {
    const current = await getProgramOverrides();
    const merged = { ...(current[id] || {}), ...patch };
    const updated = { ...current, [id]: merged };
    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: updated });
    return updated;
  });
}

async function restoreProgramExercise(id) {
  return saving(async () => {
    const current = await getProgramOverrides();
    const updated = { ...current };
    delete updated[id];
    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: updated });
    return updated;
  });
}

// ---------------------------------------------------------------------------
// Program version history — see the block comment above
// resolvePatternVersion() for the model. commitProgramPatternChange is the
// only way new entries get added: it appends the new version and, only if
// that version is effective as of today, mirrors it into programState.pattern
// too (kept in sync purely for the few screens — like the setup summary —
// that still read "the current pattern" directly rather than resolving it
// for a specific date).
// ---------------------------------------------------------------------------

async function getProgramHistory() {
  const rec = await db.get(STORES.KV, KV_PROGRAM_HISTORY);
  return rec ? rec.list : [];
}

async function commitProgramPatternChange(pattern, effectiveFrom) {
  return saving(async () => {
    const history = await getProgramHistory();
    const entry = { id: uid(), pattern: pattern.slice(), effectiveFrom, createdAt: nowISO() };
    const updated = [...history, entry].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: updated });

    const currentVersion = resolvePatternVersion(todayDateStr(), updated);
    if (currentVersion) {
      const ps = await getProgramState();
      await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...ps, pattern: currentVersion.pattern });
    }
    return updated;
  });
}

// Used by "Shift Forward/Back 1 Day" and the manual Cycle Start Date field —
// these adjust the ANCHOR of whichever version currently governs today
// (i.e. re-align the rotation's phase) without changing the pattern itself
// or touching any earlier historical version.
async function updateCurrentVersionAnchor(newEffectiveFrom) {
  return saving(async () => {
    const history = await getProgramHistory();
    if (!history.length) return history;
    const sorted = [...history].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
    const last = sorted[sorted.length - 1];
    const updated = [...sorted.slice(0, -1), { ...last, effectiveFrom: newEffectiveFrom }];
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: updated });
    return updated;
  });
}

// Cancels a scheduled-but-not-yet-effective future pattern change (or, if
// needed, removes a past entry too). Re-syncs programState.pattern in case
// removing it changes what's effective today.
async function deleteProgramHistoryEntry(id) {
  return saving(async () => {
    const history = await getProgramHistory();
    const updated = history.filter((v) => v.id !== id);
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: updated });
    const currentVersion = resolvePatternVersion(todayDateStr(), updated);
    if (currentVersion) {
      const ps = await getProgramState();
      await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...ps, pattern: currentVersion.pattern });
    }
    return updated;
  });
}

// ---------------------------------------------------------------------------
// Personal Schedule — Routines: reusable named day templates (time blocks +
// priority), independent from the Training Schedule above. Deleting a
// routine clears any dangling references to it (weekly map entries, routine
// periods) rather than leaving other records pointing at a ghost id.
// ---------------------------------------------------------------------------

async function getPersonalRoutines() {
  const rec = await db.get(STORES.KV, KV_PERSONAL_ROUTINES);
  return rec ? rec.list : DEFAULT_PERSONAL_ROUTINES.map((r) => ({ ...r }));
}

async function savePersonalRoutine(routine) {
  return saving(async () => {
    const list = await getPersonalRoutines();
    if (!routine.id) routine.id = uid();
    const idx = list.findIndex((r) => r.id === routine.id);
    if (idx >= 0) list[idx] = routine; else list.push(routine);
    await db.put(STORES.KV, { key: KV_PERSONAL_ROUTINES, list });
    return routine;
  });
}

async function deletePersonalRoutine(id) {
  return saving(async () => {
    const list = (await getPersonalRoutines()).filter((r) => r.id !== id);
    await db.put(STORES.KV, { key: KV_PERSONAL_ROUTINES, list });

    const mapRec = await db.get(STORES.KV, KV_WEEKLY_ROUTINE_MAP);
    const map = mapRec ? { ...mapRec.data } : { ...DEFAULT_WEEKLY_ROUTINE_MAP };
    let mapChanged = false;
    for (const dow of Object.keys(map)) {
      if (map[dow] === id) { map[dow] = null; mapChanged = true; }
    }
    if (mapChanged) await db.put(STORES.KV, { key: KV_WEEKLY_ROUTINE_MAP, data: map });

    const periods = (await getRoutinePeriods()).filter((p) => p.routineId !== id);
    await db.put(STORES.KV, { key: KV_ROUTINE_PERIODS, list: periods });

    return list;
  });
}

async function getPersonalEvents() {
