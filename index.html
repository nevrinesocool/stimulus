async function renderActiveWorkout(container, navigate) {
  teardown();
  const active = await storage.getActiveWorkout();
  if (!active) {
    container.innerHTML = `<div class="empty-state"><span class="glyph">◆</span><h3>No workout in progress</h3><p>Start a workout to begin logging.</p></div>`;
    return;
  }
  cachedSettings = await storage.getSettings();

  // Pre-compute "previous performance" for every exercise, excluding this active session.
  const history = await storage.getWorkouts();
  cachedPreviousByExercise = {};
  for (const entry of active.exercises) {
    cachedPreviousByExercise[entry.exerciseId] = findPreviousEntry(history, entry.exerciseId);
  }

  paintActiveWorkout(container, active, navigate);
}

function findPreviousEntry(history, exerciseId) {
  for (const w of history) {
    if (w.status !== "completed" && w.status !== "partial") continue;
    const entry = w.exercises.find((e) => e.exerciseId === exerciseId);
    if (entry && entry.sets.some((s) => s.completed)) return entry;
  }
  return null;
}

function previousSetSummary(prevEntry, unilateral) {
  if (!prevEntry) return null;
  const completedSets = prevEntry.sets.filter((s) => s.completed);
  if (!completedSets.length) return null;
  if (unilateral) {
    return completedSets.map((s) => {
      const u = s.weightUnit || "kg";
      const lw = displayWeight(s.leftWeightKg, u);
      const rw = displayWeight(s.rightWeightKg, u);
      return `L ${roundTo(lw) ?? "–"}${u}×${s.leftReps ?? "–"}  ·  R ${roundTo(rw) ?? "–"}${u}×${s.rightReps ?? "–"}`;
    });
  }
  return completedSets.map((s) => {
    const u = s.weightUnit || "kg";
    return `${roundTo(displayWeight(s.weightKg, u)) ?? "–"}${u} × ${s.reps ?? "–"}`;
  });
}

  const pct = programmed ? Math.round(((completed + skipped) / programmed) * 100) : 0;

    <div class="workout-progress-bar"><div class="workout-progress-fill" style="width:${pct}%"></div></div>
    <div class="text-faint mb-16">${completed} completed · ${skipped} skipped · ${programmed} programmed sets</div>

    ${renderCardioCard("pre", workout, "Pre-Workout Cardio")}
  `;

  for (const entry of workout.exercises) {
    html += renderExerciseCard(entry, workout);
  }

  html += renderCardioCard("post", workout, "Post-Workout Cardio");

  html += `
    <div class="field" style="margin-top:20px;">
      <label for="workout-notes">Workout Notes</label>
      <textarea id="workout-notes" placeholder="Optional notes about this session…">${escapeHtml(workout.notes || "")}</textarea>
    </div>
    <button class="btn btn-primary" data-act="finish-bottom">End Workout</button>
  `;

  container.innerHTML = html;
  wireActiveWorkoutEvents(container, workout, navigate);
}

function renderExerciseCard(entry, workout) {
  const def = PROGRAM[workout.type]?.exercises.find((e) => e.id === entry.exerciseId);
  const prev = cachedPreviousByExercise[entry.exerciseId];
  const prevLines = previousSetSummary(prev, entry.unilateral);
  const exerciseUnit = getExerciseUnit(cachedSettings, entry.exerciseId);

  let setsHtml = "";
  entry.sets.forEach((set, i) => {
    setsHtml += renderSetRow(entry, set, i, exerciseUnit);
  });

  return `
    <div class="card exercise-card" data-exercise="${entry.exerciseId}">
      <div class="ex-head">
        <div>
          <div class="ex-name">${escapeHtml(entry.name)}${entry.substitutedFrom ? `<span class="text-faint" style="font-size:11.5px; font-weight:400;"> (sub for ${escapeHtml(entry.substitutedFrom.name)})</span>` : ""}</div>
          <div class="ex-sub">
            <span>${entry.sets.length} programmed set${entry.sets.length > 1 ? "s" : ""}</span>
            ${entry.unilateral ? `<span class="badge badge-uni">Unilateral</span>` : ""}
          </div>
        </div>
        <div class="toggle-row unit-toggle" data-exercise="${entry.exerciseId}" style="width:auto; flex-shrink:0;">
          <button type="button" data-value="kg" class="${exerciseUnit === "kg" ? "active" : ""}">kg</button>
          <button type="button" data-value="lb" class="${exerciseUnit === "lb" ? "active" : ""}">lb</button>
        </div>
      </div>
      ${prevLines ? `<div class="ex-prev">LAST TIME<br>${prevLines.map(escapeHtml).join("<br>")}</div>` : `<div class="ex-prev text-faint">No previous data yet</div>`}
      <div class="sets-list">${setsHtml}</div>
      <div class="quick-row">
        ${prev ? `<button class="chip-btn" data-act="use-prev-weight" data-exercise="${entry.exerciseId}">Use Previous Weight</button>` : ""}
        ${prev ? `<button class="chip-btn" data-act="copy-prev-set" data-exercise="${entry.exerciseId}">Copy Previous Set</button>` : ""}
        <button class="chip-btn" data-act="substitute-ex" data-exercise="${entry.exerciseId}">⇄ Substitute</button>
      </div>
      <div class="tempo-row" style="margin-top:10px;">
        <span class="rir-label" style="display:block; margin-bottom:6px;">Execution</span>
        <button type="button" class="chip-btn tempo-chip ${entry.tempo === "improved" ? "active" : ""}" data-act="set-tempo" data-exercise="${entry.exerciseId}" data-tempo="improved">Improved tempo/control</button>
        <button type="button" class="chip-btn tempo-chip tempo-none ${entry.tempo === "none" ? "active" : ""}" data-act="set-tempo" data-exercise="${entry.exerciseId}" data-tempo="none">No improvement</button>
      </div>
      <div class="field" style="margin-top:10px; margin-bottom:0;">
        <textarea data-act="ex-notes" data-exercise="${entry.exerciseId}" placeholder="Notes on this exercise…" rows="2">${escapeHtml(entry.notes || "")}</textarea>
      </div>
    </div>
  `;
}

function renderSetRow(entry, set, i, exerciseUnit) {
  const rowClass = set.completed ? "completed" : set.skipped ? "skipped" : "";
  const icon = set.completed ? "✓" : set.skipped ? "–" : "";
  // A set that already has a value keeps the unit it was recorded in; a
  // blank/never-touched set uses the exercise's current preferred unit.
  const unit = set.weightUnit || exerciseUnit;

  let inputs;
  if (set.unilateral) {
    const lw = set.leftWeightKg != null ? roundTo(displayWeight(set.leftWeightKg, unit)) : "";
    const rw = set.rightWeightKg != null ? roundTo(displayWeight(set.rightWeightKg, unit)) : "";
    inputs = `
      <div class="set-col">
        <div class="set-side-label">Left</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${unit}" value="${lw}" data-field="leftWeightKg" data-exercise="${entry.exerciseId}" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="reps" value="${set.leftReps ?? ""}" data-field="leftReps" data-exercise="${entry.exerciseId}" data-set="${i}">
        </div>
      </div>
      <div class="set-col">
        <div class="set-side-label">Right</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${unit}" value="${rw}" data-field="rightWeightKg" data-exercise="${entry.exerciseId}" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="reps" value="${set.rightReps ?? ""}" data-field="rightReps" data-exercise="${entry.exerciseId}" data-set="${i}">
        </div>
      </div>
    `;
  } else {
    const w = set.weightKg != null ? roundTo(displayWeight(set.weightKg, unit)) : "";
    inputs = `
      <div class="set-col">
        <input type="number" inputmode="decimal" placeholder="${unit}" value="${w}" data-field="weightKg" data-exercise="${entry.exerciseId}" data-set="${i}">
      </div>
      <div class="set-col">
        <input type="number" inputmode="numeric" placeholder="reps" value="${set.reps ?? ""}" data-field="reps" data-exercise="${entry.exerciseId}" data-set="${i}">
      </div>
    `;
  }

  return `
    <div class="set-row ${rowClass}" data-exercise="${entry.exerciseId}" data-set="${i}">
      <div class="set-index">${i + 1}</div>
      <div class="set-inputs">${inputs}</div>
      <button class="set-complete-btn" data-act="toggle-complete" data-exercise="${entry.exerciseId}" data-set="${i}" aria-label="Mark set ${i + 1} complete">${icon}</button>
    </div>
    ${renderRirRow(entry.exerciseId, set, i)}
  `;
}

function renderRirRow(exerciseId, set, i) {
  const chips = RIR_OPTIONS.map((opt) => `
    <button type="button" class="chip-btn rir-chip ${set.rir === opt.value ? "active" : ""}" data-act="set-rir" data-exercise="${exerciseId}" data-set="${i}" data-rir="${opt.value}">${escapeHtml(opt.label)}</button>
  `).join("");

  return `
    <div class="rir-row" data-exercise="${exerciseId}" data-set="${i}">
      <span class="rir-label">RIR</span>
      ${chips}
    </div>
  `;
}

function renderCardioCard(phase, workout, title) {
  const c = workout.cardio[phase];
  const statusBadge = c.status === "completed" ? `<span class="badge badge-positive">Completed</span>`
    : c.status === "skipped" ? `<span class="badge">Skipped</span>` : "";

  return `
    <div class="card cardio-card" data-cardio="${phase}">
      <div class="flex-between">
        <div class="eyebrow">${title.toUpperCase()}</div>
        ${statusBadge}
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ${c.status === "completed" ? "btn-primary" : ""}" data-act="cardio-complete" data-phase="${phase}">
          ${c.status === "completed" ? "✓ Done" : "Mark Done"}
        </button>
        <button class="btn btn-ghost btn-sm" data-act="cardio-skip" data-phase="${phase}" style="flex:0 0 auto;">
          ${c.status === "skipped" ? "Skipped" : "Skip"}
        </button>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Event wiring
// ---------------------------------------------------------------------------

function wireActiveWorkoutEvents(container, workout, navigate) {
  // Number inputs — save on change (blur / enter), no full rerender to preserve focus elsewhere.
  qsa('input[data-field]', container).forEach((input) => {
    input.addEventListener("change", () => {
      const { field, exercise, set } = input.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      const raw = input.value === "" ? null : Number(input.value);

      if (field === "weightKg" || field === "leftWeightKg" || field === "rightWeightKg") {
        const effectiveUnit = s.weightUnit || getExerciseUnit(cachedSettings, exercise);
        s[field] = raw == null ? null : toStorageWeight(raw, effectiveUnit);
        if (raw != null) s.weightUnit = effectiveUnit;
      } else {
        s[field] = raw;
      }
      storage.saveActiveWorkout(workout);
    });
  });

  // Per-exercise unit preference toggle
  qsa('.unit-toggle', container).forEach((row) => {
    qsa("button", row).forEach((btn) => {
      btn.addEventListener("click", async () => {
        const exerciseId = row.dataset.exercise;
        const value = btn.dataset.value;
        const current = cachedSettings.exerciseUnits || {};
        cachedSettings.exerciseUnits = { ...current, [exerciseId]: value };
        await storage.saveSettings({ exerciseUnits: cachedSettings.exerciseUnits });
        const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
        const card = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
        if (card) card.outerHTML = renderExerciseCard(entry, workout);
        rewireExerciseCard(container, workout, exerciseId);
      });
    });
  });

  // RIR chips and failure toggle
  qsa('[data-act="set-rir"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set, rir } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      s.rir = s.rir === rir ? null : rir;
      storage.saveActiveWorkout(workout);
      updateRirRowUI(container, exercise, Number(set), s);
    });
  });
  // Toggle set completion
  qsa('[data-act="toggle-complete"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];

      if (!s.completed && !s.skipped) {
        s.completed = true;
      } else if (s.completed) {
        s.completed = false;
      }
      updateSetRowUI(container, entry.exerciseId, Number(set), s);
      storage.saveActiveWorkout(workout);
      updateProgressUI(container, workout);
    });
    // long-press-free alt: allow marking skipped via a second control (double click / right side) —
    // implemented as a small affordance: clicking the set index cycles through skip state.
  });

  qsa('.set-index', container).forEach((idx) => {
    idx.style.cursor = "pointer";
    idx.title = "Tap to mark skipped";
    idx.addEventListener("click", () => {
      const row = idx.closest(".set-row");
      const exercise = row.dataset.exercise, set = Number(row.dataset.set);
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[set];
      if (s.skipped) { s.skipped = false; }
      else { s.skipped = true; s.completed = false; }
      updateSetRowUI(container, exercise, set, s);
      storage.saveActiveWorkout(workout);
      updateProgressUI(container, workout);
    });
  });

  // Use previous weight / copy previous set
  qsa('[data-act="use-prev-weight"]', container).forEach((btn) => {
    btn.addEventListener("click", () => applyPrevious(container, workout, btn.dataset.exercise, "weight"));
  });
  qsa('[data-act="copy-prev-set"]', container).forEach((btn) => {
    btn.addEventListener("click", () => applyPrevious(container, workout, btn.dataset.exercise, "full"));
  });

  // Manual tempo/execution feedback (item 8) — click again to clear
  qsa('[data-act="set-tempo"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, tempo } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      entry.tempo = entry.tempo === tempo ? null : tempo;
      storage.saveActiveWorkout(workout);
      const card = qs(`.exercise-card[data-exercise="${exercise}"]`, container);
      if (card) {
        qsa(".tempo-chip", card).forEach((b) => b.classList.toggle("active", b.dataset.tempo === entry.tempo));
      }
    });
  });

  // Per-exercise notes (item 13)
  qsa('[data-act="ex-notes"]', container).forEach((ta) => {
    ta.addEventListener("change", () => {
      const entry = workout.exercises.find((e) => e.exerciseId === ta.dataset.exercise);
      entry.notes = ta.value;
      storage.saveActiveWorkout(workout);
    });
  });

  // Exercise substitution (item 16) — workout-only unless "apply permanently" is checked
  qsa('[data-act="substitute-ex"]', container).forEach((btn) => {
    btn.addEventListener("click", () => openSubstituteModal(container, workout, btn.dataset.exercise, navigate));
  });

  // Cardio controls
  qsa('[data-act="cardio-complete"]', container).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, btn.dataset.phase, "complete")));
  qsa('[data-act="cardio-skip"]', container).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, btn.dataset.phase, "skip")));

  const notes = qs("#workout-notes", container);
  if (notes) notes.addEventListener("change", () => { workout.notes = notes.value; storage.saveActiveWorkout(workout); });

  qs('[data-act="finish"]', container)?.addEventListener("click", () => finishWorkout(container, workout, navigate));
  qs('[data-act="finish-bottom"]', container)?.addEventListener("click", () => finishWorkout(container, workout, navigate));
}

function updateSetRowUI(container, exerciseId, setIndex, set) {
  const row = qs(`.set-row[data-exercise="${exerciseId}"][data-set="${setIndex}"]`, container);
  if (!row) return;
  row.classList.toggle("completed", !!set.completed);
  row.classList.toggle("skipped", !!set.skipped);
  const btn = qs('[data-act="toggle-complete"]', row);
  btn.textContent = set.completed ? "✓" : set.skipped ? "–" : "";
}

function updateRirRowUI(container, exerciseId, setIndex, set) {
  const row = qs(`.rir-row[data-exercise="${exerciseId}"][data-set="${setIndex}"]`, container);
  if (!row) return;
  qsa('[data-act="set-rir"]', row).forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.rir === set.rir);
  });
}

function updateProgressUI(container, workout) {
  const { completed, skipped, programmed } = countCompletedSets(workout);
  const pct = programmed ? Math.round(((completed + skipped) / programmed) * 100) : 0;
  const fill = qs(".workout-progress-fill", container);
  if (fill) fill.style.width = pct + "%";
  const label = qs(".workout-progress-bar", container)?.nextElementSibling;
  if (label) label.textContent = `${completed} completed · ${skipped} skipped · ${programmed} programmed sets`;
}

function applyPrevious(container, workout, exerciseId, mode) {
  const prev = cachedPreviousByExercise[exerciseId];
  if (!prev) return;
  const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
  const completedPrevSets = prev.sets.filter((s) => s.completed);
  if (!completedPrevSets.length) return;
  const last = completedPrevSets[completedPrevSets.length - 1];
  const currentUnit = getExerciseUnit(cachedSettings, exerciseId);

  entry.sets.forEach((s, i) => {
    const src = mode === "full" ? (completedPrevSets[i] || last) : last;
    if (s.unilateral) {
      s.leftWeightKg = src.leftWeightKg ?? s.leftWeightKg;
      s.rightWeightKg = src.rightWeightKg ?? s.rightWeightKg;
      if (mode === "full") { s.leftReps = src.leftReps ?? s.leftReps; s.rightReps = src.rightReps ?? s.rightReps; }
    } else {
      s.weightKg = src.weightKg ?? s.weightKg;
      if (mode === "full") s.reps = src.reps ?? s.reps;
    }
    // A freshly-copied value is a new entry made right now, so it uses the
    // exercise's current preferred unit rather than the source set's unit.
    s.weightUnit = currentUnit;
  });

  storage.saveActiveWorkout(workout);
  // Re-render just this exercise card to reflect the new values in the inputs.
  const card = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
  if (card) card.outerHTML = renderExerciseCard(entry, workout);
  rewireExerciseCard(container, workout, exerciseId);
  toast(mode === "full" ? "Copied previous set" : "Applied previous weight");
}

function rewireExerciseCard(container, workout, exerciseId) {
  const card = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
  if (!card) return;
  qsa('input[data-field]', card).forEach((input) => {
    input.addEventListener("change", () => {
      const { field, exercise, set } = input.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      const raw = input.value === "" ? null : Number(input.value);
      if (field.toLowerCase().includes("weight")) {
        const effectiveUnit = s.weightUnit || getExerciseUnit(cachedSettings, exercise);
        s[field] = raw == null ? null : toStorageWeight(raw, effectiveUnit);
        if (raw != null) s.weightUnit = effectiveUnit;
      } else {
        s[field] = raw;
      }
      storage.saveActiveWorkout(workout);
    });
  });
  qsa('.unit-toggle', card).forEach((row) => {
    qsa("button", row).forEach((btn) => {
      btn.addEventListener("click", async () => {
        const value = btn.dataset.value;
        const current = cachedSettings.exerciseUnits || {};
        cachedSettings.exerciseUnits = { ...current, [exerciseId]: value };
        await storage.saveSettings({ exerciseUnits: cachedSettings.exerciseUnits });
        const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
        const freshCard = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
        if (freshCard) freshCard.outerHTML = renderExerciseCard(entry, workout);
        rewireExerciseCard(container, workout, exerciseId);
      });
    });
  });
  qsa('[data-act="set-rir"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set, rir } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      s.rir = s.rir === rir ? null : rir;
      storage.saveActiveWorkout(workout);
      updateRirRowUI(container, exercise, Number(set), s);
    });
  });
  qsa('[data-act="toggle-complete"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      if (!s.completed && !s.skipped) s.completed = true; else if (s.completed) s.completed = false;
      updateSetRowUI(container, entry.exerciseId, Number(set), s);
      storage.saveActiveWorkout(workout);
      updateProgressUI(container, workout);
    });
  });
  qsa('.set-index', card).forEach((idx) => {
    idx.addEventListener("click", () => {
      const row = idx.closest(".set-row");
      const exercise = row.dataset.exercise, set = Number(row.dataset.set);
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[set];
      if (s.skipped) s.skipped = false; else { s.skipped = true; s.completed = false; }
      updateSetRowUI(container, exercise, set, s);
      storage.saveActiveWorkout(workout);
      updateProgressUI(container, workout);
    });
  });
  qsa('[data-act="use-prev-weight"]', card).forEach((btn) => btn.addEventListener("click", () => applyPrevious(container, workout, exerciseId, "weight")));
  qsa('[data-act="copy-prev-set"]', card).forEach((btn) => btn.addEventListener("click", () => applyPrevious(container, workout, exerciseId, "full")));
  qsa('[data-act="set-tempo"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
      entry.tempo = entry.tempo === btn.dataset.tempo ? null : btn.dataset.tempo;
      storage.saveActiveWorkout(workout);
      qsa(".tempo-chip", card).forEach((b) => b.classList.toggle("active", b.dataset.tempo === entry.tempo));
    });
  });
  qsa('[data-act="ex-notes"]', card).forEach((ta) => {
    ta.addEventListener("change", () => {
      const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
      entry.notes = ta.value;
      storage.saveActiveWorkout(workout);
    });
  });
  qsa('[data-act="substitute-ex"]', card).forEach((btn) => {
    btn.addEventListener("click", () => openSubstituteModal(container, workout, exerciseId, null));
  });
}

// ---------------------------------------------------------------------------
// Exercise substitution (item 16) — swap in a different exercise from the
// same day type for just this workout. Historical workouts are unaffected;
// checking "apply permanently" also hides the old exercise from future
// workouts and gives the new one its slot in the program order.
// ---------------------------------------------------------------------------
function openSubstituteModal(container, workout, exerciseId, navigate) {
  const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
  if (!entry) return;
  const options = (PROGRAM[workout.type]?.exercises || []).filter((e) => e.id !== exerciseId);
  if (!options.length) {
    toast("No other exercises in this workout type to substitute with");
    return;
  }

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="sub-modal-title">
      <h3 id="sub-modal-title">Substitute ${escapeHtml(entry.name)}</h3>
      <div class="field">
        <label for="sub-select">Replace with</label>
        <select id="sub-select" style="width:100%; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:10px; font-size:14px;">
          ${options.map((o) => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join("")}
        </select>
      </div>
      <label class="text-dim" style="display:flex; align-items:flex-start; gap:8px; font-size:13px; margin-top:6px;">
        <input type="checkbox" id="sub-permanent" style="margin-top:3px;">
        <span>Also replace it in my program for future workouts (this workout's history stays as recorded either way)</span>
      </label>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn btn-ghost" data-act="cancel" type="button">Cancel</button>
        <button class="btn btn-primary" data-act="confirm" type="button">Substitute</button>
      </div>
    </div>`;
  modalRoot.appendChild(overlay);

  function close() { overlay.remove(); }
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-act="cancel"]').addEventListener("click", close);
  overlay.querySelector('[data-act="confirm"]').addEventListener("click", async () => {
    const newId = qs("#sub-select", overlay).value;
    const makePermanent = qs("#sub-permanent", overlay).checked;
    const newDef = options.find((o) => o.id === newId);
    if (!newDef) { close(); return; }

    const oldId = entry.exerciseId;
    const oldName = entry.name;
    const setCount = entry.sets.length;

    entry.exerciseId = newDef.id;
    entry.name = newDef.name;
    entry.unilateral = newDef.unilateral;
    entry.sets = Array.from({ length: setCount }, (_, i) => baseSet(i, newDef.unilateral));
    entry.tempo = null;
    entry.substitutedFrom = { exerciseId: oldId, name: oldName };

    await storage.saveActiveWorkout(workout);

    if (makePermanent) {
      const order = await storage.getExerciseOrder();
      const typeOrder = (order[workout.type] || PROGRAM[workout.type].exercises.map((e) => e.id)).slice();
      const idx = typeOrder.indexOf(oldId);
      if (idx !== -1) typeOrder[idx] = newDef.id; else typeOrder.push(newDef.id);
      await storage.setExerciseOrder(workout.type, typeOrder);
      await storage.setProgramOverride(oldId, { removed: true });
      applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    }

    close();
    toast(`Substituted ${newDef.name}`);
    const history = await storage.getWorkouts();
    cachedPreviousByExercise[newDef.id] = findPreviousEntry(history, newDef.id);
    const card = qs(`.exercise-card[data-exercise="${oldId}"]`, container);
    if (card) card.outerHTML = renderExerciseCard(entry, workout);
    rewireExerciseCard(container, workout, newDef.id);
  });
}

function cardioAction(container, workout, phase, action) {
  const c = workout.cardio[phase];
  if (action === "complete") {
    c.status = c.status === "completed" ? "idle" : "completed";
  } else if (action === "skip") {
    c.status = c.status === "skipped" ? "idle" : "skipped";
  }
  storage.saveActiveWorkout(workout);
  const card = qs(`[data-cardio="${phase}"]`, container);
  if (card) {
    const title = phase === "pre" ? "Pre-Workout Cardio" : "Post-Workout Cardio";
    card.outerHTML = renderCardioCard(phase, workout, title);
    rewireCardioCard(container, workout, phase);
  }
}

function rewireCardioCard(container, workout, phase) {
  const card = qs(`[data-cardio="${phase}"]`, container);
  if (!card) return;
  qsa('[data-act="cardio-complete"]', card).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, phase, "complete")));
  qsa('[data-act="cardio-skip"]', card).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, phase, "skip")));
}

async function finishWorkout(container, workout, navigate) {
  const { completed, programmed } = countCompletedSets(workout);
  if (completed < programmed) {
    const ok = await confirmModal({
      title: "End workout now?",
      body: `You've completed ${completed} of ${programmed} programmed sets. Ending now will save this as a partial workout — you can still edit it later from History.`,
      confirmLabel: "End Workout",
    });
    if (!ok) return;
  }

  workout.status = computeWorkoutStatus(workout);
  workout.completedAt = nowISO();
  await storage.saveWorkout(workout);
  await storage.deleteActiveWorkout();

  navigate("workout-summary", { workoutId: workout.id });
}

async function renderWorkoutSummary(container, navigate, params) {
  teardown();
  const workout = await storage.getWorkout(params.workoutId);
  if (!workout) { navigate("dashboard"); return; }

  const def = PROGRAM[workout.type];
  const { completed, programmed } = countCompletedSets(workout);
  const volume = workoutVolume(workout);
  const durationMin = workout.completedAt ? Math.round((new Date(workout.completedAt) - new Date(workout.startedAt)) / 60000) : null;

  const preCardio = workout.cardio.pre, postCardio = workout.cardio.post;
  const cardioDoneCount = (preCardio.status === "completed" ? 1 : 0) + (postCardio.status === "completed" ? 1 : 0);

  // Progressions detected + PRs achieved (item 14), using existing workout
  // history — no separate tracking, computed the same way as everywhere else.
  const allWorkouts = await storage.getWorkouts();
  const workoutsAsc = completedWorkoutsAsc(allWorkouts);
  const priorAsc = workoutsAsc.filter((w) => w.id !== workout.id && new Date(w.startedAt) < new Date(workout.startedAt));

  const progressions = [];
  const prs = [];
  for (const entry of workout.exercises) {
    const prev = [...priorAsc].reverse().map((w) => w.exercises.find((e) => e.exerciseId === entry.exerciseId)).find(Boolean) || null;
    const prog = detectProgression(prev, entry);
    if (prog && (prog.type === "weight" || prog.type === "reps")) {
      progressions.push(`${entry.name}: ${prog.label}`);
    }
    const flags = computeEntryPRFlags(workoutsAsc, entry.exerciseId, workout.id);
    if (flags.weightPR) prs.push(`${entry.name} — Weight PR`);
    if (flags.repsPR) prs.push(`${entry.name} — Rep PR`);
  }

  container.innerHTML = `
    <div class="summary-hero">
      <div class="seal">✦</div>
      <h1>Workout Complete</h1>
      <div class="summary-type">${def?.label || workout.type} · ${workout.status}</div>
    </div>

    <div class="stat-grid mb-16">
      <div class="stat-box"><div class="stat-value">${completed}/${programmed}</div><div class="stat-label">Sets completed</div></div>
      <div class="stat-box"><div class="stat-value">${roundTo(volume, 0) ?? 0}</div><div class="stat-label">Total volume (kg)</div></div>
      <div class="stat-box"><div class="stat-value">${cardioDoneCount}/2</div><div class="stat-label">Cardio done</div></div>
      <div class="stat-box"><div class="stat-value">${durationMin != null ? durationMin : "–"}</div><div class="stat-label">Workout time (min)</div></div>
    </div>

    ${progressions.length ? `
    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px;">Progressions Detected</div>
      ${progressions.map((p) => `<div class="text-dim" style="padding:4px 0; font-size:13.5px;">↑ ${escapeHtml(p)}</div>`).join("")}
    </div>` : ""}

    ${prs.length ? `
    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px;">PRs Achieved</div>
      ${prs.map((p) => `<div class="text-dim" style="padding:4px 0; font-size:13.5px;">★ ${escapeHtml(p)}</div>`).join("")}
    </div>` : ""}

    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px;">Cardio</div>
      <div class="flex-between"><span class="text-dim">Pre-workout</span><span>${preCardio.status === "completed" ? "✓ Done" : preCardio.status === "skipped" ? "Skipped" : "Not logged"}</span></div>
      <div class="flex-between" style="margin-top:6px;"><span class="text-dim">Post-workout</span><span>${postCardio.status === "completed" ? "✓ Done" : postCardio.status === "skipped" ? "Skipped" : "Not logged"}</span></div>
    </div>

    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-ghost" data-act="view-details">View Details</button>
      <button class="btn btn-primary" data-act="done">Done</button>
    </div>
  `;

  qs('[data-act="done"]', container).addEventListener("click", () => navigate("dashboard"));
  qs('[data-act="view-details"]', container).addEventListener("click", () => navigate("history-detail", { workoutId: workout.id }));
}

const workout = { renderWorkoutHome, startNewWorkout, renderActiveWorkout, renderWorkoutSummary, teardown };
let historyViewMode = "list";
let historyCalendarCursor = null;

function renderHistoryCalendarHtml(workouts) {
  if (!historyCalendarCursor) {
    const d = new Date();
    historyCalendarCursor = { year: d.getFullYear(), month: d.getMonth() };
  }
  const cursor = historyCalendarCursor;

  const byDate = new Map();
  for (const w of workouts) {
    const d = new Date(w.startedAt);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    byDate.set(key, w);
  }

  const first = new Date(cursor.year, cursor.month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString(undefined, { year: "numeric", month: "long" });

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const w = byDate.get(key);
    const label = w ? (w.type || "") : "";
    const cls = w ? (w.status === "completed" ? "cal-done" : "cal-partial") : "";
    cells += `<div class="cal-cell ${cls}" ${w ? `data-id="${w.id}" style="cursor:pointer;"` : ""}>
      <span class="cal-daynum">${day}</span>${label ? `<span class="cal-tag">${label}</span>` : ""}
    </div>`;
  }

  return `
    <div class="flex-between" style="margin-bottom:10px;">
      <button class="link-btn" data-act="cal-prev">‹</button>
      <span style="font-weight:600;">${monthLabel}</span>
      <button class="link-btn" data-act="cal-next">›</button>
    </div>
    <div class="cal-weekdays">${["S", "M", "T", "W", "T", "F", "S"].map((d) => `<span>${d}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <p class="text-faint" style="margin-top:14px;">Solid = completed, outlined = partial.</p>
  `;
}

async function historyRenderList(container, navigate) {
  const workouts = await storage.getWorkouts();

  if (workouts.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="glyph">☰</span><h3>No workouts yet</h3><p>Start your first workout to begin tracking your progress.</p></div>`;
    return;
  }

  const toggleHtml = `
    <div class="toggle-row" id="history-view-toggle" style="margin-bottom:16px;">
      <button type="button" data-value="list" class="${historyViewMode === "list" ? "active" : ""}">List</button>
      <button type="button" data-value="calendar" class="${historyViewMode === "calendar" ? "active" : ""}">Calendar</button>
    </div>`;

  if (historyViewMode === "calendar") {
    container.innerHTML = toggleHtml + renderHistoryCalendarHtml(workouts);
    wireHistoryViewToggle(container, navigate);
    qs('[data-act="cal-prev"]', container)?.addEventListener("click", () => {
      historyCalendarCursor.month -= 1;
      if (historyCalendarCursor.month < 0) { historyCalendarCursor.month = 11; historyCalendarCursor.year -= 1; }
      historyRenderList(container, navigate);
    });
    qs('[data-act="cal-next"]', container)?.addEventListener("click", () => {
      historyCalendarCursor.month += 1;
      if (historyCalendarCursor.month > 11) { historyCalendarCursor.month = 0; historyCalendarCursor.year += 1; }
      historyRenderList(container, navigate);
    });
    qsa(".cal-cell[data-id]", container).forEach((el) => {
      el.addEventListener("click", () => navigate("history-detail", { workoutId: el.dataset.id }));
    });
    return;
  }

  // Group by month for a ledger-like feel.
  const groups = new Map();
  for (const w of workouts) {
    const d = new Date(w.startedAt);
    const key = d.toLocaleDateString(undefined, { year: "numeric", month: "long" });
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  }

  let html = toggleHtml;
  for (const [monthLabel, list] of groups) {
    html += `<div class="section-title"><h2>${escapeHtml(monthLabel)}</h2></div><div class="card">`;
    html += list.map((w, i) => {
      const { completed, programmed } = countCompletedSets(w);
      const cardioDone = (w.cardio?.pre?.status === "completed" ? 1 : 0) + (w.cardio?.post?.status === "completed" ? 1 : 0);
      return `
        <div class="history-item" data-id="${w.id}" style="cursor:pointer;">
          <div class="h-index">${formatDateShort(w.startedAt)}</div>
          <div class="h-body">
            <div class="h-title">${PROGRAM[w.type].label} <span class="badge ${w.status === "completed" ? "badge-positive" : w.status === "partial" ? "badge-warn" : ""}">${w.status}</span></div>
            <div class="h-meta">${completed}/${programmed} sets${cardioDone ? ` · cardio ${cardioDone}/2` : ""}</div>
          </div>
          <div class="h-chevron">›</div>
        </div>`;
    }).join("");
    html += `</div>`;
  }

  container.innerHTML = html;
  wireHistoryViewToggle(container, navigate);
  qsa(".history-item", container).forEach((el) => {
    el.addEventListener("click", () => navigate("history-detail", { workoutId: el.dataset.id }));
  });
}

function wireHistoryViewToggle(container, navigate) {
  const toggle = qs("#history-view-toggle", container);
  qsa("button", toggle).forEach((btn) => {
    btn.addEventListener("click", () => {
      historyViewMode = btn.dataset.value;
      historyRenderList(container, navigate);
    });
  });
}

async function historyRenderDetail(container, navigate, params, { editMode = false } = {}) {
  const workout = await storage.getWorkout(params.workoutId);
  if (!workout) {
    container.innerHTML = `<div class="empty-state"><h3>Workout not found</h3><p>It may have been deleted.</p></div>`;
    return;
  }
  const settings = await storage.getSettings();
  const { completed, programmed, skipped } = countCompletedSets(workout);
  const volume = workoutVolume(workout);
  const durationMin = workout.completedAt ? Math.round((new Date(workout.completedAt) - new Date(workout.startedAt)) / 60000) : null;

  let html = `
    <button class="link-btn" data-act="back">‹ History</button>
    <div class="flex-between" style="margin-top:10px;">
      <div>
        <div class="eyebrow">${formatDate(workout.startedAt)}</div>
        <h1 style="font-size:22px;">${PROGRAM[workout.type]?.label || workout.type} Workout</h1>
      </div>
      <span class="badge ${workout.status === "completed" ? "badge-positive" : workout.status === "partial" ? "badge-warn" : ""}">${workout.status}</span>
    </div>

    <div class="stat-grid" style="margin-top:14px;">
      <div class="stat-box"><div class="stat-value">${completed}/${programmed}</div><div class="stat-label">Sets completed</div></div>
      <div class="stat-box"><div class="stat-value">${roundTo(volume, 0) ?? 0}</div><div class="stat-label">Volume (kg)</div></div>
      <div class="stat-box"><div class="stat-value">${durationMin ?? "–"}</div><div class="stat-label">Duration (min)</div></div>
      <div class="stat-box"><div class="stat-value">${skipped}</div><div class="stat-label">Skipped sets</div></div>
    </div>

    <div class="btn-row" style="margin:16px 0;">
      <button class="btn ${editMode ? "btn-primary" : ""}" data-act="toggle-edit">${editMode ? "Done Editing" : "Edit Workout"}</button>
      <button class="btn btn-danger" data-act="delete">Delete</button>
    </div>
  `;

  const workoutsAsc = completedWorkoutsAsc(await storage.getWorkouts());

  for (const entry of workout.exercises) {
    const prFlags = computeEntryPRFlags(workoutsAsc, entry.exerciseId, workout.id);
    html += `<div class="card exercise-card">
      <div class="ex-head">
        <div>
          <div class="ex-name">${escapeHtml(entry.name)}${entry.substitutedFrom ? `<span class="text-faint" style="font-size:11.5px; font-weight:400;"> (sub for ${escapeHtml(entry.substitutedFrom.name)})</span>` : ""}</div>
          <div class="ex-sub">
            ${entry.unilateral ? `<span class="badge badge-uni">Unilateral</span>` : ""}
            ${prFlags.weightPR ? `<span class="badge badge-positive">Weight PR</span>` : ""}
            ${prFlags.repsPR ? `<span class="badge badge-positive">Rep PR</span>` : ""}
          </div>
        </div>
      </div>
      <div class="sets-list">`;
    entry.sets.forEach((set, i) => {
      html += renderHistSetRow(entry, set, i, settings, editMode);
    });
    html += `</div>`;
    if (entry.tempo || editMode) {
      html += `<div class="tempo-row" style="margin-top:10px;">
        <span class="rir-label" style="display:block; margin-bottom:6px;">Execution</span>
        ${editMode ? `
          <button type="button" class="chip-btn tempo-chip ${entry.tempo === "improved" ? "active" : ""}" data-act="hist-set-tempo" data-exercise="${entry.exerciseId}" data-tempo="improved">Improved tempo/control</button>
          <button type="button" class="chip-btn tempo-chip tempo-none ${entry.tempo === "none" ? "active" : ""}" data-act="hist-set-tempo" data-exercise="${entry.exerciseId}" data-tempo="none">No improvement</button>
        ` : `<span class="text-dim" style="font-size:13px;">${entry.tempo === "improved" ? "Improved tempo/control" : "No improvement"}</span>`}
      </div>`;
    }
    if (entry.notes || editMode) {
      html += `<div class="field" style="margin-top:10px; margin-bottom:0;">
        ${editMode
          ? `<textarea data-act="hist-ex-notes" data-exercise="${entry.exerciseId}" rows="2" placeholder="Notes on this exercise…">${escapeHtml(entry.notes || "")}</textarea>`
          : `<p class="text-dim" style="font-size:13px; margin:0;">${escapeHtml(entry.notes)}</p>`}
      </div>`;
    }
    html += `</div>`;
  }

  html += renderHistCardio("pre", workout, "Pre-Workout Cardio", settings, editMode);
  html += renderHistCardio("post", workout, "Post-Workout Cardio", settings, editMode);

  html += `
    <div class="field">
      <label>Notes</label>
      ${editMode
        ? `<textarea id="hist-notes">${escapeHtml(workout.notes || "")}</textarea>`
        : `<p class="text-dim" style="font-size:13.5px;">${workout.notes ? escapeHtml(workout.notes) : "No notes."}</p>`}
    </div>
  `;

  container.innerHTML = html;

  qs('[data-act="back"]', container).addEventListener("click", () => navigate("history"));
  qs('[data-act="toggle-edit"]', container).addEventListener("click", () => historyRenderDetail(container, navigate, params, { editMode: !editMode }));
  qs('[data-act="delete"]', container).addEventListener("click", async () => {
    const ok = await confirmModal({
      title: "Delete this workout?",
      body: "Deleting this workout may change your PRs, volume, exercise history, charts, and streak.",
      confirmLabel: "Delete",
      danger: true,
    });
    if (ok) {
      const snapshot = workout;
      await storage.deleteWorkout(workout.id);
      toast("Workout deleted", {
        undo: async () => { await storage.saveWorkout(snapshot); navigate("history-detail", { workoutId: snapshot.id }); },
      });
      navigate("history");
    }
  });

  if (editMode) wireEditHandlers(container, workout, navigate, params);
}

function renderHistSetRow(entry, set, i, settings, editMode) {
  const rowClass = set.completed ? "completed" : set.skipped ? "skipped" : "";
  const icon = set.completed ? "✓" : set.skipped ? "–" : "";
  // Historical sets always display/edit in the unit they were originally
  // recorded with — never the exercise's current preference.
  const unit = set.weightUnit || "kg";

  if (!editMode) {
    let text;
    if (set.unilateral) {
      const lw = set.leftWeightKg != null ? roundTo(displayWeight(set.leftWeightKg, unit)) : "–";
      const rw = set.rightWeightKg != null ? roundTo(displayWeight(set.rightWeightKg, unit)) : "–";
      text = `L ${lw}${unit}×${set.leftReps ?? "–"}  ·  R ${rw}${unit}×${set.rightReps ?? "–"}`;
    } else {
      const w = set.weightKg != null ? roundTo(displayWeight(set.weightKg, unit)) : "–";
      text = `${w}${unit} × ${set.reps ?? "–"}`;
    }
    return `
      <div class="set-row ${rowClass}">
        <div class="set-index">${i + 1}</div>
        <div class="set-inputs"><div class="set-col numeric" style="padding:9px 0;">${text}</div></div>
        <div class="set-complete-btn" style="pointer-events:none;">${icon}</div>
      </div>
      ${renderHistRirInfo(set)}`;
  }

  let inputs;
  if (set.unilateral) {
    const lw = set.leftWeightKg != null ? roundTo(displayWeight(set.leftWeightKg, unit)) : "";
    const rw = set.rightWeightKg != null ? roundTo(displayWeight(set.rightWeightKg, unit)) : "";
    inputs = `
      <div class="set-col">
        <div class="set-side-label">Left</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${unit}" value="${lw}" data-field="leftWeightKg" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="reps" value="${set.leftReps ?? ""}" data-field="leftReps" data-set="${i}">
        </div>
      </div>
      <div class="set-col">
        <div class="set-side-label">Right</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${unit}" value="${rw}" data-field="rightWeightKg" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="reps" value="${set.rightReps ?? ""}" data-field="rightReps" data-set="${i}">
        </div>
      </div>`;
  } else {
    const w = set.weightKg != null ? roundTo(displayWeight(set.weightKg, unit)) : "";
    inputs = `
      <div class="set-col"><input type="number" inputmode="decimal" placeholder="${unit}" value="${w}" data-field="weightKg" data-set="${i}"></div>
      <div class="set-col"><input type="number" inputmode="numeric" placeholder="reps" value="${set.reps ?? ""}" data-field="reps" data-set="${i}"></div>`;
  }

  return `
    <div class="set-row ${rowClass}" data-set="${i}">
      <div class="set-index" data-act="toggle-skip" data-set="${i}" style="cursor:pointer;">${i + 1}</div>
      <div class="set-inputs">${inputs}</div>
      <button class="set-complete-btn" data-act="toggle-complete" data-set="${i}">${icon}</button>
    </div>
    ${renderHistRirRow(set, i)}`;
}

function renderHistRirInfo(set) {
  if (!set.rir) return "";
  const rirLabel = RIR_OPTIONS.find((o) => o.value === set.rir)?.label;
  if (!rirLabel) return "";
  return `<div class="text-faint" style="padding-left:34px; margin-top:-6px; margin-bottom:6px;">${escapeHtml(`RIR ${rirLabel}`)}</div>`;
}

function renderHistRirRow(set, i) {
  const chips = RIR_OPTIONS.map((opt) => `
    <button type="button" class="chip-btn rir-chip ${set.rir === opt.value ? "active" : ""}" data-act="hist-set-rir" data-set="${i}" data-rir="${opt.value}">${escapeHtml(opt.label)}</button>
  `).join("");
  return `
    <div class="rir-row" data-set="${i}">
      <span class="rir-label">RIR</span>
      ${chips}
    </div>
  `;
}

function renderHistCardio(phase, workout, title, settings, editMode) {
  const c = workout.cardio?.[phase];
  if (!c) return "";

  if (!editMode) {
    if (c.status !== "completed" && c.status !== "skipped") return "";
    return `
      <div class="card">
        <div class="eyebrow">${title.toUpperCase()}</div>
        <div class="text-dim" style="margin-top:6px;">${c.status === "completed" ? "✓ Done" : "Skipped"}</div>
      </div>`;
  }

  return `
    <div class="card" data-cardio-edit="${phase}">
      <div class="eyebrow" style="margin-bottom:8px;">${title.toUpperCase()}</div>
      <div class="toggle-row">
        <button type="button" data-cardio-status="completed" class="${c.status === "completed" ? "active" : ""}">Done</button>
        <button type="button" data-cardio-status="skipped" class="${c.status === "skipped" ? "active" : ""}">Skipped</button>
      </div>
    </div>`;
}

function wireEditHandlers(container, workout, navigate, params) {
  qsa('.exercise-card', container).forEach((card, cardIdx) => {
    const entry = workout.exercises[cardIdx];

    qsa('input[data-field]', card).forEach((input) => {
      input.addEventListener("change", () => {
        const { field, set } = input.dataset;
        const s = entry.sets[Number(set)];
        const raw = input.value === "" ? null : Number(input.value);
        if (field.toLowerCase().includes("weight")) {
          // Edits to an existing recorded set stay in the unit it was
          // originally recorded with — never reinterpreted under today's
          // exercise preference.
          const unit = s.weightUnit || "kg";
          s[field] = raw == null ? null : toStorageWeight(raw, unit);
          if (raw != null && !s.weightUnit) s.weightUnit = unit;
        } else {
          s[field] = raw;
        }
        persistEdit(workout);
      });
    });

    qsa('[data-act="toggle-complete"]', card).forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = entry.sets[Number(btn.dataset.set)];
        if (!s.completed && !s.skipped) s.completed = true; else if (s.completed) s.completed = false;
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="toggle-skip"]', card).forEach((el) => {
      el.addEventListener("click", () => {
        const s = entry.sets[Number(el.dataset.set)];
        if (s.skipped) s.skipped = false; else { s.skipped = true; s.completed = false; }
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="hist-set-rir"]', card).forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = entry.sets[Number(btn.dataset.set)];
        s.rir = s.rir === btn.dataset.rir ? null : btn.dataset.rir;
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="hist-set-tempo"]', card).forEach((btn) => {
      btn.addEventListener("click", () => {
        entry.tempo = entry.tempo === btn.dataset.tempo ? null : btn.dataset.tempo;
        persistEdit(workout);
        historyRenderDetail(container, navigate, params, { editMode: true });
      });
    });
    qsa('[data-act="hist-ex-notes"]', card).forEach((ta) => {
      ta.addEventListener("change", () => {
        entry.notes = ta.value;
        persistEdit(workout);
      });
    });
  });

  ["pre", "post"].forEach((phase) => {
    const card = qs(`[data-cardio-edit="${phase}"]`, container);
    if (!card) return;

async function exercisesRenderList(container, navigate, query = "") {
  const defs = allExerciseDefs();
  const workouts = await storage.getWorkouts();

  const filtered = query
    ? defs.filter((d) => d.name.toLowerCase().includes(query.toLowerCase()))
    : defs;

  const lastPerformed = {};
  for (const w of workouts) {
    for (const e of w.exercises) {
      if (!lastPerformed[e.exerciseId] && e.sets.some((s) => s.completed)) {
        lastPerformed[e.exerciseId] = w.startedAt;
      }

  container.innerHTML = `

    <div class="section-title"><h2>Trend</h2></div>
    <div class="card">
      <span class="trend-tag" style="color:${trend.trend === "improving" ? "var(--c-positive)" : trend.trend === "declining" ? "var(--c-crimson-bright)" : "var(--c-off-dim)"}">${trend.label}</span>
      ${latestProgression ? `<p class="text-dim" style="margin:10px 0 0; font-size:13.5px;">Last session: ${escapeHtml(latestProgression.label)}</p>` : ""}

    <div class="section-title"><h2>Progression Timeline</h2></div>
    ${history.length ? `<div class="card">${history.map((h) => renderTimelineRow(h, def, workoutsAsc)).join("")}</div>` : `<p class="text-faint">No history yet.</p>`}

function renderHistoryRow(h, def, workoutsAsc) {
  const flags = computeEntryPRFlags(workoutsAsc, def.id, h.workoutId);
  const lines = h.entry.sets.filter((s) => s.completed).map((s) => {
    const unit = s.weightUnit || "kg";
    if (def.unilateral) {
      const lw = s.leftWeightKg != null ? roundTo(displayWeight(s.leftWeightKg, unit)) : "–";
      const rw = s.rightWeightKg != null ? roundTo(displayWeight(s.rightWeightKg, unit)) : "–";
      return `L ${lw}${unit}×${s.leftReps ?? "–"} · R ${rw}${unit}×${s.rightReps ?? "–"}`;
    }
    const w = s.weightKg != null ? roundTo(displayWeight(s.weightKg, unit)) : "–";
    return `${w}${unit} × ${s.reps ?? "–"}`;
  });
  return `
    <div class="history-item" data-act="open-workout" data-id="${h.workoutId}" style="cursor:pointer;">
      <div class="h-index">${formatDateShort(h.date)}</div>
      <div class="h-body">
        <div class="h-title numeric" style="font-size:13px; font-weight:500;">${lines.join(" · ")} ${flags.weightPR ? `<span class="badge badge-positive">Weight PR</span>` : ""} ${flags.repsPR ? `<span class="badge badge-positive">Rep PR</span>` : ""}</div>
      </div>
      <div class="h-chevron">›</div>
    </div>`;
}

// Progression timeline (item 11) — chronological oldest-first, reusing the
// same history array already built for the graph/history list; no separate
// database.
function renderTimelineRow(h, def, workoutsAsc) {
  const flags = computeEntryPRFlags(workoutsAsc, def.id, h.workoutId);
  const best = bestSetOf(h.entry);
  const monthLabel = new Date(h.date).toLocaleDateString(undefined, { month: "short", year: "numeric" });
  const perf = best ? `${roundTo(displayWeight(best.weight, "kg"))}kg × ${best.reps}` : "–";
  return `
    <div class="flex-between" data-act="open-workout" data-id="${h.workoutId}" style="padding:8px 0; border-top:1px solid var(--c-hairline); cursor:pointer;">
      <span class="text-dim" style="font-size:12.5px;">${monthLabel}</span>
      <span class="numeric">${perf} ${flags.weightPR || flags.repsPR ? `<span class="badge badge-positive" style="margin-left:6px;">PR</span>` : ""}</span>
    </div>`;
}

function sparkline(history) {
  // Volume is stored canonically in kg, so the sparkline always plots kg
  // regardless of any exercise's display-unit preference.
  const values = history.map((h) => h.volume);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const w = 300, h = 100, pad = 8;
  const step = values.length > 1 ? (w - pad * 2) / (values.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });
  const path = "M" + points.join(" L");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${points.join(" ")}" fill="none" stroke="var(--c-crimson-bright)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="${path} L${w - pad},${h} L${pad},${h} Z" fill="var(--c-crimson)" opacity="0.12"/>
  </svg>`;
}

  const settingsData = await storage.getSettings();

  const pattern = programState.pattern || [];

  const today = new Date();
  const next7 = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const key = dateKey(d);
    next7.push({
      date: d,
      key,
      patternLetter: cycleLetterForDate(d, startDateStr, pattern),

  // adjacent months are shown dimmed but are not clickable.
  const viewMonth = new Date(today.getFullYear(), today.getMonth() + calendarMonthOffset, 1);
  const monthLabel = viewMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const firstWeekday = viewMonth.getDay();

      day,
      date: d,
      key,
      letter: pattern.length ? effectiveDayTypeForDate(d, startDateStr, pattern, overrides) : null,

          <span style="display:flex; align-items:center; gap:6px;">

// ============================================================================
// Sequence editor — shared building blocks for the "Training Sequence"
// builder used both in the first-run Program Setup wizard and on the
// Schedule tab. A sequence is an array of day-type keys (or "R" for rest)
// that repeats continuously — see cycleLetterForDate(). Building blocks:
//   - sequenceEditorHTML(seq, dayTypeOptions, labelsMap): the chip/code/
//     meaning summary plus the reorderable position list, as an HTML string.
//   - wireSequenceEditor(card, seq, dayTypeOptions, rerender): attaches all
//     interaction handlers (reorder, change type, delete, add workout, add
//     rest). `seq` is mutated in place; `rerender` is called after any edit.
// ============================================================================

function sequenceEditorHTML(seq, dayTypeOptions, labelsMap) {
  const typeOptions = [...dayTypeOptions.map((dt) => dt.key), "R"];
  const { code, meaning } = sequenceSummary(seq, labelsMap);

  const chips = seq.length
    ? `<div class="sequence-chip-row">${seq.map((k, i) => `<span class="sequence-chip${k === "R" ? " is-rest" : ""}">${escapeHtml(labelsMap[k] || k)}</span>${i < seq.length - 1 ? `<span class="sequence-arrow">→</span>` : ""}`).join("")}</div>`
    : `<p class="text-faint" style="margin:0;">No days yet — add your first workout below.</p>`;

  return `
    <div class="sequence-summary-card" style="margin-bottom:14px;">
      ${chips}
      ${seq.length ? `<div class="sequence-code">${escapeHtml(code)}</div><div class="sequence-meaning text-faint">${escapeHtml(meaning)}</div>` : ""}
    </div>
    <div id="seq-rows">
      ${seq.map((key, i) => `
        <div class="flex-between" style="gap:8px; padding:7px 0; border-top:1px solid var(--c-hairline); align-items:center;">
          <span style="display:flex; flex-direction:column; gap:1px;">
            <button class="link-btn" data-act="seq-up" data-idx="${i}" ${i === 0 ? "disabled" : ""} style="font-size:10px; padding:0 6px; line-height:1.3; ${i === 0 ? "opacity:0.3;" : ""}">▲</button>
            <button class="link-btn" data-act="seq-down" data-idx="${i}" ${i === seq.length - 1 ? "disabled" : ""} style="font-size:10px; padding:0 6px; line-height:1.3; ${i === seq.length - 1 ? "opacity:0.3;" : ""}">▼</button>
          </span>
          <span class="text-faint numeric" style="min-width:20px;">${i + 1}</span>
          <select data-idx="${i}" class="seq-type-select" style="flex:1; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:9px 8px; font-size:13px;">
            ${typeOptions.map((k) => `<option value="${k}" ${k === key ? "selected" : ""}>${escapeHtml(labelsMap[k] || k)}</option>`).join("")}
          </select>
          <button class="link-btn" data-act="seq-remove" data-idx="${i}" style="color:var(--c-crimson-bright); font-size:16px; padding:2px 6px;">✕</button>
        </div>`).join("")}
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn" data-act="seq-add-workout">+ Add Workout</button>
      <button class="btn" data-act="seq-add-rest">+ Add Rest</button>
    </div>
  `;
}

function wireSequenceEditor(card, seq, dayTypeOptions, rerender) {
  qsa('[data-act="seq-up"], [data-act="seq-down"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.idx);
      const delta = btn.dataset.act === "seq-up" ? -1 : 1;
      const swap = idx + delta;
      if (swap < 0 || swap >= seq.length) return;
      [seq[idx], seq[swap]] = [seq[swap], seq[idx]];
      rerender();
    });
  });
  qsa(".seq-type-select", card).forEach((sel) => {
    sel.addEventListener("change", () => {
      seq[Number(sel.dataset.idx)] = sel.value;
      rerender();
    });
  });
  qsa('[data-act="seq-remove"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      seq.splice(Number(btn.dataset.idx), 1);
      rerender();
    });
  });
  qs('[data-act="seq-add-workout"]', card)?.addEventListener("click", () => {
    seq.push(dayTypeOptions[0]?.key || "R");
    rerender();
  });
  qs('[data-act="seq-add-rest"]', card)?.addEventListener("click", () => {
    seq.push("R");
    rerender();
  });
}

async function renderProgramSetup(container, navigate) {
  const programState = await storage.getProgramState();
  if (!setupChoice.split && programState.split) setupChoice = { split: programState.split };

  if (setupStep === "split") {
    container.innerHTML = `
      <h1 style="font-size:22px; margin:10px 0 6px;">Choose Your Program</h1>

          <button class="choice-card" data-split="${key}">
            <div class="choice-icon">◆</div>
            <div class="choice-title">${escapeHtml(def.label)}</div>
          </button>`).join("")}
      </div>
    `;
    qsa("[data-split]", container).forEach((btn) => {
      btn.addEventListener("click", () => {
        setupChoice = { split: btn.dataset.split };
        setupSequenceDraft = SPLIT_DEFS[btn.dataset.split].defaultPattern.slice();
        setupStep = "sequence";
        renderProgramSetup(container, navigate);
      });
    });

  }

  // sequence
  const splitDef = SPLIT_DEFS[setupChoice.split];
  if (!setupSequenceDraft) setupSequenceDraft = splitDef.defaultPattern.slice();
  const labels = { ...Object.fromEntries(splitDef.dayTypes.map((dt) => [dt.key, dt.label])), R: "Rest" };

  container.innerHTML = `

    <button class="btn btn-primary" id="setup-finish" style="width:100%;">Finish Setup</button>

    }

      dayTypes: splitDef.dayTypes,
      pattern: setupSequenceDraft.slice(),

    navigate("dashboard");
  });
}

// Resizes/compresses an image file client-side before storing it, so a full
// phone-camera photo doesn't bloat the account's stored data or the JSON backup export.
function resizeImageFile(file, maxDim = MAX_BG_DIMENSION, quality = BG_JPEG_QUALITY) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Could not load that image.")); };
    img.src = objectUrl;
  });
}

async function doSetBackground(e, container, navigate) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const dataUrl = await resizeImageFile(file);
    await storage.saveSettings({ backgroundImage: dataUrl });
    applyBackground(dataUrl);
    toast("Background updated");
    settingsRender(container, navigate);
  } catch (err) {
    toast("Couldn't use that image — try a different one");
  }
}

async function doExport() {
  const data = await storage.exportAllData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const date = nowISO().slice(0, 10);
  const a = document.createElement("a");
  a.href = url;
  a.download = `gym-tracker-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  await storage.markBackupComplete();
  toast("Backup exported");
}

async function doImport(e, container, navigate) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;

  const ok = await confirmModal({
    title: "Replace current data?",
    body: "This backup will replace your current workout data. Make sure you have exported your current data first. Continue?",
    confirmLabel: "Continue",
    danger: true,
  });
  if (!ok) return;

  try {
    const text = await file.text();
    const result = await storage.importAllData(text);
    if (!result.ok) {
      await confirmModal({ title: "Import failed", body: escapeHtml(result.errors.join(" ")), confirmLabel: "OK", cancelLabel: "Close" });
      return;
    }
    const importedProgramState = await storage.getProgramState();
    setProgramDayTypes(importedProgramState.dayTypes);
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    const importedSettings = await storage.getSettings();
    applyTheme(importedSettings.theme);
    applyBackground(importedSettings.backgroundImage);
    applyAccentColor(importedSettings.accentColor);
    toast("Backup restored");
    settingsRender(container, navigate);
  } catch (err) {
    await confirmModal({ title: "Import failed", body: "The file could not be read. " + escapeHtml(err.message || ""), confirmLabel: "OK", cancelLabel: "Close" });
  }
}

async function doReset(container, navigate) {

    body: "This permanently deletes every workout, custom exercise, and setting on this device. This cannot be undone.",

  settingsRender(container, navigate);
}

    </div>`;
}

// Parses free-typed program text into { [dayTypeKey]: [...] } for the
// current PROGRAM_DAY_TYPES. A day type's label or key on its own line
// switches which section following exercise lines fall into (starts in the
// first day type until the first switch). Per exercise line: trailing "x4"
// / "4x" / "3 sets" sets the set count (default 2), and the word
// "unilateral" (or "uni", "single-arm", etc.) anywhere in the line marks it
// unilateral and gets stripped from the name.
function parseProgramText(text) {
  const lines = (text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const result = {};
  for (const dt of PROGRAM_DAY_TYPES) result[dt.key] = [];
  if (!PROGRAM_DAY_TYPES.length) return result;
  let section = PROGRAM_DAY_TYPES[0].key;

  const headerMatch = (lowerLine) => PROGRAM_DAY_TYPES.find((dt) =>
    lowerLine === dt.key.toLowerCase() || lowerLine === `${dt.key.toLowerCase()}:` || lowerLine === `${dt.key.toLowerCase()}-` ||
    lowerLine === dt.label.toLowerCase() || lowerLine === `${dt.label.toLowerCase()}:` || lowerLine === `${dt.label.toLowerCase()}-`
  );

  for (const raw of lines) {
    const lowerLine = raw.toLowerCase();
    const header = headerMatch(lowerLine);
    if (header) { section = header.key; continue; }

    let line = raw;

    let unilateral = false;
    const uniMatch = line.match(/[\(\[]?\s*\b(unilateral|uni|single[- ]arm|single[- ]leg|one[- ]arm|one[- ]leg)\b\s*[\)\]]?/i);
    if (uniMatch) {
      unilateral = true;
      line = line.replace(uniMatch[0], "");
    }

    let sets = 2;
    const setsMatch = line.match(/(?:(\d+)\s*(?:x|×)\b|\b(?:x|×)\s*(\d+)\b|(\d+)\s*sets?\b)/i);
    if (setsMatch) {
      sets = parseInt(setsMatch[1] || setsMatch[2] || setsMatch[3], 10);
      line = line.replace(setsMatch[0], "");
    }

    const name = line
      .replace(/^[-*•\d.\)]+\s*/, "")
      .replace(/[-–,:]+\s*$/, "")
      .replace(/\s{2,}/g, " ")
      .trim();

    if (!name) continue;
    result[section].push({ name, sets: Math.max(1, Math.min(10, sets || 2)), unilateral });
  }
  return result;
}

      return;

    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const id = `custom-${slug || "exercise"}-${uid().slice(0, 6)}`;

    await storage.addCustomExercise({ id, name, type: selectedType, sets, unilateral: selectedUni, muscles: newExerciseMuscles, createdAt: nowISO() });
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    toast(`${name} added to ${PROGRAM[selectedType]?.label || selectedType}`);
    renderProgramOverview(container, navigate);

  qs("#bulk-program-apply", container).addEventListener("click", async () => {
    const text = qs("#bulk-program-text", container).value;
    const parsed = parseProgramText(text);
    const total = PROGRAM_DAY_TYPES.reduce((sum, dt) => sum + (parsed[dt.key]?.length || 0), 0);
    if (!total) {
      toast("Couldn't find any exercises in that text");
      return;
    }

    const existing = await storage.getCustomExercises();
    const hasExisting = existing.length > 0;
    const breakdown = PROGRAM_DAY_TYPES.map((dt) => `${parsed[dt.key]?.length || 0} to ${dt.label}`).join(", ");
    const ok = await confirmModal({
      title: hasExisting ? `Replace exercises with these ${total}?` : `Add these ${total} exercises?`,
      body: hasExisting
        ? `This deletes your current exercise list and adds ${breakdown}.`
        : `This adds ${breakdown}.`,
      confirmLabel: hasExisting ? "Replace" : "Add",
      danger: hasExisting,
    });
    if (!ok) return;

    for (const c of existing) {
      await storage.deleteCustomExercise(c.id);
    }
    for (const dt of PROGRAM_DAY_TYPES) {
      for (const ex of (parsed[dt.key] || [])) {
        const slug = ex.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
        const id = `custom-${slug || "exercise"}-${uid().slice(0, 6)}`;
        await storage.addCustomExercise({ id, name: ex.name, type: dt.key, sets: ex.sets, unilateral: ex.unilateral, createdAt: nowISO() });
      }
    }
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    toast(`Program updated — ${total} exercises added`);
    renderProgramOverview(container, navigate);
  });
}

const settings = { render: settingsRender, renderProgramOverview };
const appEl = document.getElementById("app");
const navButtons = qsa(".nav-btn");

let currentParams = {};
let currentRoute = null;

const TOP_LEVEL = ["dashboard", "workout", "history", "exercises", "schedule", "settings"];

function navRootFor(route) {
  if (route.startsWith("workout")) return "workout";
  if (route.startsWith("history")) return "history";
  if (route.startsWith("exercise")) return "exercises";
  if (route === "schedule") return "schedule";
  if (route.startsWith("settings") || route === "program-overview" || route === "program-setup") return "settings";
  return "dashboard";
}

function navigate(route, params = {}) {
  currentParams = params;
  const id = params.workoutId || params.exerciseId || "";
  const hash = "#/" + route + (id ? "/" + id : "");
  if (window.location.hash === hash) {
    renderRoute(route, params);
  } else {
    window.location.hash = hash;
  }
}

function parseHash() {
  const raw = window.location.hash.replace(/^#\//, "");
  const [route, id] = raw.split("/");
  return { route: route || "dashboard", id: id || null };
}

async function renderRoute(route, params) {
  currentRoute = route;
  workout.teardown();

  navButtons.forEach((btn) => {
    const isActive = btn.dataset.route === navRootFor(route);
    btn.toggleAttribute("aria-current", isActive);
    if (isActive) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });

  appEl.scrollTop = 0;
  window.scrollTo(0, 0);

  try {
    switch (route) {
      case "dashboard":
        await dashboard.render(appEl, navigate);
        break;
      case "workout":
        await workout.renderWorkoutHome(appEl, navigate);
        break;
      case "workout-active":
        await workout.renderActiveWorkout(appEl, navigate);
        break;
      case "workout-summary":
        await workout.renderWorkoutSummary(appEl, navigate, params);
        break;
      case "history":
        await historyModule.renderList(appEl, navigate);
        break;
      case "history-detail":
        await historyModule.renderDetail(appEl, navigate, params);
        break;
      case "exercises":
        await exercisesModule.renderList(appEl, navigate);
        break;
      case "exercise-detail":
        await exercisesModule.renderDetail(appEl, navigate, params);
        break;
      case "schedule":
        await scheduleModule.render(appEl, navigate);
        break;
      case "settings":
        await settings.render(appEl, navigate);
        break;
      case "program-overview":
        await settings.renderProgramOverview(appEl, navigate);
        break;
      case "program-setup":
        await programSetupModule.render(appEl, navigate);
        break;
      default:
        await dashboard.render(appEl, navigate);
    }
  } catch (err) {
    console.error("[app] render failed for route", route, err);
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Something went wrong loading this screen</h3>
        <p>Your workout data is safe in local storage. Try going back to the dashboard.</p>
        <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" id="err-home">Go to Dashboard</button>
      </div>`;
    document.getElementById("err-home")?.addEventListener("click", () => navigate("dashboard"));
  }
}

window.addEventListener("hashchange", () => {
  const { route, id } = parseHash();
  const params = id
    ? (currentParams.workoutId === id || currentParams.exerciseId === id ? currentParams : (route.startsWith("history") || route.startsWith("workout") ? { workoutId: id } : { exerciseId: id }))
    : {};
  renderRoute(route, params);
});

navButtons.forEach((btn) => {
  btn.addEventListener("click", () => navigate(btn.dataset.route));
});

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  try {
    // Relative path so this works when the app is deployed under a
    // sub-path, e.g. https://username.github.io/gym-tracker/
    await navigator.serviceWorker.register("./service-worker.js");
  } catch (err) {
    console.warn("[app] service worker registration failed:", err);
  }
}
