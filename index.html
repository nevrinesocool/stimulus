          <div style="margin-bottom:6px;">
            <span class="text-dim" style="font-size:12.5px; font-weight:600;">${escapeHtml(dt.label)}</span>
            <ul style="margin:2px 0 0; padding-left:18px; font-size:12.5px; color:var(--c-off-dim);">
              ${parsed[dt.key].map((ex) => `<li>${escapeHtml(ex.name)} — ${ex.sets} sets${ex.reps ? ` × ${escapeHtml(ex.reps)} reps` : ""}${ex.unilateral ? " (unilateral)" : ""}${ex.restSeconds ? ` · rest ${restTimerTimeLabel(ex.restSeconds)}` : ""}</li>`).join("")}
            </ul>
          </div>`).join("")}
      </div>`;
  };
  qs("#bulk-program-text", container).addEventListener("input", renderBulkPreview);
  renderBulkPreview();

  qs("#bulk-program-apply", container).addEventListener("click", async () => {
    const text = qs("#bulk-program-text", container).value;
    const parsed = parseProgramText(text);
    const total = PROGRAM_DAY_TYPES.reduce((sum, dt) => sum + (parsed[dt.key]?.length || 0), 0);
    if (!total) {
      toast("Couldn't find any exercises in that text");
      return;
    }

    const existing = await storage.getCustomExercises();
    const hasExisting = existing.length > 0;
    const breakdown = PROGRAM_DAY_TYPES.map((dt) => `${parsed[dt.key]?.length || 0} to ${dt.label}`).join(", ");
    const ok = await confirmModal({
      title: hasExisting ? `Replace exercises with these ${total}?` : `Add these ${total} exercises?`,
      body: hasExisting
        ? `This deletes your current exercise list and adds ${breakdown}.`
        : `This adds ${breakdown}.`,
      confirmLabel: hasExisting ? "Replace" : "Add",
      danger: hasExisting,
    });
    if (!ok) return;

    for (const c of existing) {
      await storage.deleteCustomExercise(c.id);
    }
    // Exercises with no "rest ..." in their line keep using the global
    // default (getExerciseRestSeconds falls back to it), so only lines
    // that actually specified a rest get an entry in this map.
    const restOverrides = {};
    for (const dt of PROGRAM_DAY_TYPES) {
      for (const ex of (parsed[dt.key] || [])) {
        const slug = ex.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
        const id = `custom-${slug || "exercise"}-${uid().slice(0, 6)}`;
        await storage.addCustomExercise({ id, name: ex.name, type: dt.key, sets: ex.sets, unilateral: ex.unilateral, targetReps: ex.reps || null, createdAt: nowISO() });
        if (ex.restSeconds) restOverrides[id] = ex.restSeconds;
      }
    }
    // Apply just deleted the whole previous exercise list, so any old
    // per-exercise rest overrides (keyed to those now-gone ids) are dead
    // weight — replace the map outright rather than merging into it, even
    // when this paste didn't specify "rest" for anything.
    cachedSettings.exerciseRestSeconds = restOverrides;
    await storage.saveSettings({ exerciseRestSeconds: restOverrides });
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    toast(`Program updated — ${total} exercises added`);
    renderProgramOverview(container, navigate);
  });
}

const settings = { render: settingsRender, renderProgramOverview, renderBulkTags };
const appEl = document.getElementById("app");
const navButtons = qsa(".nav-btn");

let currentParams = {};
let currentRoute = null;

const TOP_LEVEL = ["dashboard", "workout", "history", "exercises", "schedule", "settings"];

function navRootFor(route) {
  if (route.startsWith("workout")) return "workout";
  if (route.startsWith("history")) return "history";
  if (route.startsWith("exercise")) return "exercises";
  if (route === "schedule") return "schedule";
  if (route.startsWith("settings") || route === "program-overview" || route === "bulk-tags" || route === "program-setup") return "settings";
  return "dashboard";
}

function navigate(route, params = {}) {
  currentParams = params;
  const id = params.workoutId || params.exerciseId || "";
  const hash = "#/" + route + (id ? "/" + id : "");
  if (window.location.hash === hash) {
    renderRoute(route, params);
  } else {
    window.location.hash = hash;
  }
}

function parseHash() {
  const raw = window.location.hash.replace(/^#\//, "");
  const [route, id] = raw.split("/");
  return { route: route || "dashboard", id: id || null };
}

let routeRenderToken = 0;
async function renderRoute(route, params) {
  const myToken = ++routeRenderToken;
  currentRoute = route;
  workout.teardown();

  navButtons.forEach((btn) => {
    const isActive = btn.dataset.route === navRootFor(route);
    btn.toggleAttribute("aria-current", isActive);
    if (isActive) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });

  appEl.scrollTop = 0;
  window.scrollTo(0, 0);

  try {
    switch (route) {
      case "dashboard":
        await dashboard.render(appEl, navigate);
        break;
      case "workout":
        await workout.renderWorkoutHome(appEl, navigate);
        break;
      case "workout-active":
        await workout.renderActiveWorkout(appEl, navigate);
        break;
      case "workout-summary":
        await workout.renderWorkoutSummary(appEl, navigate, params);
        break;
      case "history":
        await historyModule.renderList(appEl, navigate);
        break;
      case "history-detail":
        await historyModule.renderDetail(appEl, navigate, params);
        break;
      case "exercises":
        await exercisesModule.renderList(appEl, navigate);
        break;
      case "exercise-detail":
        await exercisesModule.renderDetail(appEl, navigate, params);
        break;
      case "schedule":
        await scheduleModule.render(appEl, navigate);
        break;
      case "settings":
        await settings.render(appEl, navigate);
        break;
      case "program-overview":
        await settings.renderProgramOverview(appEl, navigate);
        break;
      case "bulk-tags":
        await settings.renderBulkTags(appEl, navigate);
        break;
      case "program-setup":
        await programSetupModule.render(appEl, navigate);
        break;
      default:
        await dashboard.render(appEl, navigate);
    }
  } catch (err) {
    if (myToken !== routeRenderToken) return;
    console.error("[app] render failed for route", route, err);
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Something went wrong loading this screen</h3>
        <p>This didn't touch your saved data. Try going back to the dashboard.</p>
        <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" id="err-home">Go to Dashboard</button>
      </div>`;
    document.getElementById("err-home")?.addEventListener("click", () => navigate("dashboard"));
  }
  // Fade/rise the new screen in. Re-triggering a CSS animation on the same
  // element needs a forced reflow (re-adding a class that's already there
  // is a no-op), which is why the class is removed and read back before
  // being re-added — cheap way to get a per-route transition without
  // touching every individual render function.
  appEl.classList.remove("route-anim");
  void appEl.offsetWidth;
  appEl.classList.add("route-anim");
}

window.addEventListener("hashchange", () => {
  const { route, id } = parseHash();
  const params = id
    ? (currentParams.workoutId === id || currentParams.exerciseId === id ? currentParams : (route.startsWith("history") || route.startsWith("workout") ? { workoutId: id } : { exerciseId: id }))
    : {};
  renderRoute(route, params);
});

navButtons.forEach((btn) => {
  btn.addEventListener("click", () => navigate(btn.dataset.route));
});

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  try {
    // A controller already present means this is an update, not a first install.
    const hadController = !!navigator.serviceWorker.controller;
    let prompted = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || prompted) return;
      prompted = true;
      // Never reload on the user's behalf — they may be mid-workout.
      toast("Stimulus was updated. Reload to use the new version.", {
        undo: () => location.reload(), actionLabel: "Reload", duration: 20000,
      });
    });
    // Relative path so this works when the app is deployed under a
    // sub-path, e.g. https://username.github.io/gym-tracker/
    const reg = await navigator.serviceWorker.register("./service-worker.js");
    // Installed PWAs can stay open for days; check for a new version on return.
    let lastCheck = Date.now();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && Date.now() - lastCheck > 30 * 60 * 1000) {
        lastCheck = Date.now();
        reg.update().catch(() => {});
      }
    });
  } catch (err) {
    console.warn("[app] service worker registration failed:", err);
  }
}

// Ask the browser not to evict the offline database under storage pressure.
async function requestPersistentStorage() {
  try {
    if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) {
      await navigator.storage.persist();
    }
  } catch (_) {}
}

// Last-resort error surfacing: log everything, tell the user at most every 15s.
let lastErrorToastAt = 0;
function reportUnexpectedError(kind, err) {
  console.error(`[app] ${kind}`, err);
  const now = Date.now();
  if (now - lastErrorToastAt < 15000) return;
  lastErrorToastAt = now;
  try { toast("Something went wrong. Your logged sets are safe — if it keeps happening, reload the app.", { duration: 5000 }); } catch (_) {}
}
window.addEventListener("error", (e) => reportUnexpectedError("uncaught error", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => reportUnexpectedError("unhandled rejection", e.reason));

function renderAuthScreen() {

      </div>
      <p style="text-align:center; margin-top:18px;">

      showMsg(error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = authMode === "signin" ? "Sign In" : "Create Account";
      return;
    }

    if (authMode === "signup" && !data.session) {
      // Email confirmation is required before a session exists.
      authMode = "signin";
      renderAuthScreen();
      showMsg("Account created — check your email to confirm, then sign in.", false);
      return;
    }

    document.body.classList.remove("pre-auth");
    try {
      await bootApp();
    } catch (err) {
      console.error("[app] boot after sign-in failed", err);
      appEl.innerHTML = `
        <div class="empty-state">
          <span class="glyph">⚠</span>
          <h3>Couldn't start the app</h3>
          <p>${escapeHtml((err && err.message) || "Unknown error")}</p>
          <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" onclick="location.reload()">Reload</button>
        </div>`;
    }
  });

  [qs("#auth-email", appEl), qs("#auth-password", appEl)].forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") qs("#auth-submit", appEl).click(); });
  });
}

supa.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") {
    try { localStorage.removeItem(UID_CACHE_KEY); } catch (_) {}
    // Rest timer state is device-local, not per-account — clear it on
    // sign-out so a timer started by one account can't bleed into the
    // next person who signs in on this device/browser.
    dismissRestTimer();
    location.reload();
  }
});

async function boot() {
  try {
    const { data: sessionData } = await supa.auth.getSession();
    // With no signal the stored login can't always be refreshed, but the data
    // on the phone is still this person's — let them in.
    if (!sessionData.session && !(navigator.onLine === false && cachedUserId())) {
      renderAuthScreen();
      return;
    }
    await bootApp();
  } catch (err) {
    console.error("[app] boot failed", err);
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Couldn't start the app</h3>
        <p>${(err && err.message) ? escapeHtml(err.message) : "Unknown error"}</p>
        <button class="btn btn-primary" style="margin-top:16px; width:auto; padding-left:24px; padding-right:24px;" id="boot-retry">Reload</button>
      </div>`;
    document.getElementById("boot-retry")?.addEventListener("click", () => location.reload());
  }
}

async function bootApp() {
  const result = await storage.init();
  initSaveIndicator(storage.onSaveStateChange);

  if (!result.ok) {
    appEl.innerHTML = `
      <div class="empty-state">
        <span class="glyph">⚠</span>
        <h3>Couldn't reach your data</h3>
        <p>Stimulus could not load your account's data (${result.reason || "unknown error"}). Check your internet connection and reload. If this keeps happening, the app's Supabase configuration may be incorrect.</p>
      </div>`;
    return;
  }

  const settingsData = await storage.getSettings();
  applyTheme(settingsData.theme);
  applyBackground(settingsData.backgroundImage);
  applyAccentColor(settingsData.accentColor);
  const programState = await storage.getProgramState();
  setProgramDayTypes(programState.dayTypes);
  applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());

  const { route, id } = parseHash();
  const params = id ? (route.startsWith("history") || route.startsWith("workout") ? { workoutId: id } : { exerciseId: id }) : {};
  await renderRoute(route, params);

  registerServiceWorker();
  requestPersistentStorage();
}

boot();
restoreRestTimerFromStorage();

</script>
</body>
</html>
