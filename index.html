// ---- Bulk editor -----------------------------------------------------------
async function renderBulkTags(container, navigate, keepSelected) {
  const rows = PROGRAM_DAY_TYPES.flatMap((dt) => (PROGRAM[dt.key] ? PROGRAM[dt.key].exercises : []).map((e) => ({ e, label: dt.label })));
  const selected = new Set([...(keepSelected || [])].filter((id) => rows.some((r) => r.e.id === id)));
  const pending = {}; // regionKey -> 1 | 0.5 | 0, only for regions the user touched
  const picked = () => rows.filter((r) => selected.has(r.e.id)).map((r) => r.e);
  const common = (k) => {
    const list = picked();
    if (!list.length) return 0;
    const v = list[0].regions[k] || 0;
    return list.every((e) => (e.regions[k] || 0) === v) ? v : "mixed";
  };
  const stateOf = (k) => (k in pending ? pending[k] : common(k));

  container.innerHTML = `
    <button class="link-btn" data-act="back">‹ Program Overview</button>
    <h1 style="font-size:22px; margin:10px 0 6px;">Bulk Tag Regions</h1>
    <p class="text-faint" style="margin:0 0 14px; font-size:13px;">Select exercises, then tap regions: Full counts 1.0 set, Half counts 0.5. An exercise counts once per group, at its highest credit. “~” means the selected exercises differ.</p>
    <div class="bt-bar">
      <button class="link-btn" data-act="all">Select all</button>
      <button class="link-btn" data-act="none">Clear</button>
      <span class="text-faint" id="bt-untagged"></span>
    </div>
    <div class="bt-panel" id="bt-panel" hidden>
      <div class="flex-between" style="gap:8px; margin-bottom:10px;">
        <strong id="bt-count"></strong>
        <span style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-sm" data-act="reset" type="button">Reset</button>
          <button class="btn btn-primary btn-sm" data-act="apply" type="button">Apply</button>
        </span>
      </div>
      <div id="bt-picker"></div>
    </div>
    <div class="card" id="bt-list">
      ${rows.length ? rows.map(({ e, label }) => `
        <label class="bt-row">
          <input type="checkbox" data-id="${escapeHtml(e.id)}" ${selected.has(e.id) ? "checked" : ""}>
          <span class="bt-main"><span class="bt-name">${escapeHtml(e.name)}</span>
          <span class="bt-sub">${escapeHtml(label)} · ${escapeHtml(muscleSummaryText(e))}</span></span>
        </label>`).join("") : `<p class="text-faint" style="margin:0;">No exercises in your program yet.</p>`}
    </div>`;

  const panel = qs("#bt-panel", container), applyBtn = qs('[data-act="apply"]', container);
  const picker = mountRegionPicker(qs("#bt-picker", container), {
    getState: stateOf,
    onCycle: (k) => { pending[k] = nextRegionState(stateOf(k)); sync(); },
  });
  const untagged = rows.filter((r) => !Object.keys(r.e.regions).length).length;
  qs("#bt-untagged", container).textContent = untagged ? `${untagged} untagged` : "All tagged";

  function sync() {
    const n = selected.size, t = Object.keys(pending).length;
    panel.hidden = n === 0;
    qs("#bt-count", container).textContent = `${n} selected`;
    applyBtn.disabled = !t;
    applyBtn.textContent = t ? `Apply ${t} change${t > 1 ? "s" : ""}` : "Apply";
  }
  sync();

  qs("#bt-list", container).addEventListener("change", (ev) => {
    const cb = ev.target.closest("input[data-id]");
    if (!cb) return;
    if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
    picker.redraw();
    sync();
  });
  const setAll = (on) => {
    qsa("#bt-list input[data-id]", container).forEach((cb) => { cb.checked = on; if (on) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id); });
    picker.redraw(); sync();
  };
  qs('[data-act="all"]', container).addEventListener("click", () => setAll(true));
  qs('[data-act="none"]', container).addEventListener("click", () => setAll(false));
  qs('[data-act="reset"]', container).addEventListener("click", () => { for (const k in pending) delete pending[k]; picker.redraw(); sync(); });
  qs('[data-act="back"]', container).addEventListener("click", () => navigate("program-overview"));
  applyBtn.addEventListener("click", async () => {
    const keys = Object.keys(pending);
    if (!keys.length || !selected.size) return;
    const patch = {};
    for (const e of picked()) {
      const r = { ...e.regions };
      for (const k of keys) { if (pending[k]) r[k] = pending[k]; else delete r[k]; }
      patch[e.id] = r;
    }
    await storage.bulkUpdateCustomExercises(patch);
    applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    toast(`Updated ${Object.keys(patch).length} exercise${Object.keys(patch).length > 1 ? "s" : ""}`);
    renderBulkTags(container, navigate, selected);
  });
}

// ============================================================================

// Building blocks a "Custom / Hybrid" program can be assembled from — reuses
// the exact same keys/labels as the built-in splits above, so e.g. picking
// Anterior + Posterior + Full Body here is functionally identical to an
// "AP" program with a Full Body day folded into the same sequence. Nothing
// downstream of program setup (schedule, exercise assignment, dashboard
// coloring, etc.) cares how a day type came to exist — it all already reads
// off the generic PROGRAM_DAY_TYPES list, so this needed no other changes.
const DAY_TYPE_LIBRARY = [
  { key: "FB", label: "Full Body" },
  { key: "A", label: "Anterior" },
  { key: "P", label: "Posterior" },
  { key: "U", label: "Upper" },

// Builds the compact letter code (e.g. "ULUR") and its full spelled-out
// meaning (e.g. "Upper → Lower → Upper → Rest") for a training sequence.
function sequenceSummary(seq, labelsMap) {
  return {
    code: seq.join(""),
    meaning: seq.map((k) => labelsMap[k] || k).join(" → "),
  };
}

function dayTypeLabels() {
  const map = { R: "Rest" };
  for (const dt of PROGRAM_DAY_TYPES) map[dt.key] = dt.label;
  return map;
}

// Assigns a stable color to each day-type key so the same type always
// looks the same across the Next-7-Days strip and the month calendar.
// "R" (Rest) always gets the dim/neutral treatment; everything else
// cycles through a small accent palette by position in PROGRAM_DAY_TYPES.
const DAY_TYPE_COLOR_VARS = ["--c-positive", "--c-crimson-bright", "--c-gold", "--c-warn"];
function dayTypeColorVar(key) {
  if (!key || key === "R") return "--c-off-faint";
  const idx = PROGRAM_DAY_TYPES.findIndex((dt) => dt.key === key);
  if (idx < 0) return "--c-off-faint";
  return DAY_TYPE_COLOR_VARS[idx % DAY_TYPE_COLOR_VARS.length];
}

// Which day type (or "R" for rest) the training pattern schedules for a
// given date, cycling the pattern from settings.scheduleStartDate. Returns
// null if there's no pattern yet (setup not complete, or a freshly-created
// Modified split with no days added).
function cycleLetterForDate(dateObj, startDateStr, pattern) {
  if (!pattern || !pattern.length) return null;
  const [sy, sm, sd] = (startDateStr || DEFAULT_SETTINGS.scheduleStartDate).split("-").map(Number);
  const s = new Date(sy, sm - 1, sd);
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const diffDays = Math.round((d - s) / 86400000);
  const idx = ((diffDays % pattern.length) + pattern.length) % pattern.length;
  return pattern[idx];
}

// A YYYY-MM-DD key for a date, in local time (not UTC) — used to key
// per-date schedule overrides so "today" means the user's actual today.
function dateKey(dateObj) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, "0");
  const d = String(dateObj.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// Adds (or subtracts, with a negative delta) whole days to a "YYYY-MM-DD"
// string, returning a new "YYYY-MM-DD" string. Used by the Schedule tab's
// "shift everything forward/back a day" quick actions.
function addDaysToDateStr(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return dateKey(dt);
}

// Like cycleLetterForDate, but lets a per-date override (set from the
// What the training pattern schedules for today, given today's date —
// returns a day-type key, "R" for a rest day, or null if no pattern is set
// yet. Used to drive the dashboard/workout-home "Suggested" badge.
// overrides is optional; pass storage.getScheduleOverrides() result when
// available so a manual swap for today is respected.
function todaysScheduledType(history, overrides) {
  return effectiveDayTypeForDateV(new Date(), history, overrides || {});
}

// ============================================================================
// PROGRAM VERSION HISTORY — the training sequence itself can change over
// time (new split, new frequency, entirely different program), and a change
// must never rewrite what earlier dates — or already-logged workouts —
// were scheduled as. programHistory is an append-only list of
// { id, pattern, effectiveFrom, createdAt }; a date resolves to whichever
// entry's effectiveFrom is the most recent one on or before it, cycling
// from THAT entry's own effectiveFrom (so a new pattern always starts at
// day 0 on the date it takes effect, however far in the future that is).
// ============================================================================

function resolvePatternVersion(dateStr, history) {
  if (!history || !history.length) return null;
  const sorted = [...history].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
  let match = sorted[0];
  for (const v of sorted) {
    if (v.effectiveFrom <= dateStr) match = v;
    else break;
  }
  return match;
}

// The pure sequence letter for a date — no manual overrides applied. Used
// wherever the UI needs to show "what the sequence itself says" (e.g. to
// detect and label a manual override as "(swapped)").
function patternLetterForDateV(dateObj, history) {
  const version = resolvePatternVersion(dateKey(dateObj), history);
  if (!version) return null;
  return cycleLetterForDate(dateObj, version.effectiveFrom, version.pattern);
}

// The version-aware replacement for effectiveDayTypeForDate — resolves the
// right program version for the date first, then applies any one-date
// manual override on top (an override always wins, regardless of version).
function effectiveDayTypeForDateV(dateObj, history, overrides) {
  const key = dateKey(dateObj);
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, key)) return overrides[key];
  return patternLetterForDateV(dateObj, history);
}

// The next date on which the current rotation would naturally restart at
// position 0 — the natural seam to slot a new pattern into without cutting
// the current rotation short. Powers the "Finish Current Rotation" choice
// when changing the training sequence.
function nextRotationBoundary(dateStr, effectiveFromAnchor, patternLength) {
  if (!patternLength) return dateStr;
  const [y, m, d] = dateStr.split("-").map(Number);
  const dateObj = new Date(y, m - 1, d);
  const [ay, am, ad] = effectiveFromAnchor.split("-").map(Number);
  const anchorObj = new Date(ay, am - 1, ad);
  const diffDays = Math.round((dateObj - anchorObj) / 86400000);
  const position = ((diffDays % patternLength) + patternLength) % patternLength;
  const daysUntilBoundary = position === 0 ? patternLength : (patternLength - position);
  return addDaysToDateStr(dateStr, daysUntilBoundary);
}

// Parses a "YYYY-MM-DD" string into a short local-date label without ever
// going through UTC parsing (new Date("2026-09-08") can render as Sept 7 in
// timezones behind UTC) — mirrors the local-time convention dateKey() uses.
function formatDateStrShort(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// ============================================================================
// DB — low-level Supabase-backed storage engine.
//
// This module ONLY knows how to open the database and do generic CRUD against
// its object stores. It has no knowledge of workouts, settings, or program
// concepts — that logic lives in storage.js, which is the layer the rest of
// the app is supposed to talk to. Nothing outside db.js/storage.js should
// touch Supabase directly.
//
// Backing store: a single Postgres table (see supabase-schema.sql) shaped
// like (user_id, store, record_id, data jsonb). Every row is scoped to the
// signed-in user via Row Level Security, so this file never has to filter
// by user itself — Postgres refuses any row that isn't theirs. This mirrors
// the previous local-only layout 1:1 (three "stores": kv / workouts /
// activeWorkout) so every function below it (storage.js) is unchanged.
// ============================================================================

const STORE_WORKOUTS = "workouts";
const STORE_ACTIVE = "activeWorkout";
const STORE_KV = "kv";
const TABLE = "app_records";

let unavailableReason = null;

function getUnavailableReason() {
  return unavailableReason;
}

// The "id" a record is keyed by, matching the old keyPath per store
// (workouts keyed by their own "id" field, kv keyed by "key").
//
// activeWorkout is a single fixed slot ("only one in-progress workout at a
// time") — the record_id used for the database row must always be the
// constant ACTIVE_ID regardless of the workout's own id. Previously this was
// done by overwriting the workout object's own `id` field to ACTIVE_ID
// before saving it, but that corrupted the field once the object was read
// back: getActiveWorkout() would hand back a workout whose `id` was now
// literally "active", and that polluted id then flowed through to
// finishWorkout() -> saveWorkout(), so every completed workout was written
// to the SAME row in the workouts table, silently overwriting all prior
// history. Keying off the constant here, independent of the value's own
// id, keeps the single-slot behavior without ever touching the workout's
// real id.
function recordIdOf(storeName, value) {
  if (storeName === STORE_KV) return String(value.key);
  if (storeName === STORE_ACTIVE) return "active";
  return String(value.id);
}

// ============================================================================
// OFFLINE LAYER — every read and write goes through a copy of your data kept
// on this phone (IndexedDB). Writes land there instantly and are queued to
// sync to Supabase in the background, so logging works with no signal and
// nothing is lost if the connection drops mid-workout. Reads prefer the
// server while it is reachable (so other devices stay in sync) and fall back
// to the local copy when it isn't.
// ============================================================================

const UID_CACHE_KEY = "stimulus.uid";
function cachedUserId() {
  try { return localStorage.getItem(UID_CACHE_KEY); } catch (_) { return null; }
}

// getSession() reads the stored login on the phone (no network round trip),
// so it keeps working with no signal. The id is remembered as a fallback for
// the moments the stored session can't be refreshed offline.
async function currentUserId() {
  try {
    const { data } = await supa.auth.getSession();
    const id = data?.session?.user?.id;
    if (id) {
      try { localStorage.setItem(UID_CACHE_KEY, id); } catch (_) {}
      return id;
    }
  } catch (_) { /* fall through to the remembered id */ }
  const cached = cachedUserId();
  if (cached) return cached;
  throw new Error("Not signed in.");
}

function netError(error, status) {
  const e = error instanceof Error ? error : Object.assign(new Error((error && error.message) || "Request failed"), error || {});
  e.status = status;
  return e;
}

// Raw server calls — nothing here knows about the local copy.
const netDb = {
  async getAll(storeName) {
    const uid = await currentUserId();
    const { data, error, status } = await supa.from(TABLE).select("record_id, data").eq("user_id", uid).eq("store", storeName);
    if (error) throw netError(error, status);
    return data;
  },
  async get(storeName, key) {
    const uid = await currentUserId();
    const { data, error, status } = await supa.from(TABLE).select("data").eq("user_id", uid).eq("store", storeName).eq("record_id", String(key)).maybeSingle();
    if (error) throw netError(error, status);
    return data ? data.data : undefined;
  },
  async count(storeName) {
    const uid = await currentUserId();
    const { count, error, status } = await supa.from(TABLE).select("record_id", { count: "exact", head: true }).eq("user_id", uid).eq("store", storeName);
    if (error) throw netError(error, status);
    return count || 0;
  },
  async apply(e) {
    let res;
    if (e.op === "put") {
      res = await supa.from(TABLE).upsert(
        { user_id: e.uid, store: e.store, record_id: e.record_id, data: e.data, updated_at: new Date(e.t).toISOString() },
        { onConflict: "user_id,store,record_id" }
      );
    } else if (e.op === "delete") {
      res = await supa.from(TABLE).delete().eq("user_id", e.uid).eq("store", e.store).eq("record_id", e.record_id);
    } else {
      res = await supa.from(TABLE).delete().eq("user_id", e.uid).eq("store", e.store);
    }
    if (res.error) throw netError(res.error, res.status);
  },
};

// ---- local copy (IndexedDB) ----
let localDbPromise = null;
let localBroken = false; // if IndexedDB is unavailable the app falls back to talking to the server directly

function openLocalDb() {
  if (localDbPromise) return localDbPromise;
  localDbPromise = new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open("stimulus-local-v1", 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        d.createObjectStore("rows", { keyPath: "k" });
        d.createObjectStore("outbox", { keyPath: "seq", autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (err) { reject(err); }
  });
  return localDbPromise;
}

function idbReq(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function localTx(stores, mode, fn) {
  const d = await openLocalDb();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(stores, mode);
    let out;
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("Local save aborted"));
    Promise.resolve(fn(tx)).then((v) => { out = v; }, (err) => { try { tx.abort(); } catch (_) {} reject(err); });
  });
}

const rowKey = (uid, store, id) => `${uid}|${store}|${id}`;
const storeRange = (uid, store) => IDBKeyRange.bound(`${uid}|${store}|`, `${uid}|${store}|￿`);

const local = {
  async getRow(uid, store, id) {
    return localTx(["rows"], "readonly", async (tx) => {
      const r = await idbReq(tx.objectStore("rows").get(rowKey(uid, store, id)));
      return r ? { data: r.data } : null;
    });
  },
  async putRow(uid, store, id, data) {
    await localTx(["rows"], "readwrite", async (tx) => { tx.objectStore("rows").put({ k: rowKey(uid, store, id), id, data }); });
  },
  async delRow(uid, store, id) {
    await localTx(["rows"], "readwrite", async (tx) => { tx.objectStore("rows").delete(rowKey(uid, store, id)); });
  },
  async allRows(uid, store) {
    return localTx(["rows"], "readonly", async (tx) => idbReq(tx.objectStore("rows").getAll(storeRange(uid, store))));
  },
  async countRows(uid, store) {
    return localTx(["rows"], "readonly", async (tx) => idbReq(tx.objectStore("rows").count(storeRange(uid, store))));
  },
  async clearStore(uid, store) {
    await localTx(["rows"], "readwrite", async (tx) => { tx.objectStore("rows").delete(storeRange(uid, store)); });
  },
  async replaceStore(uid, store, rows) {
    await localTx(["rows"], "readwrite", async (tx) => {
      const os = tx.objectStore("rows");
      os.delete(storeRange(uid, store));
      for (const r of rows) os.put({ k: rowKey(uid, store, r.record_id), id: r.record_id, data: r.data });
    });
  },
  async outboxAll() {
    return localTx(["outbox"], "readonly", async (tx) => idbReq(tx.objectStore("outbox").getAll()));
  },
  // Keeps the queue short: a newer write to the same record replaces the older
  // one (autosave fires constantly), and a clear swallows everything before it.
  async outboxAdd(entry) {
    await localTx(["outbox"], "readwrite", async (tx) => {
      const os = tx.objectStore("outbox");
      const all = await idbReq(os.getAll());
      for (const e of all) {
        if (e.uid !== entry.uid || e.store !== entry.store) continue;
        const same = entry.op === "clear" ? true : (e.op !== "clear" && e.record_id === entry.record_id);
        if (same) os.delete(e.seq);
      }
      os.add(entry);
    });
  },
  async outboxRemove(seq) {
    await localTx(["outbox"], "readwrite", async (tx) => { tx.objectStore("outbox").delete(seq); });
  },
  async outboxBump(seq) {
    await localTx(["outbox"], "readwrite", async (tx) => {
      const os = tx.objectStore("outbox");
      const e = await idbReq(os.get(seq));
      if (e) { e.attempts = (e.attempts || 0) + 1; os.put(e); }
    });
  },
};

// ---- sync state ----
let pendingCount = 0;       // writes saved on this phone but not yet on the server
let netBadUntil = 0;        // after a failed request, skip the network briefly so a weak signal doesn't stall every screen
let writeEpoch = 0;         // bumps on every local write; lets a read notice a write raced it
let netBadTimer = null;
const syncListeners = [];
const READ_TIMEOUT_MS = 5000;
const WRITE_TIMEOUT_MS = 8000;

function syncStatus() {
  return { pending: pendingCount, offline: navigator.onLine === false || Date.now() < netBadUntil };
}
function emitSync() {
  const st = syncStatus();
  syncListeners.forEach((fn) => { try { fn(st); } catch (_) {} });
}
function onSyncChange(fn) {
  syncListeners.push(fn);
  fn(syncStatus());
  return () => { const i = syncListeners.indexOf(fn); if (i !== -1) syncListeners.splice(i, 1); };
}
function markNetBad() {
  netBadUntil = Date.now() + 20000;
  clearTimeout(netBadTimer);
  netBadTimer = setTimeout(() => { emitSync(); if (pendingCount > 0) flushOutbox(); }, 20200);
  emitSync();
}
function markNetGood() {
  if (netBadUntil) { netBadUntil = 0; emitSync(); }
}
async function refreshPending() {
  try { pendingCount = (await local.outboxAll()).length; } catch (_) { /* keep last known */ }
  emitSync();
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(Object.assign(new Error("Request timed out"), { status: 0, timedOut: true })), ms);
    promise.then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
  });
}

// A failure worth retrying later (no signal, server hiccup, expired login that
// will refresh) versus one that will never succeed (the server rejected it).
function isRetryable(err) {
  if (!err) return true;
  const st = err.status;
  if (err.timedOut || !st) return true;
  return st >= 500 || st === 408 || st === 429 || st === 401;
}

let flushPromise = null;
let flushTimer = null;
function scheduleFlush(delay = 400) {
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => { flushOutbox(); }, delay);
}

// Sends queued writes to the server in order. Safe to call any time; resolves
// early (without waiting for the network) if maxWaitMs is given.
function flushOutbox(maxWaitMs) {
  if (localBroken) return Promise.resolve();
  if (!flushPromise) {
    flushPromise = (async () => {
      try {
        if (navigator.onLine === false || Date.now() < netBadUntil) return;
        let me;
        try { me = await currentUserId(); } catch (_) { return; }
        const list = await local.outboxAll();
        for (const e of list) {
          if (e.uid !== me) continue;
          try {
            await withTimeout(netDb.apply(e), WRITE_TIMEOUT_MS);
            await local.outboxRemove(e.seq);
            markNetGood();
            await refreshPending();
          } catch (err) {
            if (isRetryable(err)) { markNetBad(); break; }
            if ((e.attempts || 0) + 1 >= 3) {
              await local.outboxRemove(e.seq);
              console.warn("[sync] dropped a change the server rejected", e, err);
              if (typeof toast === "function") toast("One change couldn't be saved to your account");
            } else {
              await local.outboxBump(e.seq);
            }
          }
        }
      } catch (err) {
        console.warn("[sync] flush failed", err);
      } finally {
        await refreshPending();
        flushPromise = null;
        if (pendingCount > 0 && Date.now() >= netBadUntil && navigator.onLine !== false) scheduleFlush(1500);
      }
    })();
  }
  return maxWaitMs ? Promise.race([flushPromise, sleep(maxWaitMs)]) : flushPromise;
}

window.addEventListener("online", () => { netBadUntil = 0; emitSync(); flushOutbox(); });
window.addEventListener("offline", () => emitSync());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && pendingCount > 0) { netBadUntil = 0; flushOutbox(); }
});
setInterval(() => { if (pendingCount > 0) flushOutbox(); }, 15000);

// Is it safe and worthwhile to read from the server right now? Pending local
// writes are sent first so a read never returns data older than what the user
// just entered.
async function networkReadable() {
  if (pendingCount > 0) await flushOutbox(4000);
  return pendingCount === 0 && navigator.onLine !== false && Date.now() >= netBadUntil;
}

async function queueWrite(entry) {
  writeEpoch++;
  await local.outboxAdd(entry);
  await refreshPending();
  scheduleFlush(250);
}

const db = {
  async getAll(storeName) {
    if (localBroken) return (await netDb.getAll(storeName)).map((r) => r.data);
    const uid = await currentUserId();
    if (await networkReadable()) {
      const epoch = writeEpoch;
      try {
        const rows = await withTimeout(netDb.getAll(storeName), READ_TIMEOUT_MS);
        markNetGood();
        if (epoch !== writeEpoch) return (await local.allRows(uid, storeName)).map((r) => r.data); // a write raced the fetch; the local copy is newer
        await local.replaceStore(uid, storeName, rows);
        return rows.map((r) => r.data);
      } catch (err) {
        if (!isRetryable(err)) throw err;
        markNetBad();
      }
    }
    return (await local.allRows(uid, storeName)).map((r) => r.data);
  },
  async get(storeName, key) {
    if (localBroken) return netDb.get(storeName, key);
    const uid = await currentUserId();
    const id = String(key);
    if (await networkReadable()) {
      const epoch = writeEpoch;
      try {
        const data = await withTimeout(netDb.get(storeName, id), READ_TIMEOUT_MS);
        markNetGood();
        if (epoch !== writeEpoch) { const row = await local.getRow(uid, storeName, id); return row ? row.data : undefined; }
        if (data === undefined) await local.delRow(uid, storeName, id);
        else await local.putRow(uid, storeName, id, data);
        return data;
      } catch (err) {
        if (!isRetryable(err)) throw err;
        markNetBad();
      }
    }
    const row = await local.getRow(uid, storeName, id);
    return row ? row.data : undefined;
  },
  async put(storeName, value) {
    const uid = await currentUserId();
    const id = recordIdOf(storeName, value);
    if (!localBroken) {
      try {
        await local.putRow(uid, storeName, id, value);
        await queueWrite({ uid, store: storeName, record_id: id, op: "put", data: value, attempts: 0, t: Date.now() });
        return value;
      } catch (err) {
        console.warn("[sync] local store failed, writing straight to the server", err);
        localBroken = true;
      }
    }
    await netDb.apply({ uid, store: storeName, record_id: id, op: "put", data: value, t: Date.now() });
    return value;
  },
  async delete(storeName, key) {
    const uid = await currentUserId();
    const id = String(key);
    if (!localBroken) {
      try {
        await local.delRow(uid, storeName, id);
        await queueWrite({ uid, store: storeName, record_id: id, op: "delete", attempts: 0, t: Date.now() });
        return;
      } catch (err) {
        console.warn("[sync] local store failed, writing straight to the server", err);
        localBroken = true;
      }
    }
    await netDb.apply({ uid, store: storeName, record_id: id, op: "delete", t: Date.now() });
  },
  async clear(storeName) {
    const uid = await currentUserId();
    if (!localBroken) {
      try {
        await local.clearStore(uid, storeName);
        await queueWrite({ uid, store: storeName, record_id: "*", op: "clear", attempts: 0, t: Date.now() });
        return;
      } catch (err) {
        console.warn("[sync] local store failed, writing straight to the server", err);
        localBroken = true;
      }
    }
    await netDb.apply({ uid, store: storeName, op: "clear", t: Date.now() });
  },
  async count(storeName) {
    const uid = await currentUserId();
    const fromLocal = async (cause) => {
      const n = await local.countRows(uid, storeName);
      if (n === 0 && storeName === STORE_KV) {
        throw cause || new Error("You're offline and nothing is saved on this device yet. Connect once to load your data.");
      }
      return n;
    };
    if (localBroken) return netDb.count(storeName);
    if (!(await networkReadable())) return fromLocal();
    try {
      const n = await withTimeout(netDb.count(storeName), READ_TIMEOUT_MS);
      markNetGood();
      return n;
    } catch (err) {
      if (!isRetryable(err)) throw err;
      markNetBad();
      return fromLocal(err);
    }
  },
};

const STORES = { WORKOUTS: STORE_WORKOUTS, ACTIVE: STORE_ACTIVE, KV: STORE_KV };

// Probe used at boot to detect an unreachable/misconfigured backend early so
// the UI can show recovery instructions instead of failing silently later.
async function probeDB() {
  try {
    await db.count(STORE_KV);
    return { ok: true };
  } catch (err) {
    unavailableReason = err.message || String(err);
    return { ok: false, reason: unavailableReason };
  }
}

// STORAGE — the data layer. UI code must go through this module only; it must

// ============================================================================

const KV_PROGRAM_STATE = "programState";
const KV_META = "meta";
const KV_CUSTOM_EXERCISES = "customExercises";
const KV_PROGRAM_OVERRIDES = "programOverrides";
const KV_PROGRAM_HISTORY = "programHistory";
const KV_EXERCISE_ORDER = "exerciseOrder";
const KV_SCHEDULE_OVERRIDES = "scheduleOverrides";
const KV_BODYWEIGHT_LOG = "bodyweightLog";
const KV_STEP_LOG = "stepLog";
const KV_SKIP_LOG = "skipLog";

  scheduleStartDate: todayDateStr(), // ISO date — day 1 of the training sequence cycle (see programState.pattern); reset to today whenever setup finishes
  exerciseUnits: {}, // { [exerciseId]: "kg" | "lb" }, missing entries default to kg

  split: null,        // "fullbody" | "ap" | "ul" — the Program Type
  dayTypes: [],        // [{key,label}, ...] — the program's current day types
  pattern: [],          // array of dayType keys or "R", cycled from scheduleStartDate — the Training Sequence

let saveListeners = [];
function onSaveStateChange(fn) {
  saveListeners.push(fn);
  return () => { saveListeners = saveListeners.filter((f) => f !== fn); };
}
function emitSaveState(state) {
  for (const fn of saveListeners) fn(state);
}

// Wrap every mutating call so the UI can show a "Saving… / Saved / Save failed" indicator.
async function saving(fn) {
  emitSaveState("saving");
  try {
    const result = await fn();
    emitSaveState("saved");
    return result;
  } catch (err) {
    emitSaveState("error");
    throw err;
  }
}

async function init() {
  // Know about unsynced writes from last time before the first read, so a
  // stale server copy can never replace something still waiting to upload.
  await refreshPending();
  const probe = await probeDB();
  if (!probe.ok) {
    return { ok: false, reason: probe.reason };
  }

  // No "force reset" trick needed anymore — every signed-in Supabase user
  // gets their own isolated rows (enforced by Row Level Security), so a new
  // account is guaranteed to start with zero records. Just seed defaults
  // for anything this user doesn't have yet.
  // Make sure this phone holds a full copy of the account's settings/program
  // data, so a missing local record can only mean "doesn't exist" and never
  // "not downloaded yet". Skipped silently when offline.
  await refreshPending();
  flushOutbox();
  try { await db.getAll(STORE_KV); } catch (_) { /* offline: use what is already on the phone */ }
  db.getAll(STORE_WORKOUTS).catch(() => {});

  const meta = await db.get(STORES.KV, KV_META);
  if (!meta) {
    await db.put(STORES.KV, { key: KV_META, ...DEFAULT_META });
  }
  const settings = await db.get(STORES.KV, KV_SETTINGS);
  if (!settings) {
    await db.put(STORES.KV, { key: KV_SETTINGS, ...DEFAULT_SETTINGS });
  }
  const programState = await db.get(STORES.KV, KV_PROGRAM_STATE);
  if (!programState) {
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...DEFAULT_PROGRAM_STATE });
  }
  const customExercises = await db.get(STORES.KV, KV_CUSTOM_EXERCISES);
  if (!customExercises) {
    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: [] });
  }
  const programOverrides = await db.get(STORES.KV, KV_PROGRAM_OVERRIDES);
  if (!programOverrides) {
    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: {} });
  }
  const programHistory = await db.get(STORES.KV, KV_PROGRAM_HISTORY);
  if (!programHistory) {
    // Migration for accounts created before program history existed: seed
    // one entry from whatever pattern/start-date they already had, so their
    // existing schedule keeps resolving exactly as it did before.
    const psForMigration = programState || DEFAULT_PROGRAM_STATE;
    const settingsForMigration = settings || DEFAULT_SETTINGS;
    const seedList = (psForMigration.setupComplete && psForMigration.pattern && psForMigration.pattern.length)
      ? [{ id: uid(), pattern: psForMigration.pattern.slice(), effectiveFrom: settingsForMigration.scheduleStartDate || DEFAULT_SETTINGS.scheduleStartDate, createdAt: nowISO() }]
      : [];
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: seedList });
  }
  const exerciseOrder = await db.get(STORES.KV, KV_EXERCISE_ORDER);
  if (!exerciseOrder) {
    await db.put(STORES.KV, { key: KV_EXERCISE_ORDER, data: {} });
  }
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Program version history — see the block comment above
// resolvePatternVersion() for the model. commitProgramPatternChange is the
// only way new entries get added: it appends the new version and, only if
// that version is effective as of today, mirrors it into programState.pattern
// too (kept in sync purely for the few screens — like the setup summary —
// that still read "the current pattern" directly rather than resolving it
// for a specific date).
// ---------------------------------------------------------------------------

async function getProgramHistory() {
  const rec = await db.get(STORES.KV, KV_PROGRAM_HISTORY);
  return rec ? rec.list : [];
}

async function commitProgramPatternChange(pattern, effectiveFrom) {
  return saving(async () => {
    const history = await getProgramHistory();
    const entry = { id: uid(), pattern: pattern.slice(), effectiveFrom, createdAt: nowISO() };
    const updated = [...history, entry].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: updated });

    const currentVersion = resolvePatternVersion(todayDateStr(), updated);
    if (currentVersion) {
      const ps = await getProgramState();
      await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...ps, pattern: currentVersion.pattern });
    }
    return updated;
  });
}

// Used by "Shift Forward/Back 1 Day" and the manual Cycle Start Date field —
// these adjust the ANCHOR of whichever version currently governs today
// (i.e. re-align the rotation's phase) without changing the pattern itself
// or touching any earlier historical version.
//
// BUGFIX: this used to grab sorted[sorted.length - 1] — the entry with the
// chronologically LATEST effectiveFrom. That's only "today's version" when
// there's no future change queued. As soon as a "Finish Current Rotation"
// or "Pick a Specific Date" change is scheduled (a real, common flow — see
// renderPatternEditor's pickOptionModal), that future entry sorts last, so
// shifting the schedule or editing the Cycle Start Date silently moved the
// *upcoming* version's start date instead of today's active one — the
// currently-governing rotation was untouched, while a change you hadn't
// even reached yet got quietly rewritten. Target the version that actually
// resolves for today's date instead, matching the doc comment above.
async function updateCurrentVersionAnchor(newEffectiveFrom) {
  return saving(async () => {
    const history = await getProgramHistory();
    if (!history.length) return history;
    const current = resolvePatternVersion(todayDateStr(), history);
    if (!current) return history;
    const updated = history.map((v) => (v.id === current.id ? { ...v, effectiveFrom: newEffectiveFrom } : v));
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: updated });
    return updated;
  });
}

// Cancels a scheduled-but-not-yet-effective future pattern change (or, if
// needed, removes a past entry too). Re-syncs programState.pattern in case
// removing it changes what's effective today.
async function deleteProgramHistoryEntry(id) {
  return saving(async () => {
    const history = await getProgramHistory();
    const updated = history.filter((v) => v.id !== id);
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: updated });
    const currentVersion = resolvePatternVersion(todayDateStr(), updated);
    if (currentVersion) {
      const ps = await getProgramState();
      await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...ps, pattern: currentVersion.pattern });
    }
    return updated;
  });
}

// Wipes the entire version history and reseeds it with a single fresh entry
// (today's current pattern, effective today). This is the escape hatch for
// an account whose history got corrupted by the updateCurrentVersionAnchor
// bug (see comment above that function) — before the fix, "Shift a Day" or
// editing Cycle Start Date while a future change was queued could stamp a
// bogus effectiveFrom onto the wrong entry, permanently orphaning a
// scheduled change and/or leaving a nonsense "was in effect from..." row in
// Program History. Rather than trying to reverse-engineer what the
// original correct dates were (not knowable after the fact), this collapses
// history back to one clean, correct entry. It never touches logged
// workouts — only which day-type label past/future calendar dates show.
async function resetProgramHistory() {
  return saving(async () => {
    const ps = await getProgramState();
    const pattern = (ps.pattern || []).slice();
    const fresh = [{ id: uid(), pattern, effectiveFrom: todayDateStr(), createdAt: nowISO() }];
    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: fresh });
    return fresh;
  });
}

async function markBackupComplete() {
  await setLastBackupAt(nowISO());
}

function validateBackup(data) {
  const errors = [];
  if (!data || typeof data !== "object") { errors.push("File is not a valid backup object."); return errors; }
  if (typeof data.schemaVersion !== "number") errors.push("Missing or invalid schemaVersion.");
  if (data.schemaVersion > SCHEMA_VERSION) errors.push(`Backup was created by a newer app version (v${data.schemaVersion}). Update the app before importing.`);
  if (!data.settings || typeof data.settings !== "object") errors.push("Missing settings object.");
  if (!Array.isArray(data.workouts)) errors.push("Missing or invalid workouts array.");
  else {
    data.workouts.forEach((w, i) => {
      if (!w.id) errors.push(`Workout at index ${i} is missing an id.`);
      if (!w.type) errors.push(`Workout at index ${i} is missing a type.`);
      if (!Array.isArray(w.exercises)) errors.push(`Workout at index ${i} is missing exercises.`);
    });
  }
  return errors;
}

async function importAllData(raw) {
  return saving(async () => {
    let data;
    try {
      data = typeof raw === "string" ? JSON.parse(raw) : raw;
    } catch (err) {
      return { ok: false, errors: ["The file is not valid JSON and could not be read."] };
    }

    const errors = validateBackup(data);
    if (errors.length) return { ok: false, errors };

    // Migration hook: if a future schemaVersion introduces structural
    // changes, transform `data` here before writing, keyed off data.schemaVersion.
    // Historical data is always preserved — never silently dropped.

    await db.clear(STORES.WORKOUTS);
    for (const w of data.workouts) {
      await db.put(STORES.WORKOUTS, w);
    }

    if (data.activeWorkout) {
      // Preserve the backed-up workout's own id — see recordIdOf() for why
      // this store no longer needs (or wants) the id field overwritten.
      await db.put(STORES.ACTIVE, data.activeWorkout);
    } else {
      await db.delete(STORES.ACTIVE, ACTIVE_ID);
    }

    const mergedSettings = { ...DEFAULT_SETTINGS, ...data.settings };
    await db.put(STORES.KV, { key: KV_SETTINGS, ...mergedSettings });

    const mergedProgram = { ...DEFAULT_PROGRAM_STATE, ...(data.program || {}) };
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...mergedProgram });

    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: Array.isArray(data.customExercises) ? data.customExercises : [] });

    await db.put(STORES.KV, { key: KV_PROGRAM_OVERRIDES, data: (data.programOverrides && typeof data.programOverrides === "object") ? data.programOverrides : {} });

    await db.put(STORES.KV, { key: KV_EXERCISE_ORDER, data: (data.exerciseOrder && typeof data.exerciseOrder === "object") ? data.exerciseOrder : {} });

    await db.put(STORES.KV, { key: KV_SCHEDULE_OVERRIDES, data: (data.scheduleOverrides && typeof data.scheduleOverrides === "object") ? data.scheduleOverrides : {} });

    await db.put(STORES.KV, { key: KV_PROGRAM_HISTORY, list: Array.isArray(data.programHistory) ? data.programHistory : [] });

    await db.put(STORES.KV, { key: KV_BODYWEIGHT_LOG, list: Array.isArray(data.bodyweightLogs) ? data.bodyweightLogs : [] });

    await db.put(STORES.KV, { key: KV_STEP_LOG, list: Array.isArray(data.stepLogs) ? data.stepLogs : [] });

    await db.put(STORES.KV, { key: KV_SKIP_LOG, list: Array.isArray(data.skipLogs) ? data.skipLogs : [] });

    await db.put(STORES.KV, { key: KV_META, schemaVersion: SCHEMA_VERSION, lastBackupAt: (await getMeta()).lastBackupAt });

    return { ok: true };
  });
}

async function resetAllData() {
  return saving(async () => {
    await db.clear(STORES.WORKOUTS);
    await db.delete(STORES.ACTIVE, ACTIVE_ID);
    await db.put(STORES.KV, { key: KV_SETTINGS, ...DEFAULT_SETTINGS });
    await db.put(STORES.KV, { key: KV_PROGRAM_STATE, ...DEFAULT_PROGRAM_STATE });
    await db.put(STORES.KV, { key: KV_CUSTOM_EXERCISES, list: [] });

// Nudges a hex color lighter (positive percent) or darker (negative percent).
function shadeHex(hex, percent) {
  const clean = (hex || "").replace("#", "");
  const num = parseInt(clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean, 16);
  if (Number.isNaN(num)) return hex;
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp(((num >> 16) & 0xff) + Math.round(255 * percent));
  const g = clamp(((num >> 8) & 0xff) + Math.round(255 * percent));
  const b = clamp((num & 0xff) + Math.round(255 * percent));
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

// Overrides the app's accent (crimson) color family with a user-chosen hue,
// deriving a brighter hover shade and a darker "blood" shade from it so
// buttons/highlights/progress bars all stay consistent. Pass null/falsy to
// go back to the built-in crimson.
function applyAccentColor(hex) {
  const root = document.documentElement;
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) {
    root.style.removeProperty("--c-crimson");
    root.style.removeProperty("--c-crimson-bright");
    root.style.removeProperty("--c-blood");
    root.style.removeProperty("--c-primary-bg");
    root.style.removeProperty("--c-primary-fg");
    root.style.removeProperty("--c-primary-hover");
    return;
  }
  root.style.setProperty("--c-crimson", hex);
  root.style.setProperty("--c-crimson-bright", shadeHex(hex, 0.14));
  root.style.setProperty("--c-blood", shadeHex(hex, -0.2));
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  root.style.setProperty("--c-primary-bg", hex);
  root.style.setProperty("--c-primary-fg", lum > 0.6 ? "#000000" : "#ffffff");
  root.style.setProperty("--c-primary-hover", shadeHex(hex, 0.1));
}

// ============================================================================
// REST TIMER — a floating countdown between sets. It lives in its own fixed
// region outside <main>, driven by its own interval, so it keeps counting
// down even while the user flips to History/Settings/etc and back — the
// router's teardown()/renderRoute() never touches it.
// ============================================================================

const restTimerRegion = document.getElementById("rest-timer-region");
let restTimer = null; // { duration, remaining, paused, endAt, label, intervalId }
const REST_TIMER_STORAGE_KEY = "stimulus.restTimer.v1";

function restTimerShouldAutoStart() {
  return !cachedSettings || cachedSettings.restTimerAutoStart !== false;
}

// Persists just enough to survive a reload/tab-close mid-rest: a fresh page
// load calls restoreRestTimerFromStorage() and picks the countdown back up
// from endAt rather than losing it. Best-effort — if localStorage is
// unavailable (private browsing, quota), the timer simply won't survive a
// reload, same as before.
function persistRestTimer() {
  try {
    if (!restTimer) { localStorage.removeItem(REST_TIMER_STORAGE_KEY); return; }
    localStorage.setItem(REST_TIMER_STORAGE_KEY, JSON.stringify({
      duration: restTimer.duration,
      remaining: restTimer.remaining,
      paused: restTimer.paused,
      endAt: restTimer.endAt,
      label: restTimer.label,
    }));
  } catch (_) { /* ignore — persistence is a nicety, not load-bearing */ }
}

function restoreRestTimerFromStorage() {
  try {
    const raw = localStorage.getItem(REST_TIMER_STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved) return;

    if (saved.paused) {
      if (!(saved.remaining > 0)) { localStorage.removeItem(REST_TIMER_STORAGE_KEY); return; }
      restTimer = { duration: saved.duration, remaining: saved.remaining, paused: true, endAt: Date.now() + saved.remaining * 1000, label: saved.label };
    } else {
      const remainingMs = saved.endAt - Date.now();
      if (remainingMs <= 0) {
        // Finished while the app was closed — clear it silently rather than
        // replaying the chime/toast for a rest period that's long over.
        localStorage.removeItem(REST_TIMER_STORAGE_KEY);
        return;
      }
      restTimer = { duration: saved.duration, remaining: Math.ceil(remainingMs / 1000), paused: false, endAt: saved.endAt, label: saved.label };
    }
    restTimer.intervalId = setInterval(tickRestTimer, 250);
    renderRestTimerBar();
  } catch (_) {
    /* corrupt or unavailable storage — just start with no timer */
  }
}

function startRestTimer(seconds, label) {
  if (!seconds || seconds <= 0) return;
  if (restTimer && restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = {
    duration: seconds,
    remaining: seconds,
    paused: false,
    endAt: Date.now() + seconds * 1000,
    label: label || "Rest",
  };
  restTimer.intervalId = setInterval(tickRestTimer, 250);
  renderRestTimerBar();
  persistRestTimer();
}

function dismissRestTimer() {
  if (restTimer && restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = null;
  restTimerRegion.innerHTML = "";
  persistRestTimer();
}

function tickRestTimer() {
  if (!restTimer || restTimer.paused) return;
  const remainingMs = restTimer.endAt - Date.now();
  if (remainingMs <= 0) {
    finishRestTimer();
    return;
  }
  restTimer.remaining = Math.ceil(remainingMs / 1000);
  updateRestTimerUI();
}

function finishRestTimer() {
  const label = restTimer ? restTimer.label : "Rest";
  if (restTimer && restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = null;
  restTimerRegion.innerHTML = "";
  persistRestTimer();
  hapticTap([15, 60, 15, 60, 15]);
  if (!cachedSettings || cachedSettings.restTimerSound !== false) playRestTimerChime();
  toast(`Rest over — back to ${label}`, { duration: 3800 });
}

function pauseResumeRestTimer() {
  if (!restTimer) return;
  if (restTimer.paused) {
    restTimer.endAt = Date.now() + restTimer.remaining * 1000;
    restTimer.paused = false;
  } else {
    restTimer.paused = true;
  }
  updateRestTimerUI();
  persistRestTimer();
}

function adjustRestTimer(deltaSeconds) {
  if (!restTimer) return;
  restTimer.remaining = Math.max(0, restTimer.remaining + deltaSeconds);
  if (restTimer.remaining > restTimer.duration) restTimer.duration = restTimer.remaining;
  restTimer.endAt = Date.now() + restTimer.remaining * 1000;
  if (restTimer.remaining === 0) { finishRestTimer(); return; }
  updateRestTimerUI();
  persistRestTimer();
}

function restTimerTimeLabel(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function renderRestTimerBar() {
  if (!restTimer) { restTimerRegion.innerHTML = ""; return; }
  const pct = Math.max(0, Math.min(100, Math.round((restTimer.remaining / restTimer.duration) * 100)));
  restTimerRegion.innerHTML = `
    <div class="rest-timer-bar ${restTimer.paused ? "paused" : ""}" role="status">
      <div class="rest-timer-ring" style="--rt-pct:${pct}">
        <span class="numeric rest-timer-time">${restTimerTimeLabel(restTimer.remaining)}</span>
      </div>
      <div class="rest-timer-mid">
        <div class="eyebrow">Resting</div>
        <div class="rest-timer-label">${escapeHtml(restTimer.label)}</div>
      </div>
      <div class="rest-timer-actions">
        <button type="button" class="rt-btn" data-act="rt-minus" aria-label="Subtract 15 seconds">−15</button>
        <button type="button" class="rt-btn rt-btn-primary" data-act="rt-pause" aria-label="${restTimer.paused ? "Resume" : "Pause"}">${restTimer.paused ? "▶" : "❚❚"}</button>
        <button type="button" class="rt-btn" data-act="rt-plus" aria-label="Add 15 seconds">+15</button>
        <button type="button" class="rt-btn rt-btn-skip" data-act="rt-skip" aria-label="Skip rest">Skip</button>
      </div>
    </div>`;
  wireRestTimerBar();
}

function updateRestTimerUI() {
  const bar = qs(".rest-timer-bar", restTimerRegion);
  if (!bar) { renderRestTimerBar(); return; }
  const timeEl = qs(".rest-timer-time", bar);
  if (timeEl) timeEl.textContent = restTimerTimeLabel(restTimer.remaining);
  const ring = qs(".rest-timer-ring", bar);
  if (ring) ring.style.setProperty("--rt-pct", Math.max(0, Math.min(100, Math.round((restTimer.remaining / restTimer.duration) * 100))));
  const pauseBtn = qs('[data-act="rt-pause"]', bar);
  if (pauseBtn) {
    pauseBtn.textContent = restTimer.paused ? "▶" : "❚❚";
    pauseBtn.setAttribute("aria-label", restTimer.paused ? "Resume" : "Pause");
  }
  bar.classList.toggle("paused", !!restTimer.paused);
}

function wireRestTimerBar() {
  const bar = qs(".rest-timer-bar", restTimerRegion);
  if (!bar) return;
  qs('[data-act="rt-minus"]', bar)?.addEventListener("click", () => adjustRestTimer(-15));
  qs('[data-act="rt-plus"]', bar)?.addEventListener("click", () => adjustRestTimer(15));
  qs('[data-act="rt-pause"]', bar)?.addEventListener("click", pauseResumeRestTimer);
  qs('[data-act="rt-skip"]', bar)?.addEventListener("click", () => { hapticTap(8); dismissRestTimer(); });
}

// A short two-tone chime via WebAudio — no external audio file needed, and
// it still plays reliably from a background tab since it's a plain
// oscillator rather than an <audio> element that some browsers suspend.
let restTimerAudioCtx = null;
function playRestTimerChime() {
  try {
    restTimerAudioCtx = restTimerAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = restTimerAudioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    [[880, now], [1180, now + 0.16]].forEach(([freq, start]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.32);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.34);
    });
  } catch (_) {
    /* WebAudio unavailable/blocked — vibration + toast still land */
  }
}

// Wires the header save indicator to storage.js's onSaveStateChange stream.
function initSaveIndicator(onSaveStateChange) {
  const indicator = document.getElementById("save-indicator");
  const label = indicator.querySelector(".label");
  let resetTimer = null;
  let baseState = "idle";
  let sync = storage.getSyncStatus();

  // Unsynced or offline wins over "Saved" so you always know whether your
  // sets have reached your account, but a real save error still shows.
  const paint = () => {
    if (baseState !== "error" && (sync.pending > 0 || sync.offline)) {
      indicator.dataset.state = "pending";
      label.textContent = sync.offline
        ? (sync.pending > 0 ? `Offline · ${sync.pending} to sync` : "Offline")
        : `Syncing ${sync.pending}…`;
    } else {
      indicator.dataset.state = baseState;
      label.textContent = "Saved";
    }
  };

  onSaveStateChange((state) => {
    baseState = state;
    paint();
    if (state === "saved") {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { baseState = "idle"; paint(); }, 1800);
    }
  });
  storage.onSyncChange((st) => { sync = st; paint(); });
}

  const totalVolume = workouts.reduce((sum, w) => sum + workoutVolume(w), 0);

    const pre = w.cardio?.pre?.status === "completed" ? 1 : 0;

    return sum + pre + post;

  let html = "";

  const todayLabel = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

  if (active) {
    const { completed, programmed } = countCompletedSets(active);
    html += `

    }
    html += `
      <div class="hero-card">
        <div class="hero-eyebrow">${escapeHtml(todayLabel)}</div>
        <div class="hero-title">${escapeHtml(label)}</div>

        <div class="hero-actions">

  html += weekStripHtml(workouts, programHistory, scheduleOverrides, skipLogs);

  html += `

  const periodLabel = { weekly: "week", monthly: "month", yearly: "year" }[dashboardPeriodRange];

          <option value="all" ${dashboardVolumeTypeFilter === "all" ? "selected" : ""}>All Workout Types</option>

        </select>

           <div class="chart-wrap">${barChart(buckets, dashboardVolumeUnit)}</div>
           <p class="text-faint" style="margin:10px 0 0;">Tap a bar for that ${periodLabel}'s exact total. Last ${DASHBOARD_PERIOD_BUCKET_COUNT[dashboardPeriodRange]} ${periodLabel}s${dashboardVolumeTypeFilter !== "all" ? `, ${PROGRAM_DAY_TYPES.find((dt) => dt.key === dashboardVolumeTypeFilter)?.label || dashboardVolumeTypeFilter} only` : ""}.</p>
           ${!hasAnyVolumeInRange ? `<p class="text-faint" style="margin:8px 0 0; color:var(--c-danger);">No volume in this range${dashboardVolumeTypeFilter !== "all" ? " for this workout type" : ""} — try a wider period or "All Workout Types".</p>` : ""}`

  const latestBw = bwLogs[bwLogs.length - 1];

  html += `

      ${latestBw

           <div class="sc-caption" style="margin-bottom:10px;">As of ${formatDateShort(latestBw.date)}${bwDelta !== null ? ` · ${bwDelta > 0 ? "+" : ""}${roundTo(displayWeight(bwDelta, dashboardBodyweightUnit), 1)} ${dashboardBodyweightUnit} since first log` : ""}</div>`

      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-primary" id="dash-bw-log-btn" style="flex:1;">+ Log Weight</button>
        ${bwLogs.length ? `<button class="btn" id="dash-bw-history-btn">Entries</button>` : ""}
      </div>
    </div>
  `;
  html += `</div>`;

  // Recent workouts
  html += `<div class="section-title"><h2>Recent Workouts</h2><button class="link-btn" data-act="see-history">See all</button></div>`;
  if (workouts.length === 0) {

  } else {
    html += `<div class="card">` + workouts.slice(0, 5).map((w, i) => {
      const { completed, programmed } = countCompletedSets(w);
      return `
        <div class="history-item" data-act="open-workout" data-id="${w.id}" style="cursor:pointer;">

            <div class="h-title">${PROGRAM[w.type]?.label || w.type} <span class="badge ${w.status === "completed" ? "badge-positive" : w.status === "partial" ? "badge-warn" : ""}">${w.status}</span></div>
            <div class="h-meta">${formatDateShort(w.startedAt)} · ${completed}/${programmed} sets</div>
          </div>

  }

  container.innerHTML = html;

  qs('[data-act="resume"]', container)?.addEventListener("click", () => navigate("workout-active"));
  qs('[data-act="start-suggested"]', container)?.addEventListener("click", async (e) => {

  qs('[data-act="see-history"]', container)?.addEventListener("click", () => navigate("history"));
  qsa('[data-act="open-workout"]', container).forEach((el) => {

  qs("#dash-bw-history-btn", container)?.addEventListener("click", () => openBodyweightHistoryModal(container, navigate));

  const refreshDash = () => dashboardRender(container, navigate);
  qsa('[data-act="log-skip"]', container).forEach((el) => el.addEventListener("click", () => openSkipDayModal(todayDateStr(), container, navigate, refreshDash)));
  qsa("[data-skip-date]", container).forEach((el) => el.addEventListener("click", () => openSkipDayModal(el.dataset.skipDate, container, navigate, refreshDash)));

const dashboard = { render: dashboardRender };

let dashboardShowAll1RM = false; // 1 Rep Maxes card: top 5 vs every lift

const SKIP_REASONS = ["Sick", "Busy", "Tired", "Sore", "Travel", "Other"];

function compactNumber(n) {
  const v = Math.abs(n);
  if (v >= 1e6) return (n / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (v >= 1e4) return Math.round(n / 1e3) + "k";
  return String(Math.round(n));
}

// "Mon, Oct 4" from a YYYY-MM-DD string, in local time (no UTC day-shift).
function formatLocalDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

// Monday-to-Sunday strip for the current week. Each day is one of:
// done (trained), skipped (logged as skipped), missed (planned, past, nothing
// logged), planned (still to come / today), rest (nothing scheduled).
function weekStripHtml(workouts, programHistory, scheduleOverrides, skipLogs) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayKey = dateKey(today);
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));

  const doneByDate = new Map();
  for (const w of workouts) {
    if (w.status === "abandoned") continue;
    const k = dateKey(new Date(w.startedAt));
    if (!doneByDate.has(k)) doneByDate.set(k, w);
  }
  const skipByDate = new Map(skipLogs.map((e) => [e.date, e]));
  const letters = ["M", "T", "W", "T", "F", "S", "S"];

  let trained = 0, planned = 0, skipped = 0, cells = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const k = dateKey(d);
    const w = doneByDate.get(k);
    const skip = skipByDate.get(k);
    const type = effectiveDayTypeForDateV(d, programHistory, scheduleOverrides);
    const isPlanned = !!type && type !== "R";
    const isFuture = k > todayKey;
    const isPast = k < todayKey;
    if (isPlanned) planned++;

    let state = "rest", mark = "", attrs = "", status = "rest day";
    if (w) { state = "done"; mark = "✓"; trained++; status = "trained"; attrs = `data-workout-id="${w.id}"`; }
    else if (skip) { state = "skipped"; mark = "×"; skipped++; status = "skipped" + (skip.reason ? ", " + skip.reason : ""); attrs = `data-skip-date="${k}"`; }
    else if (isPlanned) {
      state = isPast ? "missed" : "planned";
      mark = (PROGRAM[type]?.label || String(type)).charAt(0).toUpperCase();
      status = isPast ? "planned, nothing logged" : "planned";
      if (!isFuture) attrs = `data-skip-date="${k}"`;
    } else if (!isFuture) attrs = `data-skip-date="${k}"`;
    if (isFuture) attrs = "disabled";

    const when = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    cells += `<button type="button" class="wk-day${k === todayKey ? " today" : ""}" data-state="${state}" ${attrs} aria-label="${escapeHtml(when)}, ${escapeHtml(status)}">
      <span class="wk-letter">${letters[i]}</span><span class="wk-dot">${mark}</span>
    </button>`;
  }

  const total = Math.max(planned, trained);
  const caption = total
    ? `${trained} of ${total} session${total === 1 ? "" : "s"} this week${skipped ? ` · ${skipped} skipped` : ""}`
    : `${trained} session${trained === 1 ? "" : "s"} this week${skipped ? ` · ${skipped} skipped` : ""}`;

  return `
    <div class="week-strip">${cells}</div>
    <div class="wk-caption"><span>${caption}</span><button class="link-btn" type="button" data-act="log-skip">Log skipped day</button></div>`;
}

// Sets per Group this week (Mon–Sun): done, still planned, and the target band from
// Settings. Tap a Group to expand its Regions. An exercise counts once per Group.
function weeklyMuscleCardHtml(workouts, programHistory, scheduleOverrides, settingsData, skipLogs) {
  const lo = settingsData.weeklySetsMin || 10;
  const hi = settingsData.weeklySetsMax || 20;
  const rlo = Math.max(1, Math.round(lo * REGION_TARGET_FACTOR));
  const rhi = Math.max(rlo, Math.round(hi * REGION_TARGET_FACTOR));

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayKey = dateKey(today);
  const monday = mondayOf(today);
  const mondayKey = dateKey(monday);

  const trainedKeys = new Set();
  for (const w of workouts) if (w.status !== "abandoned") trainedKeys.add(dateKey(new Date(w.startedAt)));
  const done = volumeByBucket(workouts, "week", { from: mondayKey }).get(mondayKey) || createVolumeAcc();

  const skipped = new Set((skipLogs || []).map((e) => e.date));
  const planned = createVolumeAcc();
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const k = dateKey(d);
    if (k < todayKey || (k === todayKey && (trainedKeys.has(k) || skipped.has(k)))) continue;
    if (skipped.has(k)) continue;
    const t = effectiveDayTypeForDateV(d, programHistory, scheduleOverrides);
    if (!t || t === "R" || !PROGRAM[t]) continue;
    mergeVolume(planned, programVolume(t));
  }

  const status = (v, a, b) => { const r = Math.round(v); return r < a ? "Low" : r > b ? "High" : "On target"; };
  const bar = (d, p, a, b, label) => {
    const max = Math.max(b * 1.25, (d + p) * 1.05, 1);
    const pc = (v) => Math.min(100, (v / max) * 100);
    return `<div class="mw-bar" role="img" aria-label="${escapeHtml(label)}"><span class="mw-band" style="left:${pc(a)}%; width:${pc(b) - pc(a)}%"></span><span class="mw-plan" style="left:${pc(d)}%; width:${pc(d + p) - pc(d)}%"></span><span class="mw-fill" style="width:${pc(d)}%"></span></div>`;
  };
  const num = (d, p, st) => `${Math.round(d)}${p ? `<span class="mw-sub">+ ${Math.round(p)} planned</span>` : ""}<span class="mw-flag">${st}</span>`;

  const groups = REGION_GROUPS
    .map((g) => ({ g, d: done.groups[g.key] || 0, p: planned.groups[g.key] || 0 }))
    .filter((x) => x.d + x.p > 0)
    .sort((a, b) => b.d + b.p - (a.d + a.p));

  const untagged = allExerciseDefs().filter((d) => !Object.keys(d.regions || {}).length).length;
  const nudge = untagged
    ? `<div class="sc-caption" style="margin-top:10px;">${untagged} exercise${untagged === 1 ? " has" : "s have"} no region tags. <button class="link-btn" type="button" data-act="go-bulk">Bulk tag</button></div>`
    : "";

  let body;
  if (!groups.length) {
    body = `<div class="sc-caption" style="margin-top:0;">Train this week to see your sets by muscle.</div>${nudge}`;
  } else {
    body = groups.map(({ g, d, p }) => {
      const open = expandedGroups.has(g.key);
      const regs = g.regions
        .map((r) => ({ r, d: done.regions[r.key] || 0, p: planned.regions[r.key] || 0 }))
        .filter((x) => x.d + x.p > 0)
        .sort((a, b) => b.d + b.p - (a.d + a.p));
      return `
        <div class="mw-group ${open ? "open" : ""}">
          <button type="button" class="mw-group-btn" data-act="toggle-group" data-group="${g.key}" aria-expanded="${open}">
            <div class="mw-head"><span class="mw-name"><span class="mw-chev" aria-hidden="true">›</span>${escapeHtml(g.label)}</span><span class="mw-num">${num(d, p, status(d + p, lo, hi))}</span></div>
            ${bar(d, p, lo, hi, `${g.label}: ${Math.round(d)} sets done, ${Math.round(p)} planned, target ${lo} to ${hi}`)}
          </button>
          <div class="mw-collapse"><div><div class="mw-regions">
            ${regs.map(({ r, d: rd, p: rp }) => `
              <div class="mw-reg">
                <div class="mw-head"><span>${escapeHtml(r.label)}</span><span class="mw-num">${num(rd, rp, status(rd + rp, rlo, rhi))}</span></div>
                ${bar(rd, rp, rlo, rhi, `${r.label}: ${Math.round(rd)} sets done, ${Math.round(rp)} planned, target ${rlo} to ${rhi}`)}
              </div>`).join("")}
          </div></div></div>
        </div>`;
    }).join("") + `<div class="sc-caption" style="margin-top:10px;">Group target ${lo}–${hi} sets, region target ${rlo}–${rhi}. Each exercise counts once per group. Tap a group to expand.</div>${nudge}`;
  }

  return `
    <div class="stat-card span-2">
      <div class="sc-head"><span class="sc-icon">${ICONS.split}</span><span class="sc-title">This Week by Muscle</span></div>
      ${body}
    </div>`;
}

// Last 30 days: how many days you trained vs skipped, with the latest skips
// listed so they can be edited. Tap a row (or a day in the week strip /
// History calendar) to change or remove it.
function skippedCardHtml(skipLogs, workouts) {
  const cutoff = new Date();
  cutoff.setHours(0, 0, 0, 0);
  cutoff.setDate(cutoff.getDate() - 29);
  const ck = dateKey(cutoff);

  const recent = skipLogs.filter((e) => e.date >= ck);
  const trainedDays = new Set(
    workouts.filter((w) => w.status !== "abandoned").map((w) => dateKey(new Date(w.startedAt))).filter((k) => k >= ck)
  ).size;

  const counts = {};
  recent.forEach((e) => { if (e.reason) counts[e.reason] = (counts[e.reason] || 0) + 1; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];

  const list = skipLogs.slice().reverse().slice(0, 4);
  const rows = list.length
    ? `<div class="skip-list">${list.map((e) => `
        <button type="button" class="skip-row" data-skip-date="${e.date}">
          <span class="skip-date">${escapeHtml(formatLocalDate(e.date))}</span>
          <span class="skip-reason">${escapeHtml(e.reason || "No reason")}${e.note ? " · " + escapeHtml(e.note) : ""}</span>
          <span class="h-chevron">›</span>
        </button>`).join("")}</div>`
    : `<div class="sc-caption">Missed a session? Log it here to keep an honest record.</div>`;

  return `
    <div class="stat-card span-2">
      <div class="sc-head"><span class="sc-icon">${ICONS.skip}</span><span class="sc-title">Skipped Days</span></div>
      <div class="sc-value">${recent.length}<span class="sc-unit">skipped</span></div>
      <div class="sc-caption" style="margin-bottom:${list.length ? 8 : 0}px;">${trainedDays} trained · ${recent.length} skipped in the last 30 days${top ? ` · mostly ${escapeHtml(top[0].toLowerCase())}` : ""}</div>
      ${rows}
      <div style="margin-top:12px;"><button class="btn btn-sm" type="button" data-act="log-skip" style="width:100%;">+ Log skipped day</button></div>
    </div>`;
}

// Log, edit or remove a skipped day. onDone re-renders whichever screen opened it.
async function openSkipDayModal(initialDate, container, navigate, onDone) {
  let logs = await storage.getSkipLogs();
  const workouts = await storage.getWorkouts();
  const trainedDates = new Set(workouts.filter((w) => w.status !== "abandoned").map((w) => dateKey(new Date(w.startedAt))));
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  modalRoot.appendChild(overlay);
  const close = () => overlay.remove();

  let date = initialDate || todayDateStr();
  let reason = "";
  let note = "";
  const sync = () => {
    const ex = logs.find((e) => e.date === date);
    reason = ex?.reason || "";
    note = ex?.note || "";
  };
  sync();

  const render = () => {
    const ex = logs.find((e) => e.date === date);
    overlay.innerHTML = `
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="skip-modal-title">
        <h3 id="skip-modal-title">${ex ? "Edit skipped day" : "Log skipped day"}</h3>
        <p class="text-faint" style="margin-top:0;">Mark a day you didn't train so your record stays honest.</p>
        <div class="field">
          <label for="skip-date">Date</label>
          <input type="date" id="skip-date" value="${date}" max="${todayDateStr()}">
        </div>
        <div class="field">
          <label>Reason</label>
          <div class="chip-wrap">${SKIP_REASONS.map((r) => `<button type="button" class="chip-btn skip-chip ${reason === r ? "active" : ""}" data-reason="${r}">${r}</button>`).join("")}</div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="skip-note">Note (optional)</label>
          <input type="text" id="skip-note" maxlength="80" value="${escapeHtml(note)}" placeholder="e.g. Knee felt off">
        </div>
        <div class="btn-row" style="margin-top:18px;">
          ${ex ? `<button class="btn btn-danger" data-act="remove" type="button">Remove</button>` : `<button class="btn btn-ghost" data-act="cancel" type="button">Cancel</button>`}
          <button class="btn btn-primary" data-act="save" type="button">Save</button>
        </div>
      </div>`;

    qs("#skip-date", overlay).addEventListener("change", (e) => {
      if (!e.target.value) return;
      date = e.target.value;
      sync();
      render();
    });
    qs("#skip-note", overlay).addEventListener("input", (e) => { note = e.target.value; });
    qsa(".skip-chip", overlay).forEach((chip) => chip.addEventListener("click", () => {
      reason = reason === chip.dataset.reason ? "" : chip.dataset.reason;
      render();
    }));
    qs('[data-act="cancel"]', overlay)?.addEventListener("click", close);
    qs('[data-act="remove"]', overlay)?.addEventListener("click", async () => {
      try {
        await storage.deleteSkipLog(ex.id);
      } catch (err) {
        toast("Couldn't remove — check your connection");
        return;
      }
      close();
      toast("Skipped day removed");
      onDone?.();
    });
    qs('[data-act="save"]', overlay).addEventListener("click", async () => {
      if (!date) { toast("Pick a date"); return; }
      if (trainedDates.has(date)) { toast("You already logged a workout on that day"); return; }
      try {
        await storage.logSkip(date, reason, note.trim());
      } catch (err) {
        toast("Couldn't save — check your connection");
        return;
      }
      close();
      toast("Skipped day logged");
      onDone?.();
    });
  };

  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  render();
}

// Best estimated 1RM per exercise (Epley) across all logged history, using
// the top completed set. Exercises are matched by name so they keep their
// history across program changes.
function computeOneRepMaxes(workouts) {
  const best = new Map();
  for (const w of workouts) {
    if (w.status !== "completed" && w.status !== "partial") continue;
    for (const entry of w.exercises) {
      const key = normalizeExerciseName(entry.name);
      if (!key) continue;
      for (const s of entry.sets) {
        if (!s.completed) continue;
        const candidates = s.unilateral
          ? [{ kg: s.leftWeightKg, reps: s.leftReps, side: "left" }, { kg: s.rightWeightKg, reps: s.rightReps, side: "right" }]
          : [{ kg: s.weightKg, reps: s.reps, side: null }];
        for (const c of candidates) {
          if (!c.kg || !c.reps) continue;
          const est = estimate1RM(c.kg, c.reps);
          const cur = best.get(key);
          if (!cur || est > cur.est) {
            best.set(key, { name: entry.name, exerciseId: entry.exerciseId, est, kg: c.kg, reps: c.reps, side: c.side, unit: s.weightUnit || "kg", date: w.startedAt });
          }
        }
      }
    }
  }
  return [...best.values()].sort((a, b) => b.est - a.est);
}
