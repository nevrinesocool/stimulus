let tickInterval = null;
let cachedSettings = null;
let cachedPreviousByExercise = {}; // exerciseId -> last completed entry (from history, excluding current active workout)
let cachedStalled = {}; // exerciseId -> true when the lift hasn't set a new best in 3 sessions
let cachedBestE1RM = {}; // exerciseId -> best estimated 1RM (kg) across history, for PR alerts

// Best estimated 1RM (kg) among the completed sets of one workout entry.
function entryBestE1RM(entry) {
  let best = 0;
  for (const s of entry.sets || []) {
    if (!s.completed) continue;
    if (s.unilateral) {
      best = Math.max(best, estimate1RM(s.leftWeightKg, s.leftReps), estimate1RM(s.rightWeightKg, s.rightReps));
    } else {
      best = Math.max(best, estimate1RM(s.weightKg, s.reps));
    }
  }
  return best;
}

// Personal-record alert: a just-completed set beats the best estimated 1RM
// from all past sessions. The first-ever log of a lift only sets a baseline.
function checkForPR(entry, set) {
  const setBest = entryBestE1RM({ sets: [set] });
  const prevBest = cachedBestE1RM[entry.exerciseId] || 0;
  if (prevBest > 0 && setBest > prevBest + 0.01) {
    cachedBestE1RM[entry.exerciseId] = setBest;
    hapticTap([30, 60, 30]);
    toast(`🏆 New PR on ${entry.name}!`, { duration: 4500 });
  } else if (prevBest === 0 && setBest > 0) {
    cachedBestE1RM[entry.exerciseId] = setBest;
  }
}

// ---- typed values: save as you type, not just on blur -----------------------
// Number boxes used to save only on "change" (blur). If the phone locked or the
// app was backgrounded while a box was still focused, that value was lost.
// Now the model updates on every keystroke, the save is debounced, and it is
// flushed immediately when the page is hidden.
const INTEGER_FIELDS = new Set(["reps", "leftReps", "rightReps"]);
let liveWorkoutRef = null;
let typedSaveTimer = null;

function commitSetInput(input, workout) {
  const { field, exercise, set } = input.dataset;
  const entry = workout.exercises.find((e) => e.exerciseId === exercise);
  const s = entry && entry.sets[Number(set)];
  if (!s) return false;
  let raw = input.value === "" ? null : Number(input.value);
  if (raw != null && !Number.isFinite(raw)) raw = null;
  if (raw != null && raw < 0) raw = 0;
  if (raw != null && INTEGER_FIELDS.has(field)) raw = Math.round(raw);
  if (field === "weightKg" || field === "leftWeightKg" || field === "rightWeightKg") {
    const effectiveUnit = s.weightUnit || getExerciseUnit(cachedSettings, exercise);
    s[field] = raw == null ? null : toStorageWeight(raw, effectiveUnit);
    if (raw != null) s.weightUnit = effectiveUnit;
  } else {
    s[field] = raw;
  }
  return true;
}

function wireSetInput(input, workout) {
  liveWorkoutRef = workout;
  input.addEventListener("input", () => {
    if (!commitSetInput(input, workout)) return;
    clearTimeout(typedSaveTimer);
    typedSaveTimer = setTimeout(() => queueActiveWorkoutSave(workout), 500);
  });
  input.addEventListener("change", () => {
    // Blur / Enter: clean up what's shown (e.g. a negative number) and save now.
    if (!commitSetInput(input, workout)) return;
    const { field, exercise, set } = input.dataset;
    const s = workout.exercises.find((e) => e.exerciseId === exercise).sets[Number(set)];
    if (input.value !== "" && Number(input.value) < 0) input.value = "0";
    if (INTEGER_FIELDS.has(field) && s[field] != null) input.value = String(s[field]);
    clearTimeout(typedSaveTimer);
    queueActiveWorkoutSave(workout);
  });
}

function flushTypedInputs() {
  if (!liveWorkoutRef || currentRoute !== "workout-active") return;
  const el = document.activeElement;
  if (el && el.matches && el.matches("input[data-field]")) commitSetInput(el, liveWorkoutRef);
  clearTimeout(typedSaveTimer);
  queueActiveWorkoutSave(liveWorkoutRef);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushTypedInputs(); });
window.addEventListener("pagehide", flushTypedInputs);

// Enter / Next jumps to the following box within one exercise card.
function wireEnterKey(card) {
  const fieldInputs = qsa('input[data-field]', card);
  fieldInputs.forEach((input, idx) => {
    input.setAttribute("enterkeyhint", idx === fieldInputs.length - 1 ? "done" : "next");
    input.addEventListener("keydown", (ev) => {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      const nextInput = fieldInputs[idx + 1];
      if (nextInput) { nextInput.focus(); if (nextInput.select) nextInput.select(); } else { input.blur(); }
    });
  });
}

// Total volume (kg x reps) of completed sets in a workout.
function workoutVolumeKg(workout) {
  let total = 0;
  for (const e of workout.exercises) {
    for (const s of e.sets) {
      if (!s.completed) continue;
      if (s.unilateral) {
        total += (s.leftWeightKg || 0) * (s.leftReps || 0) + (s.rightWeightKg || 0) * (s.rightReps || 0);
      } else {
        total += (s.weightKg || 0) * (s.reps || 0);
      }
    }
  }
  return total;
}
let dashboardPeriodRange = "weekly"; // weekly | monthly | yearly — Dashboard's period-comparison bar chart
let dashboardVolumeTypeFilter = "all"; // "all" or a PROGRAM_DAY_TYPES key — narrows the Volume by Period chart to one workout type
let dashboardVolumeUnit = "kg"; // "kg" | "lb" — display unit for the Volume by Period chart and the Total Volume stat
let dashboardBodyweightUnit = "kg"; // "kg" | "lb" — display unit for the Body Weight card

// Buckets a workout list into fixed windows for the given range and sums
// each bucket's training volume, oldest to newest — e.g. weekly gives the
// last 8 rolling 7-day windows, so you can compare week-over-week rather
// than just see a single sliding trend line. Optional typeFilter narrows
// to one workout type (day type key) instead of blending everything
// together — a Lower day and an Arms day move wildly different tonnage, so
// blending them into one number was a big part of why this felt useless.
const DASHBOARD_PERIOD_BUCKET_COUNT = { weekly: 8, monthly: 6, yearly: 5 };

function periodBuckets(workouts, range, typeFilter) {
  const now = new Date();
  const count = DASHBOARD_PERIOD_BUCKET_COUNT[range];
  const windows = [];

  if (range === "weekly") {
    for (let i = count - 1; i >= 0; i--) {
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i * 7, 23, 59, 59, 999);
      const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 6, 0, 0, 0, 0);
      windows.push({ start, end, label: `${start.getMonth() + 1}/${start.getDate()}` });
    }
  } else if (range === "monthly") {
    for (let i = count - 1; i >= 0; i--) {
      const start = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59, 999);
      windows.push({ start, end, label: start.toLocaleDateString(undefined, { month: "short" }) });
    }
  } else {
    for (let i = count - 1; i >= 0; i--) {
      const y = now.getFullYear() - i;
      windows.push({ start: new Date(y, 0, 1), end: new Date(y, 11, 31, 23, 59, 59, 999), label: String(y) });
    }
  }

  const completed = workouts.filter((w) => w.status !== "abandoned" && (!typeFilter || typeFilter === "all" || w.type === typeFilter));
  return windows.map((win) => ({
    label: win.label,
    rangeLabel: `${formatDateShort(win.start.toISOString())} – ${formatDateShort(win.end.toISOString())}`,
    value: completed
      .filter((w) => {
        const t = new Date(w.startedAt).getTime();
        return t >= win.start.getTime() && t <= win.end.getTime();
      })
      .reduce((sum, w) => sum + workoutVolume(w), 0),
  }));
}

// Minimal bar chart, styled to match sparkline() — now with an actual
// value readable per bar (not just relative height), the current period
// visually called out, and a native <title> so hovering/long-pressing a
// bar on a device that supports it shows the exact figure and date range.
function barChart(buckets, unit) {
  const values = buckets.map((b) => roundTo(displayWeight(b.value, unit), 0) ?? 0);
  const max = Math.max(...values, 1);
  const w = 300, h = 134, pad = 6, gap = 5, labelH = 14, valueH = 14;
  const plotH = h - pad * 2 - labelH - valueH;
  const barW = (w - pad * 2 - gap * (values.length - 1)) / values.length;
  const lastIdx = values.length - 1;
  const fmtValue = (v) => (v >= 1000 ? `${roundTo(v / 1000, 1)}k` : v > 0 ? String(v) : "");

  const bars = values.map((v, i) => {
    const barH = max > 0 ? (v / max) * plotH : 0;
    const x = pad + i * (barW + gap);
    const y = pad + valueH + (plotH - barH);
    const fill = i === lastIdx ? "var(--c-crimson-bright)" : "var(--c-hairline-strong)";
    const valueLabel = fmtValue(v);
    return `
      <g class="bar-group" data-index="${i}" style="cursor:pointer;">
        <rect x="${x}" y="${pad}" width="${barW}" height="${plotH + valueH}" fill="transparent"/>
        ${valueLabel ? `<text x="${x + barW / 2}" y="${pad + valueH - 3}" font-size="8.5" fill="var(--c-off-faint)" text-anchor="middle">${valueLabel}</text>` : ""}
        <rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH, 1)}" rx="2" fill="${fill}"/>
        <title>${escapeHtml(buckets[i].rangeLabel)}: ${v.toLocaleString()} ${unit}</title>
      </g>`;
  }).join("");
  const labels = buckets.map((b, i) => {
    const x = pad + i * (barW + gap) + barW / 2;
    return `<text x="${x}" y="${h - 3}" font-size="9" fill="var(--c-off-faint)" text-anchor="middle">${escapeHtml(b.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${bars}${labels}</svg>`;
}

// The headline line above the chart: this period's total plus how it
// compares to the one before it — the "period comparison" the section has
// always claimed to offer, but never actually stated as a number before.
function periodDeltaSummary(buckets, unit, periodLabel) {
  if (buckets.length < 1) return "";
  const current = buckets[buckets.length - 1];
  const currentDisplay = roundTo(displayWeight(current.value, unit), 0) ?? 0;
  if (buckets.length < 2 || !current.value) {
    return `<span class="numeric" style="font-size:20px; font-weight:600; color:var(--c-off);">${currentDisplay.toLocaleString()} ${unit}</span> <span class="text-faint">this ${periodLabel}</span>`;
  }
  const prior = buckets[buckets.length - 2];
  if (!prior.value) {
    return `<span class="numeric" style="font-size:20px; font-weight:600; color:var(--c-off);">${currentDisplay.toLocaleString()} ${unit}</span> <span class="text-faint">this ${periodLabel} — no volume logged last ${periodLabel} to compare</span>`;
  }
  const pctChange = ((current.value - prior.value) / prior.value) * 100;
  const rounded = roundTo(Math.abs(pctChange), 0) ?? 0;
  const arrow = pctChange > 0 ? "▲" : pctChange < 0 ? "▼" : "—";
  const color = pctChange > 0 ? "var(--c-positive, #4caf7d)" : pctChange < 0 ? "var(--c-off-faint)" : "var(--c-off-faint)";
  return `<span class="numeric" style="font-size:20px; font-weight:600; color:var(--c-off);">${currentDisplay.toLocaleString()} ${unit}</span> <span class="text-faint">this ${periodLabel}</span> <span class="numeric" style="color:${color}; font-weight:600;">${arrow} ${rounded}%</span> <span class="text-faint">vs last ${periodLabel}</span>`;
}


function stopTicking() {
  if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
}

// Keep the screen on while a workout is open so the phone doesn't lock
// between sets. Best-effort: browsers without the Wake Lock API just skip it.
let wakeLockSentinel = null;
async function acquireWakeLock() {
  try {
    if (!("wakeLock" in navigator) || wakeLockSentinel) return;
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
  } catch (_) { wakeLockSentinel = null; }
}
function releaseWakeLock() {
  try { if (wakeLockSentinel) wakeLockSentinel.release(); } catch (_) {}
  wakeLockSentinel = null;
}
document.addEventListener("visibilitychange", () => {
  // The browser drops the lock when the app is backgrounded; take it again on return.
  if (document.visibilityState === "visible" && currentRoute === "workout-active") acquireWakeLock();
});

function teardown() {
  releaseWakeLock();
  stopTicking();
}

async function startNewWorkout(type) {
  const def = PROGRAM[type];
  const exercises = def.exercises.map((e) => ({
    exerciseId: e.id,
    name: e.name,
    unilateral: e.unilateral,
    sets: Array.from({ length: e.sets }, (_, i) => baseSet(i, e.unilateral)),
    tempo: null, // null | "improved" | "none" — manual execution feedback, item 8
    notes: "",
    substitutedFrom: null, // { exerciseId, name } if this entry replaced another exercise for this workout only
  }));

  const workout = {
    id: uid(),
    type,
    startedAt: nowISO(),
    completedAt: null,
    status: "active",
    exercises,
    cardio: {
      pre: baseCardio(),
      post: baseCardio(),
    },
    notes: "",
  };

  dismissRestTimer();
  await settleActiveWorkoutSaves();
  await storage.saveActiveWorkout(workout);
}

function baseSet(index, unilateral) {
  return unilateral
    ? { index, unilateral: true, leftWeightKg: null, leftReps: null, rightWeightKg: null, rightReps: null, weightUnit: null, leftRir: null, rightRir: null, completed: false, skipped: false, notes: "" }
    : { index, unilateral: false, weightKg: null, reps: null, weightUnit: null, rir: null, completed: false, skipped: false, notes: "" };
}

function baseCardio() {
  return {
    status: "idle", // idle | completed | skipped
  };
}

// ---------------------------------------------------------------------------
// Active workout screen
// ---------------------------------------------------------------------------

// Fire-and-forget saves of the active workout (every set/weight/rep/note
// edit) used to call storage.saveActiveWorkout(workout) directly with no
// await and no .catch — so a failed save (dropped connection, a blip in
// Supabase) vanished silently. The input still showed the new value, the
// small header dot flipped to "Save failed" for a moment, and that was it:
// nothing retried, and closing the tab or opening another device before it
// happened to succeed meant that set was just gone.
//
// This wraps every one of those call sites instead: on failure it retries
// automatically with backoff (most failures here are a transient network
// blip, not a reason to lose the set), and if saves keep failing it
// escalates to an actual toast rather than relying on someone mid-workout
// to notice a small dot in the header. Because `workout` is the same
// mutated-in-place object used throughout the active workout screen, a
// retry always captures whatever the *latest* state is by the time it
// fires — never a stale snapshot from the moment it first failed.
let activeWorkoutSaveRetryTimer = null;
let activeWorkoutSaveFailCount = 0;
let activeSaveInFlight = null;
let activeSaveDirty = false;
let activeSaveWorkout = null;

function clearActiveWorkoutSaveRetry() {
  if (activeWorkoutSaveRetryTimer) { clearTimeout(activeWorkoutSaveRetryTimer); activeWorkoutSaveRetryTimer = null; }
  activeWorkoutSaveFailCount = 0;
  activeSaveDirty = false;
  activeSaveWorkout = null;
}

// Cancel queued saves AND wait for any request already on the wire, so a late
// upsert can't overwrite/resurrect the active workout after finish/discard.
async function settleActiveWorkoutSaves() {
  clearActiveWorkoutSaveRetry();
  if (activeSaveInFlight) {
    try { await activeSaveInFlight; } catch (_) {}
  }
  clearActiveWorkoutSaveRetry();
}

// Saves run one at a time and coalesce, so out-of-order requests can't let an
// older snapshot overwrite a newer one.
function queueActiveWorkoutSave(workout) {
  activeSaveWorkout = workout;
  activeSaveDirty = true;
  if (activeWorkoutSaveRetryTimer) { clearTimeout(activeWorkoutSaveRetryTimer); activeWorkoutSaveRetryTimer = null; }
  if (!activeSaveInFlight) activeSaveInFlight = flushActiveWorkoutSave();
}

async function flushActiveWorkoutSave() {
  try {
    while (activeSaveDirty && activeSaveWorkout) {
      activeSaveDirty = false;
      const w = activeSaveWorkout;
      try {
        await storage.saveActiveWorkout(w);
        activeWorkoutSaveFailCount = 0;
      } catch (err) {
        console.error("[app] active workout save failed, will retry", err);
        activeWorkoutSaveFailCount++;
        if (activeWorkoutSaveFailCount === 3) {
          toast("Your last few changes haven't saved — check your connection. Retrying…", { duration: 6000 });
        }
        if (activeSaveWorkout === w) {
          const delay = Math.min(15000, 1500 * activeWorkoutSaveFailCount);
          activeWorkoutSaveRetryTimer = setTimeout(() => { activeWorkoutSaveRetryTimer = null; queueActiveWorkoutSave(w); }, delay);
        }
        break;
      }
    }
  } finally {
    activeSaveInFlight = null;
  }
}

// ---- Next-set targets: double progression --------------------------------
// Work up through the rep range at one weight; once the top of the range is
// hit with reps still in reserve, add weight and drop back to the bottom.

function parseRepRange(text) {
  const t = String(text || "");
  const m = t.match(/(\d+)\s*(?:-|–|to)\s*(\d+)/i);
  if (m) {
    const x = Number(m[1]), y = Number(m[2]);
    return { lo: Math.min(x, y), hi: Math.max(x, y) };
  }
  const one = t.match(/(\d+)/);
  if (one) { const n = Number(one[1]); return { lo: n, hi: n }; }
  return null;
}

function rirNumber(v) {
  if (v === "failure") return 0;
  if (v === "2+") return 3;
  const n = Number(v);
  return v != null && v !== "" && Number.isFinite(n) ? n : null;
}

// One comparable { kg, reps, rir } per completed set. For a unilateral set the
// weaker side decides, so a lagging side isn't progressed past.
function setSummaryForTarget(s) {
  if (!s.completed) return null;
  if (s.unilateral) {
    const kg = Math.max(s.leftWeightKg || 0, s.rightWeightKg || 0);
    const reps = Math.min(s.leftReps || 0, s.rightReps || 0);
    const rirs = [rirNumber(s.leftRir), rirNumber(s.rightRir)].filter((v) => v != null);
    return kg && reps ? { kg, reps, rir: rirs.length ? rirs.reduce((x, y) => x + y, 0) / rirs.length : null } : null;
  }
  return s.weightKg && s.reps ? { kg: s.weightKg, reps: s.reps, rir: rirNumber(s.rir) } : null;
}

function weightStep(unit, w) {
  if (unit === "lb") return w >= 100 ? 5 : 2.5;
  if (w >= 60) return 2.5;
  if (w >= 30) return 2;
  if (w >= 10) return 1;
  return 0.5;
}

function computeNextTarget(prevEntry, targetRepsText, unit) {
  if (!prevEntry) return null;
  const sets = prevEntry.sets.map(setSummaryForTarget).filter(Boolean);
  if (!sets.length) return null;
  const top = sets.reduce((a, b) => (b.kg > a.kg || (b.kg === a.kg && b.reps > a.reps)) ? b : a);
  const range = parseRepRange(targetRepsText) || { lo: 8, hi: 12 };
  const rirs = sets.map((x) => x.rir).filter((v) => v != null);
  const avgRir = rirs.length ? rirs.reduce((x, y) => x + y, 0) / rirs.length : null;

  const w = roundTo(displayWeight(top.kg, unit), 1);
  const reps = top.reps;
  let next;
  if (reps >= range.hi && (avgRir == null || avgRir >= 1)) {
    next = { kind: "up", weight: roundTo(w + weightStep(unit, w), 1), reps: range.lo, why: `You hit ${reps} reps with some left in the tank. Add weight and start the range again.` };
  } else if (reps >= range.hi) {
    next = { kind: "hold", weight: w, reps: range.hi, why: `${reps} reps but right at your limit. Own this weight once more before adding.` };
  } else if (reps < range.lo) {
    next = { kind: "hold", weight: w, reps: range.lo, why: `Last time ${reps} reps. Build back up to ${range.lo} at this weight.` };
  } else {
    next = { kind: "reps", weight: w, reps: reps + 1, why: `Same weight, one more rep than last time (${reps}).` };
  }
  return next;
}

// True when none of the last 3 sessions beat the one before them.
function detectStall(history, exerciseId, name) {
  const bests = [];
  for (const w of history) {
    if (w.status !== "completed" && w.status !== "partial") continue;
    const entry = findExerciseEntryInWorkout(w, exerciseId, name);
    if (!entry) continue;
    let best = 0;
    for (const set of entry.sets) {
      const x = setSummaryForTarget(set);
      if (x) best = Math.max(best, estimate1RM(x.kg, x.reps));
    }
    if (best > 0) bests.push(best);
    if (bests.length === 4) break;
  }
  if (bests.length < 4) return false;
  const baseline = bests[3] * 1.005;
  return bests[0] <= baseline && bests[1] <= baseline && bests[2] <= baseline;
}

async function renderActiveWorkout(container, navigate) {
  teardown();
  const active = await storage.getActiveWorkout();
  if (!active) {
    container.innerHTML = `<div class="empty-state"><span class="glyph">◆</span><h3>No workout in progress</h3><p>Start a workout to begin logging.</p></div>`;
    return;
  }
  cachedSettings = await storage.getSettings();

  // Pre-compute "previous performance" for every exercise, excluding this active session.
  const history = await storage.getWorkouts();
  cachedPreviousByExercise = {};
  cachedStalled = {};
  cachedBestE1RM = {};
  for (const entry of active.exercises) {
    cachedPreviousByExercise[entry.exerciseId] = findPreviousEntry(history, entry.exerciseId, entry.name);
    cachedStalled[entry.exerciseId] = detectStall(history, entry.exerciseId, entry.name);
    let best = 0;
    for (const w of history) {
      if (w.status !== "completed" && w.status !== "partial") continue;
      const past = findExerciseEntryInWorkout(w, entry.exerciseId, entry.name);
      if (past) best = Math.max(best, entryBestE1RM(past));
    }
    cachedBestE1RM[entry.exerciseId] = best;
  }

  paintActiveWorkout(container, active, navigate);
}

function findPreviousEntry(history, exerciseId, exerciseName) {
  for (const w of history) {
    if (w.status !== "completed" && w.status !== "partial") continue;
    const entry = findExerciseEntryInWorkout(w, exerciseId, exerciseName);
    if (entry && entry.sets.some((s) => s.completed)) return entry;
  }
  return null;
}

function previousSetSummary(prevEntry, unilateral) {
  if (!prevEntry) return null;
  const completedSets = prevEntry.sets.filter((s) => s.completed);
  if (!completedSets.length) return null;
  if (unilateral) {
    return completedSets.map((s) => {
      const u = s.weightUnit || "kg";
      const lw = displayWeight(s.leftWeightKg, u);
      const rw = displayWeight(s.rightWeightKg, u);
      return `L ${roundTo(lw) ?? "–"}${u}×${s.leftReps ?? "–"}  ·  R ${roundTo(rw) ?? "–"}${u}×${s.rightReps ?? "–"}`;
    });
  }
  return completedSets.map((s) => {
    const u = s.weightUnit || "kg";
    return `${roundTo(displayWeight(s.weightKg, u)) ?? "–"}${u} × ${s.reps ?? "–"}`;
  });
}

function paintActiveWorkout(container, workout, navigate) {
  const def = PROGRAM[workout.type];
  const { completed, skipped, programmed } = countCompletedSets(workout);
  const pct = programmed ? Math.round(((completed + skipped) / programmed) * 100) : 0;

  let html = `
    <div class="workout-header">
      <div>
        <div class="eyebrow">In progress<span class="workout-timer" id="workout-elapsed" aria-label="Time elapsed"></span></div>
        <h1 style="font-size:28px; letter-spacing:-0.035em;">${def.label} workout</h1>
      </div>
      <button class="btn btn-sm btn-ghost" data-act="finish">End Workout</button>
    </div>
    <div class="workout-progress-bar"><div class="workout-progress-fill" style="width:${pct}%"></div></div>
    <div class="text-faint mb-16">${completed} completed · ${skipped} skipped · ${programmed} programmed sets</div>

    ${renderCardioCard("pre", workout, "Pre-Workout Cardio")}
  `;

  for (const entry of workout.exercises) {
    html += renderExerciseCard(entry, workout);
  }

  html += renderCardioCard("post", workout, "Post-Workout Cardio");

  html += `
    <div class="field" style="margin-top:20px;">
      <label for="workout-notes">Workout Notes</label>
      <textarea id="workout-notes" placeholder="Optional notes about this session…">${escapeHtml(workout.notes || "")}</textarea>
    </div>
    <button class="btn btn-primary" data-act="finish-bottom">End Workout</button>
  `;

  container.innerHTML = html;
  wireActiveWorkoutEvents(container, workout, navigate);
}

function renderExerciseCard(entry, workout) {
  const def = PROGRAM[workout.type]?.exercises.find((e) => e.id === entry.exerciseId);
  const prev = cachedPreviousByExercise[entry.exerciseId];
  const prevLines = previousSetSummary(prev, entry.unilateral);
  const exerciseUnit = getExerciseUnit(cachedSettings, entry.exerciseId);
  const next = computeNextTarget(prev, def?.targetReps, exerciseUnit);
  const stalled = !!cachedStalled[entry.exerciseId];

  let setsHtml = "";
  entry.sets.forEach((set, i) => {
    setsHtml += renderSetRow(entry, set, i, exerciseUnit, next);
  });

  return `
    <div class="card exercise-card" data-exercise="${entry.exerciseId}">
      <div class="ex-head">
        <div>
          <div class="ex-name">${escapeHtml(entry.name)}${entry.substitutedFrom ? `<span class="text-faint" style="font-size:var(--fs-xs); font-weight:400;"> (sub for ${escapeHtml(entry.substitutedFrom.name)})</span>` : ""}</div>
          <div class="ex-sub">
            <span>${entry.sets.length} programmed set${entry.sets.length > 1 ? "s" : ""}</span>
            ${def?.targetReps ? `<span>· target ${escapeHtml(def.targetReps)} reps</span>` : ""}
            <span>· ${exerciseUnit}</span>
            ${entry.unilateral ? `<span class="badge badge-uni">Unilateral</span>` : ""}
          </div>
        </div>
        <button type="button" class="icon-btn" data-act="open-ex-options" data-exercise="${entry.exerciseId}" aria-label="Exercise options (unit, rest timer, plates, substitute)" style="flex-shrink:0;">⋯</button>
      </div>
      ${prevLines ? `<div class="ex-prev"><span class="ex-prev-label">Last time</span><div class="prev-chips">${prevLines.map((l) => `<span class="prev-chip">${escapeHtml(l)}</span>`).join("")}</div></div>` : `<div class="ex-prev text-faint">No previous data yet</div>`}
      ${prev && prev.notes ? `<div class="ex-stall" style="border-style:solid;">Last note: ${escapeHtml(prev.notes)}</div>` : ""}
      ${next ? `<div class="ex-next"><div class="ex-next-main"><span class="ex-next-label">Next</span><span class="ex-next-val">${next.weight} ${exerciseUnit} × ${next.reps}</span></div><div class="ex-next-why">${escapeHtml(next.why)}</div></div>` : ""}
      ${stalled ? `<div class="ex-stall">No new best in the last 3 sessions. Try a lighter week or a different rep range.</div>` : ""}
      <div class="sets-list">${setsHtml}</div>
      <div class="set-edit-row">
        <button type="button" class="chip-btn" data-act="add-set" data-exercise="${entry.exerciseId}">+ Add set</button>
        ${entry.sets.length > 1 ? `<button type="button" class="chip-btn" data-act="remove-set" data-exercise="${entry.exerciseId}">− Remove last set</button>` : ""}
      </div>
      <div class="quick-row">
        ${next ? `<button class="chip-btn" data-act="use-target" data-exercise="${entry.exerciseId}">Use ${next.weight} ${exerciseUnit}</button>` : ""}
        ${prev ? `<button class="chip-btn" data-act="use-prev-weight" data-exercise="${entry.exerciseId}">Use Previous Weight</button>` : ""}
        ${prev ? `<button class="chip-btn" data-act="copy-prev-set" data-exercise="${entry.exerciseId}">Copy Previous Set</button>` : ""}
      </div>
      <div class="tempo-row" style="margin-top:10px;">
        <span class="rir-label" style="display:block; margin-bottom:6px;">Execution</span>
        <button type="button" class="chip-btn tempo-chip ${entry.tempo === "improved" ? "active" : ""}" data-act="set-tempo" data-exercise="${entry.exerciseId}" data-tempo="improved">Improved tempo/control</button>
        <button type="button" class="chip-btn tempo-chip tempo-none ${entry.tempo === "none" ? "active" : ""}" data-act="set-tempo" data-exercise="${entry.exerciseId}" data-tempo="none">No improvement</button>
      </div>
      <div class="field" style="margin-top:10px; margin-bottom:0;">
        <textarea data-act="ex-notes" data-exercise="${entry.exerciseId}" placeholder="Notes on this exercise…" rows="2">${escapeHtml(entry.notes || "")}</textarea>
      </div>
    </div>
  `;
}

function renderSetRow(entry, set, i, exerciseUnit, next) {
  const rowClass = set.completed ? "completed" : set.skipped ? "skipped" : "";
  const icon = set.completed ? "✓" : set.skipped ? "–" : "";
  // A set that already has a value keeps the unit it was recorded in; a
  // blank/never-touched set uses the exercise's current preferred unit.
  const unit = set.weightUnit || exerciseUnit;
  const wHint = next && unit === exerciseUnit ? String(next.weight) : unit;
  const rHint = next ? String(next.reps) : "reps";

  let inputs;
  if (set.unilateral) {
    const lw = set.leftWeightKg != null ? roundTo(displayWeight(set.leftWeightKg, unit)) : "";
    const rw = set.rightWeightKg != null ? roundTo(displayWeight(set.rightWeightKg, unit)) : "";
    inputs = `
      <div class="set-col">
        <div class="set-side-label">Left</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${wHint}" value="${lw}" data-field="leftWeightKg" data-exercise="${entry.exerciseId}" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="${rHint}" value="${set.leftReps ?? ""}" data-field="leftReps" data-exercise="${entry.exerciseId}" data-set="${i}">
        </div>
      </div>
      <div class="set-col">
        <div class="set-side-label">Right</div>
        <div style="display:flex; gap:4px;">
          <input type="number" inputmode="decimal" placeholder="${wHint}" value="${rw}" data-field="rightWeightKg" data-exercise="${entry.exerciseId}" data-set="${i}">
          <input type="number" inputmode="numeric" placeholder="${rHint}" value="${set.rightReps ?? ""}" data-field="rightReps" data-exercise="${entry.exerciseId}" data-set="${i}">
        </div>
      </div>
    `;
  } else {
    const w = set.weightKg != null ? roundTo(displayWeight(set.weightKg, unit)) : "";
    inputs = `
      <div class="set-col">
        <input type="number" inputmode="decimal" placeholder="${wHint}" value="${w}" data-field="weightKg" data-exercise="${entry.exerciseId}" data-set="${i}">
      </div>
      <div class="set-col">
        <input type="number" inputmode="numeric" placeholder="${rHint}" value="${set.reps ?? ""}" data-field="reps" data-exercise="${entry.exerciseId}" data-set="${i}">
      </div>
    `;
  }

  return `
    <div class="set-row ${rowClass}" data-exercise="${entry.exerciseId}" data-set="${i}">
      <div class="set-index">${i + 1}</div>
      <div class="set-inputs">${inputs}</div>
      <button class="set-complete-btn" data-act="toggle-complete" data-exercise="${entry.exerciseId}" data-set="${i}" aria-label="Mark set ${i + 1} complete">${icon}</button>
    </div>
    ${renderRirRow(entry.exerciseId, set, i)}
  `;
}

function rirChipsHtml(actName, extraAttrs, currentValue) {
  return RIR_OPTIONS.map((opt) => `
    <button type="button" class="chip-btn rir-chip ${currentValue === opt.value ? "active" : ""}" data-act="${actName}" ${extraAttrs} data-rir="${opt.value}">${escapeHtml(opt.label)}</button>
  `).join("");
}

function renderRirRow(exerciseId, set, i) {
  if (set.unilateral) {
    return `
      <div class="rir-row" data-exercise="${exerciseId}" data-set="${i}" data-side="left">
        <span class="rir-label">L RIR</span>
        ${rirChipsHtml("set-rir", `data-exercise="${exerciseId}" data-set="${i}" data-side="left"`, set.leftRir)}
      </div>
      <div class="rir-row" data-exercise="${exerciseId}" data-set="${i}" data-side="right">
        <span class="rir-label">R RIR</span>
        ${rirChipsHtml("set-rir", `data-exercise="${exerciseId}" data-set="${i}" data-side="right"`, set.rightRir)}
      </div>
    `;
  }
  return `
    <div class="rir-row" data-exercise="${exerciseId}" data-set="${i}">
      <span class="rir-label">RIR</span>
      ${rirChipsHtml("set-rir", `data-exercise="${exerciseId}" data-set="${i}"`, set.rir)}
    </div>
  `;
}

function renderCardioCard(phase, workout, title) {
  const c = workout.cardio[phase];
  const statusBadge = c.status === "completed" ? `<span class="badge badge-positive">Completed</span>`
    : c.status === "skipped" ? `<span class="badge">Skipped</span>` : "";

  return `
    <div class="card cardio-card" data-cardio="${phase}">
      <div class="flex-between">
        <div class="eyebrow" style="font-size:14px; font-weight:600; color:var(--c-off);">${title}</div>
        ${statusBadge}
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ${c.status === "completed" ? "btn-primary" : ""}" data-act="cardio-complete" data-phase="${phase}">
          ${c.status === "completed" ? "✓ Done" : "Mark Done"}
        </button>
        <button class="btn btn-ghost btn-sm" data-act="cardio-skip" data-phase="${phase}" style="flex:0 0 auto;">
          ${c.status === "skipped" ? "Skipped" : "Skip"}
        </button>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Event wiring
// ---------------------------------------------------------------------------

function wireActiveWorkoutEvents(container, workout, navigate) {
  // Number inputs — save on change (blur / enter), no full rerender to preserve focus elsewhere.
  qsa('input[data-field]', container).forEach((input) => wireSetInput(input, workout));

  // Exercise options — unit, rest duration, plate calculator, substitute —
  // all consolidated behind the card's "⋯" button (see
  // openExerciseOptionsModal for why).
  qsa('[data-act="open-ex-options"]', container).forEach((btn) => {
    btn.addEventListener("click", () => openExerciseOptionsModal(container, workout, btn.dataset.exercise));
  });

  // RIR chips and failure toggle
  qsa('[data-act="set-rir"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set, rir, side } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      if (side === "left") s.leftRir = s.leftRir === rir ? null : rir;
      else if (side === "right") s.rightRir = s.rightRir === rir ? null : rir;
      else s.rir = s.rir === rir ? null : rir;
      queueActiveWorkoutSave(workout);
      updateRirRowUI(container, exercise, Number(set), s);
    });
  });
  // Tapping a weight/reps box selects its contents so a new number just replaces it.
  qsa(".set-inputs input", container).forEach((inp) => {
    inp.addEventListener("focus", () => setTimeout(() => { try { inp.select(); } catch (_) {} }, 0));
  });
  qsa(".exercise-card", container).forEach(wireEnterKey);
  // Toggle set completion
  qsa('[data-act="toggle-complete"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      const wasCompleted = s.completed;

      if (!s.completed && !s.skipped) {
        s.completed = true;
      } else if (s.completed) {
        s.completed = false;
      }
      if (!wasCompleted && s.completed) {
        hapticTap(10);
        checkForPR(entry, s);
        if (restTimerShouldAutoStart()) {
          startRestTimer(getExerciseRestSeconds(cachedSettings, entry.exerciseId), `${entry.name} · Set ${Number(set) + 1}`);
        }
      }
      updateSetRowUI(container, entry.exerciseId, Number(set), s);
      queueActiveWorkoutSave(workout);
      updateProgressUI(container, workout);
      if (!wasCompleted && s.completed) {
        btn.classList.add("pop");
        setTimeout(() => btn.classList.remove("pop"), 360);
      }
    });
    // long-press-free alt: allow marking skipped via a second control (double click / right side) —
    // implemented as a small affordance: clicking the set index cycles through skip state.
  });

  qsa('.set-index', container).forEach((idx) => {
    idx.style.cursor = "pointer";
    idx.title = "Tap to mark skipped";
    idx.addEventListener("click", () => {
      const row = idx.closest(".set-row");
      const exercise = row.dataset.exercise, set = Number(row.dataset.set);
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[set];
      if (s.skipped) { s.skipped = false; }
      else { s.skipped = true; s.completed = false; }
      updateSetRowUI(container, exercise, set, s);
      queueActiveWorkoutSave(workout);
      updateProgressUI(container, workout);
    });
  });

  // Elapsed workout time, ticking once a second while this screen is open
  // (teardown() clears tickInterval when you leave).
  const elapsedEl = qs("#workout-elapsed", container);
  const paintElapsed = () => {
    if (!elapsedEl) return;
    const secs = Math.max(0, Math.round((Date.now() - new Date(workout.startedAt).getTime()) / 1000));
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    elapsedEl.textContent = " · " + (h ? `${h}:${String(m).padStart(2, "0")}` : String(m)) + `:${String(s).padStart(2, "0")}`;
  };
  stopTicking();
  paintElapsed();
  tickInterval = setInterval(paintElapsed, 1000);
  acquireWakeLock();

  // Add / remove a set on one exercise for this workout only. One delegated
  // handler so it keeps working after a card is re-rendered.
  container.onclick = async (ev) => {
    const btn = ev.target.closest && ev.target.closest('[data-act="add-set"], [data-act="remove-set"]');
    if (!btn) return;
    const entry = workout.exercises.find((e) => e.exerciseId === btn.dataset.exercise);
    if (!entry) return;
    if (btn.dataset.act === "add-set") {
      if (entry.sets.length >= 15) { toast("That's the maximum number of sets"); return; }
      entry.sets.push(baseSet(entry.sets.length, entry.unilateral));
    } else {
      if (entry.sets.length <= 1) return;
      const last = entry.sets[entry.sets.length - 1];
      if (last.completed) {
        const ok = await confirmModal({ title: "Remove a completed set?", body: "The last set is already logged. Removing it deletes what you entered for it.", confirmLabel: "Remove", danger: true });
        if (!ok) return;
      }
      entry.sets.pop();
    }
    queueActiveWorkoutSave(workout);
    const card = qs(`.exercise-card[data-exercise="${entry.exerciseId}"]`, container);
    if (card) card.outerHTML = renderExerciseCard(entry, workout);
    rewireExerciseCard(container, workout, entry.exerciseId);
    updateProgressUI(container, workout);
  };

  // Use the suggested weight / previous weight / copy previous set
  qsa('[data-act="use-target"]', container).forEach((btn) => {
    btn.addEventListener("click", () => applyTarget(container, workout, btn.dataset.exercise));
  });
  qsa('[data-act="use-prev-weight"]', container).forEach((btn) => {
    btn.addEventListener("click", () => applyPrevious(container, workout, btn.dataset.exercise, "weight"));
  });
  qsa('[data-act="copy-prev-set"]', container).forEach((btn) => {
    btn.addEventListener("click", () => applyPrevious(container, workout, btn.dataset.exercise, "full"));
  });

  // Manual tempo/execution feedback (item 8) — click again to clear
  qsa('[data-act="set-tempo"]', container).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, tempo } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      entry.tempo = entry.tempo === tempo ? null : tempo;
      queueActiveWorkoutSave(workout);
      const card = qs(`.exercise-card[data-exercise="${exercise}"]`, container);
      if (card) {
        qsa(".tempo-chip", card).forEach((b) => b.classList.toggle("active", b.dataset.tempo === entry.tempo));
      }
    });
  });

  // Per-exercise notes (item 13)
  qsa('[data-act="ex-notes"]', container).forEach((ta) => {
    ta.addEventListener("change", () => {
      const entry = workout.exercises.find((e) => e.exerciseId === ta.dataset.exercise);
      entry.notes = ta.value;
      queueActiveWorkoutSave(workout);
    });
  });

  // Cardio controls
  qsa('[data-act="cardio-complete"]', container).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, btn.dataset.phase, "complete")));
  qsa('[data-act="cardio-skip"]', container).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, btn.dataset.phase, "skip")));

  const notes = qs("#workout-notes", container);
  if (notes) notes.addEventListener("change", () => { workout.notes = notes.value; queueActiveWorkoutSave(workout); });

  qs('[data-act="finish"]', container)?.addEventListener("click", () => finishWorkout(container, workout, navigate));
  qs('[data-act="finish-bottom"]', container)?.addEventListener("click", () => finishWorkout(container, workout, navigate));
}

function updateSetRowUI(container, exerciseId, setIndex, set) {
  const row = qs(`.set-row[data-exercise="${exerciseId}"][data-set="${setIndex}"]`, container);
  if (!row) return;
  row.classList.toggle("completed", !!set.completed);
  row.classList.toggle("skipped", !!set.skipped);
  const btn = qs('[data-act="toggle-complete"]', row);
  btn.textContent = set.completed ? "✓" : set.skipped ? "–" : "";
}

function updateRirRowUI(container, exerciseId, setIndex, set) {
  if (set.unilateral) {
    const rowL = qs(`.rir-row[data-exercise="${exerciseId}"][data-set="${setIndex}"][data-side="left"]`, container);
    if (rowL) qsa('[data-act="set-rir"]', rowL).forEach((btn) => btn.classList.toggle("active", btn.dataset.rir === set.leftRir));
    const rowR = qs(`.rir-row[data-exercise="${exerciseId}"][data-set="${setIndex}"][data-side="right"]`, container);
    if (rowR) qsa('[data-act="set-rir"]', rowR).forEach((btn) => btn.classList.toggle("active", btn.dataset.rir === set.rightRir));
    return;
  }
  const row = qs(`.rir-row[data-exercise="${exerciseId}"][data-set="${setIndex}"]`, container);
  if (!row) return;
  qsa('[data-act="set-rir"]', row).forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.rir === set.rir);
  });
}

function updateProgressUI(container, workout) {
  const { completed, skipped, programmed } = countCompletedSets(workout);
  const pct = programmed ? Math.round(((completed + skipped) / programmed) * 100) : 0;
  const fill = qs(".workout-progress-fill", container);
  if (fill) fill.style.width = pct + "%";
  const label = qs(".workout-progress-bar", container)?.nextElementSibling;
  const volKg = workoutVolumeKg(workout);
  const volText = volKg > 0 ? ` · ${Math.round(volKg).toLocaleString()} kg volume` : "";
  if (label) label.textContent = `${completed} completed · ${skipped} skipped · ${programmed} programmed sets${volText}`;
}

function applyPrevious(container, workout, exerciseId, mode) {
  const prev = cachedPreviousByExercise[exerciseId];
  if (!prev) return;
  const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
  const completedPrevSets = prev.sets.filter((s) => s.completed);
  if (!completedPrevSets.length) return;
  const last = completedPrevSets[completedPrevSets.length - 1];
  const currentUnit = getExerciseUnit(cachedSettings, exerciseId);

  entry.sets.forEach((s, i) => {
    const src = mode === "full" ? (completedPrevSets[i] || last) : last;
    if (s.unilateral) {
      s.leftWeightKg = src.leftWeightKg ?? s.leftWeightKg;
      s.rightWeightKg = src.rightWeightKg ?? s.rightWeightKg;
      if (mode === "full") { s.leftReps = src.leftReps ?? s.leftReps; s.rightReps = src.rightReps ?? s.rightReps; }
    } else {
      s.weightKg = src.weightKg ?? s.weightKg;
      if (mode === "full") s.reps = src.reps ?? s.reps;
    }
    // A freshly-copied value is a new entry made right now, so it uses the
    // exercise's current preferred unit rather than the source set's unit.
    s.weightUnit = currentUnit;
  });

  queueActiveWorkoutSave(workout);
  // Re-render just this exercise card to reflect the new values in the inputs.
  const card = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
  if (card) card.outerHTML = renderExerciseCard(entry, workout);
  rewireExerciseCard(container, workout, exerciseId);
  toast(mode === "full" ? "Copied previous set" : "Applied previous weight");
}

// Put the suggested weight into every set that isn't done yet. Reps stay
// empty (they're what you actually do); the target shows as the placeholder.
function applyTarget(container, workout, exerciseId) {
  const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
  const prev = cachedPreviousByExercise[exerciseId];
  const def = PROGRAM[workout.type]?.exercises.find((e) => e.id === exerciseId);
  const unit = getExerciseUnit(cachedSettings, exerciseId);
  const next = computeNextTarget(prev, def?.targetReps, unit);
  if (!entry || !next) return;
  const kg = toStorageWeight(next.weight, unit);
  entry.sets.forEach((s) => {
    if (s.completed) return;
    if (s.unilateral) { s.leftWeightKg = kg; s.rightWeightKg = kg; } else { s.weightKg = kg; }
    s.weightUnit = unit;
  });
  queueActiveWorkoutSave(workout);
  const card = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
  if (card) card.outerHTML = renderExerciseCard(entry, workout);
  rewireExerciseCard(container, workout, exerciseId);
  toast(`Set to ${next.weight} ${unit}`);
}

function rewireExerciseCard(container, workout, exerciseId) {
  const card = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
  if (!card) return;
  wireEnterKey(card);
  qsa('input[data-field]', card).forEach((input) => wireSetInput(input, workout));
  qsa('[data-act="open-ex-options"]', card).forEach((btn) => {
    btn.addEventListener("click", () => openExerciseOptionsModal(container, workout, exerciseId));
  });
  qsa('[data-act="set-rir"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set, rir, side } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      if (side === "left") s.leftRir = s.leftRir === rir ? null : rir;
      else if (side === "right") s.rightRir = s.rightRir === rir ? null : rir;
      else s.rir = s.rir === rir ? null : rir;
      queueActiveWorkoutSave(workout);
      updateRirRowUI(container, exercise, Number(set), s);
    });
  });
  qsa('[data-act="toggle-complete"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const { exercise, set } = btn.dataset;
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[Number(set)];
      const wasCompleted = s.completed;
      if (!s.completed && !s.skipped) s.completed = true; else if (s.completed) s.completed = false;
      if (!wasCompleted && s.completed) {
        hapticTap(10);
        checkForPR(entry, s);
        if (restTimerShouldAutoStart()) {
          startRestTimer(getExerciseRestSeconds(cachedSettings, entry.exerciseId), `${entry.name} · Set ${Number(set) + 1}`);
        }
      }
      updateSetRowUI(container, entry.exerciseId, Number(set), s);
      queueActiveWorkoutSave(workout);
      updateProgressUI(container, workout);
    });
  });
  qsa('.set-index', card).forEach((idx) => {
    idx.addEventListener("click", () => {
      const row = idx.closest(".set-row");
      const exercise = row.dataset.exercise, set = Number(row.dataset.set);
      const entry = workout.exercises.find((e) => e.exerciseId === exercise);
      const s = entry.sets[set];
      if (s.skipped) s.skipped = false; else { s.skipped = true; s.completed = false; }
      updateSetRowUI(container, exercise, set, s);
      queueActiveWorkoutSave(workout);
      updateProgressUI(container, workout);
    });
  });
  qsa('[data-act="use-target"]', card).forEach((btn) => btn.addEventListener("click", () => applyTarget(container, workout, exerciseId)));
  qsa('[data-act="use-prev-weight"]', card).forEach((btn) => btn.addEventListener("click", () => applyPrevious(container, workout, exerciseId, "weight")));
  qsa('[data-act="copy-prev-set"]', card).forEach((btn) => btn.addEventListener("click", () => applyPrevious(container, workout, exerciseId, "full")));
  qsa('[data-act="set-tempo"]', card).forEach((btn) => {
    btn.addEventListener("click", () => {
      const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
      entry.tempo = entry.tempo === btn.dataset.tempo ? null : btn.dataset.tempo;
      queueActiveWorkoutSave(workout);
      qsa(".tempo-chip", card).forEach((b) => b.classList.toggle("active", b.dataset.tempo === entry.tempo));
    });
  });
  qsa('[data-act="ex-notes"]', card).forEach((ta) => {
    ta.addEventListener("change", () => {
      const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
      entry.notes = ta.value;
      queueActiveWorkoutSave(workout);
    });
  });
}

// ---------------------------------------------------------------------------
// Plate calculator — given a target barbell weight, works out which plates
// go on EACH side (heaviest first) using a standard greedy fill against a
// real plate set. Greedy is fine here (not the pathological coin-change
// case) because standard plate denominations are each roughly half the
// previous one. If the target isn't exactly reachable with those plates
// (e.g. an odd number), it reports the closest achievable total rather
// than pretending it hit the exact figure.
// ---------------------------------------------------------------------------
const PLATE_SIZES_KG = [25, 20, 15, 10, 5, 2.5, 1.25];
const PLATE_SIZES_LB = [45, 35, 25, 10, 5, 2.5];

function computePlateBreakdown(targetWeight, barWeight, unit) {
  const plates = unit === "lb" ? PLATE_SIZES_LB : PLATE_SIZES_KG;
  let perSide = Math.max(0, (targetWeight - barWeight) / 2);
  const used = [];
  for (const p of plates) {
    while (perSide + 1e-6 >= p) {
      used.push(p);
      perSide -= p;
    }
  }
  const achievedPerSide = used.reduce((s, p) => s + p, 0);
  const achievedTotal = roundTo(barWeight + achievedPerSide * 2, 2);
  return { plates: used, achievedTotal, remainder: Math.max(0, perSide) };
}

// ---------------------------------------------------------------------------
// Exercise options — the unit toggle, rest-timer duration, plate calculator,
// and substitute action used to each sit directly on the exercise card as
// their own row/chip, which piled up to two extra rows above the sets grid
// (the one thing you actually touch every single set) on top of the
// header. They're occasional adjustments, not per-set actions, so they now
// live behind one "⋯" button instead.
// ---------------------------------------------------------------------------
function openExerciseOptionsModal(container, workout, exerciseId) {
  const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
  if (!entry) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  function close() { overlay.remove(); }
  function refreshCardBehindModal() {
    const freshCard = qs(`.exercise-card[data-exercise="${exerciseId}"]`, container);
    if (freshCard) freshCard.outerHTML = renderExerciseCard(entry, workout);
    rewireExerciseCard(container, workout, exerciseId);
  }

  const renderBody = () => {
    const unit = getExerciseUnit(cachedSettings, exerciseId);
    const restSeconds = getExerciseRestSeconds(cachedSettings, exerciseId);
    overlay.innerHTML = `
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="ex-options-title">
        <h3 id="ex-options-title">${escapeHtml(entry.name)}</h3>
        <div class="field">
          <label>Weight unit</label>
          <div class="toggle-row" id="exopt-unit">
            <button type="button" data-value="kg" class="${unit === "kg" ? "active" : ""}">kg</button>
            <button type="button" data-value="lb" class="${unit === "lb" ? "active" : ""}">lb</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Rest timer for this exercise</label>
          <button type="button" class="chip-btn" id="exopt-rest">⏱ ${restTimerTimeLabel(restSeconds)} — tap to change</button>
        </div>
        <div class="btn-row" style="margin-top:18px; flex-direction:column; gap:8px;">
          <button class="btn" id="exopt-plates" type="button" style="width:100%;">🏋 Plate Calculator</button>
          <button class="btn" id="exopt-substitute" type="button" style="width:100%;">⇄ Substitute Exercise</button>
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn btn-primary" data-act="close" type="button" style="width:100%;">Done</button>
        </div>
      </div>`;

    overlay.querySelector('[data-act="close"]').addEventListener("click", close);
    qsa("#exopt-unit button", overlay).forEach((btn) => {
      btn.addEventListener("click", async () => {
        const value = btn.dataset.value;
        const current = cachedSettings.exerciseUnits || {};
        cachedSettings.exerciseUnits = { ...current, [exerciseId]: value };
        await storage.saveSettings({ exerciseUnits: cachedSettings.exerciseUnits });
        refreshCardBehindModal();
        renderBody();
      });
    });
    qs("#exopt-rest", overlay).addEventListener("click", async () => {
      const current = getExerciseRestSeconds(cachedSettings, exerciseId);
      const next = nextRestPreset(current);
      const map = cachedSettings.exerciseRestSeconds || {};
      cachedSettings.exerciseRestSeconds = { ...map, [exerciseId]: next };
      await storage.saveSettings({ exerciseRestSeconds: cachedSettings.exerciseRestSeconds });
      renderBody();
    });
    qs("#exopt-plates", overlay).addEventListener("click", () => {
      close();
      const currentUnit = getExerciseUnit(cachedSettings, exerciseId);
      const currentBest = bestSetOf(entry);
      const prevEntry = cachedPreviousByExercise[exerciseId];
      const prevBest = prevEntry ? bestSetOf(prevEntry) : null;
      const weightKg = currentBest?.weight || prevBest?.weight || null;
      openPlateCalculatorModal(currentUnit, weightKg ? roundTo(displayWeight(weightKg, currentUnit), 1) : null);
    });
    qs("#exopt-substitute", overlay).addEventListener("click", () => {
      close();
      openSubstituteModal(container, workout, exerciseId, null);
    });
  };

  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  modalRoot.appendChild(overlay);

  };

  qs("#plate-bar", overlay).addEventListener("input", renderResult);
  renderResult();
}

// ---------------------------------------------------------------------------
// Exercise substitution (item 16) — swap in a different exercise for just
// this workout, either picked from the same day type's existing list or
// typed in fresh (e.g. the machine's taken, you're at a different gym, or
// this day type only has one exercise so there was nothing to pick from
// before). Historical workouts are unaffected; checking "apply permanently"
// also hides the old exercise from future workouts and gives the new one
// its slot in the program order — for a typed name, it also adds it to your
// exercise catalog so it behaves like any other exercise from then on.
// ---------------------------------------------------------------------------
function openSubstituteModal(container, workout, exerciseId, navigate) {
  const entry = workout.exercises.find((e) => e.exerciseId === exerciseId);
  if (!entry) return;
  const options = (PROGRAM[workout.type]?.exercises || []).filter((e) => e.id !== exerciseId);
  const CUSTOM_VALUE = "__custom__";

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="sub-modal-title">
      <h3 id="sub-modal-title">Substitute ${escapeHtml(entry.name)}</h3>
      ${options.length ? `
        <div class="field">
          <label for="sub-select">Replace with</label>
          <select id="sub-select" style="width:100%; background:var(--c-charcoal); border:1px solid var(--c-hairline-strong); border-radius:6px; color:var(--c-off); padding:10px; font-size:14px;">
            ${options.map((o) => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join("")}
            <option value="${CUSTOM_VALUE}">✎ Type a different exercise…</option>
          </select>
        </div>
      ` : `<p class="text-faint" style="margin-top:0;">No other exercises are set up for this day type — type the one you're using instead.</p>`}
      <div class="field" id="sub-custom-wrap" style="${options.length ? "display:none;" : ""} margin-bottom:0;">
        <label for="sub-custom-name">Exercise name</label>
        <input type="text" id="sub-custom-name" placeholder="e.g. Trap Bar Deadlift" autocomplete="off">
        <label class="text-dim" style="display:flex; align-items:center; gap:8px; font-size:13px; margin-top:10px;">
          <input type="checkbox" id="sub-custom-uni">
          <span>Track each side separately (unilateral)</span>
        </label>
      </div>
      <label class="text-dim" style="display:flex; align-items:flex-start; gap:8px; font-size:13px; margin-top:14px;">
        <input type="checkbox" id="sub-permanent" style="margin-top:3px;">
        <span>Also replace it in my program for future workouts (this workout's history stays as recorded either way)</span>
      </label>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn btn-ghost" data-act="cancel" type="button">Cancel</button>
        <button class="btn btn-primary" data-act="confirm" type="button">Substitute</button>
      </div>
    </div>`;
  modalRoot.appendChild(overlay);

  function close() { overlay.remove(); }
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-act="cancel"]').addEventListener("click", close);

  const select = qs("#sub-select", overlay);
  const customWrap = qs("#sub-custom-wrap", overlay);
  if (select) {
    select.addEventListener("change", () => {
      customWrap.style.display = select.value === CUSTOM_VALUE ? "" : "none";
    });
  }

  overlay.querySelector('[data-act="confirm"]').addEventListener("click", async () => {
    const usingCustom = !select || select.value === CUSTOM_VALUE;
    const makePermanent = qs("#sub-permanent", overlay).checked;
    const oldId = entry.exerciseId;
    const oldName = entry.name;
    const setCount = entry.sets.length;

    let newDef;
    if (usingCustom) {
      const typedName = qs("#sub-custom-name", overlay).value.trim();
      if (!typedName) { toast("Enter a name for the exercise"); return; }
      const isUni = qs("#sub-custom-uni", overlay).checked;
      const slug = typedName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      newDef = { id: `custom-${slug || "exercise"}-${uid().slice(0, 6)}`, name: typedName, type: workout.type, sets: setCount, unilateral: isUni, muscles: [], createdAt: nowISO() };
      // Only add it to the persistent catalog if this is meant to stick —
      // otherwise it's a one-workout stand-in that just lives in this
      // entry, same as any other exercise's data does.
      if (makePermanent) await storage.addCustomExercise(newDef);
    } else {
      newDef = options.find((o) => o.id === select.value);
      if (!newDef) { close(); return; }
    }

    entry.exerciseId = newDef.id;
    entry.name = newDef.name;
    entry.unilateral = newDef.unilateral;
    entry.sets = Array.from({ length: setCount }, (_, i) => baseSet(i, newDef.unilateral));
    entry.tempo = null;
    entry.substitutedFrom = { exerciseId: oldId, name: oldName };

    await storage.saveActiveWorkout(workout);

    if (makePermanent) {
      const order = await storage.getExerciseOrder();
      const typeOrder = (order[workout.type] || PROGRAM[workout.type]?.exercises.map((e) => e.id) || []).slice();
      const idx = typeOrder.indexOf(oldId);
      if (idx !== -1) typeOrder[idx] = newDef.id; else typeOrder.push(newDef.id);
      await storage.setExerciseOrder(workout.type, typeOrder);
      await storage.setProgramOverride(oldId, { removed: true });
      applyCustomExercises(await storage.getCustomExercises(), await storage.getProgramOverrides(), await storage.getExerciseOrder());
    }

    close();
    toast(`Substituted ${newDef.name}`);
    const history = await storage.getWorkouts();
    cachedPreviousByExercise[newDef.id] = findPreviousEntry(history, newDef.id, newDef.name);
    const card = qs(`.exercise-card[data-exercise="${oldId}"]`, container);
    if (card) card.outerHTML = renderExerciseCard(entry, workout);
    rewireExerciseCard(container, workout, newDef.id);
  });
}

function cardioAction(container, workout, phase, action) {
  const c = workout.cardio[phase];
  if (action === "complete") {
    c.status = c.status === "completed" ? "idle" : "completed";
  } else if (action === "skip") {
    c.status = c.status === "skipped" ? "idle" : "skipped";
  }
  queueActiveWorkoutSave(workout);
  const card = qs(`[data-cardio="${phase}"]`, container);
  if (card) {
    const title = phase === "pre" ? "Pre-Workout Cardio" : "Post-Workout Cardio";
    card.outerHTML = renderCardioCard(phase, workout, title);
    rewireCardioCard(container, workout, phase);
  }
}

function rewireCardioCard(container, workout, phase) {
  const card = qs(`[data-cardio="${phase}"]`, container);
  if (!card) return;
  qsa('[data-act="cardio-complete"]', card).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, phase, "complete")));
  qsa('[data-act="cardio-skip"]', card).forEach((btn) => btn.addEventListener("click", () => cardioAction(container, workout, phase, "skip")));
}

let finishingWorkout = false;
async function finishWorkout(container, workout, navigate) {
  const { completed, programmed } = countCompletedSets(workout);
  if (completed < programmed) {
    const ok = await confirmModal({
      title: "End workout now?",
      body: `You've completed ${completed} of ${programmed} programmed sets. Ending now will save this as a partial workout — you can still edit it later from History.`,
      confirmLabel: "End Workout",
    });
    if (!ok) return;
  }

  if (finishingWorkout) return;
  finishingWorkout = true;
  try {
    await settleActiveWorkoutSaves();
    workout.status = computeWorkoutStatus(workout);
    workout.completedAt = nowISO();
    await storage.saveWorkout(workout);
    await storage.deleteActiveWorkout();
  } catch (err) {
    console.error("[app] finishing workout failed", err);
    toast("Couldn't save the workout — check your connection and try again.", { duration: 5000 });
    return;
  } finally {
    finishingWorkout = false;
  }
  dismissRestTimer();
  hapticTap([12, 40, 18]);

  navigate("workout-summary", { workoutId: workout.id });
}
